gn_fact via calendar_month_key. Carries the full month-through-year rollup inline; calendar_qtr_dim is joined separately off the same fact via its own calendar_qtr_key FK, not derived from this cube's hierarchy.","file":"model/efs/Lumos/cubes/cube_carl_dwhprd_gold_dimensions.yaml"},{"domain":"Lumos (DWH gold \u2013 linear ad sales, finance, intl, content)","name":"cube_carl_dwhprd_gold_calendar_qtr_dim","title":"Carl Dwhprd Gold \u2014 Calendar Qtr Dim","kind":"Dimension","src":"dwhprd_gold.calendar_qtr_dim","sql":"No","measures":0,"dims":2,"joins":"","preagg":"","views":"sox_view_affiliate_fact, sox_view_campaign_fact","desc":"Calendar quarter/year rollup dimension, joined directly off campaign_fact via calendar_qtr_key (a separate FK carried on the fact, not derived from calendar_month_dim's hierarchy).","file":"model/efs/Lumos/cubes/cube_carl_dwhprd_gold_dimensions.yaml"},{"domain":"Lumos (DWH gold \u2013 linear ad sales, finance, intl, content)","name":"cube_carl_dwhprd_gold_calendar_year_dim","title":"Carl Dwhprd Gold \u2014 Calendar Year Dim","kind":"Dimension","src":"dwhprd_gold.calendar_year_dim","sql":"No","measures":0,"dims":2,"joins":"","preagg":"","views":"sox_view_affiliate_fact","desc":"Calendar year rollup dimension, joined directly off affiliate_fact via calendar_year_key (a separate FK carried on the fact, not derived from calendar_month_dim's hierarchy \u2014 same pattern as calendar_qtr_dim on campaign_fact).","file":"model/efs/Lumos/cubes/cube_carl_dwhprd_gold_dimensions.yaml"},{"domain":"Lumos (DWH gold \u2013 linear ad sales, finance, intl, content)","name":"cube_carl_dwhprd_gold_campaign_delivery_type_dim","title":"Carl Dwhprd Gold \u2014 Campaign Delivery Type Dim","kind":"Dimension","src":"dwhprd_gold.campaign_delivery_type_dim","sql":"No","measures":0,"dims":2,"joins":"","preagg":"","views":"sox_view_campaign_fact","desc":"Small lookup for a campaign's delivery type, joined off campaign_dim via campaign_delivery_type_key (not directly off campaign_fact, which does not carry this FK).","file":"model/efs/Lumos/cubes/cube_carl_dwhprd_gold_dimensions.yaml"},{"domain":"Lumos (DWH gold \u2013 linear ad sales, finance, intl, content)","name":"cube_carl_dwhprd_gold_campaign_dim","title":"Carl Dwhprd Gold \u2014 Campaign Dim","kind":"Dimension","src":"dwhprd_gold.campaign_dim","sql":"No","measures":0,"dims":13,"joins":"cube_carl_dwhprd_gold_campaign_status_dim, cube_carl_dwhprd_gold_campaign_delivery_type_dim, cube_carl_dwhprd_gold_agency_group_dim, cube_carl_dwhprd_gold_client_group_dim, cube_carl_dwhprd_gold_holding_company_dim, cube_carl_dwhprd_gold_currency_dim","preagg":"","views":"international_view_bi_to_bts_recon_fact, international_view_campaign_fact, sox_view_campaign_fact","desc":"APAC ad-sales campaign hub, a different source system from the US ad-sales star used elsewhere. One row per campaign, carrying campaign-level attributes (ID, description, commission/tax/discount percentages, start/end dates) plus the keys for eight snowflaked dimensions (agency_group, client_group, holding_company, campaign_delivery_type, campaign_status, campaign_currency) that hang off this dim rather than off campaign_fact directly. campaign_currency_key resolves through cube_carl_dwhprd_gold_currency_dim, the same physical currency table joined directly off campaign_fact in the Base/Invoice Currency roles. Probed against dev data: all four snowflaked joins carry a small but non-zero orphan rate \u2014 campaign_status_dim 0.66% (3,265/493,338), campaign_delivery_type_dim 0.13% (650/493,338), holding_company_dim 0.17% (838/493,338), currency_dim (campaign currency role) 0.0004% (2/493,338) \u2014 small enough to treat as normal data-quality noise rather than a modelling gap, unlike the much larger sales-rep-allocation gap flagged on cube_carl_dwhprd_gold_campaign_fact.","file":"model/efs/Lumos/cubes/cube_carl_dwhprd_gold_dimensions.yaml"},{"domain":"Lumos (DWH gold \u2013 linear ad sales, finance, intl, content)","name":"cube_carl_dwhprd_gold_campaign_status_dim","title":"Carl Dwhprd Gold \u2014 Campaign Status Dim","kind":"Dimension","src":"dwhprd_gold.campaign_status_dim","sql":"No","measures":0,"dims":3,"joins":"","preagg":"","views":"international_view_bi_to_bts_recon_fact, sox_view_campaign_fact","desc":"Small lookup for a campaign's status, joined directly off campaign_dim via campaign_status_key.","file":"model/efs/Lumos/cubes/cube_carl_dwhprd_gold_dimensions.yaml"},{"domain":"Lumos (DWH gold \u2013 linear ad sales, finance, intl, content)","name":"cube_carl_dwhprd_gold_channel_dim","title":"Carl Dwhprd Gold \u2014 Channel Dim","kind":"Dimension","src":"dwhprd_gold.channel_dim","sql":"No","measures":0,"dims":5,"joins":"","preagg":"","views":"international_view_bi_to_bts_recon_fact, international_view_campaign_fact, sox_view_campaign_fact","desc":"APAC ad-sales channel/network master, joined directly off campaign_fact via channel_key.","file":"model/efs/Lumos/cubes/cube_carl_dwhprd_gold_dimensions.yaml"},{"domain":"Lumos (DWH gold \u2013 linear ad sales, finance, intl, content)","name":"cube_carl_dwhprd_gold_client_dim","title":"Carl Dwhprd Gold \u2014 Client Dim","kind":"Dimension","src":"dwhprd_gold.client_dim","sql":"No","measures":0,"dims":4,"joins":"","preagg":"","views":"international_view_bi_to_bts_recon_fact, international_view_campaign_fact, sox_view_campaign_fact","desc":"APAC ad-sales client (advertiser) master, joined directly off campaign_fact via client_key.","file":"model/efs/Lumos/cubes/cube_carl_dwhprd_gold_dimensions.yaml"},{"domain":"Lumos (DWH gold \u2013 linear ad sales, finance, intl, content)","name":"cube_carl_dwhprd_gold_client_group_dim","title":"Carl Dwhprd Gold \u2014 Client Group Dim","kind":"Dimension","src":"dwhprd_gold.client_group_dim","sql":"No","measures":0,"dims":3,"joins":"","preagg":"","views":"sox_view_campaign_fact","desc":"APAC client group lookup, joined off campaign_dim via client_group_key (not directly off campaign_fact, which does not carry this FK).","file":"model/efs/Lumos/cubes/cube_carl_dwhprd_gold_dimensions.yaml"},{"domain":"Lumos (DWH gold \u2013 linear ad sales, finance, intl, content)","name":"cube_carl_dwhprd_gold_common_property_dim","title":"Carl Dwhprd Gold \u2014 Common Property Dim","kind":"Dimension","src":"dwhprd_gold.common_property_dim","sql":"No","measures":0,"dims":14,"joins":"","preagg":"","views":"ad_sales_view_invoice_revenue_fact, finance_view_invoice_revenue_fact, sox_view_invoice_revenue_fact","desc":"A dimension table containing metadata about media properties (shows, films, and content) across various networks and platforms. Each row represents a unique property with its associated series information, originating network details, and audit timestamps.","file":"model/efs/Lumos/cubes/cube_carl_dwhprd_gold_dimensions.yaml"},{"domain":"Lumos (DWH gold \u2013 linear ad sales, finance, intl, content)","name":"cube_carl_dwhprd_gold_contract_dim","title":"Carl Dwhprd Gold \u2014 Contract Dim","kind":"Dimension","src":"dwhprd_gold.contract_dim","sql":"No","measures":0,"dims":2,"joins":"","preagg":"","views":"sox_view_affiliate_fact","desc":"Affiliate contract master, joined directly off affiliate_fact via contract_key. Distinct from any US ad-sales contract dimension; this is the affiliate-billing contract.","file":"model/efs/Lumos/cubes/cube_carl_dwhprd_gold_dimensions.yaml"},{"domain":"Lumos (DWH gold \u2013 linear ad sales, finance, intl, content)","name":"cube_carl_dwhprd_gold_corp_genre_dim","title":"Carl Dwhprd Gold \u2014 Corp Genre Dim","kind":"Dimension","src":"dwhprd_gold.corp_genre_dim","sql":"No","measures":0,"dims":2,"joins":"","preagg":"","views":"sox_view_airings_fact","desc":"Corporate content-genre lookup (e.g. Food, Home, Lifestyle), reached from show_dim.show_corp_genre_key. This is the physical table behind what MicroStrategy's SQL calls SHOW_CORP_GENRE_DIM \u2014 no table by that exact name exists in this catalog.","file":"model/efs/Lumos/cubes/cube_carl_dwhprd_gold_dimensions.yaml"},{"domain":"Lumos (DWH gold \u2013 linear ad sales, finance, intl, content)","name":"cube_carl_dwhprd_gold_corp_subgenre_dim","title":"Carl Dwhprd Gold \u2014 Corp Subgenre Dim","kind":"Dimension","src":"dwhprd_gold.corp_subgenre_dim","sql":"No","measures":0,"dims":2,"joins":"","preagg":"","views":"sox_view_airings_fact","desc":"Corporate content-subgenre lookup, one level finer than corp_genre_dim (carries its own corp_genre_key, not modelled here since show_dim already reaches corp_genre_dim directly). Reached from show_dim.show_corp_subgenre_key. Physical table behind MicroStrategy's SHOW_CORP_SUBGENRE_DIM \u2014 no table by that exact name exists in this catalog.","file":"model/efs/Lumos/cubes/cube_carl_dwhprd_gold_dimensions.yaml"},{"domain":"Lumos (DWH gold \u2013 linear ad sales, finance, intl, content)","name":"cube_carl_dwhprd_gold_corporate_daypart_dim","title":"Carl Dwhprd Gold \u2014 Corporate Daypart Dim","kind":"Dimension","src":"dwhprd_gold.corporate_daypart_dim","sql":"No","measures":0,"dims":4,"joins":"","preagg":"","views":"sox_view_airings_fact","desc":"A corporate-defined daypart lookup (distinct from the custom_daypart derived dimension on airings_fact, which is a simpler 2-way prime split). Combines the selling description with the internal name parenthesized, e.g. \"Prime (P)\".","file":"model/efs/Lumos/cubes/cube_carl_dwhprd_gold_dimensions.yaml"},{"domain":"Lumos (DWH gold \u2013 linear ad sales, finance, intl, content)","name":"cube_carl_dwhprd_gold_country_dim","title":"Carl Dwhprd Gold \u2014 Country Dim","kind":"Dimension","src":"dwhprd_gold.country_dim","sql":"No","measures":0,"dims":3,"joins":"","preagg":"","views":"sox_view_affiliate_fact, sox_view_campaign_fact","desc":"APAC country master, joined directly off campaign_fact via country_key. Distinct from the US ad-sales geography dims used elsewhere in the SOX set.","file":"model/efs/Lumos/cubes/cube_carl_dwhprd_gold_dimensions.yaml"},{"domain":"Lumos (DWH gold \u2013 linear ad sales, finance, intl, content)","name":"cube_carl_dwhprd_gold_currency_dim","title":"Carl Dwhprd Gold \u2014 Currency Dim","kind":"Dimension","src":"dwhprd_gold.currency_dim","sql":"No","measures":0,"dims":3,"joins":"","preagg":"","views":"sox_view_affiliate_fact, international_view_campaign_fact, sox_view_campaign_fact","desc":"A generic currency master (code, name), one row per currency. Role-played three ways on this star: Base Currency and Invoice Currency (both joined directly off campaign_fact, via base_currency_key and invoice_currency_key) and Campaign Currency (joined off campaign_dim, via campaign_currency_key) \u2014 each source cube joins this table only once, so plain joins work for all three roles without needing correlated-subquery dimensions. Confirms the same conformed-currency pattern already resolved for the US ad-sales star (base/invoice/local/contract currency), just a different physical table since this is a different source system.","file":"model/efs/Lumos/cubes/cube_carl_dwhprd_gold_dimensions.yaml"},{"domain":"Lumos (DWH gold \u2013 linear ad sales, finance, intl, content)","name":"cube_carl_dwhprd_gold_customer_dim","title":"Carl Dwhprd Gold \u2014 Customer Dim","kind":"Dimension","src":"dwhprd_gold.customer_dim","sql":"No","measures":0,"dims":5,"joins":"","preagg":"","views":"sox_view_affiliate_fact","desc":"Customer (subscriber-count grouping) master, joined directly off affiliate_fact via customer_key.","file":"model/efs/Lumos/cubes/cube_carl_dwhprd_gold_dimensions.yaml"},{"domain":"Lumos (DWH gold \u2013 linear ad sales, finance, intl, content)","name":"cube_carl_dwhprd_gold_day_dim","title":"Carl Dwhprd Gold \u2014 Day Dim","kind":"Dimension","src":"dwhprd_gold.day_dim","sql":"No","measures":0,"dims":20,"joins":"","preagg":"","views":"sox_view_airings_fact, sox_view_campaign_fact, sox_view_req_rights_episode_fact","desc":"A general calendar dimension, one row per calendar day, carrying both calendar and broadcast-calendar rollups (week/month/quarter/half/year). Role-played by req_rights_episode_fact as Financial Asset Start Date (financial_asset_start_date_key, joined directly). Also role-played by airings_fact as Local Broadcast Day (local_bcast_day_key, joined directly) \u2014 probed clean against dev data (0.09% orphan rate). The GMT-calendar and local-calendar day roles flagged in the SOX batch triage remain unconfirmed and unmodelled; only the local-broadcast role was needed so far. Only the columns needed so far are modelled; the table carries additional broadcast-calendar columns not yet mapped, to be added on demand.","file":"model/efs/Lumos/cubes/cube_carl_dwhprd_gold_dimensions.yaml"},{"domain":"Lumos (DWH gold \u2013 linear ad sales, finance, intl, content)","name":"cube_carl_dwhprd_gold_dc_episode_dim","title":"Carl Dwhprd Gold \u2014 Dc Episode Dim","kind":"Dimension","src":"dwhprd_gold.dc_episode_dim","sql":"No","measures":0,"dims":8,"joins":"","preagg":"","views":"sox_view_airings_fact","desc":"Distribution-channel-scoped episode facts: per (episode, distribution channel) pair, when that channel first and most recently aired the episode. \"DC\" prefixes throughout this table and its season/show counterparts (dc_season_dim, dc_show_dim) stand for Distribution Channel, not \"Data Center\" or \"Direct Consumer\" \u2014 confirm by the join shape (one row per episode/channel pair) if this is ever ambiguous again. Distinct from episode_dim (the advertising-side dimension keyed on property_key/network_key) and from season_dim/show_dim (the plain content dimensions, not channel-scoped). Only the columns needed so far are modelled; the table carries many more distribution-channel timing/count columns not currently read.","file":"model/efs/Lumos/cubes/cube_carl_dwhprd_gold_dimensions.yaml"},{"domain":"Lumos (DWH gold \u2013 linear ad sales, finance, intl, content)","name":"cube_carl_dwhprd_gold_dc_season_dim","title":"Carl Dwhprd Gold \u2014 Dc Season Dim","kind":"Dimension","src":"dwhprd_gold.dc_season_dim","sql":"Yes","measures":0,"dims":11,"joins":"","preagg":"","views":"sox_view_airings_fact","desc":"Distribution-channel-scoped season facts: per (season, distribution channel) pair, when that channel premiered and most recently/next aired the season, regionally and channel-wide. Query-backed for the same reason as cube_carl_dwhprd_gold_season_dim \u2014 probed against dev data with 79 duplicate rows on dc_season_key, deduplicated here by keeping the most-recently-updated row per key. See cube_carl_dwhprd_gold_dc_episode_dim for what \"DC\" means in this table family. Only the columns needed so far are modelled.","file":"model/efs/Lumos/cubes/cube_carl_dwhprd_gold_dimensions.yaml"},{"domain":"Lumos (DWH gold \u2013 linear ad sales, finance, intl, content)","name":"cube_carl_dwhprd_gold_dc_show_dim","title":"Carl Dwhprd Gold \u2014 Dc Show Dim","kind":"Dimension","src":"dwhprd_gold.dc_show_dim","sql":"No","measures":0,"dims":7,"joins":"","preagg":"","views":"sox_view_airings_fact","desc":"Distribution-channel-scoped show facts: per (show, distribution channel) pair, when that channel first and most recently/next aired the show, regionally and channel-wide. See cube_carl_dwhprd_gold_dc_episode_dim for what \"DC\" means in this table family. Only the columns needs are modelled.","file":"model/efs/Lumos/cubes/cube_carl_dwhprd_gold_dimensions.yaml"},{"domain":"Lumos (DWH gold \u2013 linear ad sales, finance, intl, content)","name":"cube_carl_dwhprd_gold_deal_current_status_dim","title":"Carl Dwhprd Gold \u2014 Deal Current Status Dim","kind":"Dimension","src":"dwhprd_gold.deal_current_status_dim","sql":"No","measures":0,"dims":8,"joins":"","preagg":"","views":"ad_sales_view_invoice_revenue_fact, ad_sales_view_projected_working_revenue_fact","desc":"A dimension table that maintains the current status codes and descriptions for deals. It tracks deal lifecycle states such as Expansion, Complete, and Planning Cancelled with associated metadata and change history.","file":"model/efs/Lumos/cubes/cube_carl_dwhprd_gold_dimensions.yaml"},{"domain":"Lumos (DWH gold \u2013 linear ad sales, finance, intl, content)","name":"cube_carl_dwhprd_gold_deal_dim","title":"Carl Dwhprd Gold \u2014 Deal Dim","kind":"Dimension","src":"dwhprd_gold.deal_dim","sql":"No","measures":0,"dims":66,"joins":"cube_carl_dwhprd_gold_super_deal_dim, cube_carl_dwhprd_gold_deal_current_status_dim","preagg":"","views":"ad_sales_view_invoice_revenue_fact, finance_view_invoice_revenue_fact, sox_view_invoice_revenue_fact, ad_sales_view_projected_working_revenue_fact, finance_view_projected_working_revenue_fact","desc":"A dimension table that stores deal master data with revision history, status tracking, and sales team information. Each row represents a unique version of a deal with its associated attributes, dates, and business context.","file":"model/efs/Lumos/cubes/cube_carl_dwhprd_gold_dimensions.yaml"},{"domain":"Lumos (DWH gold \u2013 linear ad sales, finance, intl, content)","name":"cube_carl_dwhprd_gold_deal_io_part_prog_dim","title":"Carl Dwhprd Gold \u2014 Deal IO Participant Program Dim","kind":"Dimension","src":"dwhprd_gold.deal_io_part_prog_dim","sql":"No","measures":0,"dims":6,"joins":"cube_carl_dwhprd_gold_budget_category_dim, cube_carl_dwhprd_gold_deal_type_dim, cube_carl_dwhprd_gold_deal_program_episode_dim","preagg":"","views":"sox_view_airings_fact","desc":"The Deal-Internal Offer-Participant-Program junction \u2014 bridges an internal offer to its deal type, budget category, originating entity and deal program episode, joined directly from airings_fact via the composite key (deal_io_part_prog_key, internal_offer_key) \u2014 load-bearing, not optional, since airings_fact carries both FKs itself. Only the columns needed so far are modelled; the table also carries participant contribution amounts and rights dates not currently read (see cube_carl_dwhprd_gold_req_rights_participant_contribution for the equivalent contribution measures on the req_rights_episode_fact star).","file":"model/efs/Lumos/cubes/cube_carl_dwhprd_gold_dimensions.yaml"},{"domain":"Lumos (DWH gold \u2013 linear ad sales, finance, intl, content)","name":"cube_carl_dwhprd_gold_deal_partner_dim","title":"Carl Dwhprd Gold \u2014 Deal Partner Dim","kind":"Dimension","src":"dwhprd_gold.deal_partner_dim","sql":"No","measures":0,"dims":7,"joins":"","preagg":"","views":"","desc":"A dimension table containing deal partner master data, including partner names and lifecycle timestamps. This table tracks deal partners involved in advertising sales transactions with full history tracking through create, update, and end timestamps.","file":"model/efs/Lumos/cubes/cube_carl_dwhprd_gold_dimensions.yaml"},{"domain":"Lumos (DWH gold \u2013 linear ad sales, finance, intl, content)","name":"cube_carl_dwhprd_gold_deal_prog_eps_status_dim","title":"Carl Dwhprd Gold \u2014 Deal Prog Eps Status Dim","kind":"Dimension","src":"dwhprd_gold.deal_prog_eps_status_dim","sql":"No","measures":0,"dims":3,"joins":"","preagg":"","views":"sox_view_airings_fact","desc":"Small lookup for a deal program episode's status, excluding Dead/Removed From Deal statuses (deal_prog_eps_status_key not in (5, 6)) via deal_program_episode_dim.","file":"model/efs/Lumos/cubes/cube_carl_dwhprd_gold_dimensions.yaml"},{"domain":"Lumos (DWH gold \u2013 linear ad sales, finance, intl, content)","name":"cube_carl_dwhprd_gold_deal_program_dim","title":"Carl Dwhprd Gold \u2014 Deal Program Dim","kind":"Dimension","src":"dwhprd_gold.deal_program_dim","sql":"No","measures":0,"dims":12,"joins":"","preagg":"","views":"sox_view_req_rights_episode_fact","desc":"One row per programme (show/property) attached to a deal in the deals-and-rights star, carrying its title, property ID, SAP order number, and status (deal_program_status_key). The physical table (deal_program_dim) carries roughly 80 columns covering greenlight/window/D+/sponsorship metadata \u2014 only the columns needed to date are modelled here; the rest can be added on demand without breaking anything already shipped.","file":"model/efs/Lumos/cubes/cube_carl_dwhprd_gold_dimensions.yaml"},{"domain":"Lumos (DWH gold \u2013 linear ad sales, finance, intl, content)","name":"cube_carl_dwhprd_gold_deal_program_episode_dim","title":"Carl Dwhprd Gold \u2014 Deal Program Episode Dim","kind":"Dimension","src":"dwhprd_gold.deal_program_episode_dim","sql":"No","measures":0,"dims":3,"joins":"cube_carl_dwhprd_gold_deal_prog_eps_status_dim","preagg":"","views":"","desc":"Bridges a deal program to the episodes under it, carrying that episode's status within the deal program (deal_prog_eps_status_key), reached via deal_io_part_prog_dim.deal_program_episode_key, not directly from airings_fact. Only the status-gate FK is modelled; the table carries additional projected-date and content-linkage columns not currently read.","file":"model/efs/Lumos/cubes/cube_carl_dwhprd_gold_dimensions.yaml"},{"domain":"Lumos (DWH gold \u2013 linear ad sales, finance, intl, content)","name":"cube_carl_dwhprd_gold_deal_project_dim","title":"Carl Dwhprd Gold \u2014 Deal Project Dim","kind":"Dimension","src":"dwhprd_gold.deal_project_dim","sql":"No","measures":0,"dims":14,"joins":"","preagg":"","views":"sox_view_airings_fact, sox_view_req_rights_episode_fact","desc":"One row per deal project in the deals-and-rights star \u2014 MicroStrategy's export names this table DEAL_PROJECT_TEAM_DIM; only deal_project_dim exists in Glue, with the same key (deal_project_key) and the same columns (deal_name, contract_code), so this is treated as the same table under a shortened name rather than a missing one \u2014 confirm with the data owner if that's wrong. Joined by req_rights_episode_fact on a 3-column composite key (deal_project_key, budget_currency_key, premiere_status_key), meaning deal_project_key alone does not uniquely key this table. The physical table carries roughly 190 columns spanning legal/BA/PMD workflow status, COVID-era tracking and talent-deal detail \u2014 only the columns needed to date, plus the join keys, are modelled here; the rest can be added on demand without breaking anything already shipped.","file":"model/efs/Lumos/cubes/cube_carl_dwhprd_gold_dimensions.yaml"},{"domain":"Lumos (DWH gold \u2013 linear ad sales, finance, intl, content)","name":"cube_carl_dwhprd_gold_deal_revenue_snapshot_dim","title":"Carl Dwhprd Gold \u2014 Deal Revenue Snapshot Dim","kind":"Dimension","src":"dwhprd_gold.deal_revenue_snapshot_dim","sql":"No","measures":0,"dims":7,"joins":"","preagg":"","views":"ad_sales_view_invoice_revenue_fact, finance_view_invoice_revenue_fact, sox_view_invoice_revenue_fact, ad_sales_view_invoice_team_split_revenue, ad_sales_view_projected_working_revenue_fact","desc":"A dimension table that stores snapshots of deal revenue information with temporal tracking. Each row represents a point-in-time view of deal revenue data, with creation, update, and end timestamps to support slowly changing dimension (SCD) patterns.","file":"model/efs/Lumos/cubes/cube_carl_dwhprd_gold_dimensions.yaml"},{"domain":"Lumos (DWH gold \u2013 linear ad sales, finance, intl, content)","name":"cube_carl_dwhprd_gold_deal_revenue_status_dim","title":"Carl Dwhprd Gold \u2014 Deal Revenue Status Dim","kind":"Dimension","src":"dwhprd_gold.deal_revenue_status_dim","sql":"No","measures":0,"dims":7,"joins":"","preagg":"","views":"ad_sales_view_invoice_revenue_fact, finance_view_invoice_revenue_fact, sox_view_invoice_revenue_fact, ad_sales_view_projected_working_revenue_fact, finance_view_projected_working_revenue_fact","desc":"A dimension table that defines the possible revenue statuses for deals in the sales data warehouse. It contains three status categories: Projected, Working, and Booked, each with a unique key identifier.","file":"model/efs/Lumos/cubes/cube_carl_dwhprd_gold_dimensions.yaml"},{"domain":"Lumos (DWH gold \u2013 linear ad sales, finance, intl, content)","name":"cube_carl_dwhprd_gold_deal_status_dim","title":"Carl Dwhprd Gold \u2014 Deal Status Dim","kind":"Dimension","src":"dwhprd_gold.deal_status_dim","sql":"No","measures":0,"dims":10,"joins":"","preagg":"","views":"sox_view_req_rights_episode_fact","desc":"A small lookup dimension decoding the deals-and-rights star's deal_status_key into its code, description and status group, e.g. \"Deal Status\", with values including \"Dead\". Distinct from deal_current_status_dim, which decodes the advertising-side deal_dim.","file":"model/efs/Lumos/cubes/cube_carl_dwhprd_gold_dimensions.yaml"},{"domain":"Lumos (DWH gold \u2013 linear ad sales, finance, intl, content)","name":"cube_carl_dwhprd_gold_deal_type_dim","title":"Carl Dwhprd Gold \u2014 Deal Type Dim","kind":"Dimension","src":"dwhprd_gold.deal_type_dim","sql":"No","measures":0,"dims":16,"joins":"","preagg":"","views":"sox_view_airings_fact, sox_view_req_rights_episode_fact","desc":"Decodes the deals-and-rights star's deal_type_key into its description and a set of flags describing what a deal of this type carries (programs, budget, contract, offer letter, buy-in, deliverables, output agreement), e.g. \"Deal Type\", with values including \"DEVELOPMENT\".","file":"model/efs/Lumos/cubes/cube_carl_dwhprd_gold_dimensions.yaml"},{"domain":"Lumos (DWH gold \u2013 linear ad sales, finance, intl, content)","name":"cube_carl_dwhprd_gold_demographics_dim","title":"Carl Dwhprd Gold \u2014 Demographics Dim","kind":"Dimension","src":"dwhprd_gold.demographics_dim","sql":"No","measures":0,"dims":15,"joins":"","preagg":"","views":"ad_sales_view_invoice_revenue_fact, finance_view_invoice_revenue_fact, ad_sales_view_projected_working_revenue_fact","desc":"A dimension table containing demographic segment definitions used for audience targeting and reporting. Each row represents a distinct demographic segment with age range, group classification, and indicator flags for base and guaranteed status.","file":"model/efs/Lumos/cubes/cube_carl_dwhprd_gold_dimensions.yaml"},{"domain":"Lumos (DWH gold \u2013 linear ad sales, finance, intl, content)","name":"cube_carl_dwhprd_gold_distribution_channel_dim","title":"Carl Dwhprd Gold \u2014 Distribution Channel Dim","kind":"Dimension","src":"dwhprd_gold.distribution_channel_dim","sql":"No","measures":0,"dims":11,"joins":"","preagg":"","views":"sox_view_airings_fact","desc":"A distribution-channel master (e.g. Discovery Channel - US, TLC US) \u2014 the unit content airings are reported by. Distinct from network_dim; a distribution channel is how a network's feed reaches a region (distr_chnl_region_key), which is why this table carries its own region name/key rather than inheriting one from network_dim.","file":"model/efs/Lumos/cubes/cube_carl_dwhprd_gold_dimensions.yaml"},{"domain":"Lumos (DWH gold \u2013 linear ad sales, finance, intl, content)","name":"cube_carl_dwhprd_gold_distribution_channel_hist_dim","title":"Carl Dwhprd Gold \u2014 Distribution Channel Hist Dim","kind":"Dimension","src":"dwhprd_gold.distribution_channel_hist_dim","sql":"No","measures":0,"dims":7,"joins":"","preagg":"","views":"sox_view_airings_fact","desc":"History of name changes for a distribution channel over time \u2014 a channel that was renamed still resolves to one distribution_channel_key, but each historical name gets its own row here, alongside the current name from distribution_channel_dim and a same-channel-has-changed flag (carried on the fact itself).","file":"model/efs/Lumos/cubes/cube_carl_dwhprd_gold_dimensions.yaml"},{"domain":"Lumos (DWH gold \u2013 linear ad sales, finance, intl, content)","name":"cube_carl_dwhprd_gold_entity_dim","title":"Carl Dwhprd Gold \u2014 Entity Dim","kind":"Dimension","src":"dwhprd_gold.entity_dim","sql":"No","measures":0,"dims":11,"joins":"cube_carl_dwhprd_gold_region_dim","preagg":"","views":"sox_view_airings_fact, sox_view_req_rights_episode_fact","desc":"A company/business-entity master, one row per entity (studio, network group, production company, etc.). Role- played by req_rights_episode_fact under five names \u2014 Offering Entity (offering_entity_key, joined directly), Participating Entity, Originating Entity, Primary Contracting Entity and Primary Prod Business Company (the other four, read via correlated-subquery dimensions on the fact cube rather than a second join, since a fact can only join a given cube once). Confirms an open question from the SOX batch triage (docs/ingestion-requests/2026-08-18-lumos-sox.md): these five MicroStrategy tables are one physical table in five roles, not five separate tables. Also role-played by season_dim (as Season Controlling Entity, via season_cont_entity_key), show_dim (as Show Controlling Entity, via show_cont_entity_key), and deal_io_part_prog_dim (as Originating Entity, via originating_entity_key) \u2014 three more MicroStrategy role-play tables resolved to this same physical table. None of these three declare a `joins:` edge to this cube: cube-sql's automatic join-path resolver treats every declared edge as a candidate route regardless of which view field uses it, so a second edge into an already-joined cube (airings_fact joins entity_dim directly, in the Controlling Entity role) creates a genuine multi-path ambiguity the moment any query touches two of these cubes together \u2014 not just when the specific role-play field is selected. All three are read via correlated-subquery dimensions on cube_carl_dwhprd_gold_airings_fact instead, matching the req_rights_episode_fact precedent above.","file":"model/efs/Lumos/cubes/cube_carl_dwhprd_gold_dimensions.yaml"},{"domain":"Lumos (DWH gold \u2013 linear ad sales, finance, intl, content)","name":"cube_carl_dwhprd_gold_episode_dim","title":"Carl Dwhprd Gold \u2014 Episode Dim","kind":"Dimension","src":"dwhprd_gold.episode_dim","sql":"No","measures":0,"dims":16,"joins":"cube_carl_dwhprd_gold_property_dim","preagg":"","views":"sox_view_airings_fact, finance_view_invoice_revenue_fact","desc":"A dimension table containing episode metadata for television programs across multiple networks. Each row represents a unique episode with its identifiers, names, descriptions, and network associations. This table supports analytics on episode-level content attributes and relationships.","file":"model/efs/Lumos/cubes/cube_carl_dwhprd_gold_dimensions.yaml"},{"domain":"Lumos (DWH gold \u2013 linear ad sales, finance, intl, content)","name":"cube_carl_dwhprd_gold_episode_version_dim","title":"Carl Dwhprd Gold \u2014 Episode Version Dim","kind":"Dimension","src":"dwhprd_gold.episode_version_dim","sql":"No","measures":0,"dims":17,"joins":"","preagg":"","views":"finance_view_invoice_revenue_fact","desc":"Dimension table containing episode version attributes, including descriptive information, ratings, network details, and broadcast specifications. Each row represents a distinct version of an episode with its associated metadata and audit timestamps.","file":"model/efs/Lumos/cubes/cube_carl_dwhprd_gold_dimensions.yaml"},{"domain":"Lumos (DWH gold \u2013 linear ad sales, finance, intl, content)","name":"cube_carl_dwhprd_gold_fa_offer_status_dim","title":"Carl Dwhprd Gold \u2014 Fa Offer Status Dim","kind":"Dimension","src":"dwhprd_gold.fa_offer_status_dim","sql":"No","measures":0,"dims":9,"joins":"","preagg":"","views":"sox_view_req_rights_episode_fact","desc":"A small lookup dimension decoding internal_offer_dim's fa_offer_status_key (the financial asset offer status) into its description and a participating flag.","file":"model/efs/Lumos/cubes/cube_carl_dwhprd_gold_dimensions.yaml"},{"domain":"Lumos (DWH gold \u2013 linear ad sales, finance, intl, content)","name":"cube_carl_dwhprd_gold_grid_title_dim","title":"Carl Dwhprd Gold \u2014 Grid Title Dim","kind":"Dimension","src":"dwhprd_gold.grid_title_dim","sql":"No","measures":0,"dims":12,"joins":"","preagg":"","views":"ad_sales_view_invoice_revenue_fact, finance_view_invoice_revenue_fact","desc":"A dimension table containing metadata about grid titles (television p ory. Read through a de-duplicating query rather than straight from the table: season keys 218668 (Ghost Adventures season 20) and 222533 (Harry Potter: Wizards of Baking) each landed twice, identical in every column including the load timestamps, so this is a double load and not a slowly changing dimension. Left alone the second copy doubles revenue on the 1,102 invoice rows that reach those two seasons \u2014 too few for anyone to notice, and wrong. Drop the wrapper once the duplicates are gone upstream.","file":"model/efs/Lumos/cubes/cube_carl_dwhprd_gold_dimensions.yaml"},{"domain":"Lumos (DWH gold \u2013 linear ad sales, finance, intl, content)","name":"cube_carl_dwhprd_gold_selling_title_daypart_dim","title":"Carl Dwhprd Gold \u2014 Selling Title Daypart Dim","kind":"Dimension","src":"dwhprd_gold.selling_title_daypart_dim","sql":"No","measures":0,"dims":22,"joins":"","preagg":"","views":"ad_sales_view_invoice_revenue_fact, sox_view_invoice_revenue_fact","desc":"This dimension table defines selling daypart configurations for broadcast networks, including time slots, scheduling details, and daypart groupings. Each row represents a unique combination of network, daypart time period, and selling classification used for advertising inventory management.","file":"model/efs/Lumos/cubes/cube_carl_dwhprd_gold_dimensions.yaml"},{"domain":"Lumos (DWH gold \u2013 linear ad sales, finance, intl, content)","name":"cube_carl_dwhprd_gold_selling_title_dim","title":"Carl Dwhprd Gold \u2014 Selling Title Dim","kind":"Dimension","src":"dwhprd_gold.selling_title_dim","sql":"No","measures":0,"dims":18,"joins":"cube_carl_dwhprd_gold_property_category_dim","preagg":"","views":"ad_sales_view_inventory_fact, finance_view_inventory_fact, ad_sales_view_invoice_revenue_fact, finance_view_invoice_revenue_fact","desc":"A dimension table that contains selling title information, including title descriptions, types, and their associated property categories. It tracks master-detail relationships between selling titles and maintains historical changes through timestamps.","file":"model/efs/Lumos/cubes/cube_carl_dwhprd_gold_dimensions.yaml"},{"domain":"Lumos (DWH gold \u2013 linear ad sales, finance, intl, content)","name":"cube_carl_dwhprd_gold_show_dim","title":"Carl Dwhprd Gold \u2014 Show Dim","kind":"Dimension","src":"dwhprd_gold.show_dim","sql":"No","measures":0,"dims":107,"joins":"cube_carl_dwhprd_gold_corp_genre_dim, cube_carl_dwhprd_gold_corp_subgenre_dim, cube_carl_dwhprd_gold_show_genre_concat_dim","preagg":"","views":"sox_view_airings_fact, ad_sales_view_invoice_revenue_fact","desc":"Show_dim is a dimension table that contains comprehensive metadata and attributes for television shows, including show identifiers, names, descriptions, premiere and airing dates, episode counts, genre classifications, and distribution/licensing information across multiple regions (global, US, DNI). Each row represents a unique show with its associated business attributes and operational metrics.","file":"model/efs/Lumos/cubes/cube_carl_dwhprd_gold_dimensions.yaml"},{"domain":"Lumos (DWH gold \u2013 linear ad sales, finance, intl, content)","name":"cube_carl_dwhprd_gold_show_genre_concat_dim","title":"Carl Dwhprd Gold \u2014 Show Genre Concat Dim","kind":"Dimension","src":"dwhprd_gold.show_genre_concat_dim","sql":"No","measures":0,"dims":2,"joins":"","preagg":"","views":"sox_view_airings_fact","desc":"A concatenated network-genre lookup combining up to three genre levels (primary/second/third) into one display value, reached from show_dim.show_genre_concat_key. Only the concatenated name is modelled; the individual primary/second/third genre columns are not currently read.","file":"model/efs/Lumos/cubes/cube_carl_dwhprd_gold_dimensions.yaml"},{"domain":"Lumos (DWH gold \u2013 linear ad sales, finance, intl, content)","name":"cube_carl_dwhprd_gold_source_system_dim","title":"Carl Dwhprd Gold \u2014 Source System Dim","kind":"Dimension","src":"dwhprd_gold.source_syste ing a line-item or order key. Without one there is no grain integrity and overlap can only be resolved at bucket level.","Audience flag is a header row in the workbook today, not a column."]},{"id":"ADP-DELIVERY-202","name":"Ad Product Delivery","domain":"Ad Products","status":"proposed","answers":"What did display actually deliver, by line item and ad unit?","tables":["adproducts_gold.fct_ad_delivery"],"views":["adproducts_view_ad_delivery"],"grain":"line_item x product x site x ad_unit x format x audience_flag x activity month","gaps":["Kept deliberately separate from booked revenue because the two run on different calendars \u2014 booked on calendar quarter, delivered on activity quarter. Merging them silently is the failure mode this product exists to prevent.","$65.74M of $80.38M GAM revenue sits under product \"Other\", so yield by product cannot be completed for display until GAM line items carry a placement classification."]},{"id":"ADP-BUCKETED-203","name":"Deduplicated Revenue Buckets","domain":"Ad Products","status":"proposed","answers":"Split across Ad Innovation, DAT and Traditional, with the overlap removed \u2014 how much revenue is in each, without double counting?","tables":["adproducts_gold.fct_ad_revenue_bucketed"],"views":["adproducts_view_ad_revenue_bucketed"],"grain":"One row per booked line per bucket","gaps":["The six bucket names still need business sign-off."]},{"id":"ADP-YIELD-204","name":"Ad Product Yield","domain":"Ad Products","status":"proposed","answers":"What is CPM and yield by vertical, format and quarter?","tables":[],"views":["adproducts_view_yield"],"grain":"Vertical x format x quarter","gaps":["Depends on the In-front 1.9x impression multiplier becoming an effective-dated rule row rather than a constant repeated in 560 formulas.","\"Production Fee\" is unmapped in the buy-type map, so $108,507 drops out of every breakdown while staying in the total."]},{"id":"MSI-SUPPLY-DEMAND-301","name":"Telecast Supply & Demand (Nielsen C3 x   cube:   { label: "Cube",   color: "var(--cube)",   what: "Semantic layer: governed measures and dimensions over Gold." },
  other:  { label: "Unlayered", color: "var(--other)", what: "Control, audit, UAT and sandbox databases with no medallion suffix." },
};
const TIERS = ["certified", "production", "pipeline", "undocumented", "sandbox", "stale"];
const TIER_COLOR = { certified: "#2fa36f", production: "#3b7ddd", pipeline: "#7a5fd0", undocumented: "#e0a230", sandbox: "#b9bec8", stale: "#d9583f" };
const TIER_HELP = {
  certified: "Bound to a certified or beta data product in the registry",
  production: "In prod, refreshed, with a catalogued producer job",
  pipeline: "Refreshed with a known producer, not yet in prod",
  undocumented: "Refreshed, but no catalogued job claims to write it",
  sandbox: "Database name marks it as scratch / POC / UAT",
  stale: `No publish within ${DATA.windowDays} days of the snapshot`,
};

const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const fmt = n => Number(n || 0).toLocaleString();
const pct = (a, b) => b ? Math.round(100 * a / b) + "%" : "–";
const by = (arr, f) => arr.reduce((m, x) => ((m[f(x)] ||= []).push(x), m), {});
const latest = t => (t.prodTs > t.devTs ? t.prodTs : t.devTs) || "";
const exposed = t => t.cubes.length || t.views.length;
const chip = (cls, text, title) => `<span class="chip ${cls}"${title ? ` title="${esc(title)}"` : ""}>${esc(text)}</span>`;
const tierChip = t => chip("tier-" + t, t, TIER_HELP[t]);

const T = DATA.tables;
const byLayer = by(T, t => t.layer);
const deployedViews = DATA.cubeViews.filter(v => v.status === "deployed");
const designedViews = DATA.cubeViews.filter(v => v.status !== "deployed");

function tierBar(rows) {
  const c = {}; rows.forEach(r => c[r.tier] = (c[r.tier] || 0) + 1);
  return `<div class="bar" title="${TIERS.filter(k => c[k]).map(k => `${k}: ${c[k]}`).join("\n")}">` +
    TIERS.filter(k => c[k]).map(k => `<span style="width:${100 * c[k] / rows.length}%;background:${TIER_COLOR[k]}"></span>`).join("") + "</div>";
}
const tierLegend = () => `<div class="legend">${TIERS.map(k => `<span title="${esc(TIER_HELP[k])}"><i style="background:${TIER_COLOR[k]}"></i>${k}</span>`).join("")}</div>`;

/* ---------- header + nav ---------- */
document.getElementById("meta").innerHTML =
  `Physical snapshot ${esc(DATA.asof)} · built ${esc(DATA.generated)} · ` +
  `Sources: ${Object.values(DATA.sources).map(esc).join("; ")}`;

const TABS = [
  ["overview", "Overview", ""],
  ["bronze", "Bronze", (byLayer.bronze || []).length],
  ["silver", "Silver", (byLayer.silver || []).length],
  ["gold", "Gold", (byLayer.gold || []).length],
  ["cube", "Cube", deployedViews.length + " views"],
  ["other", "Unlayered", (byLayer.other || []).length],
];
const nav = document.getElementById("nav");
nav.innerHTML = TABS.map(([id, label, n]) =>
  `<button data-tab="${id}" style="--accent:${(LAYER_INFO[id] || {}).color || "#fff"}">${label}${n !== "" ? `<span class="count">${esc(n)}</span>` : ""}</button>`).join("");
nav.addEventListener("click", e => { const b = e.target.closest("button"); if (b) show(b.dataset.tab); });

const rendered = {};
function show(id, opts) {
  document.querySelectorAll("nav button").forEach(b => b.classList.toggle("active", b.dataset.tab === id));
  document.querySelectorAll("section.tab").forEach(s => s.classList.toggle("active", s.id === "tab-" + id));
  if (!rendered[id]) { rendered[id] = true; (id === "overview" ? renderOverview : id === "cube" ? renderCube : renderLayer)(id); }
  if (opts && LAYER_STATE[id]) { Object.assign(LAYER_STATE[id], opts); LAYER_STATE[id].apply(); }
  history.replaceState(null, "", "#" + id);
  window.scrollTo(0, 0);
}

/* ---------- overview ---------- */
function layerStats(rows) {
  const dbs = new Set(rows.map(r => r.db));
  return {
    n: rows.length, dbs: dbs.size,
    prod: rows.filter(r => r.prod).length,
    devOnly: rows.filter(r => r.dev && !r.prod).length,
    exposed: rows.filter(exposed).length,
    fresh: rows.filter(r => r.tier !== "stale" && r.tier !== "sandbox").length,
    stale: rows.filter(r => r.tier === "stale").length,
    domains: new Set(rows.map(r => r.domain)).size,
  };
}

function renderOverview() {
  const el = document.getElementById("tab-overview");
  const s = Object.fromEntries(LAYERS.map(l => [l, layerStats(byLayer[l] || [])]));
  const fields = deployedViews.flatMap(v => v.fields);
  const measures = fields.filter(f => f.type === "measure").length;
  const facts = DATA.cubes.filter(c => /fact/i.test(c.kind)).length;

  const layerCard = l => `
    <div class="card layer-card" style="--c:${LAYER_INFO[l].color}" onclick="show('${l}')">
      <h3>${LAYER_INFO[l].label}</h3>
      <div class="big">${fmt(s[l].n)} <span class="muted" style="font-size:13px;font-weight:400">tables</span></div>
      <div class="what">${LAYER_INFO[l].what}</div>
      <dl>
        <dt>Databases</dt><dd>${s[l].dbs}</dd>
        <dt>Domains</dt><dd>${s[l].domains}</dd>
        <dt>In prod</dt><dd>${fmt(s[l].prod)} <span class="muted">(${pct(s[l].prod, s[l].n)})</span></dd>
        <dt>Dev only</dt><dd>${fmt(s[l].devOnly)}</dd>
        <dt>Stale (&gt;${DATA.windowDays}d)</dt><dd>${fmt(s[l].stale)}</dd>
        <dt>Exposed via Cube</dt><dd>${fmt(s[l].exposed)}</dd>
      </dl>
    </div>`;

  const cubeCard = `
    <div class="card layer-card" style="--c:var(--cube)" onclick="show('cube')">
      <h3>Cube</h3>
      <div class="big">${deployedViews.length} <span class="muted" style="font-size:13px;font-weight:400">views deployed</span></div>
      <div class="what">${LAYER_INFO.cube.what}</div>
      <dl>
        <dt>Cubes</dt><dd>${DATA.cubes.length}</dd>
        <dt>Fact / dimension cubes</dt><dd>${facts} / ${DATA.cubes.length - facts}</dd>
        <dt>Exposed fields</dt><dd>${fmt(fields.length)}</dd>
        <dt>Measures</dt><dd>${fmt(measures)}</dd>
        <dt>Designed, not deployed</dt><dd>${designedViews.filter(v => v.status === "proposed").length}</dd>
        <dt>Business areas</dt><dd>${new Set(deployedViews.map(v => v.business).filter(Boolean)).size}</dd>
      </dl>
    </div>`;

  // domain x layer matrix
  const domains = [...new Set(T.filter(t => t.layer !== "other").map(t => t.domain))];
  const viewsByDomainKey = {};
  DATA.cubeViews.filter(v => v.status === "deployed").forEach(v => {
    const srcDbs = (v.base || "").split(/[,\s]+/).filter(Boolean).map(x => x.split(".")[0]);
    const doms = new Set(T.filter(t => srcDbs.some(d => t.db === d || t.db.replace(/^carl_/, "").replace(/_(dev|qa|stage|prod)$/, "") === d)).map(t => t.domain));
    doms.forEach(d => viewsByDomainKey[d] = (viewsByDomainKey[d] || 0) + 1);
  });
  const cnt = {}; T.forEach(t => { const k = t.domain + "|" + t.layer; cnt[k] = (cnt[k] || 0) + 1; });
  domains.sort((a, b) => LAYERS.reduce((s2, l) => s2 + (cnt[b + "|" + l] || 0), 0) - LAYERS.reduce((s2, l) => s2 + (cnt[a + "|" + l] || 0), 0));
  const max = Math.max(...Object.values(cnt));
  const shade = (n, color) => n ? `background:color-mix(in srgb, ${color} ${Math.round(12 + 60 * Math.sqrt(n / max))}%, white)` : "";
  const matrix = `<table class="matrix"><thead><tr><th>Domain</th>${LAYERS.map(l => `<th class="num">${LAYER_INFO[l].label}</th>`).join("")}<th class="num">Cube views</th><th>Shape</th></tr></thead><tbody>` +
    domains.map(d => {
      const n = LAYERS.map(l => cnt[d + "|" + l] || 0), v = viewsByDomainKey[d] || 0;
      const shape = n[0] && !n[1] && !n[2] ? "Bronze only" : n[2] && !v ? "Gold, no Cube" : v ? "Reaches Cube" : n[1] && !n[2] ? "Stops at Silver" : "";
      return `<tr><td>${esc(d)}</td>${LAYERS.map((l, i) => `<td class="cell ${n[i] ? "" : "zero"}" style="${shade(n[i], LAYER_INFO[l].color)}" ${n[i] ? `onclick="show('${l}',{domain:${esc(JSON.stringify(d))}})"` : ""}>${n[i] || "·"}</td>`).join("")}
        <td class="cell ${v ? "" : "zero"}" style="${shade(v * 8, "var(--cube)")}" ${v ? `onclick="show('cube')"` : ""}>${v || "·"}</td><td class="muted">${shape}</td></tr>`;
    }).join("") + "</tbody></table>";

  // findings
  const bronzeOnly = domains.filter(d => cnt[d + "|bronze"] && !cnt[d + "|silver"] && !cnt[d + "|gold"]);
  const goldProd = (byLayer.gold || []).filter(t => t.prod);
  const goldProdExposed = goldProd.filter(exposed);
  const dwh = (byLayer.gold || []).filter(t => /dwhprd_gold/.test(t.db));
  const undoc = T.filter(t => t.tier === "undocumented").length;
  const findings = [
    `<b>${fmt(T.length)} Iceberg tables</b> across ${new Set(T.map(t => t.db)).size} databases: ${fmt(s.bronze.n)} Bronze, ${fmt(s.silver.n)} Silver, ${fmt(s.gold.n)} Gold, plus ${fmt((byLayer.other || []).length)} in unlayered control, UAT and sandbox databases.`,
    `<b>Only ${fmt(goldProd.length)} of ${fmt(s.gold.n)} Gold tables are in prod</b> (${pct(goldProd.length, s.gold.n)}); ${fmt(goldProdExposed.length)} of those prod Gold tables are reachable through a Cube view.`,
    dwh.length ? `<b>${fmt(dwh.length)} Gold tables are the Lumos DWH port</b> (${esc([...new Set(dwh.map(t => t.db))].join(", "))}), dev only. ${fmt(dwh.filter(exposed).length)} of them already back Cube cubes, so most deployed Cube views read from tables not yet in prod.` : "",
    bronzeOnly.length ? `<b>${bronzeOnly.length} domains have Bronze but no Silver or Gold:</b> ${esc(bronzeOnly.join(", "))}. Every consumer of those re-derives the same logic.` : "",
    `<b>${fmt(undoc)} tables are "undocumented"</b>: refreshing, but no catalogued job claims to write them, so nobody can be paged when they stop.`,
    `<b>${designedViews.filter(v => v.status === "proposed").length} Cube views are designed but not deployed</b> (Ad Products and Research Market Share). Attach new demand to these rather than opening duplicates.`,
  ].filter(Boolean);

  const tierRows = LAYERS.concat("other").map(l => {
    const rows = byLayer[l] || [];
    return `<tr><td>${chip(l === "other" ? "" : l, LAYER_INFO[l].label)}</td><td class="num">${fmt(rows.length)}</td><td style="width:55%">${rows.length ? tierBar(rows) : ""}</td>` +
      TIERS.map(k => `<td class="num">${fmt(rows.filter(r => r.tier === k).length)}</td>`).join("") + "</tr>";
  }).join("");

  const products = DATA.products.map(p => {
    const layers = new Set(p.tables.map(f => (T.find(t => t.db + "." + t.t === f) || {}).layer || (f.match(/_(bronze|silver|gold)\b/) || [])[1]).filter(Boolean));
    const live = p.tables.filter(f => T.some(t => t.db + "." + t.t === f)).length;
    return `<tr><td class="mono">${esc(p.id)}</td><td><b>${esc(p.name)}</b><div class="muted">${esc(p.answers)}</div></td><td>${esc(p.domain)}</td><td>${chip("st-" + p.status, p.status)}</td>
      <td>${LAYERS.filter(l => layers.has(l)).map(l => chip(l, LAYER_INFO[l].label)).join("")}${p.views.length ? chip("cube", "Cube") : ""}</td>
      <td class="num">${p.tables.length ? `${live}/${p.tables.length}` : "–"}</td>
      <td class="muted" style="max-width:340px">${p.gaps.map(g => esc(g)).join("<br>")}</td></tr>`;
  }).join("");

  el.innerHTML = `
    <div class="flow">${layerCard("bronze")}<div class="arrow">→</div>${layerCard("silver")}<div class="arrow">→</div>${layerCard("gold")}<div class="arrow">→</div>${cubeCard}</div>
    <div class="grid two" style="margin-top:14px">
      <div class="card"><h2>Key findings</h2><ul class="findings">${findings.map(f => `<li>${f}</li>`).join("")}</ul></div>
      <div class="card"><h2>Tier mix by layer <small>how safe each table is to cite</small></h2>${tierLegend()}
        <table><thead><tr><th>Layer</th><th class="num">Tables</th><th></th>${TIERS.map(k => `<th class="num" title="${esc(TIER_HELP[k])}">${k.slice(0, 5)}</th>`).join("")}</tr></thead><tbody>${tierRows}</tbody></table>
        <div class="note">Hover a tier for its definition. Tiers follow the iceberg-catalog-agent rules.</div></div>
    </div>
    <h2>Domain × layer <small>table counts; click a cell to open that layer filtered to the domain</small></h2>
    <div class="card scroll" style="max-height:none;padding:0">${matrix}</div>
    <h2>Curated data products <small>registry/products.yaml — what a requester can build on</small></h2>
    <div class="card scroll" style="padding:0"><table><thead><tr><th>ID</th><th>Product</th><th>Domain</th><th>Status</th><th>Layers</th><th class="num">Tables live</th><th>Known gaps</th></tr></thead><tbody>${products}</tbody></table></div>`;
}

/* ---------- layer tabs ---------- */
const LAYER_STATE = {};
function sortable(table, rows, cols, renderRows, initial) {
  let key = initial, asc = false;
  const ths = table.querySelectorAll("th[data-k]");
  ths.forEach(th => th.addEventListener("click", () => {
    asc = key === th.dataset.k ? !asc : th.dataset.k === "t" || th.dataset.k === "db";
    key = th.dataset.k; draw();
  }));
  function draw() {
    ths.forEach(th => { th.classList.toggle("sorted", th.dataset.k === key); th.classList.toggle("asc", th.dataset.k === key && asc); });
    const get = cols[key];
    const sorted = rows().slice().sort((a, b) => { const x = get(a), y = get(b); return (x < y ? -1 : x > y ? 1 : 0) * (asc ? 1 : -1); });
    renderRows(sorted);
  }
  return draw;
}

function renderLayer(layer) {
  const el = document.getElementById("tab-" + layer);
  const rows = byLayer[layer] || [];
  const st = layerStats(rows);
  const dbRows = Object.entries(by(rows, r => r.db)).map(([db, ts]) => ({
    db, ts, domain: ts[0].domain, n: ts.length, prod: ts.filter(t => t.prod).length, dev: ts.filter(t => t.dev).length,
    last: ts.map(latest).sort().pop() || "", exposed: ts.filter(exposed).length,
    src: [...new Set(ts.map(t => t.src).filter(Boolean).flatMap(s => s.split(/,\s*/)))].join(", "),
  }));
  const domains = [...new Set(rows.map(r => r.domain))].sort();
  const srcs = [...new Set(rows.flatMap(r => r.src ? r.src.split(/,\s*/) : []))].sort();
  const info = LAYER_INFO[layer];

  el.innerHTML = `
    <div class="grid kpis">
      ${[["Tables", st.n], ["Databases", st.dbs], ["Domains", st.domains], ["In prod", st.prod, pct(st.prod, st.n) + " of layer"],
         ["Dev only", st.devOnly], ["Stale", st.stale, `no publish in ${DATA.windowDays}d`], ["Exposed via Cube", st.exposed]]
        .map(([l, v, s]) => `<div class="card kpi" style="border-top:3px solid ${info.color}"><div class="l">${l}</div><div class="v">${fmt(v)}</div>${s ? `<div class="s">${s}</div>` : ""}</div>`).join("")}
    </div>
    <p class="muted" style="margin:10px 0 0">${info.what}</p>
    <h2>Databases <small>click a row to filter the table inventory below</small></h2>${tierLegend()}
    <div class="scroll" style="max-height:420px"><table id="${layer}-dbs"><thead><tr>
      <th data-k="db">Database</th><th data-k="domain">Domain</th><th data-k="n" class="num">Tables</th><th data-k="dev" class="num">Dev</th><th data-k="prod" class="num">Prod</th>
      <th data-k="exposed" class="num">Cube</th><th data-k="last">Last publish</th><th>Tier mix</th><th data-k="src">Source systems</th></tr></thead><tbody></tbody></table></div>
    <h2>Table inventory</h2>
    <div class="controls">
      <input type="search" placeholder="Search table, database, producer, cube…" id="${layer}-q">
      <select id="${layer}-domain"><option value="">All domains</option>${domains.map(d => `<option>${esc(d)}</option>`).join("")}</select>
      <select id="${layer}-db"><option value="">All databases</option>${dbRows.map(d => d.db).sort().map(d => `<option>${esc(d)}</option>`).join("")}</select>
      <select id="${layer}-tier"><option value="">All tiers</option>${TIERS.map(t => `<option>${t}</option>`).join("")}</select>
      <select id="${layer}-src"><option value="">All sources</option>${srcs.map(s => `<option>${esc(s)}</option>`).join("")}</select>
      <div class="pill-toggle" id="${layer}-env"><button data-v="" class="on">All envs</button><button data-v="prod">In prod</button><button data-v="devonly">Dev only</button></div>
      <label class="muted"><input type="checkbox" id="${layer}-cube"> Cube-exposed</label>
      <span class="n" id="${layer}-n"></span>
    </div>
    <div class="scroll"><table id="${layer}-tables"><thead><tr>
      <th data-k="t">Table</th><th data-k="db">Database</th><th data-k="domain">Domain</th><th data-k="tier">Tier</th><th>Envs</th>
      <th data-k="last">Last publish</th><th data-k="src">Source</th><th data-k="producer">Producer</th><th>Cube</th><th data-k="product">Product</th></tr></thead><tbody></tbody></table></div>
    <button class="more" id="${layer}-more" hidden>Show more</button>`;

  const state = LAYER_STATE[layer] = { q: "", domain: "", db: "", tier: "", src: "", env: "", cube: false, limit: 300 };
  const $ = id => document.getElementById(`${layer}-${id}`);

  const dbTable = $("dbs");
  const drawDbs = sortable(dbTable, () => dbRows,
    { db: r => r.db, domain: r => r.domain, n: r => r.n, dev: r => r.dev, prod: r => r.prod, exposed: r => r.exposed, last: r => r.last, src: r => r.src },
    sorted => {
      dbTable.tBodies[0].innerHTML = sorted.map(r => `<tr class="click ${state.db === r.db ? "sel" : ""}" data-db="${esc(r.db)}">
        <td class="mono">${esc(r.db)}</td><td>${esc(r.domain)}</td><td class="num">${fmt(r.n)}</td><td class="num">${fmt(r.dev)}</td>
        <td class="num">${r.prod ? fmt(r.prod) : '<span class="muted">0</span>'}</td><td class="num">${r.exposed || '<span class="muted">0</span>'}</td>
        <td class="mono">${esc(r.last)}</td><td>${tierBar(r.ts)}</td><td class="muted">${esc(r.src)}</td></tr>`).join("");
    }, "n");
  dbTable.tBodies[0].addEventListener("click", e => {
    const tr = e.target.closest("tr"); if (!tr) return;
    state.db = state.db === tr.dataset.db ? "" : tr.dataset.db; $("db").value = state.db; state.apply();
  });

  const tTable = $("tables");
  const filtered = () => {
    const q = state.q.toLowerCase();
    return rows.filter(r =>
      (!state.domain || r.domain === state.domain) && (!state.db || r.db === state.db) && (!state.tier || r.tier === state.tier) &&
      (!state.src || r.src.split(/,\s*/).includes(state.src)) &&
      (!state.env || (state.env === "prod" ? r.prod : r.dev && !r.prod)) && (!state.cube || exposed(r)) &&
      (!q || [r.t, r.db, r.producer, r.src, r.product, r.cubes.join(" "), r.views.join(" ")].join(" ").toLowerCase().includes(q)));
  };
  const drawTables = sortable(tTable, filtered,
    { t: r => r.t, db: r => r.db, domain: r => r.domain, tier: r => TIERS.indexOf(r.tier), last: latest, src: r => r.src, producer: r => r.producer, product: r => r.product },
    sorted => {
      $("n").textContent = `${fmt(sorted.length)} of ${fmt(rows.length)} tables`;
      tTable.tBodies[0].innerHTML = sorted.slice(0, state.limit).map(r => `<tr>
        <td class="mono"><b>${esc(r.t)}</b></td><td class="mono muted">${esc(r.db)}</td><td>${esc(r.domain)}</td><td>${tierChip(r.tier)}</td>
        <td>${chip(r.dev ? "env" : "envoff", "dev", r.devTs)}${chip(r.prod ? "env" : "envoff", "prod", r.prodTs)}</td>
        <td class="mono">${esc(latest(r))}</td><td>${esc(r.src)}</td><td class="mono muted">${esc(r.producer)}</td>
        <td>${r.views.map(v => chip("cube", v, "Cube view")).join("")}${r.cubes.length ? `<span class="muted" title="${esc(r.cubes.join("\n"))}">${r.cubes.length} cube${r.cubes.length > 1 ? "s" : ""}</span>` : ""}</td>
        <td class="mono">${esc(r.product)}</td></tr>`).join("");
      $("more").hidden = sorted.length <= state.limit;
      $("more").textContent = `Show more (${fmt(sorted.length - state.limit)} hidden)`;
    }, "last");

  state.apply = () => {
    $("q").value = state.q; $("domain").value = state.domain; $("db").value = state.db; $("tier").value = state.tier; $("src").value = state.src;
    $("cube").checked = state.cube;
    $("env").querySelectorAll("button").forEach(b => b.classList.toggle("on", b.dataset.v === state.env));
    drawDbs(); drawTables();
  };
  $("q").addEventListener("input", e => { state.q = e.target.value; state.limit = 300; drawTables(); });
  ["domain", "db", "tier", "src"].forEach(k => $(k).addEventListener("change", e => { state[k] = e.target.value; state.limit = 300; state.apply(); }));
  $("cube").addEventListener("change", e => { state.cube = e.target.checked; drawTables(); });
  $("env").addEventListener("click", e => { const b = e.target.closest("button"); if (b) { state.env = b.dataset.v; state.apply(); } });
  $("more").addEventListener("click", () => { state.limit += 500; drawTables(); });
  state.apply();
}

/* ---------- cube tab ---------- */
function renderCube() {
  const el = document.getElementById("tab-cube");
  const fields = deployedViews.flatMap(v => v.fields.map(f => ({ ...f, view: v.name })));
  const measures = fields.filter(f => f.type === "measure").length;
  const facts = DATA.cubes.filter(c => /fact/i.test(c.kind)).length;
  const srcDbs = by(DATA.cubes.flatMap(c => c.src.split(/[,\s]+/).filter(s => s.includes("."))), s => s.split(".")[0]);
  const layerOfSrc = db => (db.match(/(bronze|silver|gold)/) || ["", "other"])[1];

  el.innerHTML = `
    <div class="grid kpis">
      ${[["Views deployed", deployedViews.length, "the query surface"], ["Cubes", DATA.cubes.length, `${facts} fact · ${DATA.cubes.length - facts} dimension`],
         ["Exposed fields", fields.length, `${fmt(measures)} measures · ${fmt(fields.length - measures)} dimensions`],
         ["Business areas", new Set(deployedViews.map(v => v.business).filter(Boolean)).size, [...new Set(deployedViews.map(v => v.business).filter(Boolean))].join(", ")],
         ["Source tables", Object.values(srcDbs).reduce((a, b) => a + new Set(b).size, 0), Object.keys(srcDbs).join(", ")],
         ["Designed, not deployed", designedViews.filter(v => v.status === "proposed").length, "Ad Products · Market Share"]]
        .map(([l, v, s]) => `<div class="card kpi" style="border-top:3px solid var(--cube)"><div class="l">${l}</div><div class="v">${fmt(v)}</div><div class="s">${esc(s)}</div></div>`).join("")}
    </div>
    <h2>Where Cube reads from <small>source tables behind all cubes, by database</small></h2>
    <div class="card" style="padding:0"><table><thead><tr><th>Source database</th><th>Layer</th><th class="num">Tables used</th><th class="num">Cubes</th></tr></thead><tbody>
      ${Object.entries(srcDbs).sort((a, b) => b[1].length - a[1].length).map(([db, list]) => {
        const l = layerOfSrc(db);
        return `<tr><td class="mono">${esc(db)}</td><td>${l === "other" ? "" : chip(l, LAYER_INFO[l].label)}</td><td class="num">${new Set(list).size}</td>
          <td class="num">${DATA.cubes.filter(c => c.src.split(/[,\s]+/).some(s => s.startsWith(db + "."))).length}</td></tr>`;
      }).join("")}</tbody></table></div>
    <h2>Views <small>click a view to see its measures and dimensions</small></h2>
    <div class="controls">
      <input type="search" id="cube-q" placeholder="Search views, fields, descriptions, base tables…">
      <select id="cube-biz"><option value="">All business areas</option>${[...new Set(DATA.cubeViews.map(v => v.business).filter(Boolean))].sort().map(b => `<option>${esc(b)}</option>`).join("")}</select>
      <div class="pill-toggle" id="cube-status"><button data-v="" class="on">All</button><button data-v="deployed">Deployed</button><button data-v="designed">Designed only</button></div>
      <span class="n" id="cube-n"></span>
    </div>
    <div id="cube-views"></div>
    <h2>All cubes <small>the building blocks views are assembled from</small></h2>
    <div class="controls">
      <input type="search" id="cubes-q" placeholder="Search cubes, source tables, joins…">
      <select id="cubes-kind"><option value="">All kinds</option><option>Fact / metric</option><option>Dimension</option></select>
      <span class="n" id="cubes-n"></span>
    </div>
    <div class="scroll"><table id="cubes-table"><thead><tr>
      <th data-k="name">Cube</th><th data-k="kind">Kind</th><th data-k="domain">Domain</th><th data-k="src">Source table</th>
      <th data-k="measures" class="num">Measures</th><th data-k="dims" class="num">Dims</th><th data-k="views">Used in views</th><th>Description</th></tr></thead><tbody></tbody></table></div>`;

  const vs = { q: "", biz: "", status: "" };
  const drawViews = () => {
    const q = vs.q.toLowerCase();
    const list = DATA.cubeViews.filter(v =>
      (!vs.biz || v.business === vs.biz) &&
      (!vs.status || (vs.status === "deployed" ? v.status === "deployed" : v.status !== "deployed")) &&
      (!q || [v.name, v.title, v.desc, v.base, v.domain, ...v.fields.map(f => f.name + " " + f.title + " " + f.desc)].join(" ").toLowerCase().includes(q)));
    document.getElementById("cube-n").textContent = `${list.length} of ${DATA.cubeViews.length} views`;
    const groups = by(list, v => v.domain);
    document.getElementById("cube-views").innerHTML = Object.entries(groups).map(([dom, vlist]) => `<div class="domain-h">${esc(dom)} · ${vlist.length}</div>` +
      vlist.map(v => {
        const ms = v.fields.filter(f => f.type === "measure"), ds = v.fields.filter(f => f.type !== "measure");
        const hit = f => q && [f.name, f.title, f.desc].join(" ").toLowerCase().includes(q);
        const ftable = (title, fs) => fs.length ? `<h3 style="font-size:13px;margin:10px 0 6px">${title} (${fs.length})</h3><div class="scroll" style="max-height:320px"><table><thead><tr><th>Field</th><th>Title</th><th>Type / agg</th><th>Source cube.member</th><th>Description</th></tr></thead><tbody>` +
          fs.map(f => `<tr${hit(f) ? ' style="background:#fff7d6"' : ""}><td class="mono">${esc(f.name)}</td><td>${esc(f.title)}</td><td class="mono">${esc(f.dtype)}</td><td class="mono muted">${esc(f.cube ? f.cube + "." + f.member : "")}</td><td class="muted">${esc(f.desc)}</td></tr>`).join("") + "</tbody></table></div>" : "";
        return `<details class="view"${q && v.fields.some(hit) ? " open" : ""}><summary>
          <div class="vname">${esc(v.title)}<span class="mono">${esc(v.name)}</span></div>
          <div class="muted" style="font-size:12px">${esc(v.desc).slice(0, 220)}${v.desc.length > 220 ? "…" : ""}</div>
          <div>${chip("st-" + v.status, v.status === "deployed" ? "deployed" : v.status)}${v.business ? chip("cube", v.business) : ""}</div>
          <div class="muted" style="font-size:12px">${fmt(v.measures)} measures<br>${fmt(v.dims)} dims</div>
          <div class="muted" style="font-size:12px">${v.joins != null ? fmt(v.joins) + " cubes" : ""}</div></summary>
          <div class="body"><div><b>Base table:</b> <span class="mono">${esc(v.base)}</span></div>
            <div class="muted" style="margin-top:4px">${esc(v.desc)}</div>
            <div class="muted mono" style="margin-top:4px">${esc(v.file)}</div>
            ${ftable("Measures", ms)}${ftable("Dimensions", ds)}</div></details>`;
      }).join("")).join("") || '<p class="muted">No views match.</p>';
  };
  document.getElementById("cube-q").addEventListener("input", e => { vs.q = e.target.value; drawViews(); });
  document.getElementById("cube-biz").addEventListener("change", e => { vs.biz = e.target.value; drawViews(); });
  document.getElementById("cube-status").addEventListener("click", e => {
    const b = e.target.closest("button"); if (!b) return; vs.status = b.dataset.v;
    e.currentTarget.querySelectorAll("button").forEach(x => x.classList.toggle("on", x === b)); drawViews();
  });
  drawViews();

  const cs = { q: "", kind: "" };
  const ct = document.getElementById("cubes-table");
  const drawCubes = sortable(ct, () => DATA.cubes.filter(c => (!cs.kind || c.kind === cs.kind) &&
      (!cs.q || [c.name, c.title, c.src, c.joins, c.views, c.desc].join(" ").toLowerCase().includes(cs.q.toLowerCase()))),
    { name: c => c.name, kind: c => c.kind, domain: c => c.domain, src: c => c.src, measures: c => c.measures || 0, dims: c => c.dims || 0, views: c => c.views },
    sorted => {
      document.getElementById("cubes-n").textContent = `${sorted.length} of ${DATA.cubes.length} cubes`;
      ct.tBodies[0].innerHTML = sorted.map(c => `<tr><td class="mono"><b>${esc(c.name)}</b><div class="muted">${esc(c.title)}</div></td><td>${esc(c.kind)}</td>
        <td class="muted">${esc(c.domain)}</td><td class="mono">${esc(c.src)}</td><td class="num">${fmt(c.measures)}</td><td class="num">${fmt(c.dims)}</td>
        <td class="mono muted" style="max-width:240px">${esc(c.views)}</td><td class="muted" style="max-width:420px">${esc(c.desc).slice(0, 260)}${c.desc.length > 260 ? "…" : ""}</td></tr>`).join("");
    }, "measures");
  document.getElementById("cubes-q").addEventListener("input", e => { cs.q = e.target.value; drawCubes(); });
  document.getElementById("cubes-kind").addEventListener("change", e => { cs.kind = e.target.value; drawCubes(); });
  drawCubes();
}

const startTab = location.hash.slice(1);
show(TABS.some(([id]) => id === startTab) ? startTab : "overview");
</script>
</body>
</html>
