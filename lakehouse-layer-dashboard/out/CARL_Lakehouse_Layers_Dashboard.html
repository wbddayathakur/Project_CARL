im. This column holds the surrogate key only; the readable labels are columns on advertiser_dim. Filtered on directly downstream, because MSTR emits key literals rather than names.","cube":"cube_carl_dwhprd_gold_invoice_revenue_fact","member":"advertiser_key"},{"type":"measure","name":"as_sold_unequiv_rate","title":"As Sold Unequiv Rate","dtype":"sum","desc":"Sum of as-sold unit rates.","cube":"cube_carl_dwhprd_gold_invoice_revenue_fact","member":"as_sold_unequiv_rate"},{"type":"measure","name":"avg_equiv30_unit_rate","title":"Avg Equiv :30 Unit Rate","dtype":"number","desc":"Revenue per equivalent :30 unit. MSTR defines it elsewhere as Avg Equiv30 Revenue, computed as Revenue / [Equiv30 Spots] \u2014 exactly this. A metric named Avg Equiv :30 Unit Rate elsewhere is assumed to be the same computation, though no formula was available to confirm it there. Distinct from as_sold_unequiv_rate, which sums the rate on each row rather than deriving one.","cube":"cube_carl_dwhprd_gold_invoice_revenue_fact","member":"avg_equiv30_unit_rate"},{"type":"dimension","name":"buy_type_key","title":"Buy Type Key","dtype":"number","desc":"Foreign key joining invoice_revenue_fact to buy_type_dim. This column holds the surrogate key only; the readable labels are columns on buy_type_dim. Filtered on directly downstream, because MSTR emits key literals rather than names.","cube":"cube_carl_dwhprd_gold_invoice_revenue_fact","member":"buy_type_key"},{"type":"dimension","name":"buying_agency_key","title":"Buying Agency Key","dtype":"number","desc":"Foreign key joining invoice_revenue_fact to buying_agency_dim. This column holds the surrogate key only; the readable labels are columns on buying_agency_dim. Filtered on directly downstream, because MSTR emits key literals rather than names.","cube":"cube_carl_dwhprd_gold_invoice_revenue_fact","member":"buying_agency_key"},{"type":"dimension","name":"deal_revenue_snapshot_key","title":"Deal Revenue Snapshot Key","dtype":"number","desc":"Foreign key joining invoice_revenue_fact to deal_revenue_snapshot_dim. This column holds the surrogate key only; the readable labels are columns on deal_revenue_snapshot_dim. Filtered on directly downstream, because MSTR emits key literals rather than names.","cube":"cube_carl_dwhprd_gold_invoice_revenue_fact","member":"deal_revenue_snapshot_key"},{"type":"dimension","name":"deal_revenue_status_key","title":"Deal Revenue Status Key","dtype":"number","desc":"Foreign key joining invoice_revenue_fact to deal_revenue_status_dim. This column holds the surrogate key only; the readable labels are columns on deal_revenue_status_dim. Filtered on directly downstream, because MSTR emits key literals rather than names.","cube":"cube_carl_dwhprd_gold_invoice_revenue_fact","member":"deal_revenue_status_key"},{"type":"dimension","name":"deal_revision_key","title":"Deal Revision Key","dtype":"number","desc":"Foreign key joining invoice_revenue_fact to deal_dim. This column holds the surrogate key only; the readable labels are columns on deal_dim. Filtered on directly downstream, because MSTR emits key literals rather than names.","cube":"cube_carl_dwhprd_gold_invoice_revenue_fact","member":"deal_revision_key"},{"type":"measure","name":"eqv30_spots","title":"Equiv30 Spots","dtype":"sum","desc":"Sum of equivalent 30-second spots.","cube":"cube_carl_dwhprd_gold_invoice_revenue_fact","member":"eqv30_spots"},{"type":"dimension","name":"market_key","title":"Market Key","dtype":"number","desc":"Foreign key joining invoice_revenue_fact to market_dim. This column holds the surrogate key only; the readable labels are columns on market_dim. Filtered on directly downstream, because MSTR emits key literals rather than names.","cube":"cube_carl_dwhprd_gold_invoice_revenue_fact","member":"market_key"},{"type":"measure","name":"natl_comm_acm_net_corp_cpm","title":"ACM Net Corp CPM (National Commercial)","dtype":"number","desc":"UNVERIFIED \u2014 confirm with finance before quoting this number. MSTR defines it as [Revenue - Post ACM/National Commercial] / [ACM Net Corp Estimated Impressions], mixing a filtered numerator (national commercial revenue, only rows carrying a tracking methodology) with an UNFILTERED denominator. MSTR names the national-commercial variant explicitly elsewhere and not here, so this may be an authoring slip \u2014 the two readings give 17.4417 against 20.0368.","cube":"cube_carl_dwhprd_gold_invoice_revenue_fact","member":"natl_comm_acm_net_corp_cpm"},{"type":"measure","name":"natl_comm_ecm_net_corp_cpm","title":"ECM Net Corp CPM (National Commercial)","dtype":"number","desc":"The ECM sibling of natl_comm_pal_net_corp_cpm above, same formula shape \u2014 national commercial revenue over national commercial ECM net corp impressions, both sides filtered to buy type 12. Completes the \"PAL/ACM/ECM Net Corp Estimated CPM - National Commercial\" trio; ACM/PAL existed already, this was the missing one.","cube":"cube_carl_dwhprd_gold_invoice_revenue_fact","member":"natl_comm_ecm_net_corp_cpm"},{"type":"measure","name":"natl_comm_pal_net_corp_cpm","title":"PAL Net Corp CPM (National Commercial)","dtype":"number","desc":"National commercial revenue per thousand PAL net corp impressions. MSTR defines it as [Revenue - National Commercial] / [PAL Net Corp Estimated Impressions - National Commercial]; both sides filter to buy type 12, so the ratio stays within national commercial. No multiply by 1000 is needed because the denominator is already in thousands.","cube":"cube_carl_dwhprd_gold_invoice_revenue_fact","member":"natl_comm_pal_net_corp_cpm"},{"type":"dimension","name":"network_key","title":"Network Key","dtype":"number","desc":"Foreign key joining invoice_revenue_fact to network_dim. This column holds the surrogate key only; the readable labels are columns on network_dim. Filtered on directly downstream, because MSTR emits key literals rather than names.","cube":"cube_carl_dwhprd_gold_invoice_revenue_fact","member":"network_key"},{"type":"dimension","name":"order_line_sell_key","title":"Order Line Sell Key","dtype":"number","desc":"Foreign key joining invoice_revenue_fact to order_line_sell_dim, the sell-side order line. This column holds the surrogate key only; order_line_sell_dim in turn carries order_line_revision_key, which reaches order_line_dim for the displayed line number.","cube":"cube_carl_dwhprd_gold_invoice_revenue_fact","member":"order_line_sell_key"},{"type":"dimension","name":"order_revision_key","title":"Order Revision Key","dtype":"number","desc":"Foreign key joining invoice_revenue_fact to order_dim. This column holds the surrogate key only; the readable labels are columns on order_dim. Filtered on directly downstream, because MSTR emits key literals rather than names.","cube":"cube_carl_dwhprd_gold_invoice_revenue_fact","member":"order_revision_key"},{"type":"dimension","name":"property_key","title":"Property Key","dtype":"number","desc":"Foreign key joining invoice_revenue_fact to property_dim. This column holds the surrogate key only; the readable labels are columns on property_dim. Filtered on directly downstream, because MSTR emits key literals rather than names.","cube":"cube_carl_dwhprd_gold_invoice_revenue_fact","member":"property_key"},{"type":"measure","name":"ratecard_pct","title":"% of Ratecard","dtype":"number","desc":"As-sold unequivalised rate over ratecard unequivalised rate. MSTR defines this as [As Sold Unequiv Rate] / [RateCard Unequiv Rate], which is exactly this. A ratio of two sums rather than a sum of ratios \u2014 dividing after aggregation is what MSTR does, and the two disagree at any grain coarser than a row.","cube":"cube_carl_dwhprd_gold_invoice_revenue_fact","member":"ratecard_pct"},{"type":"measure","name":"ratecard_unequiv_rate","title":"Ratecard Unequiv Rate","dtype":"sum","desc":"Sum of ratecard unit rates.","cube":"cube_carl_dwhprd_gold_invoice_revenue_fact","member":"ratecard_unequiv_rate"},{"type":"dimension","name":"rateclass_key","title":"Rateclass Key","dtype":"number","desc":"Foreign key joining invoice_revenue_fact to rateclass_dim. This column holds the surrogate key only; the readable labels are columns on rateclass_dim. Filtered on directly downstream, because MSTR emits key literals rather than names.","cube":"cube_carl_dwhprd_gold_invoice_revenue_fact","member":"rateclass_key"},{"type":"measure","name":"revenue","title":"Revenue","dtype":"sum","desc":"Total revenue summed across all transactions.","cube":"cube_carl_dwhprd_gold_invoice_revenue_fact","member":"revenue"},{"type":"dimension","name":"revenue_eff_bcast_month_key","title":"Revenue Effective Broadcast Month Key","dtype":"number","desc":"Foreign key joining invoice_revenue_fact to revenue_eff_bcast_month_dim. This column holds the surrogate key only; the readable labels (broadcast month name, and the quarter/half/year hierarchy above it) are columns on revenue_eff_bcast_month_dim.","cube":"cube_carl_dwhprd_gold_invoice_revenue_fact","member":"revenue_eff_bcast_month_key"},{"type":"dimension","name":"revenue_eff_bcast_qtr_key","title":"Revenue Effective Broadcast Quarter Key","dtype":"number","desc":"Foreign key joining invoice_revenue_fact to revenue_eff_bcast_qtr_dim. This column holds the surrogate key only; the readable labels are columns on revenue_eff_bcast_qtr_dim. Filtered on directly downstream, because MSTR emits key literals rather than names.","cube":"cube_carl_dwhprd_gold_invoice_revenue_fact","member":"revenue_eff_bcast_qtr_key"},{"type":"dimension","name":"revenue_eff_bcast_year_key","title":"Revenue Effective Broadcast Year Key","dtype":"number","desc":"Foreign key joining invoice_revenue_fact to revenue_eff_bcast_year_dim. This column holds the surrogate key only; the readable broadcast year is a column on revenue_eff_bcast_year_dim.","cube":"cube_carl_dwhprd_gold_invoice_revenue_fact","member":"revenue_eff_bcast_year_key"},{"type":"dimension","name":"revenue_eff_cal_month_key","title":"Revenue Effective Calendar Month Key","dtype":"number","desc":"A calendar dimension table that provides a complete hierarchy of time periods for revenue analysis, including month, quarter, half-year, and year levels with associated dates and day counts. This table enables time-based aggregation and filtering across multiple calendar granularities.","cube":"cube_carl_dwhprd_gold_invoice_revenue_fact","member":"revenue_eff_cal_month_key"},{"type":"dimension","name":"revenue_eff_cal_qtr_key","title":"Revenue Effective Calendar Quarter Key","dtype":"number","desc":"Foreign key joining invoice_revenue_fact to revenue_eff_cal_qtr_dim. This column holds the surrogate key only; the readable labels are columns on revenue_eff_cal_qtr_dim. Filtered on directly downstream, because MSTR emits key literals rather than names.","cube":"cube_carl_dwhprd_gold_invoice_revenue_fact","member":"revenue_eff_cal_qtr_key"},{"type":"dimension","name":"revenue_effective_day_key","title":"Revenue Effective Date Key","dtype":"number","desc":"A comprehensive time dimension table that provides calendar and broadcast period attributes for revenue-related fact tables. It contains daily grain records with associated calendar hierarchies (day, week, month, quarter, year) and broadcast period hierarchies, plus holiday and competitive pressure indicators.","cube":"cube_carl_dwhprd_gold_invoice_revenue_fact","member":"revenue_effective_day_key"},{"type":"dimension","name":"selling_title_daypart_key","title":"Selling Title Daypart Key","dtype":"number","desc":"This dimension table defines selling daypart configurations for broadcast networks, including time slots, scheduling details, and daypart groupings. Each row represents a unique combination of network, daypart time period, and selling classification used for advertising inventory management.","cube":"cube_carl_dwhprd_gold_invoice_revenue_fact","member":"selling_title_daypart_key"},{"type":"dimension","name":"unit_type_key","title":"Unit Type Key","dtype":"number","desc":"Foreign key joining invoice_revenue_fact to unit_type_dim. This column holds the surrogate key only; the readable labels are columns on unit_type_dim. Filtered on directly downstream, because MSTR emits key literals rather than names.","cube":"cube_carl_dwhprd_gold_invoice_revenue_fact","member":"unit_type_key"},{"type":"dimension","name":"account_property_category","title":"Account Property Category","dtype":"string","desc":"property_category_dim.property_category looked up by account_property_category_key via a correlated subquery, since property_category_dim is already joined once directly from invoice_revenue_fact (Order Property Category role, via invoice_revenue_fact.property_category_key). MSTR's ACCOUNT_PROPERTY_CATEGORY_DIM view (ADSALESDWH.ACCOUNT_PROPERTY_CATEGORY_DIM) is a pure rename over PROPERTY_CATEGORY_DIM \u2014 no join, no filter \u2014 confirming this is a role-play of the same dimension, not a distinct table. Probed against dev data: property_category_dim is unique on property_category_key (no fan-out risk), and every one of 406,836 account_dim rows has a matching property_category_dim row (0% orphan).","cube":"cube_carl_dwhprd_gold_account_dim","member":"account_property_category"},{"type":"dimension","name":"account_property_category_id","title":"Account Property Category ID","dtype":"number","desc":"property_category_dim.property_category_id looked up by account_property_category_key via a correlated subquery, for the same reason as account_property_category above.","cube":"cube_carl_dwhprd_gold_account_dim","member":"account_property_category_id"},{"type":"dimension","name":"act_air_daypart_day_time_name","title":"Actual Aired Daytime Daypart","dtype":"string","desc":"Human-readable name describing the daypart's day and time characteristics.","cube":"cube_carl_dwhprd_gold_actual_air_daypart_dim","member":"act_air_daypart_day_time_name"},{"type":"dimension","name":"adv_id","title":"Advertiser ID","dtype":"number","desc":"Business identifier for the advertiser from the source system.","cube":"cube_carl_dwhprd_gold_advertiser_dim","member":"adv_id"},{"type":"dimension","name":"adv_name","title":"Advertiser","dtype":"string","desc":"The legal or business name of the advertiser.","cube":"cube_carl_dwhprd_gold_advertiser_dim","member":"adv_name"},{"type":"dimension","name":"adv_name_id","title":"Advertiser (ID)","dtype":"string","desc":"Advertiser name with its business ID suffixed in parentheses, e.g. \"ABBOTT DIABETES CARE (12268)\" \u2014 reproduces MicroStrategy's display format exactly. Confirmed live in MSTR's own generated SQL (`\"ADV_NAME\"||' ('||\"ADV_ID\"||')' \"ADV_NAME\"`), which concatenates the same two fields already modeled separately here (adv_name, adv_id).","cube":"cube_carl_dwhprd_gold_advertiser_dim","member":"adv_name_id"},{"type":"dimension","name":"buy_type_desc","title":"Buy Type","dtype":"string","desc":"Human-readable description of the purchase type.","cube":"cube_carl_dwhprd_gold_buy_type_dim","member":"buy_type_desc"},{"type":"dimension","name":"buy_type_sales_group_desc","title":"Sales Group","dtype":"string","desc":"Description of the sales group associated with this purchase type.","cube":"cube_carl_dwhprd_gold_buy_type_dim","member":"buy_type_sales_group_desc"},{"type":"dimension","name":"buy_type_sales_group_key","title":"Sales Group Key","dtype":"number","desc":"Surrogate key linking to the associated sales group dimension.","cube":"cube_carl_dwhprd_gold_buy_type_dim","member":"buy_type_sales_group_key"},{"type":"dimension","name":"buying_agency_id","title":"Buying Agency ID","dtype":"number","desc":"Business identifier for the buying agency from the source system.","cube":"cube_carl_dwhprd_gold_buying_agency_dim","member":"buying_agency_id"},{"type":"dimension","name":"buying_agency_name","title":"Buying Agency","dtype":"string","desc":"Official name of the buying agency.","cube":"cube_carl_dwhprd_gold_buying_agency_dim","member":"buying_agency_name"},{"type":"dimension","name":"buying_agency_name_id","title":"Buying Agency (ID)","dtype":"string","desc":"Buying agency name with its business ID suffixed in parentheses, e.g. \"SPARK FOUNDRY-CHI (5848)\" \u2014 reproduces MicroStrategy's display format exactly. Confirmed live in MSTR's own generated SQL (`\"BUYING_AGENCY_NAME\"||' ('||\"BUYING_AGENCY_ID\"||')' \"BUYING_AGENCY_NAME\"`), which concatenates the same two fields already modeled separately here (buying_agency_name, buying_agency_id).","cube":"cube_carl_dwhprd_gold_buying_agency_dim","member":"buying_agency_name_id"},{"type":"dimension","name":"deal_cancelled_flag","title":"Deal Cancelled Flag","dtype":"string","desc":"Indicator flag showing if the deal has been cancelled.","cube":"cube_carl_dwhprd_gold_deal_dim","member":"deal_cancelled_flag"},{"type":"dimension","name":"deal_key","title":"Deal Key","dtype":"number","desc":"Surrogate key linking to the base deal entity.","cube":"cube_carl_dwhprd_gold_deal_dim","member":"deal_key"},{"type":"dimension","name":"deal_revision_num","title":"Deal Revision Number","dtype":"number","desc":"Sequential revision number for this deal.","cube":"cube_carl_dwhprd_gold_deal_dim","member":"deal_revision_num"},{"type":"dimension","name":"deal_year","title":"Deal Year","dtype":"number","desc":"Fiscal or calendar year associated with the deal.","cube":"cube_carl_dwhprd_gold_deal_dim","member":"deal_year"},{"type":"dimension","name":"gab_deal_id","title":"GAB Deal ID","dtype":"number","desc":"External identifier linking to a GAB (Global Account Business) system deal.","cube":"cube_carl_dwhprd_gold_deal_dim","member":"gab_deal_id"},{"type":"dimension","name":"last_revision_audit_num","title":"Last Revision Audit Num","dtype":"number","desc":"Audit number of the last revision made to the deal.","cube":"cube_carl_dwhprd_gold_deal_dim","member":"last_revision_audit_num"},{"type":"dimension","name":"last_revision_user","title":"Last Revision User","dtype":"string","desc":"User identifier of the person who made the last revi ","cube":"cube_carl_dwhprd_gold_deal_revenue_status_dim","member":"deal_revenue_status_desc"},{"type":"dimension","name":"market_desc","title":"Market","dtype":"string","desc":"Human-readable description or name of the market.","cube":"cube_carl_dwhprd_gold_market_dim","member":"market_desc"},{"type":"dimension","name":"net_name","title":"Network","dtype":"string","desc":"Official name of the broadcast network.","cube":"cube_carl_dwhprd_gold_network_dim","member":"net_name"},{"type":"dimension","name":"last_modified_date","title":"Last Modified Date","dtype":"time","desc":"Date when the order was last modified.","cube":"cube_carl_dwhprd_gold_order_dim","member":"last_modified_date"},{"type":"dimension","name":"order_num","title":"Order Num","dtype":"string","desc":"Human-readable order number or reference code.","cube":"cube_carl_dwhprd_gold_order_dim","member":"order_num"},{"type":"dimension","name":"order_sales_asst_id","title":"Order Sales Asst Id","dtype":"number","desc":"Identifier for the sales assistant assigned to the order.","cube":"cube_carl_dwhprd_gold_order_dim","member":"order_sales_asst_id"},{"type":"dimension","name":"order_sales_asst_name","title":"Order Sales Assistant","dtype":"string","desc":"Name of the sales assistant assigned to the order.","cube":"cube_carl_dwhprd_gold_order_dim","member":"order_sales_asst_name"},{"type":"dimension","name":"order_status_key","title":"Order Status Key","dtype":"number","desc":"Foreign key or code representing the current status of the order.","cube":"cube_carl_dwhprd_gold_order_dim","member":"order_status_key"},{"type":"dimension","name":"original_order_date","title":"Original Order Date","dtype":"time","desc":"Date when the order was originally placed or created.","cube":"cube_carl_dwhprd_gold_order_dim","member":"original_order_date"},{"type":"dimension","name":"order_status_desc","title":"Order Status","dtype":"string","desc":"Human-readable description of the order status, e.g. Hold or Order.","cube":"cube_carl_dwhprd_gold_order_status_dim","member":"order_status_desc"},{"type":"dimension","name":"order_line_num","title":"Order Line Num","dtype":"number","desc":"Human-readable line number within the parent order.","cube":"cube_carl_dwhprd_gold_order_line_dim","member":"order_line_num"},{"type":"dimension","name":"common_property_series_name","title":"Common Property Series","dtype":"string","desc":"Name of the series or franchise associated with the property.","cube":"cube_carl_dwhprd_gold_common_property_dim","member":"common_property_series_name"},{"type":"dimension","name":"rateclass_desc","title":"Rateclass","dtype":"string","desc":"Full descriptive name of the rate class explaining its purpose or category.","cube":"cube_carl_dwhprd_gold_rateclass_dim","member":"rateclass_desc"},{"type":"dimension","name":"broadcast_month_name","title":"Broadcast Month Name","dtype":"string","desc":"Human-readable name of the broadcast month, e.g. what the \"Broadcast Month\" attribute displays.","cube":"cube_carl_dwhprd_gold_revenue_eff_bcast_month_dim","member":"broadcast_month_name"},{"type":"dimension","name":"bcast_qtr_desc","title":"Broadcast Quarter","dtype":"string","desc":"Human-readable description of the broadcast quarter.","cube":"cube_carl_dwhprd_gold_revenue_eff_bcast_qtr_dim","member":"bcast_qtr_desc"},{"type":"dimension","name":"broadcast_qtr_num","title":"Broadcast Quarter Number","dtype":"number","desc":"Sequential number identifying the quarter within its broadcast year (1-4).","cube":"cube_carl_dwhprd_gold_revenue_eff_bcast_qtr_dim","member":"broadcast_qtr_num"},{"type":"dimension","name":"broadcast_year","title":"Broadcast Year","dtype":"number","desc":"Broadcast year, e.g. what the \"Broadcast Year\" attribute displays.","cube":"cube_carl_dwhprd_gold_revenue_eff_bcast_year_dim","member":"broadcast_year"},{"type":"dimension","name":"calendar_month_name","title":"Calendar Month","dtype":"string","desc":"The full name of the calendar month (e.g., January, February).","cube":"cube_carl_dwhprd_gold_revenue_eff_cal_month_dim","member":"calendar_month_name"},{"type":"dimension","name":"cal_qtr_desc","title":"Calendar Quarter","dtype":"string","desc":"A descriptive label for the calendar quarter (e.g., 'Q1 2024').","cube":"cube_carl_dwhprd_gold_revenue_eff_cal_qtr_dim","member":"cal_qtr_desc"},{"type":"dimension","name":"calendar_qtr_num","title":"Calendar Quarter Number","dtype":"number","desc":"The quarter number within the calendar year (1, 2, 3, or 4).","cube":"cube_carl_dwhprd_gold_revenue_eff_cal_qtr_dim","member":"calendar_qtr_num"},{"type":"dimension","name":"calendar_year","title":"Calendar Year","dtype":"number","desc":"The calendar year (e.g., 2024) that contains this quarter.","cube":"cube_carl_dwhprd_gold_revenue_eff_cal_qtr_dim","member":"calendar_year"},{"type":"dimension","name":"day_date","title":"Revenue Effective Date","dtype":"time","desc":"The actual calendar date represented by this dimension record.","cube":"cube_carl_dwhprd_gold_revenue_effective_day_dim","member":"day_date"},{"type":"dimension","name":"sell_title_dpart_selling_desc","title":"Selling Title Selling Daypart","dtype":"string","desc":"Description of the selling classification for this daypart (e.g., 'PRIME', 'DAYTIME', 'EARLY MORNING').","cube":"cube_carl_dwhprd_gold_selling_title_daypart_dim","member":"sell_title_dpart_selling_desc"},{"type":"dimension","name":"unit_type_desc","title":"Unit Type","dtype":"string","desc":"Human-readable description of the unit type.","cube":"cube_carl_dwhprd_gold_unit_type_dim","member":"unit_type_desc"}]},{"domain":"Lumos (DWH gold \u2013 linear ad sales, finance, intl, content)","name":"ad_sales_view_invoice_team_split_revenue","title":"Ad Sales \u2014 Invoiced-Booked Revenue by Team","business":"ad_sales","base":"dwhprd_gold.acct_cov_team_member_dim, dwhprd_gold.ae_fraction_fact, dwhprd_gold.invoice_revenue_fact, dwhprd_gold.revenue_eff_cal_month_dim","measures":1,"dims":16,"joins":8,"access":"No","desc":"Business view for ad_sales on CARL-3016 \"Invoiced-Booked Revenue by Team\". Its one metric is Split Revenue \u2014 invoice revenue allocated to a sales team member by that member's AE fraction, which MSTR writes as Revenue (Sales Team) times Fraction. Separate from ad_sales_view_invoice_revenue_fact rather than added to it, because the grain is different: one row per sales team member per coverage member per month, not one per invoice row. Gross Revenue is deliberately absent here \u2014 at this grain it would be the whole coverage team's revenue repeated against each member, which is a real intermediate in MSTR's calculation but is not a number anyone should read as revenue. Use ad_sales_view_invoice_revenue_fact for that. Split Revenue is additive over every dimension below, so it sums normally in QuickSight with no calculated field. The report's filters are Network, Calendar Year, Revenue Area (ID) not equal to 0 and Deal Revenue Snapshot = Invoiced/Current Booked; all four are exposed here and none are baked into the cube. Verified against dev 2026-09-30 for CNN / calendar 2025: 297,857,564.00 across the export's 969 populated cells, exact to the cent. revenue_eff_calendar_year keeps its name but now resolves to the cube's own calendar_year rather than the month dimension's. Consumers see no change \u2014 same alias, same title, same values \u2014 but the filter now reaches FILTER_PARAMS inside the cube's aggregate, which is the difference between a 229.7s and a 7.8s query. Filtering the month dimension's copy would silently fall back to the slow path, which is why only one of the two is exposed here.","file":"model/efs/Lumos/views/invoice_team_split_revenue/ad_sales_view_invoice_team_split_revenue.yaml","status":"deployed","fields":[{"type":"measure","name":"split_revenue","title":"Split Revenue","dtype":"sum","desc":"MSTR's Split Revenue: invoice revenue allocated to a sales team member by that member's AE fraction for the unit broadcast month. Additive over every dimension this cube exposes \u2014 sum it in QuickSight, no calculated field needed.","cube":"cube_carl_dwhprd_gold_invoice_team_split_revenue","member":"split_revenue"},{"type":"dimension","name":"revenue_area_key","title":"Revenue Area (ID)","dtype":"number","desc":"Part of the grain; joins to revenue_area_dim for Revenue Area and Revenue Group. This is the fact's own revenue_area_key, which MSTR aliases REVENUE_AREA_ID \u2014 not revenue_area_mapping_key. The report filters it to non-zero.","cube":"cube_carl_dwhprd_gold_invoice_team_split_revenue","member":"revenue_area_key"},{"type":"dimension","name":"network_key","title":"Network (ID)","dtype":"number","desc":"Part of the grain; joins to network_dim for the network name the report is run for.","cube":"cube_carl_dwhprd_gold_invoice_team_split_revenue","member":"network_key"},{"type":"dimension","name":"revenue_eff_cal_month_key","title":"Revenue Effective Calendar Month (ID)","dtype":"number","desc":"Part of the grain; joins to revenue_eff_cal_month_dim for the \"January 2025\" month label and the calendar year. This is the revenue-effective calendar month, which is what the report's Year Type = Calendar resolves to \u2014 not the unit-scheduled month.","cube":"cube_carl_dwhprd_gold_invoice_team_split_revenue","member":"revenue_eff_cal_month_key"},{"type":"dimension","name":"deal_revenue_snapshot_key","title":"Deal Revenue Snapshot (ID)","dtype":"number","desc":"Part of the grain; joins to deal_revenue_snapshot_dim. Left unfiltered here so the cube is not pinned to one snapshot \u2014 the report filters it to 8 (Invoiced/Current Booked) at query time.","cube":"cube_carl_dwhprd_gold_invoice_team_split_revenue","member":"deal_revenue_snapshot_key"},{"type":"dimension","name":"sales_team_member_key","title":"Sales Team Member Key","dtype":"number","desc":"Part of the grain; joins to sales_team_member_dim for the AE, and on to sales_office_team_dim for Sales Team and Sales Office. This is who the revenue is split to.","cube":"cube_carl_dwhprd_gold_invoice_team_split_revenue","member":"sales_team_member_key"},{"type":"dimension","name":"acct_cov_team_member_key","title":"Account Coverage Team Member Key","dtype":"number","desc":"Part of the grain; joins to acct_cov_team_member_dim. This is whose coverage the revenue came through, which is a different person from the sales team member the fraction splits it to.","cube":"cube_carl_dwhprd_gold_invoice_team_split_revenue","member":"acct_cov_team_member_key"},{"type":"dimension","name":"revenue_eff_calendar_year","title":"Calendar Year","dtype":"number","desc":"The revenue-effective calendar year, carried in this cube's own SQL rather than read through revenue_eff_cal_month_dim, because FILTER_PARAMS can only push a filter that lands on this cube's own member. Filter the year here and the predicate moves inside the aggregate; filter the month dimension's calendar_year instead and it stays outside, which is the 229.7s path. Not part of the primary key: it is functionally dependent on revenue_eff_cal_month_key, so selecting it leaves the grain at the same 19,653 groups.","cube":"cube_carl_dwhprd_gold_invoice_team_split_revenue","member":"calendar_year"},{"type":"dimension","name":"revenue_group_desc","title":"Revenue Group","dtype":"string","desc":"Description or name of the revenue group classification.","cube":"cube_carl_dwhprd_gold_revenue_area_dim","member":"revenue_group_desc"},{"type":"dimension","name":"revenue_area_desc","title":"Revenue Area","dtype":"string","desc":"Human-readable description or name of the revenue area.","cube":"cube_carl_dwhprd_gold_revenue_area_dim","member":"revenue_area_desc"},{"type":"dimension","name":"net_name","title":"Network","dtype":"string","desc":"Official name of the broadcast network.","cube":"cube_carl_dwhprd_gold_network_dim","member":"net_name"},{"type":"dimension","name":"revenue_eff_calendar_month","title":"Revenue Effective Calendar Month","dtype":"string","desc":"Formatted \"<M rom linear_digital_revenue_bronze.metro_sf_opportunity, excluding deleted rows. Header of the pipeline export. Quarter, property, and the net-projection candidates live on the site-month breakout. Both deal-id columns are exposed because the export's iDeal ID is not yet locked to one of them. Status group, UF year, sales division, uf group, weighted projections, and linear total amount are calculated in the Looker extract and are not columns here.","file":"model/efs/linear_digital_revenue/cubes/cube_linear_digital_revenue_bronze_metro_sf_opportunity.yaml"},{"domain":"Linear/Digital revenue (Salesforce, exec)","name":"cube_linear_digital_revenue_bronze_metro_sf_site_month_breakout","title":"Linear Digital Revenue Bronze \u2014 Salesforce Site Month Breakout","kind":"Fact / metric","src":"linear_digital_revenue_bronze.metro_sf_site_month_breakout__c","sql":"Yes","measures":5,"dims":8,"joins":"cube_linear_digital_revenue_bronze_metro_sf_opportunity","preagg":"","views":"ad_sales_view_sf_pipeline","desc":"One site-month row from metro_sf_site_month_breakout__c, excluding deleted rows. This is the quarter and property grain of the pipeline export. Three revenue columns are all exposed because the export's Net Projections is not yet locked to one of them.","file":"model/efs/linear_digital_revenue/cubes/cube_linear_digital_revenue_bronze_metro_sf_site_month_breakout.yaml"},{"domain":"Linear/Digital revenue (Salesforce, exec)","name":"cube_linear_digital_revenue_gold_fact_executive_revenue_month_v","title":"Linear Digital Revenue Gold \u2014 Fact Executive Revenue Month","kind":"Fact / metric","src":"linear_digital_revenue_gold.fact_executive_revenue_month_v","sql":"No","measures":7,"dims":52,"joins":"","preagg":"executive_revenue_by_source_and_market, executive_revenue_by_advertiser, executive_revenue_by_agency, executive_revenue_by_sales_org","views":"executive_view_bobby_v","desc":"One row per advertiser/agency/network/month revenue slice feeding the Bobby V executive dashboard (CARL-497/CARL-559). Pre-aggregated monthly, not per-spot \u2014 do not expect this to reconcile with spot-level invoice facts. 815,481 rows in dev as of 2026-10. CARL-2923.","file":"model/efs/linear_digital_revenue/cubes/cube_linear_digital_revenue_gold_fact_executive_revenue_month_v.yaml"},{"domain":"Linear/Digital revenue (Salesforce, exec)","name":"cube_linear_digital_revenue_bronze_metro_sf_recordtype","title":"Linear Digital Revenue Bronze \u2014 Salesforce Record Type","kind":"Dimension","src":"linear_digital_revenue_bronze.metro_sf_recordtype","sql":"No","measures":0,"dims":2,"joins":"","preagg":"","views":"ad_sales_view_sf_pipeline","desc":"Salesforce record type. The pipeline export's Record Type is this name (Digital or Linear).","file":"model/efs/linear_digital_revenue/cubes/cube_linear_digital_revenue_bronze_metro_sf_recordtype.yaml"},{"domain":"Linear/Digital revenue (Salesforce, exec)","name":"cube_linear_digital_revenue_bronze_sf_account","title":"Linear Digital Revenue Bronze \u2014 Salesforce Account","kind":"Dimension","src":"linear_digital_revenue_bronze.salesforce_sf_account","sql":"Yes","measures":0,"dims":3,"joins":"","preagg":"","views":"ad_sales_view_sf_pipeline","desc":"Salesforce account, used as the advertiser on metro_sf_opportunity.accountid. Deleted accounts (isdeleted = 1) are excluded.","file":"model/efs/linear_digital_revenue/cubes/cube_linear_digital_revenue_bronze_sf_account.yaml"},{"domain":"Linear/Digital revenue (Salesforce, exec)","name":"cube_linear_digital_revenue_bronze_sf_billing_agency","title":"Linear Digital Revenue Bronze \u2014 Salesforce Billing Agency","kind":"Dimension","src":"linear_digital_revenue_bronze.salesforce_sf_account","sql":"Yes","measures":0,"dims":3,"joins":"","preagg":"","views":"ad_sales_view_sf_pipeline","desc":"Same Salesforce account table, role-played as the buying agency on metro_sf_opportunity.billing_agency__c. A second cube so the advertiser and the agency can both be joined.","file":"model/efs/linear_digital_revenue/cubes/cube_linear_digital_revenue_bronze_sf_account.yaml"},{"domain":"Lumos (DWH gold \u2013 linear ad sales, finance, intl, content)","name":"cube_carl_dwhprd_gold_ae_fraction_fact","title":"Carl Dwhprd Gold \u2014 AE Fraction Fact","kind":"Fact / metric","src":"dwhprd_gold.ae_fraction_fact","sql":"No","measures":2,"dims":3,"joins":"cube_carl_dwhprd_gold_sales_team_member_dim","preagg":"","views":"","desc":"Gold AE allocation fractions (member + unit_sched_bcast_month_key + sales_team_member_key grain). CARL-3016 reads fractions through cube_carl_dwhprd_gold_invoice_team_ae_bridge (same table, month-aligned join to invoice), not directly from ad_sales views.","file":"model/efs/Lumos/cubes/cube_carl_dwhprd_gold_ae_fraction_fact.yaml"},{"domain":"Lumos (DWH gold \u2013 linear ad sales, finance, intl, content)","name":"cube_carl_dwhprd_gold_affiliate_fact","title":"Carl Dwhprd Gold \u2014 Affiliate Fact","kind":"Fact / metric","src":"dwhprd_gold.affiliate_fact, dwhprd_gold.ext_src_affiliate_fact","sql":"Yes","measures":2,"dims":39,"joins":"cube_carl_dwhprd_gold_affiliate_dim, cube_carl_dwhprd_gold_customer_dim, cube_carl_dwhprd_gold_sap_geography_dim, cube_carl_dwhprd_gold_sap_platform_dim, cube_carl_dwhprd_gold_sap_profit_center_dim, cube_carl_dwhprd_gold_sap_region_dim, cube_carl_dwhprd_gold_currency_dim, cube_carl_dwhprd_gold_billing_period_dim, cube_carl_dwhprd_gold_contract_dim, cube_carl_dwhprd_gold_country_dim, cube_carl_dwhprd_gold_invoice_dim, cube_carl_dwhprd_gold_inv_process_status_dim, cube_carl_dwhprd_gold_invoice_type_dim, cube_carl_dwhprd_gold_calendar_month_dim, cube_carl_dwhprd_gold_package_dim, cube_carl_dwhprd_gold_calendar_qtr_dim, cube_carl_dwhprd_gold_rate_type_dim, cube_carl_dwhprd_gold_sap_company_code_dim, cube_carl_dwhprd_gold_source_system_dim, cube_carl_dwhprd_gold_calendar_year_dim, cube_carl_dwhprd_gold_revenue_type_dim","preagg":"","views":"sox_view_affiliate_fact","desc":"Affiliate carriage and subscriber counts from five affiliate billing systems (DLA/DNA/DNE/DNR/EXT), joined to SAP master data. Same international source system as the campaign_fact star \u2014 country_dim, currency_dim, calendar_month_dim and calendar_qtr_dim are the exact same physical Glue tables and cubes already authored there, confirming the shared-dimension question sox-triage.md left open. QUERY-BACKED, 2026-08-28 \u2014 added a UNION ALL with ext_src_affiliate_fact to reproduce Oracle's DNIAFFDWH.AFFILIATE_FACT_VW, which the Pack Type filter actually depends on: `Pack Type = 'External Source'` rows physically live only in ext_src_affiliate_fact (923,563 rows), never in affiliate_fact itself (confirmed via Athena \u2014 0 rows match that value there). Found by `semantic-authoring re-coverage` flagging ext_src_affiliate_fact as reconstructed-but-unread, the same shape as the campaign_fact/sales_rep_fraction_fact query-backed join. Oracle's view fills every FK ext_src_affiliate_fact lacks (country/invoice/contract/package/currencies/etc.) with a sentinel 0 (or '0' for text columns) \u2014 reproduced exactly here so numbers reconcile to MicroStrategy. Every dimension joined from this cube resolves those sentinel rows to NULL rather than dropping them, since Cube always compiles its join graph as a LEFT JOIN with this fact on the left (confirmed against Cube's own docs) \u2014 unlike the raw AI-reverse-engineered transformation.sql, which INNER JOINs 14 dimensions and would silently return zero External Source rows if run directly against Athena. sap_exchange_rate (also flagged by re-coverage, also read by the same Oracle view for an EXCHANGE_RATE column) is deliberately NOT added here \u2014 MicroStrategy's own SELECT never surfaces exchange_rate, so there is nothing currently needing it. RESOLVED \u2014 SAP GL Account exclusion needs no dedup after all. MicroStrategy's metric definitions carry an aggregation-level qualifier on the sum of New Actual/Billable Subs \u2014 MSTR's own notation for \"sum, with SAP GL Account excluded from the aggregation level\" \u2014 which was initially read as meaning the fact repeats an identical subscriber count once per SAP GL Account row (the same shape as cube_carl_dwhprd_gold_req_rights_participant_contribution's dedup-then-sum pattern) and would need a MAX-based dedup before summing. Checked against dev data instead of assumed: grouping affiliate_fact at MicroStrategy's own 8-key aggregation grain (affiliate, customer, geography, month, pack_type, platform, profit_center, region) finds 410,550 combos with more than one row (1,305,309 rows total) \u2014 but only 16% of those combos (65,843) carry an identical new_actual_subs value across their duplicate rows, and only 14.5% (59,579) for new_billable_subs. If this were a repeated-value GL-account pattern, that figure would be at or near 100%; instead the overwhelming majority of duplicate combos carry genuinely different values, meaning they are separate legitimate contributions (e.g. different invoices/contracts active in the same month) that should be added, not deduplicated. This cube therefore defines new_actual_subs/new_billable_subs as plain sum measures \u2014 mathematically identical to MicroStrategy's own two-stage aggregation (its SQL groups at ~34-attribute grain, then its analytical engine sums again at the 8-key grain; summing twice at progressively coarser grains equals summing once at the coarsest, with no join fan-out in between to invalidate that). Flagged for business confirmation since it reverses an earlier, unverified assumption, but shipped rather than blocked given the data now supports it. KNOWN GAPS: `new_package_dim` and `new_contract_dim` (a package/contract \"before/after\" swap pair, the same shape as cube_carl_dwhprd_gold_package_dim's own before/after role) do not exist anywhere in the ingested catalog (`aws glue get-table` returns EntityNotFoundException for both) \u2014 the \"New Package ID/Name\" and \"New Contract\" fields are not modelled. `network_dim` is a confirmed collision, not the affiliate-billing network: probed against dev data, joining affiliate_fact.network_key to network_dim.network_key produces a 51.6% orphan rate (1,585,191 of 3,073,121 rows) \u2014 far too high to be the same table. Network Name is not modelled. RESOLVED \u2014 invoice_dim is NOT a collision. sox-triage.md flagged this table name alongside network_dim as a possible US-ad-sales collision (missing an INVOICE_NO-equivalent column). Probing the join found 0% orphan (all 3,073,121 rows match), and cube_carl_dwhprd_gold_invoice_dim already existed in this model \u2014 generically authored, exposing invoice_id and invoice_type_desc \u2014 reused as-is here rather than re-declared, which avoided a duplicate-cube-name conflict caught by semantic-authoring audit's unknown_view_member check against finance_view_invoice_revenue_fact. invoice_dim is the single shared physical table across both the finance/invoice_revenue_fact star and this affiliate star; no separate affiliate-only table exists. DATA-QUALITY GAP \u2014 country_dim is significantly under-populated for this fact's country universe. All other 19 joins on this cube probed 0% orphan against dev data (perfectly clean), but country_dim \u2014 the same cube reused from the campaign_fact, confirming it as a genuinely shared physical table \u2014 orphans 65.9% of affiliate_fact's 3,073,121 rows (2,024,071 unmatched). country_dim currently holds only 92 rows with country_key ranging -2 to 89, while affiliate_fact's unmatched country_key values run into the 300s (e.g. 93, 152, 246, 266, 303, 362) \u2014 real-looking, non-null, non-sentinel IDs outside that range, not a wrong-table mismatch. This looks like country_dim was populated only for the countries campaign_fact's APAC scope touches, and was never backfilled with the fuller country list affiliate_fact's five global billing systems (DLA/DNA/DNE/DNR/EXT) reference. Kept as a declared join (same key space, correct table) rather than dropped, but Country Name/Reporting Country Name will read NULL for roughly two-thirds of rows until country_dim is backfilled \u2014 flagged to the ingestion team rather than worked around here.","file":"model/efs/Lumos/cubes/cube_carl_dwhprd_gold_affiliate_fact.yaml"},{"domain":"Lumos (DWH gold \u2013 linear ad sales, finance, intl, content)","name":"cube_carl_dwhprd_gold_airings_fact","title":"Carl Dwhprd Gold \u2014 Airings Fact","kind":"Fact / metric","src":"dwhprd_gold.airings_fact","sql":"No","measures":4,"dims":34,"joins":"cube_carl_dwhprd_gold_corporate_daypart_dim, cube_carl_dwhprd_gold_deal_project_dim, cube_carl_dwhprd_gold_deal_io_part_prog_dim, cube_carl_dwhprd_gold_internal_offer_type_dim, cube_carl_dwhprd_gold_dc_episode_dim, cube_carl_dwhprd_gold_dc_season_dim, cube_carl_dwhprd_gold_dc_show_dim, cube_carl_dwhprd_gold_day_dim, cube_carl_dwhprd_gold_distribution_channel_dim, cube_carl_dwhprd_gold_distribution_channel_hist_dim, cube_carl_dwhprd_gold_entity_dim, cube_carl_dwhprd_gold_episode_dim, cube_carl_dwhprd_gold_season_dim, cube_carl_dwhprd_gold_show_dim, cube_carl_dwhprd_gold_time_dim","preagg":"","views":"sox_view_airings_fact","desc":"One row per content airing (a scheduled broadcast instance), the content-airings star. Distinct from program_airing_dim (a different, non-fact table at program-airing grain covering a similar but not identical concept) and from the advertising-revenue star (invoice_revenue_fact). MicroStrategy's SQL joins this fact to a table it calls EPISODE_DIM \u2014 that name resolves in this catalog to the advertising-side episode_dim (keyed on property_key/network_key; see docs/ingestion-requests/2026-08-18-lumos-sox.md for the collision), a genuinely different, much narrower table than the content-side one MicroStrategy actually reads. One consumer only needed EPISODE_SLOT_LENGTH from that join, which this fact carries as its own column instead (no join needed). Another needs 14 more content-side episode columns (title, alt names, property id, global premiere/last/next-air dates and distribution channels, associated id, source inventory list, repackage type/indicator) that do not exist anywhere in this catalog under any name \u2014 a genuine, still-open ingestion gap (see the ingestion request doc), not modelled here. That consumer's episode_key join to the advertising-side episode_dim is kept anyway for the 3 columns that do happen to overlap (episode_number, episode_id, episode_short_desc), at a documented 68.6% orphan rate. Only the columns currently needed are modelled; the table carries additional distribution-channel and premiere-indicator columns not currently read. Also the base fact for a hybrid consumer that reads this fact like the other content-airings consumers but joins out into the \"deals and rights\" star (deal_project_dim, deal_io_part_prog_dim, internal_offer_type_dim). EPS_REPACKAGE_TYPE_NAME off the same content-side EPISODE_DIM collision is also needed elsewhere \u2014 deferred as the same documented gap, not modelled here.","file":"model/efs/Lumos/cubes/cube_carl_dwhprd_gold_airings_fact.yaml"},{"domain":"Lumos (DWH gold \u2013 linear ad sales, finance, intl, content)","name":"cube_carl_dwhprd_gold_bi_to_bts_recon_fact","title":"Carl Dwhprd Gold \u2014 BI To BTS Recon Fact","kind":"Fact / metric","src":"dwhprd_gold.bi_to_bts_recon_fact","sql":"No","measures":24,"dims":20,"joins":"cube_carl_dwhprd_gold_campaign_dim, cube_carl_dwhprd_gold_agency_dim, cube_carl_dwhprd_gold_client_dim, cube_carl_dwhprd_gold_invoice_holding_company_dim, cube_carl_dwhprd_gold_calendar_month_dim, cube_carl_dwhprd_gold_channel_dim, cube_carl_dwhprd_gold_base_currency_dim, cube_carl_dwhprd_gold_source_system_region_dim","preagg":"","views":"international_view_bi_to_bts_recon_fact","desc":"BI vs BTS reconciliation fact capturing contract value, spot counts, and revenue for broadcast advertising campaigns, along with the BI-minus-BTS differences for each. Each row is a campaign/calendar-month/channel grain reconciliation record. Does not alter joins on campaign_fact or other existing facts \u2014 all joins below are declared only on this cube. campaign_status_dim and holding_company_dim are reached through campaign_dim (same snowflake as sox_view_campaign_fact) so this cube does not add a second join instance to those cubes. Invoice-side holding company uses cube_carl_dwhprd_gold_invoice_holding_company_dim, a distinct cube over the same table, so Cube does not collapse it with the campaign-side holding company. Base currency uses cube_carl_dwhprd_gold_base_currency_dim, a distinct cube over currency_dim, because campaign_dim already joins cube_carl_dwhprd_gold_currency_dim for campaign currency.","file":"model/efs/Lumos/cubes/cube_carl_dwhprd_gold_bi_to_bts_recon_fact.yaml"},{"domain":"Lumos (DWH gold \u2013 linear ad sales, finance, intl, content)","name":"cube_carl_dwhprd_gold_campaign_fact","title":"Carl Dwhprd Gold \u2014 Campaign Fact","kind":"Fact / metric","src":"dwhprd_gold.campaign_fact, dwhprd_gold.sales_rep_fraction_fact","sql":"Yes","measures":30,"dims":32,"joins":"cube_carl_dwhprd_gold_campaign_dim, cube_carl_dwhprd_gold_source_system_region_dim, cube_carl_dwhprd_gold_business_type_dim, cube_carl_dwhprd_gold_country_dim, cube_carl_dwhprd_gold_currency_dim, cube_carl_dwhprd_gold_agency_dim, cube_carl_dwhprd_gold_client_dim, cube_carl_dwhprd_gold_channel_dim, cube_carl_dwhprd_gold_calendar_month_dim, cube_carl_dwhprd_gold_calendar_qtr_dim, cube_carl_dwhprd_gold_day_dim","preagg":"campaign_grid_report","views":"international_view_campaign_fact, sox_view_campaign_fact","desc":"Query-backed \u2014 APAC ad-sales campaigns, a different source system from the US ad-sales star used elsewhere; see sox-triage.md for the write-up. Reproduces MicroStrategy's `CAMPAIGN_FACT_VW`, which reads every measure at campaign x sales-rep grain, multiplying each raw measure by SALES_REP_REVENUE_SHARE before summing (one row per rep assigned to a campaign; confirmed unique on (campaign_key, sales_rep_key) against dev data \u2014 427,206 sales_rep_fraction_fact rows, ~413K distinct campaigns, ~14K campaigns split across more than one rep). campaign_fact itself is not unique on campaign_key alone either (confirmed against dev data: 1.80M rows across 481K distinct campaign_keys \u2014 it already fans out by channel/product/deal/month); the sales-rep join adds a second, independent fan-out on top of that. This is safe specifically because every rep- allocated measure below multiplies through by sales_rep_revenue_share before summing (never a bare sum() of a raw column) \u2014 since a campaign's rep shares are fractions of the same total, summing (raw_measure * share) across the fanned-out rep rows reconstructs the original total exactly once, distributed across reps, rather than inflating it. REVISED, 2026-08-26 \u2014 the sales-rep join is embedded directly in this cube's own sql: (a LEFT JOIN to sales_rep_fraction_fact) rather than declared as a native one_to_many joins: entry to a separate cube, which is how it originally shipped in carl-semantic-authoring#34. That native-join version passed every offline check (verify, audit, Athena probes) but failed the very first live QuickSight smoke test after deploy: Cube's SQL API \u2014 which is what QuickSight's data source actually speaks, not the REST API this repo's other tooling exercises \u2014 unconditionally refuses any measure whose formula crosses a one_to_many join via a cross-cube reference, regardless of which dimensions are grouped by: `'cube_carl_dwhprd_gold_campaign_fact.campaign_budget_loc' references cubes that lead to row multiplication. Please rewrite it using sub query.` This is a known, unconditional Cube.js SQL-API guard (see cube-js/cube#11330, cube-js/cube#9523) \u2014 it has no way to verify that a COALESCE(share, 1) multiply is safe from double-counting, so it blocks the shape outright rather than risk it. Cube's documented workaround (`subQuery: true` dimensions) doesn't fit either: a subQuery dimension can only pull one aggregated value per \"one\"-side row from the joined cube, not a per-row multiplier that has to apply before the sum \u2014 which is exactly what every rep-allocated measure here needs. Embedding the join in the base query \u2014 so sales_rep_revenue_share arrives as a plain column of this cube, and every measure reads it as its own same-cube column instead of a cross-cube reference \u2014 sidesteps the guard entirely, because Cube's row-multiplication check only fires on cross-cube references through a declared one_to_many join, not on a cube's own embedded SQL. This is a deliberate, evidence-backed exception to semantic-authoring's `embedded_join_in_query_backed_cube` check (see that check's own allowlist and docstring caveat that a hand-written JOIN is \"almost always\", not always, a lookup-table mistake) \u2014 the alternative literally cannot be served through QuickSight. sales_rep_key/name/team fields, previously on their own cube_carl_dwhprd_gold_sales_rep_fraction_fact cube, are now plain dimensions on this cube instead (that cube is retired \u2014 nothing else referenced it). RESOLVED, 2026-08-26 \u2014 decimal overflow on multi-term measures, found by the same live smoke test: after the row-multiplication fix above, five measures (campaign_net_revenue_loc, campaign_net_net_revenue_loc, agency_commission_loc, agency_incentive_loc, sales_commission_loc) still failed via QuickSight with `NUMERIC_VALUE_OUT_OF_RANGE: Decimal overflow` / `GENERIC_INTERNAL_ERROR: Decimal overflow` \u2014 reproducible regardless of which dimensions were grouped by, unlike the row-multiplication error. Root cause: gross_revenue, sales_rep_revenue_share and every *_pct column are all decimal(38,10) in Glue (38 is Trino/Athena's maximum decimal precision). Standard SQL decimal arithmetic grows precision and scale with every multiplication (decimal(p1,s1) * decimal(p2,s2) \u2192 decimal(p1+p2, s1+s2), capped at 38 total digits) \u2014 each of these five measures chains 3-4 multiplications, so by the second or third term there are only a handful of integer digits left before the cap, and summing across many rows overflows that headroom. The other 17 measures (a single `raw_column * COALESCE(share, 1)` multiplication) don't hit this, which is why they passed. Fix: each affected measure now casts its leading gross_revenue operand to DOUBLE before multiplying \u2014 SQL's decimal/double type promotion then carries the rest of that measure's chain as DOUBLE arithmetic, which doesn't compound precision the same way. This trades exact base-10 decimal precision for IEEE 754 double precision (~15-17 significant digits) on these five derived measures only; the 17 single-multiplication measures are left as exact decimal arithmetic since they don't need it. RESOLVED, 2026-08-26 \u2014 unallocated campaigns default to 100% share, not zero: probed against dev data, 123,007 of campaign_fact's 1,803,379 rows (6.8%) have no matching sales_rep_fraction_fact row at all \u2014 6.26% of total campaign_budget and 6.24% of total gross_revenue sits on these rows. Pulled BTSDWH.CAMPAIGN_FACT_VW's actual view DDL (s3://carl-lumos-us-east-1-dev/data-contracts/ai-reverse-engineering/ BI_Monthly_Order_Tracking_Report/views/BTSDWH.CAMPAIGN_FACT_VW.sql) to settle this rather than guess: the view's SALES_REP_REVENUE_SHARE column is `NVL(E.SALES_REP_REVENUE_SHARE, 1)` \u2014 E being SALES_REP_FRACTION_FACT, outer-joined via `A.CAMPAIGN_KEY = E.CAMPAIGN_KEY(+)` (Oracle's LEFT OUTER JOIN syntax) \u2014 the same LEFT JOIN shape this cube's own sql: now uses directly. So MicroStrategy's source view already defaults an unallocated campaign to a 100% share, not to zero. Every rep-allocated measure below wraps its own sales_rep_revenue_share column in a COALESCE(..., 1) to match \u2014 a bare multiply (NULL * measure = NULL, dropped by sum()) would silently undercount these rows by ~6.3%; this was the same question flagged open in sox-triage.md (\"Is CAMPAIGN_FACT_VW a view we can land as-is?\"), now closed with primary-source evidence rather than a business guess. PLAIN SUMS \u2014 Campaign Grid Latam Report lives on this same cube, not a second cube over campaign_fact. international_view_campaign_fact includes the *_plain measures (aliased back to the report names). Each one keeps only fact_row_rep_ordinal = 1, so the embedded sales-rep join does not count a campaign_fact row once per rep. They are not multiplied by sales_rep_revenue_share. sox_view_campaign_fact does not include them; its measures stay share-weighted. Probed 2026-10-02 on dev at campaign grain for region 21 and years 2019-2026: those plain sums match the share-weighted report within one cent except where a single sales-rep share is not 1 (C0200179 and C0197572 are 2.0; C0001410 and C0001411 are 0.5; 156 campaigns store 0.9999). KNOWN GAP \u2014 currency-converted measures deferred, now with a named source instead of a guess: roughly half of MicroStrategy's ~30 measures on this fact are \"Current Rate\"/\"Hist Rate\" variants that further multiply by PLAN_CURR_RATE / PLAN_HIST_RATE off the source view. The same view DDL pull identifies exactly where those come from: `PLAN_HIST_RATE` is `B.EXCHANGE_FACTOR` from `BTSDWH.PLAN_HIST_CURRENCY_RATE_VW`, joined on `(BASE_CURRENCY_KEY, BASE_CURRENCY_YEAR)`; `PLAN_CURR_RATE` is `D.EXCHANGE_FACTOR` from `BTSDWH.PLAN_CURR_CURRENCY_RATE_VW`, joined on `BASE_CURRENCY_KEY` alone (both outer joins, `(+)` on the B/D side, so a campaign with no matching plan-rate row gets a NULL rate rather than dropping the row \u2014 consistent with the sales-rep default above, though NULL-vs-zero here still needs the same COALESCE treatment once ingested). Neither view is in the ingested catalog (confirmed against the Glue catalog: `plan_hist_currency_rate_vw`/`plan_curr_currency_rate_vw` \u2014 EntityNotFoundException on both) and campaign_fact itself carries no PLAN_* columns. `sap_exchange_rate` (from_currency_key/to_currency_key/ valid_from/exchange_rate/exchange_rate_type) is NOT the source \u2014 confirmed a different system (SAP/US, same collision risk as product_dim/deal_dim), a different join shape (currency-pair + as-of-date vs. base-currency + plan-year), and a single-snapshot table (all rows dated 2026-01-01) rather than the year-keyed historic/current rate distinction PLAN_HIST_RATE/PLAN_CURR_RATE draw. This is now a concrete, scoped ingestion ask \u2014 land `BTSDWH.PLAN_HIST_CURRENCY_RATE_VW` and `BTSDWH.PLAN_CURR_CURRENCY_RATE_VW` (or their EXCHANGE_FACTOR columns pre-joined onto campaign_fact) \u2014 rather than an open-ended \"find an FX source\" question. Until that lands, only the LOC (local-currency, unconverted) measures and plain counts (spots/ratings/impacts) are modelled here. Also deferred for the same reason as product_dim/deal_dim: Product Name/Category and Deal ID/Name, neither of which the ingested product_dim/deal_dim carry for this source system.","file":"model/efs/Lumos/cubes/cube_carl_dwhprd_gold_campaign_fact.yaml"},{"domain":"Lumos (DWH gold \u2013 linear ad sales, finance, intl, content)","name":"cube_carl_dwhprd_gold_internal_offer_dim","title":"Carl Dwhprd Gold \u2014 Internal Offer Dim","kind":"Fact / metric","src":"dwhprd_gold.internal_offer_dim","sql":"No","measures":1,"dims":18,"joins":"cube_carl_dwhprd_gold_region_dim","preagg":"","views":"sox_view_req_rights_episode_fact","desc":"An offer of programming hours from one entity to another, under a budget category and buy-in response, awaiting or holding a financial-asset offer status. Also carries the region/entity/territory keys used to scope offers by region and finality.","file":"model/efs/Lumos/cubes/cube_carl_dwhprd_gold_dimensions.yaml"},{"domain":"Lumos (DWH gold \u2013 linear ad sales, finance, intl, content)","name":"cube_carl_dwhprd_gold_inventory_fact","title":"Carl Dwhprd Gold \u2014 Inventory Fact","kind":"Fact / metric","src": oice_team_ae_bridge","title":"Carl Dwhprd Gold \u2014 Invoice Team AE Bridge","kind":"Fact / metric","src":"dwhprd_gold.acct_cov_team_member_dim, dwhprd_gold.ae_fraction_fact","sql":"Yes","measures":2,"dims":4,"joins":"cube_carl_dwhprd_gold_acct_cov_team_member_dim, cube_carl_dwhprd_gold_sales_team_member_dim","preagg":"","views":"ad_sales_view_invoice_revenue_fact","desc":"Query-backed ae_fraction_fact joined to acct_cov_team_member_dim so acct_cov_team_key is a physical column for invoice\u2192bridge joins (Athena rejects cross-cube refs and correlated subqueries in join SQL). Grain is fraction row + team key from member. CARL-3016 ad_sales only. Probed dev 2026-09-29: unique on (acct_cov_team_key, unit_sched_bcast_month_key, acct_cov_team_member_key, sales_team_member_key).","file":"model/efs/Lumos/cubes/cube_carl_dwhprd_gold_invoice_team_ae_bridge.yaml"},{"domain":"Lumos (DWH gold \u2013 linear ad sales, finance, intl, content)","name":"cube_carl_dwhprd_gold_invoice_team_split_revenue","title":"Carl Dwhprd Gold \u2014 Invoice Team Split Revenue","kind":"Fact / metric","src":"dwhprd_gold.acct_cov_team_member_dim, dwhprd_gold.ae_fraction_fact, dwhprd_gold.invoice_revenue_fact, dwhprd_gold.revenue_eff_cal_month_dim","sql":"Yes","measures":2,"dims":7,"joins":"cube_carl_dwhprd_gold_revenue_area_dim, cube_carl_dwhprd_gold_network_dim, cube_carl_dwhprd_gold_revenue_eff_cal_month_dim, cube_carl_dwhprd_gold_deal_revenue_snapshot_dim, cube_carl_dwhprd_gold_sales_team_member_dim, cube_carl_dwhprd_gold_acct_cov_team_member_dim","preagg":"","views":"ad_sales_view_invoice_team_split_revenue","desc":"Query-backed cube for CARL-3016 \"Invoiced-Booked Revenue by Team\", whose only metric is Split Revenue \u2014 MSTR's Revenue (Sales Team) times Fraction. That product cannot be a measure on invoice_revenue_fact: Cube rejects a member that references another cube (\"references foreign cubes ... please split and move this definition\"), so it has to be computed inside the SQL of one cube that physically holds both columns. This is that cube. The join is the same fan-out the report performs \u2014 invoice to ae_fraction_fact on unit broadcast month plus the coverage team key, via acct_cov_team_member_dim. MSTR aggregates revenue per coverage member first and then multiplies by the fraction, but the fraction is constant within one of those groups, so multiplying per row and summing afterwards is the same arithmetic and needs no second pass. Both forms were run against dev 2026-09-30 and agree: the row-level product over all 1,156,152 joined rows returns 297,857,564.00, and MSTR's two-pass form returns 297,857,564.00, matching the CNN / calendar 2025 export exactly across its 969 populated cells. Grouped to foreign keys only, with no labels in this SQL. Revenue Group, Revenue Area, Sales Office, Sales Team, AE and the month label all come from the shared dimension cubes through the joins below, so they cannot drift from what the rest of the model shows for the same key. Rows with no revenue-effective calendar month are excluded, matching the report and keeping the month key non-null in the composite primary key below. The month dimension is joined here, rather than only through the declared join below, so that the report's Calendar Year filter can be pushed inside this aggregate via FILTER_PARAMS. Without it every query joins and aggregates the whole invoice fact before any filter applies: measured against dev 2026-10-01, CNN / calendar 2025 took 229.7s unpushed and 7.8s with the year pushed in, for identical output \u2014 19,653 groups and 297,857,564.00 either way. Bytes scanned were 197 MB in both, so this was never I/O; narrowing the fact to one year before the fan-out join to ae_fraction_fact is what collapses the work. Pushing the other three filters as well was also measured and bought nothing further (5.8s), so only the year is pushed and the rest stay ordinary declared-join filters.","file":"model/efs/Lumos/cubes/cube_carl_dwhprd_gold_invoice_team_split_revenue.yaml"},{"domain":"Lumos (DWH gold \u2013 linear ad sales, finance, intl, content)","name":"cube_carl_dwhprd_gold_projected_working_revenue_fact","title":"Carl Dwhprd Gold \u2014 Projected Working Revenue Fact","kind":"Fact / metric","src":"dwhprd_gold.projected_working_revenue_fact","sql":"No","measures":23,"dims":27,"joins":"cube_carl_dwhprd_gold_account_dim, cube_carl_dwhprd_gold_advertiser_dim, cube_carl_dwhprd_gold_buy_type_dim, cube_carl_dwhprd_gold_buying_agency_dim, cube_carl_dwhprd_gold_brand_dim, cube_carl_dwhprd_gold_deal_dim, cube_carl_dwhprd_gold_deal_revenue_snapshot_dim, cube_carl_dwhprd_gold_deal_revenue_status_dim, cube_carl_dwhprd_gold_demographics_dim, cube_carl_dwhprd_gold_guar_est_methodology_dim, cube_carl_dwhprd_gold_market_dim, cube_carl_dwhprd_gold_network_dim, cube_carl_dwhprd_gold_order_dim, cube_carl_dwhprd_gold_pressure_type_dim, cube_carl_dwhprd_gold_product_dim, cube_carl_dwhprd_gold_program_avg_daypart_dim, cube_carl_dwhprd_gold_property_category_dim, cube_carl_dwhprd_gold_revenue_eff_bcast_qtr_dim, cube_carl_dwhprd_gold_revenue_eff_bcast_year_dim, cube_carl_dwhprd_gold_revenue_eff_cal_month_dim, cube_carl_dwhprd_gold_revenue_eff_cal_qtr_dim, cube_carl_dwhprd_gold_revenue_eff_cal_year_dim, cube_carl_dwhprd_gold_selling_title_daypart_dim, cube_carl_dwhprd_gold_unit_sched_bcast_month_dim, cube_carl_dwhprd_gold_unit_type_dim, cube_carl_dwhprd_gold_unit_type_group_dim, cube_carl_dwhprd_gold_acct_cov_team_dim, cube_carl_dwhprd_gold_planning_agency_dim","preagg":"","views":"ad_sales_view_projected_working_revenue_fact, finance_view_projected_working_revenue_fact","desc":"This fact table captures projected working revenue for advertising orders at a monthly grain, combining financial metrics (projected, budgeted, and working revenue) with demographic impressions across multiple estimation methodologies. Each row represents a unique combination of account, deal, order, and broadcast month with associated revenue figures and audience estimates.","file":"model/efs/Lumos/cubes/cube_carl_dwhprd_gold_projected_working_revenue_fact.yaml"},{"domain":"Lumos (DWH gold \u2013 linear ad sales, finance, intl, content)","name":"cube_carl_dwhprd_gold_req_rights_episode_fact","title":"Carl Dwhprd Gold \u2014 Req Rights Episode Fact","kind":"Fact / metric","src":"dwhprd_gold.req_rights_episode_fact","sql":"No","measures":1,"dims":31,"joins":"cube_carl_dwhprd_gold_budget_category_dim, cube_carl_dwhprd_gold_buy_in_response_dim, cube_carl_dwhprd_gold_day_dim, cube_carl_dwhprd_gold_deal_program_dim, cube_carl_dwhprd_gold_deal_project_dim, cube_carl_dwhprd_gold_deal_status_dim, cube_carl_dwhprd_gold_deal_type_dim, cube_carl_dwhprd_gold_entity_dim, cube_carl_dwhprd_gold_fa_offer_status_dim, cube_carl_dwhprd_gold_internal_offer_dim, cube_carl_dwhprd_gold_req_rights_participant_contribution, cube_carl_dwhprd_gold_territory_dim","preagg":"","views":"sox_view_req_rights_episode_fact","desc":"One row per rights episode line under an internal offer \u2014 the deals-and-rights star. Distinct from the advertising-revenue star (invoice_revenue_fact) and the content-airings star (airings_fact): this fact tracks who offered what programming rights to whom, under which deal, contract and budget category, for which platforms, geographies and rights term. There is no aggregation upstream of this table \u2014 MicroStrategy's own export is a bare SELECT DISTINCT with no GROUP BY, because its two contribution metrics are fixed at internal-offer x participating-entity grain and repeat across every episode row underneath that pair; see cube_carl_dwhprd_gold_req_rights_participant_contribution for how those are summed safely. Only the columns currently needed are modelled; the table carries more (rights verification workflow, scheduling-sync detail) not currently read.","file":"model/efs/Lumos/cubes/cube_carl_dwhprd_gold_req_rights_episode_fact.yaml"},{"domain":"Lumos (DWH gold \u2013 linear ad sales, finance, intl, content)","name":"cube_carl_dwhprd_gold_req_rights_participant_contribution","title":"Carl Dwhprd Gold \u2014 Req Rights Participant Contribution","kind":"Fact / metric","src":"dwhprd_gold.req_rights_episode_fact","sql":"Yes","measures":2,"dims":4,"joins":"","preagg":"","views":"sox_view_req_rights_episode_fact","desc":"Query-backed, not a physical table \u2014 same technique as cube_carl_dwhprd_gold_season_dim's de-duplicating query. req_rights_episode_fact carries two contribution metrics (Total Participant Contribution Amount, Total Participant Contribution Per Hour) that MicroStrategy computes at internal-offer x participating-entity grain, not episode grain: every episode row under the same (internal_offer_key, participating_entity_key) pair repeats the identical value. A plain sum() over the fact multiplies each contribution by the number of episode rows underneath it. This cube collapses the fact to one row per (internal_offer_key, participating_entity_key) pair first \u2014 MAX is a dedupe, not an aggregation, since the value is constant per pair \u2014 so the measures here sum safely at that grain. As with total_hours_offered on internal_offer_dim, combining these measures in the same query as an episode-grain dimension from req_rights_episode_fact directly (rather than through this cube) would reintroduce the fan-out; no SOX view does that.","file":"model/efs/Lumos/cubes/cube_carl_dwhprd_gold_dimensions.yaml"},{"domain":"Lumos (DWH gold \u2013 linear ad sales, finance, intl, content)","name":"cube_carl_dwhprd_gold_account_dim","title":"Carl Dwhprd Gold \u2014 Account Dim","kind":"Dimension","src":"dwhprd_gold.account_dim","sql":"No","measures":0,"dims":23,"joins":"","preagg":"","views":"ad_sales_view_invoice_revenue_fact, sox_view_invoice_revenue_fact, ad_sales_view_projected_working_revenue_fact","desc":"A dimension table containing account master data including account identifiers, associated agencies, networks, advertisers, and broadcast periods. Each row represents a unique account with its geographic location, account type, and property category classification.","file":"model/efs/Lumos/cubes/cube_carl_dwhprd_gold_dimensions.yaml"},{"domain":"Lumos (DWH gold \u2013 linear ad sales, finance, intl, content)","name":"cube_carl_dwhprd_gold_acct_cov_team_dim","title":"Carl Dwhprd Gold \u2014 Account Coverage Team Dim","kind":"Dimension","src":"dwhprd_gold.acct_cov_team_dim","sql":"No","measures":0,"dims":4,"joins":"","preagg":"","views":"ad_sales_view_invoice_revenue_fact, ad_sales_view_projected_working_revenue_fact","desc":"Account coverage team dimension identifying the sales AE assignments for a deal's coverage team. Carries the buying, client, and planning AE strings used by MSTR ad_sales reports (e.g. CHI CNN Orders, CARL-3003). Joined many_to_one off invoice_revenue_fact via acct_cov_team_key (probe 2026-09-04: unique on acct_cov_team_key across 1,381,348 rows, zero orphan fact rows).","file":"model/efs/Lumos/cubes/cube_carl_dwhprd_gold_dimensions.yaml"},{"domain":"Lumos (DWH gold \u2013 linear ad sales, finance, intl, content)","name":"cube_carl_dwhprd_gold_acct_cov_team_member_dim","title":"Carl Dwhprd Gold \u2014 Account Coverage Team Member Dim","kind":"Dimension","src":"dwhprd_gold.acct_cov_team_member_dim","sql":"No","measures":0,"dims":6,"joins":"","preagg":"","views":"ad_sales_view_invoice_revenue_fact, ad_sales_view_invoice_team_split_revenue","desc":"One row per account-coverage team member (AE assignment on a coverage team). For CARL-3016 ad_sales invoice views, reached via invoice_team_ae_bridge (month + member key), not a team-key-only join from invoice. Misuse risk: summing invoice Gross Revenue without team-member and unit broadcast month in the query grain inflates totals; exposed on ad_sales_view_invoice_revenue_fact only through the bridge path.","file":"model/efs/Lumos/cubes/cube_carl_dwhprd_gold_dimensions.yaml"},{"domain":"Lumos (DWH gold \u2013 linear ad sales, finance, intl, content)","name":"cube_carl_dwhprd_gold_actual_air_daypart_dim","title":"Carl Dwhprd Gold \u2014 Actual Air Daypart Dim","kind":"Dimension","src":"dwhprd_gold.actual_air_daypart_dim","sql":"No","measures":0,"dims":22,"joins":"","preagg":"","views":"ad_sales_view_inventory_fact, finance_view_inventory_fact, ad_sales_view_invoice_revenue_fact, finance_view_invoice_revenue_fact, sox_view_invoice_revenue_fact","desc":"A dimension table that defines actual air dayparts, representing specific time slots and day combinations used for broadcast scheduling and selling. It contains daypart characteristics, network associations, groupings, and validity dates for tracking daypart definitions over time.","file":"model/efs/Lumos/cubes/cube_carl_dwhprd_gold_dimensions.yaml"},{"domain":"Lumos (DWH gold \u2013 linear ad sales, finance, intl, content)","name":"cube_carl_dwhprd_gold_adv_default_product_dim","title":"Carl Dwhprd Gold \u2014 Product Dim (Advertiser Default)","kind":"Dimension","src":"dwhprd_gold.product_dim","sql":"No","measures":0,"dims":4,"joins":"","preagg":"","views":"ad_sales_view_invoice_revenue_fact, finance_view_invoice_revenue_fact, ad_sales_view_projected_working_revenue_fact","desc":"A second cube over the same product_dim table, reached from advertiser_dim on adv_default_prod_cat_key rather than from a fact's own product_key. It exists because a report can ask for both product-category readings at once \u2014 the advertiser's standing category and the category of the product actually sold \u2014 and those are different rows of product_dim. Declaring them as two join_paths to one cube does not give two join instances: Cube collapses them and whichever path it picks answers both members, so the product-of-sale reading silently returns the advertiser's default. CNNE Data hit this on 122 of 867 rows. Keep this cube distinct from cube_carl_dwhprd_gold_product_dim; do not merge them.","file":"model/efs/Lumos/cubes/cube_carl_dwhprd_gold_dimensions.yaml"},{"domain":"Lumos (DWH gold \u2013 linear ad sales, finance, intl, content)","name":"cube_carl_dwhprd_gold_advertiser_dim","title":"Carl Dwhprd Gold \u2014 Advertiser Dim","kind":"Dimension","src":"dwhprd_gold.advertiser_dim","sql":"No","measures":0,"dims":21,"joins":"cube_carl_dwhprd_gold_adv_default_product_dim","preagg":"","views":"ad_sales_view_invoice_revenue_fact, finance_view_invoice_revenue_fact, sox_view_invoice_revenue_fact, ad_sales_view_projected_working_revenue_fact, finance_view_projected_working_revenue_fact","desc":"A dimension table containing core advertiser information including contact details, address, and status flags. This table maintains a complete history of advertiser records with effective dating and audit timestamps.","file":"model/efs/Lumos/cubes/cube_carl_dwhprd_gold_dimensions.yaml"},{"domain":"Lumos (DWH gold \u2013 linear ad sales, finance, intl, content)","name":"cube_carl_dwhprd_gold_affiliate_dim","title":"Carl Dwhprd Gold \u2014 Affiliate Dim","kind":"Dimension","src":"dwhprd_gold.affiliate_dim","sql":"No","measures":0,"dims":5,"joins":"","preagg":"","views":"sox_view_affiliate_fact","desc":"Affiliate (MSO/distributor) master, joined directly off affiliate_fact via affiliate_key. Same international source system as the campaign_fact star \u2014 see cube_carl_dwhprd_gold_country_dim's description for the shared-dimension confirmation.","file":"model/efs/Lumos/cubes/cube_carl_dwhprd_gold_dimensions.yaml"},{"domain":"Lumos (DWH gold \u2013 linear ad sales, finance, intl, content)","name":"cube_carl_dwhprd_gold_agency_dim","title":"Carl Dwhprd Gold \u2014 Agency Dim","kind":"Dimension","src":"dwhprd_gold.agency_dim","sql":"No","measures":0,"dims":3,"joins":"","preagg":"","views":"international_view_bi_to_bts_recon_fact, international_view_campaign_fact, sox_view_campaign_fact","desc":"APAC ad-sales agency master, joined directly off campaign_fact via agency_key.","file":"model/efs/Lumos/cubes/cube_carl_dwhprd_gold_dimensions.yaml"},{"domain":"Lumos (DWH gold \ _fact","desc":"A dimension table describing advertiser brands \u2014 a finer grain than advertiser_dim, distinct from both advertiser and product category. Each brand rolls up to a product and an advertiser.","file":"model/efs/Lumos/cubes/cube_carl_dwhprd_gold_dimensions.yaml"},{"domain":"Lumos (DWH gold \u2013 linear ad sales, finance, intl, content)","name":"cube_carl_dwhprd_gold_budget_category_dim","title":"Carl Dwhprd Gold \u2014 Budget Category Dim","kind":"Dimension","src":"dwhprd_gold.budget_category_dim","sql":"No","measures":0,"dims":8,"joins":"","preagg":"","views":"sox_view_airings_fact, sox_view_req_rights_episode_fact","desc":"A small lookup dimension decoding req_rights_episode_fact's budget_category_key into its description \u2014 the \"Budget Category\" attribute.","file":"model/efs/Lumos/cubes/cube_carl_dwhprd_gold_dimensions.yaml"},{"domain":"Lumos (DWH gold \u2013 linear ad sales, finance, intl, content)","name":"cube_carl_dwhprd_gold_business_type_dim","title":"Carl Dwhprd Gold \u2014 Business Type Dim","kind":"Dimension","src":"dwhprd_gold.business_type_dim","sql":"No","measures":0,"dims":3,"joins":"","preagg":"","views":"sox_view_campaign_fact","desc":"APAC ad-sales business type lookup, joined directly off campaign_fact via business_type_key.","file":"model/efs/Lumos/cubes/cube_carl_dwhprd_gold_dimensions.yaml"},{"domain":"Lumos (DWH gold \u2013 linear ad sales, finance, intl, content)","name":"cube_carl_dwhprd_gold_buy_in_response_dim","title":"Carl Dwhprd Gold \u2014 Buy In Response Dim","kind":"Dimension","src":"dwhprd_gold.buy_in_response_dim","sql":"No","measures":0,"dims":9,"joins":"","preagg":"","views":"sox_view_req_rights_episode_fact","desc":"A small lookup dimension decoding req_rights_episode_fact's buy_in_response_key into its description and a participating flag.","file":"model/efs/Lumos/cubes/cube_carl_dwhprd_gold_dimensions.yaml"},{"domain":"Lumos (DWH gold \u2013 linear ad sales, finance, intl, content)","name":"cube_carl_dwh
