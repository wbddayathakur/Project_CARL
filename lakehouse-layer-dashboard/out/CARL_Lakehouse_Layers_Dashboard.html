without those dimensions gives the all-bands, all-dayparts total.","cube":"cube_carl_dwhprd_gold_airings_fact","member":"aired_count"},{"type":"dimension","name":"airing_property_id","title":"Airing Property Id","dtype":"number","desc":"Property identifier for this airing, carried directly on the fact.","cube":"cube_carl_dwhprd_gold_airings_fact","member":"airing_property_id"},{"type":"dimension","name":"dc_has_chng_flag","title":"Distribution Channel Has Changed","dtype":"string","desc":"Indicator for whether this airing's distribution channel has been renamed/changed historically, alongside distribution_channel_hist_dim's historical name.","cube":"cube_carl_dwhprd_gold_airings_fact","member":"dc_has_chng_flag"},{"type":"dimension","name":"eps_slot_length","title":"Episode Slot Length","dtype":"number","desc":"Slot length for this airing's episode, carried directly on the fact. See this cube's description for why this is read from here rather than an episode_dim join.","cube":"cube_carl_dwhprd_gold_airings_fact","member":"eps_slot_length"},{"type":"measure","name":"future_airing_count","title":"Future Airing Count","dtype":"sum","desc":"Sum of future airing counts.","cube":"cube_carl_dwhprd_gold_airings_fact","member":"future_airing_count"},{"type":"dimension","name":"originating_entity_name","title":"Originating Entity","dtype":"string","desc":"entity_dim.entity_name for deal_io_part_prog_dim's Originating Entity role (deal_io_part_prog_dim.originating_entity_key), read via a correlated subquery through deal_io_part_prog_dim rather than a second join to entity_dim \u2014 same cube-sql join-path limitation as season_cont_entity_name. deal_io_part_prog_key + internal_offer_key is this table's declared composite key, so no duplicate-row guard is needed \u2014 confirmed live a bare LIMIT (without ORDER BY) actually breaks this shape, failing with the same \"NOT_SUPPORTED: Given correlated subquery is not supported\" error as the nested-subquery case: Trino's engine only supports LIMIT inside a correlated subquery when paired with ORDER BY (the \"top-1 row\" pattern used on season_cont_entity_name/show_cont_entity_name to dodge their dedupe issue); an unordered LIMIT on an otherwise-unique join takes a different, unsupported decorrelation path. Left as a plain single-row-by-construction correlated subquery instead.","cube":"cube_carl_dwhprd_gold_airings_fact","member":"originating_entity_name"},{"type":"dimension","name":"participant_region_flag_desc","title":"Participant Region Flag","dtype":"string","desc":"Decoded participant_region_flag \u2014 D/O/P/null map to Distribution channel region/Offering region/ Participating region/Not Assigned respectively (any other raw value is left blank, matching MicroStrategy's own DECODE, which has no catch-all default).","cube":"cube_carl_dwhprd_gold_airings_fact","member":"participant_region_flag_desc"},{"type":"dimension","name":"participating_entity_name","title":"Participating Entity","dtype":"string","desc":"entity_dim.entity_name looked up by participating_entity_key via a correlated subquery, since entity_dim is already joined once on this fact in the Controlling Entity role \u2014 same role-play pattern as cube_carl_dwhprd_gold_req_rights_episode_fact's equivalent dimension, but fully populated here (see participating_entity_key's description).","cube":"cube_carl_dwhprd_gold_airings_fact","member":"participating_entity_name"},{"type":"measure","name":"record_count","title":"Record Count","dtype":"count","desc":"Row count for smoke queries.","cube":"cube_carl_dwhprd_gold_airings_fact","member":"record_count"},{"type":"dimension","name":"season_cont_entity_name","title":"Season Controlling Entity","dtype":"string","desc":"entity_dim.entity_name for season_dim's Season Controlling Entity role (season_dim.season_cont_entity_key), read via a correlated subquery through season_dim rather than a second join to entity_dim. entity_dim is already joined once directly from this fact (Controlling Entity role); Cube's SQL API (cube-sql, what QuickSight's data source speaks) cannot resolve a single query that needs entity_dim via more than one join path at once \u2014 unlike the REST/JS query engine, which handles this role-play fine. Reproduced live: selecting controlling_entity_name + season_cont_entity_name + show_cont_entity_name + originating_entity_name together via the SQL API failed with \"Can't find join path to join 'cube_carl_dwhprd_gold_airings_fact', ...'\" while the identical REST query succeeded. Fixed by dropping this member's join_path in the view down to a same-cube subquery, matching the participating_entity_name precedent on this same cube. The subquery uses a plain JOIN to entity_dim inside it (not a second nested correlated subquery) \u2014 Athena/Trino's engine rejects a correlated subquery whose own WHERE clause value comes from another correlated subquery (\"NOT_SUPPORTED: Given correlated subquery is not supported\"), confirmed live on an earlier version of this fix; only a single level of outer-cube correlation is supported, with everything else expressed as ordinary joins inside that one subquery. ORDER BY update_ts DESC LIMIT 1 mirrors cube_carl_dwhprd_gold_season_dim's own de-dupe query (see that cube's description) \u2014 querying season_dim's raw table directly here (not through that cube's deduped SQL) hit the two known duplicate season_key rows live, failing with \"SUBQUERY_MULTIPLE_ROWS: Scalar sub-query has returned multiple rows\"; both known duplicates are identical in every column so which one LIMIT 1 keeps doesn't matter, but ORDER BY makes the pick deterministic rather than relying on engine-specific unordered-LIMIT behavior.","cube":"cube_carl_dwhprd_gold_airings_fact","member":"season_cont_entity_name"},{"type":"dimension","name":"season_cont_region_long_name","title":"Season Controlling Region","dtype":"string","desc":"region_dim.region_long_name for the Season Controlling Entity's region, read via a single correlated subquery through season_dim with two plain internal JOINs (to entity_dim, then region_dim) rather than the three-hop join_path (season_dim.entity_dim.region_dim) \u2014 see season_cont_entity_name's description for why this has to be one correlated subquery with internal joins (not nested correlated subqueries) and why it needs the ORDER BY/LIMIT 1 de-dupe guard.","cube":"cube_carl_dwhprd_gold_airings_fact","member":"season_cont_region_long_name"},{"type":"dimension","name":"show_cont_entity_name","title":"Show Controlling Entity","dtype":"string","desc":"entity_dim.entity_name for show_dim's Show Controlling Entity role (show_dim.show_cont_entity_key), read via a correlated subquery through show_dim rather than a second join to entity_dim \u2014 same cube-sql join-path limitation as season_cont_entity_name, same single-correlated-subquery-with-internal-join fix. show_dim isn't wrapped in a de-dupe query like season_dim is, but carries the same ORDER BY/LIMIT 1 guard defensively, on the same \"cube can only join a given target once\" reasoning.","cube":"cube_carl_dwhprd_gold_airings_fact","member":"show_cont_entity_name"},{"type":"dimension","name":"show_cont_region_long_name","title":"Show Controlling Region","dtype":"string","desc":"region_dim.region_long_name for the Show Controlling Entity's region, read via a single correlated subquery through show_dim with two plain internal JOINs (to entity_dim, then region_dim) rather than the three-hop join_path (show_dim.entity_dim.region_dim) \u2014 see season_cont_entity_name's description for why, and show_cont_entity_name's for the defensive ORDER BY/LIMIT 1 guard.","cube":"cube_carl_dwhprd_gold_airings_fact","member":"show_cont_region_long_name"},{"type":"measure","name":"total_airing_count_sum","title":"Total Airing Count","dtype":"sum","desc":"Sum of total airing counts \u2014 selected by MicroStrategy's SQL but not exposed as a named template metric.","cube":"cube_carl_dwhprd_gold_airings_fact","member":"total_airing_count_sum"},{"type":"dimension","name":"year_grouping","title":"Year Grouping","dtype":"string","desc":"Elapsed-month band between this airing's local broadcast month and the season's premiere month on this distribution channel (dc_season_dim.dc_seas_prem_bday_key) \u2014 ten bands, months 0-11 through 100-110. See custom_daypart (on time_dim) for the other half of MicroStrategy's 20-way AIREDCOUNT/GODWFLAG encoding this replaces. Uses Cube's cross-cube dimension reference notation (dot inside the braces) against dc_season_dim, which is already directly joined from this fact \u2014 a prior version used a raw correlated subquery instead (on the mistaken assumption that Cube.js disallows cross-cube dimension references entirely; it does not, see docs.cube.dev/data-modeling/dimensions#from-other-cubes), which compiled fine but failed at query time against Athena with \"NOT_SUPPORTED: Given correlated subquery is not supported\" \u2014 Athena's Trino engine only supports a correlated subquery whose outer-table reference is confined to the WHERE clause; referencing the outer column inside the subquery's own SELECT list (as the date-diff calculation here needed to) is rejected outright, even with a single level of nesting. Also casts both decimal(38,10) key columns through BIGINT before VARCHAR/date_parse, since a direct decimal-to-VARCHAR cast renders as \"20070706.0000000000\" and breaks the '%Y%m%d' format string.","cube":"cube_carl_dwhprd_gold_airings_fact","member":"year_grouping"},{"type":"dimension","name":"corporate_daypart_label","title":"Corporate Daypart","dtype":"string","desc":"\"<selling description> (<name>)\", e.g. \"Prime (P)\", read via airings_fact's corporate_daypart_key join. Matches MicroStrategy's own concatenation. Defined here rather than on airings_fact because Cube.js does not allow a member's SQL to reference the same foreign cube's columns more than once in one formula; a same-cube self-reference has no such limit.","cube":"cube_carl_d otal Absolute Diff (WJXBFSd) is a QuickSight calculated field after aggregation. Cube measure descriptions that cite WJXBFS aliases describe the detail report; the summary reuses those measures by business meaning, and the summary's own aliases differ from WJXBFSd onward. Includes only members that already exist on the live gold cubes \u2014 campaign booking-channel fields and calendar quarter attributes are omitted because campaign_dim / calendar_month_dim do not expose them.","file":"model/efs/Lumos/views/bi_to_bts_recon_fact/international_view_bi_to_bts_recon_fact.yaml","status":"deployed","fields":[{"type":"measure","name":"bi_contract_value","title":"BI Contract Value LOC","dtype":"sum","desc":"Sum of BI-side contract value in local currency.","cube":"cube_carl_dwhprd_gold_bi_to_bts_recon_fact","member":"bi_contract_value"},{"type":"measure","name":"bts_contract_value","title":"BTS Contract Value LOC","dtype":"sum","desc":"Sum of BTS-side contract value in local currency.","cube":"cube_carl_dwhprd_gold_bi_to_bts_recon_fact","member":"bts_contract_value"},{"type":"measure","name":"contract_value_diff","title":"Contract Value Diff LOC","dtype":"sum","desc":"Sum of BI minus BTS contract value in local currency.","cube":"cube_carl_dwhprd_gold_bi_to_bts_recon_fact","member":"contract_value_diff"},{"type":"measure","name":"bi_number_of_spots","title":"Number Of Spots - BI","dtype":"sum","desc":"Sum of BI-side spot count.","cube":"cube_carl_dwhprd_gold_bi_to_bts_recon_fact","member":"bi_number_of_spots"},{"type":"measure","name":"bts_number_of_spots","title":"Number Of Spots - BTS","dtype":"sum","desc":"Sum of BTS-side spot count.","cube":"cube_carl_dwhprd_gold_bi_to_bts_recon_fact","member":"bts_number_of_spots"},{"type":"measure","name":"spot_count_diff","title":"Spots Diff","dtype":"sum","desc":"Sum of BI minus BTS spot count.","cube":"cube_carl_dwhprd_gold_bi_to_bts_recon_fact","member":"spot_count_diff"},{"type":"measure","name":"bi_spot_revenue_less_hold","title":"BI Spot Revenue LOC (excl Rotator Hold)","dtype":"sum","desc":"Sum of BI spot revenue excluding rotator hold, in local currency.","cube":"cube_carl_dwhprd_gold_bi_to_bts_recon_fact","member":"bi_spot_revenue_less_hold"},{"type":"measure","name":"bts_spot_revenue_gross","title":"BTS Spot Revenue LOC (Gross)","dtype":"sum","desc":"Sum of BTS gross spot revenue in local currency.","cube":"cube_carl_dwhprd_gold_bi_to_bts_recon_fact","member":"bts_spot_revenue_gross"},{"type":"measure","name":"spot_revenue_no_hold_diff","title":"Spot Revenue Diff LOC (excl Rotator Hold)","dtype":"sum","desc":"Sum of BI minus BTS spot revenue excluding rotator hold, in local currency.","cube":"cube_carl_dwhprd_gold_bi_to_bts_recon_fact","member":"spot_revenue_no_hold_diff"},{"type":"measure","name":"bi_off_air_revenue_gross","title":"BI Off Air Revenue LOC (Gross)","dtype":"sum","desc":"Sum of BI gross off-air revenue in local currency.","cube":"cube_carl_dwhprd_gold_bi_to_bts_recon_fact","member":"bi_off_air_revenue_gross"},{"type":"measure","name":"bts_off_air_revenue_gross","title":"BTS Off Air Revenue LOC (Gross)","dtype":"sum","desc":"Sum of BTS gross off-air revenue in local currency.","cube":"cube_carl_dwhprd_gold_bi_to_bts_recon_fact","member":"bts_off_air_revenue_gross"},{"type":"measure","name":"off_air_revenue_diff","title":"Off Air Revenue LOC Diff","dtype":"sum","desc":"Sum of BI minus BTS gross off-air revenue in local currency.","cube":"cube_carl_dwhprd_gold_bi_to_bts_recon_fact","member":"off_air_revenue_diff"},{"type":"measure","name":"bi_spot_hold_spots","title":"Number of Hold Spots - BI","dtype":"sum","desc":"Sum of BI-side hold spot count.","cube":"cube_carl_dwhprd_gold_bi_to_bts_recon_fact","member":"bi_spot_hold_spots"},{"type":"measure","name":"bts_number_of_hold_spots","title":"Number of Hold Spots - BTS","dtype":"sum","desc":"Sum of BTS-side hold spot count.","cube":"cube_carl_dwhprd_gold_bi_to_bts_recon_fact","member":"bts_number_of_hold_spots"},{"type":"measure","name":"bi_spot_hold_revenue_rotator","title":"BI Spot Revenue - Rotator Hold LOC","dtype":"sum","desc":"Sum of BI rotator-hold spot revenue in local currency.","cube":"cube_carl_dwhprd_gold_bi_to_bts_recon_fact","member":"bi_spot_hold_revenue_rotator"},{"type":"measure","name":"bi_spot_hold_spots_rotator","title":"Number of Rotator Spots - BI","dtype":"sum","desc":"Sum of BI-side rotator hold spot count.","cube":"cube_carl_dwhprd_gold_bi_to_bts_recon_fact","member":"bi_spot_hold_spots_rotator"},{"type":"measure","name":"bi_spot_hold_revenue","title":"BI Spot Hold Revenue LOC","dtype":"sum","desc":"Sum of BI hold spot revenue in local currency.","cube":"cube_carl_dwhprd_gold_bi_to_bts_recon_fact","member":"bi_spot_hold_revenue"},{"type":"measure","name":"bts_spot_revenue_transmitted","title":"BTS Spot Revenue LOC (Transmitted)","dtype":"sum","desc":"Sum of BTS transmitted spot revenue in local currency.","cube":"cube_carl_dwhprd_gold_bi_to_bts_recon_fact","member":"bts_spot_revenue_transmitted"},{"type":"measure","name":"bi_spot_revenue_booked","title":"BI Spot Revenue LOC - Booked","dtype":"sum","desc":"Sum of BI booked spot revenue in local currency.","cube":"cube_carl_dwhprd_gold_bi_to_bts_recon_fact","member":"bi_spot_revenue_booked"},{"type":"measure","name":"bi_spot_revenue_transmitted","title":"BI Spot Revenue LOC - Transmitted","dtype":"sum","desc":"Sum of BI transmitted spot revenue in local currency.","cube":"cube_carl_dwhprd_gold_bi_to_bts_recon_fact","member":"bi_spot_revenue_transmitted"},{"type":"measure","name":"spot_revenue_transmitted_diff","title":"Spot Revenue - Transmitted LOC Diff","dtype":"sum","desc":"Sum of BI minus BTS transmitted spot revenue in local currency.","cube":"cube_carl_dwhprd_gold_bi_to_bts_recon_fact","member":"spot_revenue_transmitted_diff"},{"type":"measure","name":"min_month","title":"Min (Month)","dtype":"min","desc":"Earliest calendar_month_key at the query grain. On the summary report that grain is finance audit type, holding company, base currency, and BTS batch date. The value is the month key, not the month name.","cube":"cube_carl_dwhprd_gold_bi_to_bts_recon_fact","member":"min_month"},{"type":"measure","name":"max_month","title":"Max (Month)","dtype":"max","desc":"Latest calendar_month_key at the same summary grain. The value is the month key, not the month name.","cube":"cube_carl_dwhprd_gold_bi_to_bts_recon_fact","member":"max_month"},{"type":"dimension","name":"campaign_key","title":"Campaign Key","dtype":"number","desc":"Foreign key to campaign_dim. Part of this cube's composite grain (campaign \u00d7 calendar month \u00d7 channel). Required as a primary key because Cube refuses joins on a cube with no PK.","cube":"cube_carl_dwhprd_gold_bi_to_bts_recon_fact","member":"campaign_key"},{"type":"dimension","name":"campaign_status_key","title":"Campaign Status Key","dtype":"number","desc":"Degenerate campaign-status key on the recon row. Readable status is snowflaked from campaign_dim.campaign_status_dim, not joined from this cube.","cube":"cube_carl_dwhprd_gold_bi_to_bts_recon_fact","member":"campaign_status_key"},{"type":"dimension","name":"calendar_month_key","title":"Calendar Month Key","dtype":"number","desc":"Foreign key to calendar_month_dim. Part of this cube's composite grain (campaign \u00d7 calendar month \u00d7 channel).","cube":"cube_carl_dwhprd_gold_bi_to_bts_recon_fact","member":"calendar_month_key"},{"type":"dimension","name":"agency_key","title":"Agency Key","dtype":"number","desc":"Foreign key to agency_dim.","cube":"cube_carl_dwhprd_gold_bi_to_bts_recon_fact","member":"agency_key"},{"type":"dimension","name":"client_key","title":"Client Key","dtype":"number","desc":"Foreign key to client_dim.","cube":"cube_carl_dwhprd_gold_bi_to_bts_recon_fact","member":"client_key"},{"type":"dimension","name":"holding_company_key","title":"Holding Company Key","dtype":"number","desc":"Campaign-side holding company key. Readable name is snowflaked from campaign_dim.holding_company_dim, not joined from this cube.","cube":"cube_carl_dwhprd_gold_bi_to_bts_recon_fact","member":"holding_company_key"},{"type":"dimension","name":"base_currency_key","title":"Base Currency Key","dtype":"number","desc":"Foreign key to cube_carl_dwhprd_gold_base_currency_dim. Do not retarget this join at cube_carl_dwhprd_gold_currency_dim; campaign_dim already uses that cube for campaign currency.","cube":"cube_carl_dwhprd_gold_bi_to_bts_recon_fact","member":"base_currency_key"},{"type":"dimension","name":"invoice_holding_company_key","title":"Invoice Holding Company Key","dtype":"number","desc":"Foreign key to cube_carl_dwhprd_gold_invoice_holding_company_dim (second cube over holding_company_dim). Do not retarget this join at holding_company_dim.","cube":"cube_carl_dwhprd_gold_bi_to_bts_recon_fact","member":"invoice_holding_company_key"},{"type":"dimension","name":"channel_key","title":"Channel Key","dtype":"number","desc":"Foreign key to channel_dim. Part of this cube's composite grain (campaign \u00d7 calendar month \u00d7 channel).","cube":"cube_carl_dwhprd_gold_bi_to_bts_recon_fact","member":"channel_key"},{"type":"dimension","name":"contract_number","title":"Contract Number","dtype":"string","desc":"Contract number on the reconciliation row.","cube":"cube_carl_dwhprd_gold_bi_to_bts_recon_fact","member":"contract_number"},{"type":"dimension","name":"fin_audit_type","title":"Finance Audit Type","dtype":"string","desc":"Finance audit type classification on the reconciliation row.","cube":"cube_carl_dwhprd_gold_bi_to_bts_recon_fact","member":"fin_audit_type"},{"type":"dimension","name":"hold_closed_flag","title":"Hold Closed Flag","dtype":"string","desc":"Flag indicating hold-closed reconciliation rows (MSTR filter value '1').","cube":"cube_carl_dwhprd_gold_bi_to_bts_recon_fact","member":"hold_closed_flag"},{"type":"dimension","name":"discrepancy_flag","title":"Discrepancy Flag","dtype":"string","desc":"Flag indicating BI vs BTS discrepancy rows (MSTR filter ken syntax than the Oracle/Teradata-style pattern MSTR used.","cube":"cube_carl_dwhprd_gold_campaign_dim","member":"campaign_start_end_date"},{"type":"dimension","name":"campaign_status_code","title":"Campaign Status Code","dtype":"string","desc":"Natural code for the campaign status.","cube":"cube_carl_dwhprd_gold_campaign_status_dim","member":"campaign_status_code"},{"type":"dimension","name":"campaign_status_name","title":"Campaign Status Name","dtype":"string","desc":"Human-readable name of the campaign status.","cube":"cube_carl_dwhprd_gold_campaign_status_dim","member":"campaign_status_name"},{"type":"dimension","name":"holding_company_name","title":"Holding Company Name","dtype":"string","desc":"Human-readable name of the holding company.","cube":"cube_carl_dwhprd_gold_holding_company_dim","member":"holding_company_name"},{"type":"dimension","name":"agency_id","title":"Agency ID","dtype":"string","desc":"Natural identifier for the agency.","cube":"cube_carl_dwhprd_gold_agency_dim","member":"agency_id"},{"type":"dimension","name":"agency_name","title":"Agency Name","dtype":"string","desc":"Human-readable value \"Agency\".","cube":"cube_carl_dwhprd_gold_agency_dim","member":"agency_name"},{"type":"dimension","name":"client_id","title":"Client ID","dtype":"string","desc":"Natural identifier for the client.","cube":"cube_carl_dwhprd_gold_client_dim","member":"client_id"},{"type":"dimension","name":"client_name","title":"Client Name","dtype":"string","desc":"Human-readable name of the client.","cube":"cube_carl_dwhprd_gold_client_dim","member":"client_name"},{"type":"dimension","name":"invoice_holding_company_name","title":"Invoice Holding Company","dtype":"string","desc":"Name of the invoice-side holding company. This is not the campaign-side holding company \u2014 for that use cube_carl_dwhprd_gold_holding_company_dim.holding_company_name.","cube":"cube_carl_dwhprd_gold_invoice_holding_company_dim","member":"holding_company_name"},{"type":"dimension","name":"calendar_month_label","title":"Month","dtype":"string","desc":"Formatted \"<Month Name> <Year>\" label, reproducing MSTR's custom column (CustCol_400/CustCol_3). Both operands now explicitly cube-qualified \u2014 RESOLVED 2026-08-27: the previous unqualified `calendar_year` reference compiled fine and worked via the REST API, but broke both sox_view_campaign_fact and sox_view_affiliate_fact live against Cube's SQL API (what QuickSight's data source speaks) with `AMBIGUOUS_NAME: Column 'calendar_year' is ambiguous` \u2014 Trino/Athena resolves unqualified column references against every physical table in the generated JOIN, not just the cube that declares the dimension, and at least one sibling table joined alongside calendar_month_dim on each of those two views also carries a raw `calendar_year` column (e.g. calendar_year_dim on sox_view_affiliate_fact). Confirmed via live dev CloudWatch logs on both views. Always qualify cross-column references in multi-column derived dimensions with the cube-reference prefix to avoid this class of bug.","cube":"cube_carl_dwhprd_gold_calendar_month_dim","member":"calendar_month_label"},{"type":"dimension","name":"calendar_year","title":"Calendar Year (raw)","dtype":"number","desc":"Raw calendar year, used to build calendar_month_label.","cube":"cube_carl_dwhprd_gold_calendar_month_dim","member":"calendar_year"},{"type":"dimension","name":"display_channel_name","title":"Channel Name","dtype":"string","desc":"Display-formatted channel name, distinct from the raw channel_name column.","cube":"cube_carl_dwhprd_gold_channel_dim","member":"display_channel_name"},{"type":"dimension","name":"channel_id","title":"Channel ID","dtype":"string","desc":"Natural identifier for the channel.","cube":"cube_carl_dwhprd_gold_channel_dim","member":"channel_id"},{"type":"dimension","name":"master_channel","title":"Master Channel","dtype":"string","desc":"Parent network grouping, e.g. Animal Planet, Discovery Channel, Discovery ID, Discovery Science, Discovery Turbo, TLC.","cube":"cube_carl_dwhprd_gold_channel_dim","member":"master_channel"},{"type":"dimension","name":"base_currency_code","title":"Base Currency Code","dtype":"string","desc":"Currency code for the reconciliation row's base currency.","cube":"cube_carl_dwhprd_gold_base_currency_dim","member":"currency_cd"},{"type":"dimension","name":"base_currency_name","title":"Base Currency Name","dtype":"string","desc":"Currency name for the reconciliation row's base currency.","cube":"cube_carl_dwhprd_gold_base_currency_dim","member":"currency_name"},{"type":"dimension","name":"source_region_name","title":"Source Region Name","dtype":"string","desc":"Human-readable name of the source region.","cube":"cube_carl_dwhprd_gold_source_system_region_dim","member":"source_region_name"}]},{"domain":"Lumos (DWH gold \u2013 linear ad sales, finance, intl, content)","name":"international_view_campaign_fact","title":"International \u2014 Campaign Grid Latam Report","business":"international","base":"dwhprd_gold.campaign_fact, dwhprd_gold.sales_rep_fraction_fact","measures":8,"dims":11,"joins":8,"access":"No","desc":"Campaign Grid Latam Report for Discovery Latin America ad sales. Local-currency campaign booking and revenue by holding company, channel, campaign, campaign dates, agency, client, base currency, month, and master channel. Reads the plain-sum measures on cube_carl_dwhprd_gold_campaign_fact. sox_view_campaign_fact reads the share-weighted measures on that same cube, so the SOX campaign report is unchanged. Apply in QuickSight: source_system_region_key = 21 AND calendar_year_key IN (2019, 2020, 2021, 2022, 2023, 2024, 2025, 2026). Those filters are not on the cube. Product is omitted. campaign_net_revenue_loc is sum(gross_revenue * (1 - agency_commission_pct)), not a sum of the stored campaign_net_revenue column. agency_commission_loc is sum(gross_revenue * agency_commission_pct). Measures are plain sums and are not multiplied by sales_rep_revenue_share.","file":"model g time. Y on 1,912 rows in the whole fact and N on the rest, and none of the Y rows is an avails row, so this cannot move any measure that selects inventory_status_key = 0 \u2014 which is both capacity measures below. Exposed for completeness so the MSTR prompt has a column to point at, not because it changes a number.","cube":"cube_carl_dwhprd_gold_inventory_fact","member":"log_denied_flag"},{"type":"measure","name":"booked_pressure_eqv30_spots","title":"Booked Pressure EQV30 Spots","dtype":"sum","desc":"Equivalent 30-second spots where the booked pressure indicator is 0 or 2, or the inventory status is Booked or Pressure. The nested condition in the SQL reduces to that disjunction. No dimension decodes booked_pressure_ind \u2014 see registry/key_decode/carl_dwhprd_gold.yaml.","cube":"cube_carl_dwhprd_gold_inventory_fact","member":"booked_pressure_eqv30_spots"},{"type":"dimension","name":"episode_version_key","title":"Episode Version Key","dtype":"number","desc":"Foreign key joining inventory_fact to episode_version_dim. This column holds the surrogate key only; the readable labels are columns on episode_version_dim. Filtered on directly downstream, because MSTR emits key literals rather than names.","cube":"cube_carl_dwhprd_gold_inventory_fact","member":"episode_version_key"},{"type":"dimension","name":"inventory_status_key","title":"Inventory Status Key","dtype":"number","desc":"Foreign key joining inventory_fact to inventory_status_dim. This column holds the surrogate key only; the readable labels are columns on inventory_status_dim. Filtered on directly downstream, because MSTR emits key literals rather than names.","cube":"cube_carl_dwhprd_gold_inventory_fact","member":"inventory_status_key"},{"type":"dimension","name":"inventory_type_key","title":"Inventory Type Key","dtype":"number","desc":"Foreign key joining inventory_fact to inventory_type_dim. This column holds the surrogate key only; the readable labels are columns on inventory_type_dim. Filtered on directly downstream, because MSTR emits key literals rather than names.","cube":"cube_carl_dwhprd_gold_inventory_fact","member":"inventory_type_key"},{"type":"dimension","name":"network_key","title":"Network Key","dtype":"number","desc":"Foreign key joining inventory_fact to network_dim. This column holds the surrogate key only; the readable labels are columns on network_dim. Filtered on directly downstream, because MSTR emits key literals rather than names.","cube":"cube_carl_dwhprd_gold_inventory_fact","member":"network_key"},{"type":"measure","name":"num_of_eqv30_spots","title":"Number of EQV30 Spots","dtype":"sum","desc":"Sum of the number of equivalent 30-second advertising spots.","cube":"cube_carl_dwhprd_gold_inventory_fact","member":"num_of_eqv30_spots"},{"type":"dimension","name":"act_air_daypart_day_time_name","title":"Actual Aired Daytime Daypart","dtype":"string","desc":"Human-readable name describing the daypart's day and time characteristics.","cube":"cube_carl_dwhprd_gold_actual_air_daypart_dim","member":"act_air_daypart_day_time_name"},{"type":"dimension","name":"act_air_total_day_ind_desc","title":"Total Day Indicator","dtype":"string","desc":"Description indicating whether this daypart is a total day or partial day classification.","cube":"cube_carl_dwhprd_gold_actual_air_daypart_dim","member":"act_air_total_day_ind_desc"},{"type":"dimension","name":"property_desc","title":"Property","dtype":"string","desc":"Human-readable name or title of the broadcast property (show, program, or content).","cube":"cube_carl_dwhprd_gold_property_dim","member":"property_desc"},{"type":"dimension","name":"property_desc_id","title":"Property (ID)","dtype":"string","desc":"Property name with its business ID suffixed in parentheses, e.g. \"2015 NBA Playoff Playbacks (281333)\" \u2014 reproduces MicroStrategy's display format exactly. Confirmed live in MSTR's own generated SQL (`\"PROPERTY_DESC\" || ' ('|| \"PROPERTY_ID\"||')' \"PROPERTY_DESC\"`), which concatenates the same two fields already modeled separately here (property_desc, property_id). Also resolves property_desc alone being ambiguous for ~38% of properties.","cube":"cube_carl_dwhprd_gold_property_dim","member":"property_desc_id"},{"type":"dimension","name":"property_id","title":"Property ID","dtype":"number","desc":"Business identifier for the property from the source system.","cube":"cube_carl_dwhprd_gold_property_dim","member":"property_id"},{"type":"dimension","name":"net_name","title":"Network","dtype":"string","desc":"Official name of the broadcast network.","cube":"cube_carl_dwhprd_gold_network_dim","member":"net_name"},{"type":"dimension","name":"master_selling_title_desc","title":"Master Selling Title","dtype":"string","desc":"Description of the master selling title.","cube":"cube_carl_dwhprd_gold_selling_title_dim","member":"master_selling_title_desc"},{"type":"dimension","name":"sell_property_category_key","title":"Sell Property Category Key","dtype":"number","desc":"Surrogate key referencing the property category dimension.","cube":"cube_carl_dwhprd_gold_selling_title_dim","member":"sell_property_category_key"},{"type":"dimension","name":"selling_title_desc","title":"Selling Title","dtype":"string","desc":"Human-readable description or name of the selling title.","cube":"cube_carl_dwhprd_gold_selling_title_dim","member":"selling_title_desc"},{"type":"dimension","name":"property_category","title":"Sell Property Category","dtype":"string","desc":"Descriptive name or label of the property category.","cube":"cube_carl_dwhprd_gold_property_category_dim","member":"property_category"},{"type":"dimension","name":"inventory_type_desc","title":"Inventory Type","dtype":"string","desc":"Full descriptive name or label for the inventory type.","cube":"cube_carl_dwhprd_gold_inventory_type_dim","member":"inventory_type_desc"},{"type":"dimension","name":"inventory_status_desc","title":"Inventory Status","dtype":"string","desc":"Human-readable description of the inventory status (e.g., 'N/A', 'Booked', 'Pressure').","cube":"cube_carl_dwhprd_gold_inventory_status_dim","member":"inventory_status_desc"},{"type":"dimension","name":"bcast_qtr_desc","title":"Unit Broadcast Quarter","dtype":"string","desc":"Descriptive text for the broadcast quarter.","cube":"cube_carl_dwhprd_gold_unit_sched_bday_dim","member":"bcast_qtr_desc"},{"type":"dimension","name":"broadcast_qtr_key","title":"Unit Broadcast Quarter Key","dtype":"number","desc":"Surrogate key for the broadcast quarter containing this day.","cube":"cube_carl_dwhprd_gold_unit_sched_bday_dim","member":"broadcast_qtr_key"},{"type":"dimension","name":"calendar_qtr_key","title":"Unit Calendar Quarter Key","dtype":"number","desc":"Surrogate key for the calendar quarter containing this day.","cube":"cube_carl_dwhprd_gold_unit_sched_bday_dim","member":"calendar_qtr_key"},{"type":"dimension","name":"day_date","title":"Unit Broadcast Date","dtype":"time","desc":"The actual calendar date for this business day.","cube":"cube_carl_dwhprd_gold_unit_sched_bday_dim","member":"day_date"},{"type":"dimension","name":"broadcast_year","title":"Broadcast Year","dtype":"number","desc":"The broadcast year.","cube":"cube_carl_dwhprd_gold_unit_sched_bday_dim","member":"broadcast_year"},{"type":"dimension","name":"calendar_year","title":"Calendar Year","dtype":"number","desc":"The calendar year (e.g., 2024).","cube":"cube_carl_dwhprd_gold_unit_sched_bday_dim","member":"calendar_year"}]},{"domain":"Lumos (DWH gold \u2013 linear ad sales, finance, intl, content)","name":"ad_sales_view_invoice_revenue_fact","title":"Ad Sales \u2014 Invoice Revenue Fact","business":"ad_sales","base":"dwhprd_gold.invoice_revenue_fact","measures":32,"dims":153,"joins":61,"access":"No","desc":"Business view for ad_sales on invoice_revenue_fact. CLARIFICATIONS (CARL-3631 dev QuickSight validation): (1) MSTR's \"Booked Revenue\"/\"Revenue\" measure is this view's Gross Revenue \u2014 there is no separate Booked Revenue column; Gross Revenue is also the correct base for Net Revenue/Agency Commission (see the Gross vs Net for $0 billing report), so it keeps that name rather than being renamed. (2) \"Sold LOA Network\"/\"Sold LOA Market\"/\"Sold LOA Guar/Target Demographic\"/\"Sold LOA Unit Broadcast Quarter\" (Sports SLOA reports) are the same Network/Market/Guar/Target Demographic/Unit Broadcast Quarter fields already in this view \u2014 already scoped to the Sold-LOA snapshot once filtered on Deal Revenue Snapshot = \"Sold-LOA/1st to Order/CB Hold\"; not a separate role-played dimension. (3) MSTR's displayed \"Broadcast Quarter\"/\"Calendar Quarter\" text is a computed \"4th Qtr 2026\"-style string (ordinal quarter + year), not necessarily identical formatting to bcast_qtr_desc/cal_qtr_desc here \u2014 confirm before treating as an exact match. (4) Some MSTR filter values (Product Category, Program Average Selling Daypart) carry a source-system ID prefix/suffix not present in this view's clean description fields \u2014 prod_cat_name_id is available as the numeric counterpart for Product Category. (5) CARL-3016 Invoiced-Booked Revenue by Team uses a single path invoice \u2192 team_ae_bridge (ae_fraction_fact) \u2192 member / sales team dims. Team member and fraction are month-aligned (unit broadcast month + acct_cov_team_member_key); coverage team member labels are members with a fraction row for that invoice month, not every member on the team key alone. Do not sum Gross Revenue at invoice-only grain while this path is active. Finance/sox views omit these paths. (6) CARL-3953 Theatrical Deals - Various: MSTR view filters on hundreds of distinct brand_key values (many labeled VARIOUS). Filter on Brand (ID), not brand_name alone, to match MSTR scope.","file":"model/efs/Lumos/views/invoice_revenue_fact/ad_sales_view_invoice_revenue_fact.yaml","status":"deployed","fields":[{"type":"dimension","name":"deal_id","title":"Deal Id","dtype":"number","desc":"Unique identifier for the deal.","cube":"cube_carl_dwhprd_gold_invoice_revenue_fact","member":"deal_id"},{"type":"measure","name":"revenue","title":"Gross Revenue","dtype":"sum","desc":"Total revenue summed across all transactions.","cube":"cube_carl_dwhprd_gold_invoice_revenue_fact","member":"revenue"},{"type":"measure","name":"eqv30_spots","title":"Equiv30 Spots","dtype":"sum","desc":"Sum of equivalent 30-second spots.","cube":"cube_carl_dwhprd_gold_invoice_revenue_fact","member":"eqv30_spots"},{"type":"measure","name":"guar_target_imps_000","title":"Guar/Target Estimated Impressions","dtype":"sum","desc":"Sum of guaranteed target estimated impressions multiplied by number of spots, expressed in thousands. Calculated by multiplying impressions by spot count and dividing by 1000.","cube":"cube_carl_dwhprd_gold_invoice_revenue_fact","member":"guar_target_imps_000"},{"type":"measure","name":"net_corp_imps_000","title":"Net Corp Estimated Imps","dtype":"sum","desc":"Net corporate estimated impressions multiplied by number of spots, divided by 1000.","cube":"cube_carl_dwhprd_gold_invoice_revenue_fact","member":"net_corp_imps_000"},{"type":"measure","name":"acm_hh_imps_000","title":"ACM HH Estimated Imps","dtype":"sum","desc":"Household estimated impressions multiplied by number of spots, divided by 1,000 for ACM data. Aggregated as a sum across all rows.","cube":"cube_carl_dwhprd_gold_invoice_revenue_fact","member":"acm_hh_imps_000"},{"type":"measure","name":"ratecard_unequiv_rate","title":"RateCard Unequiv Rate","dtype":"sum","desc":"Sum of ratecard unit rates.","cube":"cube_carl_dwhprd_gold_invoice_revenue_fact","member":"ratecard_unequiv_rate"},{"type":"measure","name":"potential_cancelable_revenue","title":"Potential Cancellable Revenue","dtype":"sum","desc":"Sum of potential cancelable dollars \u2014 revenue at risk of cancellation under deal cutback terms.","cube":"cube_carl_dwhprd_gold_invoice_revenue_fact","member":"potential_cancelable_revenue"},{"type":"measure","name":"agency_commission","title":"Agency Commission","dtype":"sum","desc":"Revenue multiplied by the row-level agency commission percentage, summed.","cube":"cube_carl_dwhprd_gold_invoice_revenue_fact","member":"agency_commission"},{"type":"measure","name":"net_revenue","title":"Net Revenue","dtype":"sum","desc":"Gross revenue less agency commission, summed.","cube":"cube_carl_dwhprd_gold_invoice_revenue_fact","member":"net_revenue"},{"type":"measure","name":"commission_pct","title":"Commission %","dtype":"number","desc":"Net Revenue over Gross Revenue. MSTR defines \"commission\" as the Net Revenue measure divided by the Gross Revenue measure \u2014 a ratio of two sums, not a sum of row-level ratios.","cube":"cube_carl_dwhprd_gold_invoice_revenue_fact","member":"commission_pct"},{"type":"measure","name":"number_of_spots","title":"Number of Spots","dtype":"sum","desc":"Sum of the raw (non-equivalized) number of spots.","cube":"cube_carl_dwhprd_gold_invoice_revenue_fact","member":"number_of_spots"},{"type":"measure","name":"as_sold_unequiv_rate","title":"As Sold Unequiv Rate","dtype":"sum","desc":"Sum of as-sold unit rates.","cube":"cube_carl_dwhprd_gold_invoice_revenue_fact","member":"as_sold_unequiv_rate"},{"type":"dimension","name":"guar_target_demo_key","title":"Guar/Target Demographic (ID)","dtype":"number","desc":"Foreign key joining invoice_revenue_fact to demographics_dim. This column holds the surrogate key only; the readable labels are columns on demographics_dim. Filtered on directly downstream, because MSTR emits key literals rather than names.","cube":"cube_carl_dwhprd_gold_invoice_revenue_fact","member":"guar_target_demo_key"},{"type":"dimension","name":"revenue_eff_bcast_qtr_key","title":"Broadcast Quarter (ID)","dtype":"number","desc":"Foreign key joining invoice_revenue_fact to revenue_eff_bcast_qtr_dim. This column holds the surrogate key only; the readable labels are columns on revenue_eff_bcast_qtr_dim. Filtered on directly downstream, because MSTR emits key literals rather than names.","cube":"cube_carl_dwhprd_gold_invoice_revenue_fact","member":"revenue_eff_bcast_qtr_key"},{"type":"dimension","name":"revenue_eff_cal_qtr_key","title":"Calendar Quarter (ID)","dtype":"number","desc":"Foreign key joining invoice_revenue_fact to revenue_eff_cal_qtr_dim. This column holds the surrogate key only; the readable labels are columns on revenue_eff_cal_qtr_dim. Filtered on directly downstream, because MSTR emits key literals rather than names.","cube":"cube_carl_dwhprd_gold_invoice_revenue_fact","member":"revenue_eff_cal_qtr_key"},{"type":"dimension","name":"revenue_eff_cal_year_key","title":"Calendar Year (ID)","dtype":"number","desc":"Foreign key joining invoice_revenue_fact to revenue_eff_cal_year_dim. This column holds the surrogate key only; the readable labels are columns on revenue_eff_cal_year_dim. Filtered on directly downstream, because MSTR emits key literals rather than names.","cube":"cube_carl_dwhprd_gold_invoice_revenue_fact","member":"revenue_eff_cal_year_key"},{"type":"dimension","name":"revenue_eff_cal_month_key","title":"Revenue Effective Calendar Month (ID)","dtype":"number","desc":"A calendar dimension table that provides a complete hierarchy of time periods for revenue analysis, including month, quarter, half-year, and year levels with associated dates and day counts. This table enables time-based aggregation and filtering across multiple calendar granularities.","cube":"cube_carl_dwhprd_gold_invoice_revenue_fact","member":"revenue_eff_cal_month_key"},{"type":"dimension","name":"revenue_area_key","title":"Revenue Area (ID)","dtype":"number","desc":"Foreign key joining invoice_revenue_fact to revenue_area_dim. This column holds the surrogate key only; the readable labels are columns on revenue_area_dim. Filtered on directly downstream, because MSTR emits key literals rather than names.","cube":"cube_carl_dwhprd_gold_invoice_revenue_fact","member":"revenue_area_key"},{"type":"dimension","name":"network_key","title":"Network (ID)","dtype":"number","desc":"Foreign key joining invoice_revenue_fact to network_dim. This column holds the surrogate key only; the readable labels are columns on network_dim. Filtered on directly downstream, because MSTR emits key literals rather than names.","cube":"cube_carl_dwhprd_gold_invoice_revenue_fact","member":"network_key"},{"type":"dimension","name":"brand_key","title":"Brand (ID)","dtype":"number","desc":"Foreign key joining invoice_revenue_fact to brand_dim. This column holds the surrogate key only; the readable brand name is a column on brand_dim. Distinct from advertiser_key and product_key.","cube":"cube_carl_dwhprd_gold_invoice_revenue_fact","member":"brand_key"},{"type":"dimension","name":"market_key","title":"Market (ID)","dtype":"number","desc":"Foreign key joining invoice_revenue_fact to market_dim. This column holds the surrogate key only; the readable labels are columns on market_dim. Filtered on directly downstream, because MSTR emits key literals rather than names.","cube":"cube_carl_dwhprd_gold_invoice_revenue_fact","member":"market_key"},{"type":"dimension","name":"rateclass_key","title":"Rateclass (ID)","dtype":"number","desc":"Foreign key joining invoice_revenue_fact to rateclass_dim. This column holds the surrogate key only; the readable labels are columns on rateclass_dim. Filtered on directly downstream, because MSTR emits key literals rather than names.","cube":"cube_carl_dwhprd_gold_invoice_revenue_fact","member":"rateclass_key"},{"type":"dimension","name":"deal_revenue_snapshot_key","title":"Deal Revenue Snapshot (ID)","dtype":"number","desc":"Foreign key joining invoice_revenue_fact to deal_revenue_snapshot_dim. This column holds the surrogate key only; the readable labels are columns on deal_revenue_snapshot_dim. Filtered on directly downstream, because MSTR emits key literals rather than names.","cube":"cube_carl_dwhprd_gold_invoice_revenue_fact","member":"deal_revenue_snapshot_key"},{"type":"measure","name":"current_booked_revenue","title":"Revenue - Current Booked","dtype":"sum","desc":"MSTR \"Revenue - Current Booked\" used by CNNE Data, CNNI Revenue Detail, and CNNI Posted Spots: booked revenue restricted to Deal Revenue Snapshot Invoiced/Current Booked (key 8).","cube":"cube_carl_dwhprd_gold_invoice_revenue_fact","member":"current_booked_revenue"},{"type":"dimension","name":"usn_key","title":"USN","dtype":"number","desc":"Unit serial number key emitted directly by MSTR as USN for posted-spot reporting. No decoded lookup is present in the CNNE Data SQL.","cube":"cube_carl_dwhprd_gold_invoice_revenue_fact","member":"usn_key"},{"type":"dimension","name":"unit_type_group_key","title":"Unit Type Group (ID)","dtype":"number","desc":"Foreign key joining invoice_revenue_fact to unit_type_group_dim. This column holds the surrogate key only; the readable labels are columns on unit_type_group_dim. Filtered on directly downstream, because MSTR emits key literals rather than names.","cube":"cube_carl_dwhprd_gold_invoice_revenue_fact","member":"unit_type_group_key"},{"type":"dimension","name":"guar_est_methodology_key","title":"Guar Estimated Methodology (ID)","dtype":"number","desc":"Foreign key joining invoice_revenue_fact to guar_est_methodology_dim. This column holds the surrogate key only; the readable labels are columns on guar_est_methodology_dim. Filtered on directly downstream, because MSTR emits key literals rather than names.","cube":"cube_carl_dwhprd_gold_invoice_revenue_fact","member":"guar_est_methodology_key"},{"type":"dimension","name":"buy_type_key","title":"Buy Type (ID)","dtype":"number","desc":"Foreign key joining invoice_revenue_fact to buy_type_dim. This column holds the surrogate key only; the readable labels are columns on buy_type_dim. Filtered on directly downstream, because MSTR emits key literals rather than names.","cube":"cube_carl_dwhprd_gold_invoice_revenue_fact","member":"buy_type_key"},{"type":"dimension","name":"deal_revenue_status_key","title":"Deal Revenue Status (ID)","dtype":"number","desc":"Foreign key joining invoice_revenue_fact to deal_revenue_status_dim. This column holds the surrogate key only; the readable labels are columns on deal_revenue_status_dim. Filtered on directly downstream, because MSTR emits key literals rather than names.","cube":"cube_carl_dwhprd_gold_invoice_revenue_fact","member":"deal_revenue_status_key"},{"type":"dimension","name":"inventory_type_key","title":"Inventory Type (ID)","dtype":"number","desc":"Foreign key joining invoice_revenue_fact to inventory_type_dim. This column holds the surrogate key only; the readable labels are columns on inventory_type_dim. Filtered on directly downstream, because MSTR emits key literals rather than names.","cube":"cube_carl_dwhprd_gold_invoice_revenue_fact","member":"inventory_type_key"},{"type":"dimension","name":"selling_title_key","title":"Selling Title (ID)","dtype":"number","desc":"Foreign key joining invoice_revenue_fact to selling_title_dim. This column holds the surrogate key only; the readable labels are columns on selling_title_dim. Filtered on directly downstream, because MSTR emits key literals rather than names.","cube":"cube_carl_dwhprd_gold_invoice_revenue_fact","member":"selling_title_key"},{"type":"measure","name":"acm_net_corp_imps_000","title":"ACM Net Corp Impressions (Thousands)","dtype":"sum","desc":"ACM net corporate estimated impressions multiplied by number of spots, divided by 1000.","cube":"cube_carl_dwhprd_gold_invoice_revenue_fact","member":"acm_net_corp_imps_000"},{"type":"measure","name":"hh_imps_000","title":"HH Estimated Impressions (Thousands)","dtype":"sum","desc":"Household estimated impressions multiplied by number of spots, divided by 1,000. Aggregated as a sum across all rows.","cube":"cube_carl_dwhprd_gold_invoice_revenue_fact","member":"hh_imps_000"},{"type":"measure","name":"pal_net_corp_imps_000","title":"PAL Net Corp Impressions (Thousands)","dtype":"sum","desc":"PAL net corporate estimated impressions multiplied by number of spots, divided by 1000. Unconditioned counterpart of natl_comm_pal_net_corp_imps_000, same pattern as acm_net_corp_imps_000 vs natl_comm_acm_net_corp_imps_000. Feeds pal_net_corp_cpm below.","cube":"cube_carl_dwhprd_gold_invoice_revenue_fact","member":"pal_net_corp_imps_000"},{"type":"measure","name":"ecm_net_corp_imps_000","title":"ECM Net Corp Impressions (Thousands)","dtype":"sum","desc":"ECM net corporate estimated impressions multiplied by number of spots, divided by 1000. Same pattern as acm_net_corp_imps_000/pal_net_corp_imps_000; ecm_net_corp_estimated_imps confirmed present on the ingested invoice_revenue_fact table (2026-08-31), no ingestion needed. Feeds ecm_net_corp_cpm below.","cube":"cube_carl_dwhprd_gold_invoice_revenue_fact","member":"ecm_net_corp_imps_000"},{"type":"measure","name":"net_corp_actual_imps_000","title":"Net Corp Actual Impressions (Thousands)","dtype":"sum","desc":"Net corporate ACTUAL impressions (net_corp_actual_imps), divided by 1000 \u2014 unlike its \"_estimated\" siblings (net_corp_imps_000 etc.), not multiplied by num_of_spots: it's already a per-row total, not a per-spot rate. No filter baked in; MSTR scoped this to unit_type_group_key = 1 (\"Cash\") for Net Corp Unit Actual CPM below \u2014 filter at query time via that dimension instead.","cube":"cube_carl_dwhprd_gold_invoice_revenue_fact","member":"net_corp_actual_imps_000"},{"type":"measure","name":"acm_guar_target_imps_000","title":"ACM Guar/Target Estimated Impressions (Thousands)","dtype":"sum","desc":"ACM-specific counterpart of guar_target_imps_000 above, using acm_guar_target_estimated_imps instead of guar_target_estimated_imps, same multiply-by-spots-divide-by-1000 shape. No filter baked in; MSTR's export scoped this to guar_est_methodology_key = 2 AND unit_type_group_key = 1 when computing Guar/Target Estimated CPM - ACM Guar below \u2014 filter at query time via the existing guar_est_methodology_key/unit_type_group_key dimensions rather than here.","cube":"cube_carl_dwhprd_gold_invoice_revenue_fact","member":"acm_guar_target_imps_000"},{"type":"measure","name":"guar_target_cpm","title":"Guar/Target CPM","dtype":"number","desc":"Revenue per thousand guaranteed or target demographic impressions. MSTR defines it as Revenue / [Guar/Target Estimated Impressions], and defines that denominator as Sum([Booked Guar/Target Estimated Imps]) / 1000. MSTR leaves the metric itself unnamed \u2014 it is literally called New Metric \u2014 so the name here is ours.","cube":"cube_carl_dwhprd_gold_invoice_revenue_fact","member":"guar_target_cpm"},{"type":"measure","name":"net_corp_cpm","title":"Net Corp CPM","dtype":"number","desc":"Revenue per thousand net corp impressions. MSTR calls it corp cpm and defines it as Revenue / [Net Corp Estimated Imps], with that denominator defined as Sum(same) / 1000 \u2014 exactly this pair, so no multiply by 1000 is needed. One question stays open, narrower than the formula \u2014 whether [Net Corp Estimated Imps] means the plain impressions column or the ACM one. They land 0.6% apart.","cube":"cube_carl_dwhprd_gold_invoice_revenue_fact","member":"net_corp_cpm"},{"type":"measure","name":"acm_net_corp_cpm","title":"ACM Net Corp CPM","dtype":"number","desc":"Unconditioned ACM counterpart of net_corp_cpm above (revenue over ACM net corp impressions, no buy-type filter), same relationship natl_comm_acm_net_corp_cpm has to its National-Commercial-filtered inputs \u2014 the missing unconditioned sibling, same gap pattern pal_net_corp_cpm/ecm_net_corp_cpm filled for their measures.","cube":"cube_carl_dwhprd_gold_invoice_revenue_fact","member":"acm_net_corp_cpm"},{"type":"measure","name":"acm_hh_cpm","title":"ACM HH CPM","dtype":"number","desc":"Revenue per thousand ACM household impressions. MSTR defines it as Revenue / [ACM HH Estimated Imps], and defines that denominator as Sum([Booked ACM HH Estimated Imps]) / 1000.","cube":"cube_carl_dwhprd_gold_invoice_revenue_fact","member":"acm_hh_cpm"},{"type":"measure","name":"pal_net_corp_cpm","title":"PAL Net Corp CPM","dtype":"number","desc":"Unconditioned PAL counterpart of net_corp_cpm above (revenue over PAL net corp impressions, no buy-type filter), same relationship natl_comm_pal_net_corp_cpm has to its National-Commercial-filtered inputs.","cube":"cube_carl_dwhprd_gold_invoice_revenue_fact","member":"pal_net_corp_cpm"},{"type":"measure","name":"ecm_net_corp_cpm","title":"ECM Net Corp CPM","dtype":"number","desc":"Unconditioned ECM counterpart of net_corp_cpm above, same pattern as pal_net_corp_cpm.","cube":"cube_carl_dwhprd_gold_invoice_revenue_fact","member":"ecm_net_corp_cpm"},{"type":"measure","name":"net_corp_actual_cpm","title":"Net Corp Unit Actual CPM","dtype":"number","desc":"UNVERIFIED \u2014 inferred from MSTR's SQL trailer for \"Sponsorship - Linear Revenue Data\", which names this metric but doesn't spell out its formula. Revenue over net_corp_actual_imps_000, the same revenue-per-thousand-impressions shape every other _cpm measure on this cube uses. MSTR scoped both sides to unit_type_group_key = 1 (\"Cash\") \u2014 apply that filter at query time; not baked in here so the measure stays reusable. Confirm with the report owner before treating as authoritative.","cube":"cube_carl_dwhprd_gold_invoice_revenue_fact","member":"net_corp_actual_cpm"},{"type":"measure","name":"acm_guar_target_cpm","title":"Guar/Target Estimated CPM - ACM Guar","dtype":"number","desc":"UNVERIFIED \u2014 inferred from MSTR's SQL trailer for \"Sponsorship - Linear Revenue Data\", which names this metric but doesn't spell out its formula. Revenue over acm_guar_target_imps_000, the ACM sibling of guar_target_cpm above. MSTR scoped both sides to guar_est_methodology_key = 2 AND unit_type_group_key = 1 \u2014 apply those filters at query time, same reusability reason as net_corp_actual_cpm. Confirm with the report owner before treating as authoritative.","cube":"cube_carl_dwhprd_gold_invoice_revenue_fact","member":"acm_guar_target_cpm"},{"type":"measure","name":"avg_equiv30_unit_rate","title":"Avg Equiv :30 Unit Rate","dtype":"number","desc":"Revenue per equivalent :30 unit. MSTR defines it elsewhere as Avg Equiv30 Revenue, computed as Revenue / [Equiv30 Spots] \u2014 exactly this. A metric named Avg Equiv :30 Unit Rate elsewhere is assumed to be the same computation, though no formula was available to confirm it there. Distinct from as_sold_unequiv_rate, which sums the rate on each row rather than deriving one.","cube":"cube_carl_dwhprd_gold_invoice_revenue_fact","member":"avg_equiv30_unit_rate"},{"type":"measure","name":"ratecard_pct","title":"% of Ratecard","dtype":"number","desc":"As-sold unequivalised rate over ratecard unequivalised rate. MSTR defines this as [As Sold Unequiv Rate] / [RateCard Unequiv Rate], which is exactly this. A ratio of two sums rather than a sum of ratios \u2014 dividing after aggregation is what MSTR does, and the two disagree at any grain coarser than a row.","cube":"cube_carl_dwhprd_gold_invoice_revenue_fact","member":"ratecard_pct"},{"type":"measure","name":"revenue_over_ratecard_rate","title":"Revenue over Ratecard Unequiv Rate","dtype":"number","desc":"UNVERIFIED \u2014 faithful to MSTR but probably not what its name suggests. Finance should say which formula was intended before this number is quoted. MSTR calls it rc% and defines it as Revenue / [RateCard Unequiv Rate], which is no percentage \u2014 dollars over a dollars-per-unit rate gives a unit count. ratecard_pct is the other reading, [As Sold Unequiv Rate] / [RateCard Unequiv Rate]. Registered as written so this reproduces MSTR faithfully.","cube":"cube_carl_dwhprd_gold_invoice_revenue_fact","member":"revenue_over_ratecard_rate"},{"type":"measure","name":"revenue_tracked","title":"Revenue (Tracked Methodology Only)","dtype":"sum","desc":"Revenue excluding rows whose tracking estimate methodology is N/A (tracking_est_methodology_key = 0). Distinct from natl_comm_revenue_tracked, which pairs the same exclusion with a buy_type_key = 12 (National Commercial) filter \u2014 this one has no buy-type restriction, needed by \"Sponsorship - Linear Revenue Data\" (scopes to unit_type_group_key = 1 at query time instead). Kept separate rather than merged, since the two answer different questions and merging would silently change one of them.","cube":"cube_carl_dwhprd_gold_invoice_revenue_fact","member":"revenue_tracked"},{"type":"dimension","name":"sub_account","title":"Sub Account","dtype":"string","desc":"Sub-account name or identifier within the account.","cube":"cube_carl_dwhprd_gold_account_dim","member":"sub_account"},{"type":"dimension","name":"adv_id","title":"Advertiser ID","dtype":"number","desc":"Business identifier for the advertiser from the source system.","cube":"cube_carl_dwhprd_gold_advertiser_dim","member":"adv_id"},{"type":"dimension","name":"adv_name","title":"Advertiser","dtype":"string","desc":"The legal or business name of the advertiser.","cube":"cube_carl_dwhprd_gold_advertiser_dim","member":"adv_name"},{"type":"dimension","name":"adv_name_id","title":"Advertiser (ID)","dtype":"string","desc":"Advertiser name with its business ID suffixed in parentheses, e.g. \"ABBOTT DIABETES CARE (12268)\" \u2014 reproduces MicroStrategy's display format exactly. Confirmed live in MSTR's own generated SQL (`\"ADV_NAME\"||' ('||\"ADV_ID\"||')' \"ADV_NAME\"`), which concatenates the same two fields already modeled separately here (adv_name, adv_id).","cube":"cube_carl_dwhprd_gold_advertiser_dim","member":"adv_name_id"},{"type":"dimension","name":"adv_reporting_parent","title":"Advertiser Parent","dtype":"string","desc":"Identifier for the parent advertiser entity used for consolidated reporting purposes.","cube":"cube_carl_dwhprd_gold_advertiser_dim","member":"adv_reporting_parent"},{"type":"dimension","name":"adv_default_prod_cat_key","title":"Advertiser Primary Product Category (ID)","dtype":"number","desc":"Foreign key reference to the default product category dimension for this advertiser.","cube":"cube_carl_dwhprd_gold_advertiser_dim","member":"adv_default_prod_cat_key"},{"type":"dimension","name":"adv_default_prod_cat_name","title":"Advertiser Primary Product Category","dtype":"string","desc":"The advertiser's standing product category, i.e. the category on the product referenced by advertiser_dim.adv_default_prod_cat_key. This is not the category of the product sold on the transaction \u2014 for that use cube_carl_dwhprd_gold_product_dim.prod_cat_name.","cube":"cube_carl_dwhprd_gold_adv_default_product_dim","member":"prod_cat_name"},{"type":"dimension","name":"brand_name","title":"Brand","dtype":"string","desc":"Name of the brand (e.g. a movie-studio campaign name, or \"Various\" placeholder).","cube":"cube_carl_dwhprd_gold_brand_dim","member":"brand_name"},{"type":"dimension","name":"buy_type_desc","title":"Buy Type","dtype":"string","desc":"Human-readable description of the purchase type.","cube":"cube_carl_dwhprd_gold_buy_type_dim","member":"buy_type_desc"},{"type":"dimension","name":"buy_type_sales_group_desc","title":"Sales Group","dtype":"string","desc":"Description of the sales group associated with this purchase type.","cube":"cube_carl_dwhprd_gold_buy_type_dim","member":"buy_type_sales_group_desc"},{"type":"dimension","name":"buying_agency_id","title":"Buying Agency ID","dtype":"number","desc":"Business identifier for the buying agency from the source system.","cube":"cube_carl_dwhprd_gold_buying_agency_dim","member":"buying_agency_id"},{"type":"dimension","name":"buying_agency_name","title":"Buying Agency","dtype":"string","desc":"Official name of the buying agency.","cube":"cube_carl_dwhprd_gold_buying_agency_dim","member":"buying_agency_name"},{"type":"dimension","name":"buying_agency_name_id","title":"Buying Agency (ID)","dtype":"string","desc":"Buying agency name with its business ID suffixed in parentheses, e.g. \"SPARK FOUNDRY-CHI (5848)\" \u2014 reproduces MicroStrategy's display format exactly. Confirmed live in MSTR's own generated SQL (`\"BUYING_AGENCY_NAME\"||' ('||\"BUYING_AGENCY_ID\"||')' \"BUYING_AGENCY_NAME\"`), which concatenates the same two fields already modeled separately here (buying_agency_name, buying_agency_id).","cube":"cube_carl_dwhprd_gold_buying_agency_dim","member":"buying_agency_name_id"},{"type":"dimension","name":"buying_agency_state","title":"Buying Agency State","dtype":"string","desc":"State or province where the buying agency is located.","cube":"cube_carl_dwhprd_gold_buying_agency_dim","member":"buying_agency_state"},{"type":"dimension","name":"buying_agency_country_code","title":"Buying Agency Country Code","dtype":"string","desc":"Country code where the buying agency operates.","cube":"cube_carl_dwhprd_gold_buying_agency_dim","member":"buying_agency_country_code"},{"type":"dimension","name":"buying_agency_reporting_parent","title":"Buying Agency Parent","dtype":"string","desc":"Identifier of the parent agency for reporting hierarchy purposes.","cube":"cube_carl_dwhprd_gold_buying_agency_dim","member":"buying_agency_reporting_parent"},{"type":"dimension","name":"buying_mega_agency_id","title":"Buying Mega Agency (ID)","dtype":"number","desc":"Identifier for the mega agency (parent organization) to which this buying agency belongs.","cube":"cube_carl_dwhprd_gold_buying_agency_dim","member":"buying_mega_agency_id"},{"type":"dimension","name":"buying_mega_agency_name","title":"Buying Mega Agency","dtype":"string","desc":"Name of the mega agency (parent organization) to which this buying agency belongs.","cube":"cube_carl_dwhprd_gold_buying_agency_dim","member":"buying_mega_agency_name"},{"type":"dimension","name":"deal_type_desc","title":"Deal Type","dtype":"string","desc":"Text description of the deal type or category.","cube":"cube_carl_dwhprd_gold_deal_dim","member":"deal_type_desc"},{"type":"dimension","name":"deal_year","title":"Deal Year","dtype":"number","desc":"Fiscal or calendar year associated with the deal.","cube":"cube_carl_dwhprd_gold_deal_dim", e query grain; summing Gross Revenue at coarser grain while this path is joined still inflates revenue. MSTR multiplies pre-aggregated revenue and fraction \u2014 validate parity.","cube":"cube_carl_dwhprd_gold_invoice_team_ae_bridge","member":"fraction"},{"type":"dimension","name":"sales_team_member_key","title":"Sales Team Member Key","dtype":"number","desc":"Part of bridge grain; foreign key to sales_team_member_dim.","cube":"cube_carl_dwhprd_gold_invoice_team_ae_bridge","member":"sales_team_member_key"},{"type":"dimension","name":"coverage_team_member_label","title":"Account Coverage Team Member","dtype":"string","desc":"Display label for the coverage team member (MSTR CustCol_11: last, first (role)).","cube":"cube_carl_dwhprd_gold_acct_cov_team_member_dim","member":"coverage_team_member_label"},{"type":"dimension","name":"acct_cov_team_member_key","title":"Account Coverage Team Member Key","dtype":"number","desc":"Surrogate key for each account coverage team member.","cube":"cube_carl_dwhprd_gold_acct_cov_team_member_dim","member":"acct_cov_team_member_key"},{"type":"dimension","name":"sales_team_member_name","title":"Sales Team Member","dtype":"string","desc":"Display name (MSTR CustCol_16).","cube":"cube_carl_dwhprd_gold_sales_team_member_dim","member":"sales_team_member_name"},{"type":"dimension","name":"sales_team_name","title":"Sales Team Name","dtype":"string","desc":"Name of the sales team.","cube":"cube_carl_dwhprd_gold_sales_office_team_dim","member":"sales_team_name"},{"type":"dimension","name":"sales_office_name","title":"Sales Office Name","dtype":"string","desc":"Name of the sales office.","cube":"cube_carl_dwhprd_gold_sales_office_team_dim","member":"sales_office_name"}]},{"domain":"Lumos (DWH gold \u2013 linear ad sales, finance, intl, content)","name":"finance_view_invoice_revenue_fact","title":"Finance \u2014 Invoice Revenue Fact","business":"finance","base":"dwhprd_gold.invoice_revenue_fact","measures":21,"dims":90,"joins":36,"access":"No","desc":"Business view for finance on invoice_revenue_fact.","file":"model/efs/Lumos/views/invoice_revenue_fact/finance_view_invoice_revenue_fact.yaml","status":"deployed","fields":[{"type":"measure","name":"acm_hh_cpm","title":"ACM HH CPM","dtype":"number","desc":"Revenue per thousand ACM household impressions. MSTR defines it as Revenue / [ACM HH Estimated Imps], and defines that denominator as Sum([Booked ACM HH Estimated Imps]) / 1000.","cube":"cube_carl_dwhprd_gold_invoice_revenue_fact","member":"acm_hh_cpm"},{"type":"measure","name":"acm_hh_imps_000","title":"ACM HH Estimated Impressions (Thousands)","dtype":"sum","desc":"Household estimated impressions multiplied by number of spots, divided by 1,000 for ACM data. Aggregated as a sum across all rows.","cube":"cube_carl_dwhprd_gold_invoice_revenue_fact","member":"acm_hh_imps_000"},{"type":"measure","name":"acm_net_corp_imps_000","title":"ACM Net Corp Impressions (Thousands)","dtype":"sum","desc":"ACM net corporate estimated impressions multiplied by number of spots, divided by 1000.","cube":"cube_carl_dwhprd_gold_invoice_revenue_fact","member":"acm_net_corp_imps_000"},{"type":"measure","name":"as_sold_unequiv_rate","title":"As Sold Unequiv Rate","dtype":"sum","desc":"Sum of as-sold unit rates.","cube":"cube_carl_dwhprd_gold_invoice_revenue_fact","member":"as_sold_unequiv_rate"},{"type":"measure","name":"avg_equiv30_unit_rate","title":"Avg Equiv :30 Unit Rate","dtype":"number","desc":"Revenue per equivalent :30 unit. MSTR defines it elsewhere as Avg Equiv30 Revenue, computed as Revenue / [Equiv30 Spots] \u2014 exactly this. A metric named Avg Equiv :30 Unit Rate elsewhere is assumed to be the same computation, though no formula was available to confirm it there. Distinct from as_sold_unequiv_rate, which sums the rate on each row rather than deriving one.","cube":"cube_carl_dwhprd_gold_invoice_revenue_fact","member":"avg_equiv30_unit_rate"},{"type":"dimension","name":"buy_type_key","title":"Buy Type Key","dtype":"number","desc":"Foreign key joining invoice_revenue_fact to buy_type_dim. This column holds the surrogate key only; the readable labels are columns on buy_type_dim. Filtered on directly downstream, because MSTR emits key literals rather than names.","cube":"cube_carl_dwhprd_gold_invoice_revenue_fact","member":"buy_type_key"},{"type":"dimension","name":"deal_revenue_snapshot_key","title":"Deal Revenue Snapshot Key","dtype":"number","desc":"Foreign key joining invoice_revenue_fact to deal_revenue_snapshot_dim. This column holds the surrogate key only; the readable labels are columns on deal_revenue_snapshot_dim. Filtered on directly downstream, because MSTR emits key literals rather than names.","cube":"cube_carl_dwhprd_gold_invoice_revenue_fact","member":"deal_revenue_snapshot_key"},{"type":"dimension","name":"episode_version_key","title":"Episode Version Key","dtype":"number","desc":"Foreign key joining invoice_revenue_fact to episode_version_dim. This column holds the surrogate key only; the readable labels are columns on episode_version_dim. Filtered on directly downstream, because MSTR emits key literals rather than names.","cube":"cube_carl_dwhprd_gold_invoice_revenue_fact","member":"episode_version_key"},{"type":"measure","name":"eqv30_spots","title":"Equiv30 Spots","dtype":"sum","desc":"Sum of equivalent 30-second spots.","cube":"cube_carl_dwhprd_gold_invoice_revenue_fact","member":"eqv30_spots"},{"type":"measure","name":"guar_target_cpm","title":"Guar/Target CPM","dtype":"number","desc":"Revenue per thousand guaranteed or target demographic impressions. MSTR defines it as Revenue / [Guar/Target Estimated Impressions], and defines that denominator as Sum([Booked Guar/Target Estimated Imps]) / 1000. MSTR leaves the metric itself unnamed \u2014 it is literally called New Metric \u2014 so the name here is ours.","cube":"cube_carl_dwhprd_gold_invoice_revenue_fact","member":"guar_target_cpm"},{"type":"dimension","name":"guar_target_demo_key","title":"Guarantee Target Demographic Key","dtype":"number","desc":"Foreign key joining invoice_revenue_fact to demographics_dim. This column holds the surrogate key only; the readable labels are columns on demographics_dim. Filtered on directly downstream, because MSTR emits key literals rather than names.","cube":"cube_carl_dwhprd_gold_invoice_revenue_fact","member":"guar_target_demo_key"},{"type":"measure","name":"guar_target_imps_000","title":"Guaranteed Target Estimated Impressions (Thousands)","dtype":"sum","desc":"Sum of guaranteed target estimated impressions multiplied by number of spots, expressed in thousands. Calculated by multiplying impressions by spot count and dividing by 1000.","cube":"cube_carl_dwhprd_gold_invoice_revenue_fact","member":"guar_target_imps_000"},{"type":"measure","name":"hh_imps_000","title":"HH Estimated Impressions (Thousands)","dtype":"sum","desc":"Household estimated impressions multiplied by number of spots, divided by 1,000. Aggregated as a sum across all rows.","cube":"cube_carl_dwhprd_gold_invoice_revenue_fact","member":"hh_imps_000"},{"type":"dimension","name":"market_key","title":"Market Key","dtype":"number","desc":"Foreign key joining invoice_revenue_fact to market_dim. This column holds the surrogate key only; the readable labels are columns on market_dim. Filtered on directly downstream, because MSTR emits key literals rather than names.","cube":"cube_carl_dwhprd_gold_invoice_revenue_fact","member":"market_key"},{"type":"measure","name":"natl_comm_acm_net_corp_cpm","title":"ACM Net Corp CPM (National Commercial)","dtype":"number","desc":"UNVERIFIED \u2014 confirm with finance before quoting this number. MSTR defines it as [Revenue - Post ACM/National Commercial] / [ACM Net Corp Estimated Impressions], mixing a filtered numerator (national commercial revenue, only rows carrying a tracking methodology) with an UNFILTERED denominator. MSTR names the national-commercial variant explicitly elsewhere and not here, so this may be an authoring slip \u2014 the two readings give 17.4417 against 20.0368.","cube":"cube_carl_dwhprd_gold_invoice_revenue_fact","member":"natl_comm_acm_net_corp_cpm"},{"type":"measure","name":"natl_comm_acm_net_corp_imps_000","title":"ACM Net Corp Impressions (National Commercial, Thousands)","dtype":"sum","desc":"ACM net corporate estimated impressions multiplied by number of spots, in thousands, for National Commercial buys.","cube":"cube_carl_dwhprd_gold_invoice_revenue_fact","member":"natl_comm_acm_net_corp_imps_000"},{"type":"measure","name":"natl_comm_pal_net_corp_cpm","title":"PAL Net Corp CPM (National Commercial)","dtype":"number","desc":"National commercial revenue per thousand PAL net corp impressions. MSTR defines it as [Revenue - National Commercial] / [PAL Net Corp Estimated Impressions - National Commercial]; both sides filter to buy type 12, so the ratio stays within national commercial. No multiply by 1000 is needed because the denominator is already in thousands.","cube":"cube_carl_dwhprd_gold_invoice_revenue_fact","member":"natl_comm_pal_net_corp_cpm"},{"type":"measure","name":"natl_comm_pal_net_corp_imps_000","title":"PAL Net Corp Impressions (National Commercial, Thousands)","dtype":"sum","desc":"PAL net corporate estimated impressions multiplied by number of spots, in thousands, for National Commercial buys.","cube":"cube_carl_dwhprd_gold_invoice_revenue_fact","member":"natl_comm_pal_net_corp_imps_000"},{"type":"measure","name":"natl_comm_revenue","title":"National Commercial Revenue","dtype":"sum","desc":"Revenue for National Commercial buys.","cube":"cube_carl_dwhprd_gold_invoice_revenue_fact","member":"natl_comm_revenue"},{"type":"measure","name":"natl_comm_revenue_tracked","title":"National Commercial Revenue (Tracked Methodology Only)","dtype":"sum","desc":"Revenue for National Commercial buys, excluding rows whose tracking estimate methodology is N/A. Compare natl_comm_revenue, which includes them.","cube":"cube_carl_dwhprd_gold_invoice_revenue_fact","member":"natl_comm_revenue_tracked"},{"type":"measure","name":"net_corp_cpm","title":"Net Corp CPM","dtype":"number","desc":"Revenue per thousand net corp impressions. MSTR calls it corp cpm and defines it as Revenue / [Net Corp Estimated Imps], with that denominator defined as Sum(same) / 1000 \u2014 exactly this pair, so no multiply by 1000 is needed. One question stays open, narrower than the formula \u2014 whether [Net Corp Estimated Imps] means the plain impressions column or the ACM one. They land 0.6% apart.","cube":"cube_carl_dwhprd_gold_invoice_revenue_fact","member":"net_corp_cpm"},{"type":"measure","name":"net_corp_imps_000","title":"Net Corp Impressions (Thousands)","dtype":"sum","desc":"Net corporate estimated impressions multiplied by number of spots, divided by 1000.","cube":"cube_carl_dwhprd_gold_invoice_revenue_fact","member":"net_corp_imps_000"},{"type":"dimension","name":"network_key","title":"Network Key","dtype":"number","desc":"Foreign key joining invoice_revenue_fact to network_dim. This column holds the surrogate key only; the readable labels are columns on network_dim. Filtered on directly downstream, because MSTR emits key literals rather than names.","cube":"cube_carl_dwhprd_gold_invoice_revenue_fact","member":"network_key"},{"type":"dimension","name":"product_key","title":"Product Key","dtype":"number","desc":"Foreign key joining invoice_revenue_fact to product_dim. This column holds the surrogate key only; the readable labels are columns on product_dim. Filtered on directly downstream, because MSTR emits key literals rather than names.","cube":"cube_carl_dwhprd_gold_invoice_revenue_fact","member":"product_key"},{"type":"dimension","name":"program_key","title":"Program Key","dtype":"number","desc":"Foreign key joining invoice_revenue_fact to program_dim. This column holds the surrogate key only; the readable labels are columns on program_dim. Filtered on directly downstream, because MSTR emits key literals rather than names.","cube":"cube_carl_dwhprd_gold_invoice_revenue_fact","member":"program_key"},{"type":"dimension","name":"property_key","title":"Property Key","dtype":"number","desc":"Foreign key joining invoice_revenue_fact to property_dim. This column holds the surrogate key only; the readable labels are columns on property_dim. Filtered on directly downstream, because MSTR emits key literals rather than names.","cube":"cube_carl_dwhprd_gold_invoice_revenue_fact","member":"property_key"},{"type":"measure","name":"ratecard_pct","title":"% of Ratecard","dtype":"number","desc":"As-sold unequivalised rate over ratecard unequivalised rate. MSTR defines this as [As Sold Unequiv Rate] / [RateCard Unequiv Rate], which is exactly this. A ratio of two sums rather than a sum of ratios \u2014 dividing after aggregation is what MSTR does, and the two disagree at any grain coarser than a row.","cube":"cube_carl_dwhprd_gold_invoice_revenue_fact","member":"ratecard_pct"},{"type":"measure","name":"ratecard_unequiv_rate","title":"Ratecard Unequiv Rate","dtype":"sum","desc":"Sum of ratecard unit rates.","cube":"cube_carl_dwhprd_gold_invoice_revenue_fact","member":"ratecard_unequiv_rate"},{"type":"dimension","name":"rateclass_key","title":"Rateclass Key","dtype":"number","desc":"Foreign key joining invoice_revenue_fact to rateclass_dim. This column holds the surrogate key only; the readable labels are columns on rateclass_dim. Filtered on directly downstream, because MSTR emits key literals rather than names.","cube":"cube_carl_dwhprd_gold_invoice_revenue_fact","member":"rateclass_key"},{"type":"measure","name":"revenue","title":"Revenue","dtype":"sum","desc":"Total revenue summed across all transactions.","cube":"cube_carl_dwhprd_gold_invoice_revenue_fact","member":"revenue"},{"type":"dimension","name":"revenue_area_key","title":"Revenue Area Key","dtype":"number","desc":"Foreign key joining invoice_revenue_fact to revenue_area_dim. This column holds the surrogate key only; the readable labels are columns on revenue_area_dim. Filtered on directly downstream, because MSTR emits key literals rather than names.","cube":"cube_carl_dwhprd_gold_invoice_revenue_fact","member":"revenue_area_key"},{"type":"dimension","name":"revenue_eff_bcast_qtr_key","title":"Revenue Effective Broadcast Quarter Key","dtype":"number","desc":"Foreign key joining invoice_revenue_fact to revenue_eff_bcast_qtr_dim. This column holds the surrogate key only; the readable labels are columns on revenue_eff_bcast_qtr_dim. Filtered on directly downstream, because MSTR emits key literals rather than names.","cube":"cube_carl_dwhprd_gold_invoice_revenue_fact","member":"revenue_eff_bcast_qtr_key"},{"type":"dimension","name":"revenue_eff_cal_month_key","title":"Revenue Effective Calendar Month Key","dtype":"number","desc":"A calendar dimension table that provides a complete hierarchy of time periods for revenue analysis, including month, quarter, half-year, and year levels with associated dates and day counts. This table enables time-based aggregation and filtering across multiple calendar granularities.","cube":"cube_carl_dwhprd_gold_invoice_revenue_fact","member":"revenue_eff_cal_month_key"},{"type":"dimension","name":"revenue_eff_cal_qtr_key","title":"Revenue Effective Calendar Quarter Key","dtype":"number","desc":"Foreign key joining invoice_revenue_fact to revenue_eff_cal_qtr_dim. This column holds the surrogate key only; the readable labels are columns on revenue_eff_cal_qtr_dim. Filtered on directly downstream, because MSTR emits key literals rather than names.","cube":"cube_carl_dwhprd_gold_invoice_revenue_fact","member":"revenue_eff_cal_qtr_key"},{"type":"measure","name":"revenue_over_ratecard_rate","title":"Revenue over Ratecard Unequiv Rate","dtype":"number","desc":"UNVERIFIED \u2014 faithful to MSTR but probably not what its name suggests. Finance should say which formula was intended before this number is quoted. MSTR calls it rc% and defines it as Revenue / [RateCard Unequiv Rate], which is no percentage \u2014 dollars over a dollars-per-unit rate gives a unit count. ratecard_pct is the other reading, [As Sold Unequiv Rate] / [RateCard Unequiv Rate]. Registered as written so this reproduces MSTR faithfully.","cube":"cube_carl_dwhprd_gold_invoice_revenue_fact","member":"revenue_over_ratecard_rate"},{"type":"dimension","name":"revenue_effective_day_key","title":"Revenue Effective Date Key","dtype":"number","desc":"A comprehensive time dimension table that provides calendar and broadcast period attributes for revenue-related fact tables. It contains daily grain records with associated calendar hierarchies (day, week, month, quarter, year) and broadcast period hierarchies, plus holiday and competitive pressure indicators.","cube":"cube_carl_dwhprd_gold_invoice_revenue_fact","member":"revenue_effective_day_key"},{"type":"dimension","name":"unit_type_group_key","title":"Unit Type Group Key","dtype":"number","desc":"Foreign key joining invoice_revenue_fact to unit_type_group_dim. This column holds the surrogate key only; the readable labels are columns on unit_type_group_dim. Filtered on directly downstream, because MSTR emits key literals rather than names.","cube":"cube_carl_dwhprd_gold_invoice_revenue_fact","member":"unit_type_group_key"},{"type":"dimension","name":"unit_type_key","title":"Unit Type Key","dtype":"number","desc":"Foreign key joining invoice_revenue_fact to unit_type_dim. This column holds the surrogate key only; the readable labels are columns on unit_type_dim. Filtered on directly downstream, because MSTR emits key literals rather than names.","cube":"cube_carl_dwhprd_gold_invoice_revenue_fact","member":"unit_type_key"},{"type":"dimension","name":"act_air_daypart_day_time_name","title":"Actual Aired Daytime Daypart","dtype":"string","desc":"Human-readable name describing the daypart's day and time characteristics.","cube":"cube_carl_dwhprd_gold_actual_air_daypart_dim","member":"act_air_daypart_day_time_name"},{"type":"dimension","name":"act_air_daypart_sell
