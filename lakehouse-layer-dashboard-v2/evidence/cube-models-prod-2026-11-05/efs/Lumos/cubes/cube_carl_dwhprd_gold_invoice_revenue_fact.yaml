        relationship: many_to_one
      - name: cube_carl_dwhprd_gold_log_status_dim
        sql: '{CUBE}.log_status_key = {cube_carl_dwhprd_gold_log_status_dim}.log_status_key'
        relationship: many_to_one
      - name: cube_carl_dwhprd_gold_isci_code_dim
        sql: '{CUBE}.isci_code_key = {cube_carl_dwhprd_gold_isci_code_dim}.isci_code_key'
        relationship: many_to_one
      - name: cube_carl_dwhprd_gold_planning_agency_dim
        sql: '{CUBE}.planning_agency_key = {cube_carl_dwhprd_gold_planning_agency_dim}.planning_agency_key'
        relationship: many_to_one
    measures:
      - name: record_count
        sql: '*'
        type: count
        title: Record Count
        description: Row count for smoke queries.
        meta:
          source: generated
          used_by_report_ids: []
      - name: acm_net_corp_imps_000
        sql: (CAST(({CUBE}.acm_net_corp_estimated_imps * {CUBE}.num_of_spots) AS DOUBLE) / 1000.0)
        type: sum
        title: ACM Net Corp Impressions (Thousands)
        description: ACM net corporate estimated impressions multiplied by number of spots, divided by 1000.
      - name: acm_hh_imps_000
        sql: ({CUBE}.acm_hh_estimated_imps * {CUBE}.num_of_spots) / 1000.0
        type: sum
        title: ACM HH Estimated Impressions (Thousands)
        description: >-
          Household estimated impressions multiplied by number of spots, divided by 1,000 for ACM data. Aggregated as a sum
          across all rows.
      - name: natl_comm_acm_net_corp_imps_000
        sql: >-
          (CAST((CASE WHEN {CUBE}.buy_type_key IN (12) THEN ({CUBE}.acm_net_corp_estimated_imps * {CUBE}.num_of_spots) ELSE
          NULL END) AS DOUBLE) / 1000.0)
        type: sum
        title: ACM Net Corp Impressions (National Commercial, Thousands)
        description: ACM net corporate estimated impressions multiplied by number of spots, in thousands, for National Commercial
          buys.
      - name: as_sold_unequiv_rate
        sql: '{CUBE}.as_sold_unit_rate'
        type: sum
        title: As Sold Unequiv Rate
        description: Sum of as-sold unit rates.
      - name: natl_comm_revenue_tracked
        sql: >-
          (CASE WHEN {CUBE}.buy_type_key IN (12) THEN CASE WHEN {CUBE}.tracking_est_methodology_key = 0 THEN NULL ELSE {CUBE}.revenue
          END ELSE NULL END)
        type: sum
        title: National Commercial Revenue (Tracked Methodology Only)
        description: >-
          Revenue for National Commercial buys, excluding rows whose tracking estimate methodology is N/A. Compare natl_comm_revenue,
          which includes them.
      - name: natl_comm_revenue
        sql: (CASE WHEN {CUBE}.buy_type_key IN (12) THEN {CUBE}.revenue ELSE NULL END)
        type: sum
        title: National Commercial Revenue
        description: Revenue for National Commercial buys.
      - name: eqv30_spots
        sql: '{CUBE}.eqv30_spots'
        type: sum
        title: Equiv30 Spots
        description: Sum of equivalent 30-second spots.
      - name: number_of_spots
        sql: '{CUBE}.num_of_spots'
        type: sum
        title: Number of Spots
        description: Sum of the raw (non-equivalized) number of spots.
      - name: guar_target_imps_000
        sql: ({CUBE}.guar_target_estimated_imps * {CUBE}.num_of_spots) / 1000.0
        type: sum
        title: Guaranteed Target Estimated Impressions (Thousands)
        description: >-
          Sum of guaranteed target estimated impressions multiplied by number of spots, expressed in thousands. Calculated
          by multiplying impressions by spot count and dividing by 1000.
      - name: hh_imps_000
        sql: ({CUBE}.hh_estimated_imps * {CUBE}.num_of_spots) / 1000.0
        type: sum
        title: HH Estimated Impressions (Thousands)
        description: Household estimated impressions multiplied by number of spots, divided by 1,000. Aggregated as a sum
          across all rows.
      - name: net_corp_imps_000
        sql: (CAST(({CUBE}.net_corp_estimated_imps * {CUBE}.num_of_spots) AS DOUBLE) / 1000.0)
        type: sum
        title: Net Corp Impressions (Thousands)
        description: Net corporate estimated impressions multiplied by number of spots, divided by 1000.
      - name: pal_net_corp_imps_000
        sql: (CAST(({CUBE}.pal_net_corp_estimated_imps * {CUBE}.num_of_spots) AS DOUBLE) / 1000.0)
        type: sum
        title: PAL Net Corp Impressions (Thousands)
        description: >-
          PAL net corporate estimated impressions multiplied by number of spots, divided by 1000. Unconditioned
          counterpart of natl_comm_pal_net_corp_imps_000, same pattern as acm_net_corp_imps_000 vs
          natl_comm_acm_net_corp_imps_000. Feeds pal_net_corp_cpm below.
      - name: natl_comm_pal_net_corp_imps_000
        sql: >-
          (CAST((CASE WHEN {CUBE}.buy_type_key IN (12) THEN ({CUBE}.pal_net_corp_estimated_imps * {CUBE}.num_of_spots) ELSE
          NULL END) AS DOUBLE) / 1000.0)
        type: sum
        title: PAL Net Corp Impressions (National Commercial, Thousands)
        description: PAL net corporate estimated impressions multiplied by number of spots, in thousands, for National Commercial
          buys.
      - name: ecm_net_corp_imps_000
        sql: (CAST(({CUBE}.ecm_net_corp_estimated_imps * {CUBE}.num_of_spots) AS DOUBLE) / 1000.0)
        type: sum
        title: ECM Net Corp Impressions (Thousands)
        description: >-
          ECM net corporate estimated impressions multiplied by number of spots, divided by 1000. Same pattern as
          acm_net_corp_imps_000/pal_net_corp_imps_000; ecm_net_corp_estimated_imps confirmed present on
          the ingested invoice_revenue_fact table (2026-08-31), no ingestion needed. Feeds ecm_net_corp_cpm below.
      - name: natl_comm_ecm_net_corp_imps_000
        sql: >-
          (CAST((CASE WHEN {CUBE}.buy_type_key IN (12) THEN ({CUBE}.ecm_net_corp_estimated_imps * {CUBE}.num_of_spots) ELSE
          NULL END) AS DOUBLE) / 1000.0)
        type: sum
        title: ECM Net Corp Impressions (National Commercial, Thousands)
        description: >-
          ECM net corporate estimated impressions multiplied by number of spots, in thousands, for National Commercial
          buys. Same pattern as natl_comm_acm_net_corp_imps_000/natl_comm_pal_net_corp_imps_000.
          Feeds natl_comm_ecm_net_corp_cpm below (the ACM/PAL siblings of that measure already existed as
          natl_comm_acm_net_corp_cpm/natl_comm_pal_net_corp_cpm).
      - name: ratecard_unequiv_rate
        sql: '{CUBE}.ratecard_unit_rate'
        type: sum
        title: Ratecard Unequiv Rate
        description: Sum of ratecard unit rates.
      - name: revenue
        sql: '{CUBE}.revenue'
        type: sum
        title: Revenue
        description: Total revenue summed across all transactions.
      - name: ratecard_pct
        sql: CAST({as_sold_unequiv_rate} AS DOUBLE) / NULLIF({ratecard_unequiv_rate}, 0)
        type: number
        title: '% of Ratecard'
        description: >-
          As-sold unequivalised rate over ratecard unequivalised rate. MSTR defines this as [As Sold Unequiv Rate] /
          [RateCard Unequiv Rate], which is exactly this. A ratio of two sums rather than a sum
          of ratios — dividing after aggregation is what MSTR does, and the two disagree at any grain coarser than a row.
      - name: net_corp_cpm
        sql: CAST({revenue} AS DOUBLE) / NULLIF({net_corp_imps_000}, 0)
        type: number
        title: Net Corp CPM
        description: >-
          Revenue per thousand net corp impressions. MSTR calls it corp cpm and defines it as Revenue / [Net Corp
          Estimated Imps], with that denominator defined as Sum(same) / 1000 — exactly this pair,
          so no multiply by 1000 is needed. One question stays open, narrower than the formula — whether [Net Corp Estimated
          Imps] means the plain impressions column or the ACM one. They land 0.6% apart.
      - name: guar_target_cpm
        sql: CAST({revenue} AS DOUBLE) / NULLIF({guar_target_imps_000}, 0)
        type: number
        title: Guar/Target CPM
        description: >-
          Revenue per thousand guaranteed or target demographic impressions. MSTR defines it as Revenue / [Guar/Target
          Estimated Impressions], and defines that denominator as Sum([Booked Guar/Target Estimated Imps]) / 1000. MSTR
          leaves the metric itself unnamed — it is literally called New Metric — so the name here is ours.
      - name: acm_hh_cpm
        sql: CAST({revenue} AS DOUBLE) / NULLIF({acm_hh_imps_000}, 0)
        type: number
        title: ACM HH CPM
        description: >-
          Revenue per thousand ACM household impressions. MSTR defines it as Revenue / [ACM HH Estimated Imps], and
          defines that denominator as Sum([Booked ACM HH Estimated Imps]) / 1000.
      - name: revenue_over_ratecard_rate
        sql: CAST({revenue} AS DOUBLE) / NULLIF({ratecard_unequiv_rate}, 0)
        type: number
        title: Revenue over Ratecard Unequiv Rate
        description: >-
          UNVERIFIED — faithful to MSTR but probably not what its name suggests. Finance should say which formula was intended
          before this number is quoted. MSTR calls it rc% and defines it as Revenue / [RateCard Unequiv
          Rate], which is no percentage — dollars over a dollars-per-unit rate gives a unit count. ratecard_pct is the other
          reading, [As Sold Unequiv Rate] / [RateCard Unequiv Rate]. Registered as written so this reproduces MSTR faithfully.
      - name: potential_cancelable_revenue
        sql: '{CUBE}.potential_cancelable_dollars'
        type: sum
        title: Potential Cancellable Revenue
        description: Sum of potential cancelable dollars — revenue at risk of cancellation under deal cutback terms.
      - name: agency_commission
        sql: '{CUBE}.revenue * {CUBE}.agency_commission_pct'
        type: sum
        title: Agency Commission
        description: Revenue multiplied by the row-level agency commission percentage, summed.
      - name: net_revenue
        sql: '{CUBE}.revenue - ({CUBE}.revenue * {CUBE}.agency_commission_pct)'
        type: sum
        title: Net Revenue
        description: Gross revenue less agency commission, summed.
      - name: commission_pct
        sql: CAST({net_revenue} AS DOUBLE) / NULLIF({revenue}, 0)
        type: number
        title: Commission %
        description: >-
          Net Revenue over Gross Revenue. MSTR defines "commission" as the Net Revenue measure divided by the
          Gross Revenue measure — a ratio of two sums, not a sum of row-level ratios.
      - name: avg_equiv30_unit_rate
        sql: CAST({revenue} AS DOUBLE) / NULLIF({eqv30_spots}, 0)
        type: number
        title: Avg Equiv :30 Unit Rate
        description: >-
          Revenue per equivalent :30 unit. MSTR defines it elsewhere as Avg Equiv30 Revenue, computed as Revenue /
          [Equiv30 Spots] — exactly this. A metric named Avg Equiv :30 Unit Rate elsewhere is assumed to be the same
          computation, though no formula was available to confirm it there. Distinct from as_sold_unequiv_rate,
          which sums the rate on each row rather than deriving one.
      - name: natl_comm_pal_net_corp_cpm
        sql: CAST({natl_comm_revenue} AS DOUBLE) / NULLIF({natl_comm_pal_net_corp_imps_000}, 0)
        type: number
        title: PAL Net Corp CPM (National Commercial)
        description: >-
          National commercial revenue per thousand PAL net corp impressions. MSTR defines it as [Revenue - National Commercial]
          / [PAL Net Corp Estimated Impressions - National Commercial]; both sides filter to buy type 12, so the ratio stays
          within national commercial. No multiply by 1000 is needed because the denominator is already in thousands.
      - name: natl_comm_acm_net_corp_cpm
        sql: CAST({natl_comm_revenue_tracked} AS DOUBLE) / NULLIF({acm_net_corp_imps_000}, 0)
        type: number
        title: ACM Net Corp CPM (National Commercial)
        description: >-
          UNVERIFIED — confirm with finance before quoting this number. MSTR defines it as [Revenue - Post ACM/National Commercial]
          / [ACM Net Corp Estimated Impressions], mixing a filtered numerator (national commercial revenue, only rows carrying
          a tracking methodology) with an UNFILTERED denominator. MSTR names the national-commercial variant explicitly elsewhere
          and not here, so this may be an authoring slip — the two readings give 17.4417 against 20.0368.
      - name: natl_comm_ecm_net_corp_cpm
        sql: CAST({natl_comm_revenue} AS DOUBLE) / NULLIF({natl_comm_ecm_net_corp_imps_000}, 0)
        type: number
        title: ECM Net Corp CPM (National Commercial)
        description: >-
          The ECM sibling of natl_comm_pal_net_corp_cpm above, same formula shape — national commercial
          revenue over national commercial ECM net corp impressions, both sides filtered to buy type 12. Completes the
          "PAL/ACM/ECM Net Corp Estimated CPM - National Commercial" trio; ACM/PAL existed already, this was the
          missing one.
      - name: pal_net_corp_cpm
        sql: CAST({revenue} AS DOUBLE) / NULLIF({pal_net_corp_imps_000}, 0)
        type: number
        title: PAL Net Corp CPM
        description: >-
          Unconditioned PAL counterpart of net_corp_cpm above (revenue over PAL net corp impressions,
          no buy-type filter), same relationship natl_comm_pal_net_corp_cpm has to its National-Commercial-filtered inputs.
      - name: ecm_net_corp_cpm
        sql: CAST({revenue} AS DOUBLE) / NULLIF({ecm_net_corp_imps_000}, 0)
        type: number
        title: ECM Net Corp CPM
        description: >-
          Unconditioned ECM counterpart of net_corp_cpm above, same pattern as pal_net_corp_cpm.
      - name: current_booked_revenue
        sql: CASE WHEN {CUBE}.deal_revenue_snapshot_key IN (8) THEN {CUBE}.revenue ELSE NULL END
        type: sum
        title: Revenue - Current Booked
        description: >-
          MSTR "Revenue - Current Booked" used by CNNE Data, CNNI Revenue Detail, and CNNI Posted Spots: booked revenue
          restricted to Deal Revenue Snapshot Invoiced/Current Booked (key 8).
      - name: net_corp_actual_imps_000
        sql: '{CUBE}.net_corp_actual_imps / 1000.0'
        type: sum
        title: Net Corp Actual Impressions (Thousands)
        description: >-
          Net corporate ACTUAL impressions (net_corp_actual_imps), divided by 1000 — unlike its "_estimated"
          siblings (net_corp_imps_000 etc.), not multiplied by num_of_spots: it's already a per-row total, not
          a per-spot rate. No filter baked in; MSTR scoped this to unit_type_group_key = 1 ("Cash") for Net Corp
          Unit Actual CPM below — filter at query time via that dimension instead.
      - name: acm_guar_target_imps_000
        sql: ({CUBE}.acm_guar_target_estimated_imps * {CUBE}.num_of_spots) / 1000.0
        type: sum
        title: ACM Guar/Target Estimated Impressions (Thousands)
        description: >-
          ACM-specific counterpart of guar_target_imps_000 above, using acm_guar_target_estimated_imps instead
          of guar_target_estimated_imps, same multiply-by-spots-divide-by-1000 shape. No filter baked in; MSTR's
          export scoped this to guar_est_methodology_key = 2 AND unit_type_group_key = 1 when computing
          Guar/Target Estimated CPM - ACM Guar below — filter at query time via the existing
          guar_est_methodology_key/unit_type_group_key dimensions rather than here.
      - name: pal_guar_target_imps_000
        sql: >-
          (CASE WHEN {CUBE}.guar_est_methodology_key = 1 THEN {CUBE}.pal_guar_target_estimated_imps * {CUBE}.num_of_spots
          ELSE NULL END) / 1000.0
        type: sum
        title: Guar/Target Estimated Impressions - PAL Guar
        description: >-
          CARL-3025/CARL-3034. PAL guaranteed/target estimated impressions times number of spots, divided by 1000,
          only when guar_est_methodology_key = 1. The methodology test stays inside the measure so Revenue and Equiv30
          on the same query are not filtered to PAL rows. There is no Cash filter; the percent-of-demographic metric
          uses this unscoped total.
      - name: acm_guar_target_imps_000_tracking
        sql: >-
          (CASE WHEN {CUBE}.tracking_est_methodology_key = 2 THEN {CUBE}.acm_guar_target_estimated_imps * {CUBE}.num_of_spots
          ELSE NULL END) / 1000.0
        type: sum
        title: Guar/Target Estimated Impressions - ACM Tracking
        description: >-
          CARL-3025/CARL-3034. ACM guaranteed/target estimated impressions times number of spots, divided by 1000,
          only when tracking_est_methodology_key = 2. Distinct from acm_guar_target_imps_000, which has no methodology
          filter. The methodology test stays inside the measure so a query-level tracking filter does not also drop
          Revenue and Equiv30 on non-ACM-tracking rows.
      - name: acm_net_corp_cpm
        sql: CAST({revenue} AS DOUBLE) / NULLIF({acm_net_corp_imps_000}, 0)
        type: number
        title: ACM Net Corp CPM
        description: >-
          Unconditioned ACM counterpart of net_corp_cpm above (revenue over ACM net corp impressions, no
          buy-type filter), same relationship natl_comm_acm_net_corp_cpm has to its National-Commercial-filtered
          inputs — the missing unconditioned sibling, same gap pattern pal_net_corp_cpm/ecm_net_corp_cpm filled
          for their measures.
      - name: net_corp_actual_cpm
        sql: CAST({revenue} AS DOUBLE) / NULLIF({net_corp_actual_imps_000}, 0)
        type: number
        title: Net Corp Unit Actual CPM
        description: >-
          UNVERIFIED — inferred from MSTR's SQL trailer for "Sponsorship - Linear Revenue Data", which names
          this metric but doesn't spell out its formula. Revenue over net_corp_actual_imps_000, the same
          revenue-per-thousand-impressions shape every other _cpm measure on this cube uses. MSTR scoped both
          sides to unit_type_group_key = 1 ("Cash") — apply that filter at query time; not baked in here so
          the measure stays reusable. Confirm with the report owner before treating as authoritative.
      - name: acm_guar_target_cpm
        sql: CAST({revenue} AS DOUBLE) / NULLIF({acm_guar_target_imps_000}, 0)
        type: number
        title: Guar/Target Estimated CPM - ACM Guar
        description: >-
          UNVERIFIED — inferred from MSTR's SQL trailer for "Sponsorship - Linear Revenue Data", which names
          this metric but doesn't spell out its formula. Revenue over acm_guar_target_imps_000, the ACM sibling
          of guar_target_cpm above. MSTR scoped both sides to guar_est_methodology_key = 2 AND
          unit_type_group_key = 1 — apply those filters at query time, same reusability reason as
          net_corp_actual_cpm. Confirm with the report owner before treating as authoritative.
      - name: revenue_tracked
        sql: (CASE WHEN {CUBE}.tracking_est_methodology_key = 0 THEN NULL ELSE {CUBE}.revenue END)
        type: sum
        title: Revenue (Tracked Methodology Only)
        description: >-
          Revenue excluding rows whose tracking estimate methodology is N/A (tracking_est_methodology_key = 0).
          Distinct from natl_comm_revenue_tracked, which pairs the same exclusion with a buy_type_key = 12
          (National Commercial) filter — this one has no buy-type restriction, needed by "Sponsorship - Linear
          Revenue Data" (scopes to unit_type_group_key = 1 at query time instead). Kept separate rather than
          merged, since the two answer different questions and merging would silently change one of them.
      # CARL-3034 CPM vs Upfront Pricing Data. The report returns Revenue, Equiv30, and every
      # PAL/ACM/ECM guar and tracking CPM in one query, so methodology and Cash filters stay inside
      # the measures. Snapshot 9 stays a query filter because the prompt selects one revenue status.
      - name: acm_guar_target_imps_000_guar
        sql: >-
          (CASE WHEN {CUBE}.guar_est_methodology_key = 2 THEN {CUBE}.acm_guar_target_estimated_imps * {CUBE}.num_of_spots
          ELSE NULL END) / 1000.0
        type: sum
        title: Guar/Target Estimated Impressions - ACM Guar
        description: >-
          CARL-3034. ACM guaranteed/target estimated impressions times spots, divided by 1000, only when
          guar_est_methodology_key = 2. Distinct from acm_guar_target_imps_000, which has no methodology filter.
      - name: ecm_guar_target_imps_000_guar
        sql: >-
          (CASE WHEN {CUBE}.guar_est_methodology_key = 3 THEN {CUBE}.ecm_guar_target_estimated_imps * {CUBE}.num_of_spots
          ELSE NULL END) / 1000.0
        type: sum
        title: Guar/Target Estimated Impressions - ECM Guar
        description: >-
          CARL-3034. ECM guaranteed/target estimated impressions times spots, divided by 1000, only when
          guar_est_methodology_key = 3.
      - name: pal_guar_target_imps_000_tracking
        sql: >-
          (CASE WHEN {CUBE}.tracking_est_methodology_key = 1 THEN {CUBE}.pal_guar_target_estimated_imps * {CUBE}.num_of_spots
          ELSE NULL END) / 1000.0
        type: sum
        title: Guar/Target Estimated Impressions - PAL Tracking
        description: >-
          CARL-3034. PAL guaranteed/target estimated impressions times spots, divided by 1000, only when
          tracking_est_methodology_key = 1.
      - name: ecm_guar_target_imps_000_tracking
        sql: >-
          (CASE WHEN {CUBE}.tracking_est_methodology_key = 3 THEN {CUBE}.ecm_guar_target_estimated_imps * {CUBE}.num_of_spots
          ELSE NULL END) / 1000.0
        type: sum
        title: Guar/Target Estimated Impressions - ECM Tracking
        description: >-
          CARL-3034. ECM guaranteed/target estimated impressions times spots, divided by 1000, only when
          tracking_est_methodology_key = 3.
      - name: cash_revenue
        sql: CASE WHEN {CUBE}.unit_type_group_key = 1 THEN {CUBE}.revenue ELSE NULL END
        type: sum
        title: Cash Revenue
        description: >-
          CARL-3034. Revenue for Cash unit types (unit_type_group_key = 1). Numerator of the Cash PAL, ACM,
          and ECM Net Corp CPMs. Distinct from revenue, which has no unit-type-group filter.
      - name: cash_revenue_pal_guar
        sql: >-
          CASE WHEN {CUBE}.unit_type_group_key = 1 AND {CUBE}.guar_est_methodology_key = 1 THEN {CUBE}.revenue
          ELSE NULL END
        type: sum
        title: Cash Revenue - PAL Guar
        description: >-
          CARL-3034. Cash revenue whose guaranteed estimate methodology is PAL (key 1). Numerator of
          Cash Guar/Target Estimated CPM - PAL Guar.
      - name: cash_revenue_acm_guar
        sql: >-
          CASE WHEN {CUBE}.unit_type_group_key = 1 AND {CUBE}.guar_est_methodology_key = 2 THEN {CUBE}.revenue
          ELSE NULL END
        type: sum
        title: Cash Revenue - ACM Guar
        description: >-
          CARL-3034. Cash revenue whose guaranteed estimate methodology is ACM (key 2). Numerator of
          Cash Guar/Target Estimated CPM - ACM Guar.
      - name: cash_revenue_ecm_guar
        sql: >-
          CASE WHEN {CUBE}.unit_type_group_key = 1 AND {CUBE}.guar_est_methodology_key = 3 THEN {CUBE}.revenue
          ELSE NULL END
        type: sum
        title: Cash Revenue - ECM Guar
        description: >-
          CARL-3034. Cash revenue whose guaranteed estimate methodology is ECM (key 3). Numerator of
          Cash Guar/Target Estimated CPM - ECM Guar.
      - name: cash_revenue_pal_tracking
        sql: >-
          CASE WHEN {CUBE}.unit_type_group_key = 1 AND {CUBE}.tracking_est_methodology_key = 1 THEN {CUBE}.revenue
          ELSE NULL END
        type: sum
        title: Cash Revenue - PAL Tracking
        description: >-
          CARL-3034. Cash revenue whose tracking estimate methodology is PAL (key 1). Numerator of
          Cash Guar/Target Estimated CPM - PAL Tracking.
      - name: cash_revenue_acm_tracking
        sql: >-
          CASE WHEN {CUBE}.unit_type_group_key = 1 AND {CUBE}.tracking_est_methodology_key = 2 THEN {CUBE}.revenue
          ELSE NULL END
        type: sum
        title: Cash Revenue - ACM Tracking
        description: >-
          CARL-3034. Cash revenue whose tracking estimate methodology is ACM (key 2). Numerator of
          Cash Guar/Target Estimated CPM - ACM Tracking.
      - name: cash_revenue_ecm_tracking
        sql: >-
          CASE WHEN {CUBE}.unit_type_group_key = 1 AND {CUBE}.tracking_est_methodology_key = 3 THEN {CUBE}.revenue
          ELSE NULL END
        type: sum
        title: Cash Revenue - ECM Tracking
        description: >-
          CARL-3034. Cash revenue whose tracking estimate methodology is ECM (key 3). Numerator of
          Cash Guar/Target Estimated CPM - ECM Tracking.
      - name: cash_pal_guar_target_imps_000
        sql: >-
          (CASE WHEN {CUBE}.unit_type_group_key = 1 AND {CUBE}.guar_est_methodology_key = 1
          THEN {CUBE}.pal_guar_target_estimated_imps * {CUBE}.num_of_spots ELSE NULL END) / 1000.0
        type: sum
        title: Cash Guar/Target Estimated Impressions - PAL Guar
        description: >-
          CARL-3034. Cash PAL guaranteed impressions in thousands. Denominator of Cash Guar/Target
          Estimated CPM - PAL Guar.
      - name: cash_acm_guar_target_imps_000_guar
        sql: >-
          (CASE WHEN {CUBE}.unit_type_group_key = 1 AND {CUBE}.guar_est_methodology_key = 2
          THEN {CUBE}.acm_guar_target_estimated_imps * {CUBE}.num_of_spots ELSE NULL END) / 1000.0
        type: sum
        title: Cash Guar/Target Estimated Impressions - ACM Guar
        description: >-
          CARL-3034. Cash ACM guaranteed impressions in thousands. Denominator of Cash Guar/Target
          Estimated CPM - ACM Guar.
      - name: cash_ecm_guar_target_imps_000_guar
        sql: >-
          (CASE WHEN {CUBE}.unit_type_group_key = 1 AND {CUBE}.guar_est_methodology_key = 3
          THEN {CUBE}.ecm_guar_target_estimated_imps * {CUBE}.num_of_spots ELSE NULL END) / 1000.0
        type: sum
        title: Cash Guar/Target Estimated Impressions - ECM Guar
        description: >-
          CARL-3034. Cash ECM guaranteed impressions in thousands. Denominator of Cash Guar/Target
          Estimated CPM - ECM Guar.
      - name: cash_pal_guar_target_imps_000_tracking
        sql: >-
          (CASE WHEN {CUBE}.unit_type_group_key = 1 AND {CUBE}.tracking_est_methodology_key = 1
          THEN {CUBE}.pal_guar_target_estimated_imps * {CUBE}.num_of_spots ELSE NULL END) / 1000.0
        type: sum
        title: Cash Guar/Target Estimated Impressions - PAL Tracking
        description: >-
          CARL-3034. Cash PAL tracking impressions in thousands. Denominator of Cash Guar/Target
          Estimated CPM - PAL Tracking.
      - name: cash_acm_guar_target_imps_000_tracking
        sql: >-
          (CASE WHEN {CUBE}.unit_type_group_key = 1 AND {CUBE}.tracking_est_methodology_key = 2
          THEN {CUBE}.acm_guar_target_estimated_imps * {CUBE}.num_of_spots ELSE NULL END) / 1000.0
        type: sum
        title: Cash Guar/Target Estimated Impressions - ACM Tracking
        description: >-
          CARL-3034. Cash ACM tracking impressions in thousands. Denominator of Cash Guar/Target
          Estimated CPM - ACM Tracking.
      - name: cash_ecm_guar_target_imps_000_tracking
        sql: >-
          (CASE WHEN {CUBE}.unit_type_group_key = 1 AND {CUBE}.tracking_est_methodology_key = 3
          THEN {CUBE}.ecm_guar_target_estimated_imps * {CUBE}.num_of_spots ELSE NULL END) / 1000.0
        type: sum
        title: Cash Guar/Target Estimated Impressions - ECM Tracking
        description: >-
          CARL-3034. Cash ECM tracking impressions in thousands. Denominator of Cash Guar/Target
          Estimated CPM - ECM Tracking. The MSTR SQL export pre-aggregates the matching cash revenue
          column and the other five cash impression columns, and this one follows that same pair.
      - name: cash_pal_net_corp_imps_000
        sql: >-
          (CASE WHEN {CUBE}.unit_type_group_key = 1 THEN {CUBE}.pal_net_corp_estimated_imps * {CUBE}.num_of_spots
          ELSE NULL END) / 1000.0
        type: sum
        title: Cash PAL Net Corp Estimated Imps
        description: >-
          CARL-3034. PAL net corporate estimated impressions times spots, divided by 1000, for Cash unit
          types only. Denominator of Cash PAL Net Corp Estimated CPM.
      - name: cash_acm_net_corp_imps_000
        sql: >-
          (CASE WHEN {CUBE}.unit_type_group_key = 1 THEN {CUBE}.acm_net_corp_estimated_imps * {CUBE}.num_of_spots
          ELSE NULL END) / 1000.0
        type: sum
        title: Cash ACM Net Corp Estimated Imps
        description: >-
          CARL-3034. ACM net corporate estimated impressions times spots, divided by 1000, for Cash unit
          types only. Denominator of Cash ACM Net Corp Estimated CPM.
      - name: cash_ecm_net_corp_imps_000
        sql: >-
          (CASE WHEN {CUBE}.unit_type_group_key = 1 THEN {CUBE}.ecm_net_corp_estimated_imps * {CUBE}.num_of_spots
          ELSE NULL END) / 1000.0
        type: sum
        title: Cash ECM Net Corp Estimated Imps
        description: >-
          CARL-3034. ECM net corporate estimated impressions times spots, divided by 1000, for Cash unit
          types only. Denominator of Cash ECM Net Corp Estimated CPM.
      - name: cash_pal_guar_cpm
        sql: CAST({cash_revenue_pal_guar} AS DOUBLE) / NULLIF({cash_pal_guar_target_imps_000}, 0)
        type: number
        title: Cash Guar/Target Estimated CPM - PAL Guar
        description: >-
          CARL-3034. Cash PAL-guaranteed revenue over cash PAL-guaranteed impressions. MSTR Guar/Target
          Estimated CPM - PAL Guar. A ratio of two sums.
      - name: cash_acm_guar_cpm
        sql: CAST({cash_revenue_acm_guar} AS DOUBLE) / NULLIF({cash_acm_guar_target_imps_000_guar}, 0)
        type: number
        title: Cash Guar/Target Estimated CPM - ACM Guar
        description: >-
          CARL-3034. Cash ACM-guaranteed revenue over cash ACM-guaranteed impressions. Distinct from
          acm_guar_target_cpm, which does not bake the Cash or methodology filters.
      - name: cash_ecm_guar_cpm
        sql: CAST({cash_revenue_ecm_guar} AS DOUBLE) / NULLIF({cash_ecm_guar_target_imps_000_guar}, 0)
        type: number
        title: Cash Guar/Target Estimated CPM - ECM Guar
        description: >-
          CARL-3034. Cash ECM-guaranteed revenue over cash ECM-guaranteed impressions.
      - name: cash_pal_tracking_cpm
        sql: CAST({cash_revenue_pal_tracking} AS DOUBLE) / NULLIF({cash_pal_guar_target_imps_000_tracking}, 0)
        type: number
        title: Cash Guar/Target Estimated CPM - PAL Tracking
        description: >-
          CARL-3034. Cash PAL-tracking revenue over cash PAL-tracking impressions.
      - name: cash_acm_tracking_cpm
        sql: CAST({cash_revenue_acm_tracking} AS DOUBLE) / NULLIF({cash_acm_guar_target_imps_000_tracking}, 0)
        type: number
        title: Cash Guar/Target Estimated CPM - ACM Tracking
        description: >-
          CARL-3034. Cash ACM-tracking revenue over cash ACM-tracking impressions.
      - name: cash_ecm_tracking_cpm
        sql: CAST({cash_revenue_ecm_tracking} AS DOUBLE) / NULLIF({cash_ecm_guar_target_imps_000_tracking}, 0)
        type: number
        title: Cash Guar/Target Estimated CPM - ECM Tracking
        description: >-
          CARL-3034. Cash ECM-tracking revenue over cash ECM-tracking impressions.
      - name: cash_pal_net_corp_cpm
        sql: CAST({cash_revenue} AS DOUBLE) / NULLIF({cash_pal_net_corp_imps_000}, 0)
        type: number
        title: Cash PAL Net Corp Estimated CPM
        description: >-
          CARL-3034. Cash revenue over cash PAL net corp impressions. Distinct from pal_net_corp_cpm, which
          has no Cash filter.
      - name: cash_acm_net_corp_cpm
        sql: CAST({cash_revenue} AS DOUBLE) / NULLIF({cash_acm_net_corp_imps_000}, 0)
        type: number
        title: Cash ACM Net Corp Estimated CPM
        description: >-
          CARL-3034. Cash revenue over cash ACM net corp impressions. Distinct from acm_net_corp_cpm.
      - name: cash_ecm_net_corp_cpm
        sql: CAST({cash_revenue} AS DOUBLE) / NULLIF({cash_ecm_net_corp_imps_000}, 0)
        type: number
        title: Cash ECM Net Corp Estimated CPM
        description: >-
          CARL-3034. Cash revenue over cash ECM net corp impressions. Distinct from ecm_net_corp_cpm.
