            WHERE {CUBE}.rateclass_key = hop1.rateclass_key
          )
        type: string
        title: Rateclass (MSTR Category)
        description: 'MSTR-aligned rateclass grouping, verified against the Sports Linear Holes Data 25-26 Booked export in qa: every one of its 11,882 rows matches to the cent with
          this grouping applied. "National" and "Ad-Enh Interstitial - National" group to National; everything beginning "DR", plus "Bonus", groups to DR. Note that "DR - National"
          groups to DR and not to National -- it reads like a national variant and is not one, which is the whole reason this dimension is spelled out rather than inferred from the
          name. Anything else keeps its own description.'
