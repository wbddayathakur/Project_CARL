cubes:
  - name: cube_carl_dwhprd_gold_invoice_revenue_fact
    sql_table: "{{ catalog('dwhprd_gold') }}.invoice_revenue_fact"
    data_source: default
    public: false
    title: Carl Dwhprd Gold — Invoice Revenue Fact
    description: >-
      This fact table captures invoice-level revenue transactions for broadcast advertising, including financial metrics,
      impressions, and deal terms. Each row represents a single unit scheduled for broadcast with associated revenue, rates,
      and performance data across multiple dimensions.
    dimensions:
      - name: account_property_category
        sql: |-
          (
            SELECT hop2.property_category
            FROM {{ catalog('dwhprd_gold') }}.account_dim hop1
            LEFT JOIN {{ catalog('dwhprd_gold') }}.property_category_dim hop2
              ON hop1.account_property_category_key = hop2.property_category_key
            WHERE {CUBE}.account_key = hop1.account_key
          )
        type: string
        title: Account Property Category
        description: 'property_category_dim.property_category looked up by account_property_category_key via a correlated subquery, since property_category_dim is already joined
          once directly from invoice_revenue_fact (Order Property Category role, via invoice_revenue_fact.property_category_key). MSTR''s ACCOUNT_PROPERTY_CATEGORY_DIM view
          (ADSALESDWH.ACCOUNT_PROPERTY_CATEGORY_DIM)
          is a pure rename over PROPERTY_CATEGORY_DIM — no join, no filter — confirming this is a role-play of the same dimension, not a distinct table. Probed against dev data:
          property_category_dim is unique on property_category_key (no fan-out risk), and every one of 406,836 account_dim rows has a matching property_category_dim row (0% orphan).'
      - name: account_property_category_id
        sql: |-
          (
            SELECT hop2.property_category_id
            FROM {{ catalog('dwhprd_gold') }}.account_dim hop1
            LEFT JOIN {{ catalog('dwhprd_gold') }}.property_category_dim hop2
              ON hop1.account_property_category_key = hop2.property_category_key
            WHERE {CUBE}.account_key = hop1.account_key
          )
        type: number
        title: Account Property Category ID
        description: property_category_dim.property_category_id looked up by account_property_category_key via a correlated subquery, for the same reason as account_property_category
          above.
      - name: sub_account
        sql: |-
          (
            SELECT hop1.sub_account
            FROM {{ catalog('dwhprd_gold') }}.account_dim hop1
            WHERE {CUBE}.account_key = hop1.account_key
          )
        type: string
        title: Sub Account
        description: Sub-account name or identifier within the account.
      - name: buy_ae_string
        sql: |-
          (
            SELECT hop1.buy_ae_string
            FROM {{ catalog('dwhprd_gold') }}.acct_cov_team_dim hop1
            WHERE {CUBE}.acct_cov_team_key = hop1.acct_cov_team_key
          )
        type: string
        title: Buying AE String
        description: Buying account executive string for the coverage team (MSTR "Buying AE String").
      - name: client_ae_string
        sql: |-
          (
            SELECT hop1.client_ae_string
            FROM {{ catalog('dwhprd_gold') }}.acct_cov_team_dim hop1
            WHERE {CUBE}.acct_cov_team_key = hop1.acct_cov_team_key
