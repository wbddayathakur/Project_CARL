      - name: row_id
        sql: >-
          concat(cast({CUBE}.source_system_region_key as varchar), '|',
          cast({CUBE}.calendar_year_key as varchar), '|',
          cast({CUBE}.calendar_month_key as varchar), '|',
          cast({CUBE}.campaign_key as varchar), '|',
          cast({CUBE}.channel_key as varchar), '|',
          cast({CUBE}.site_key as varchar), '|',
          cast({CUBE}.section_key as varchar), '|',
          cast({CUBE}.format_key as varchar), '|',
          cast({CUBE}.product_key as varchar), '|',
          cast({CUBE}.digital_item_num as varchar), '|',
          cast({CUBE}.digital_line_num as varchar), '|',
          cast({CUBE}.action_type_key as varchar), '|',
          cast({CUBE}.business_type_key as varchar), '|',
          cast({CUBE}.holding_company_key as varchar), '|',
          cast({CUBE}.spot_booking_status_key as varchar), '|',
          cast({CUBE}.campaign_currency_key as varchar), '|',
          cast({CUBE}.agency_key as varchar), '|',
          cast({CUBE}.client_key as varchar), '|',
          cast({CUBE}.digital_item_adserver_key as varchar), '|',
          cast({CUBE}.digital_line_adserver_key as varchar), '|',
          cast({CUBE}.calendar_week_num as varchar), '|',
          cast({CUBE}.cal_month_week_start_dt as varchar), '|',
          cast({CUBE}.cal_month_week_end_dt as varchar), '|',
          cast({CUBE}.digital_placement_id as varchar))
        type: string
        primary_key: true
        title: Row Id (synthetic)
        description: >-
          Technical surrogate so this cube can declare joins. Digital fact has no single
          natural key. This concat follows the report grain. calendar_week_num alone is
          not enough: the same placement can be a full week and a boundary day, with
          different cal_month_week_start_dt and cal_month_week_end_dt. Dev probe
          2026-10-08: with both dates in the key, region 21 / year 2026 is 98,977
          distinct of 98,977 rows, and the full table is 387,553 distinct of 387,553.
      - name: source_system_region_key
