cubes:
  - name: cube_carl_dwhprd_gold_digital_fact
    sql_table: "{{ catalog('dwhprd_gold') }}.digital_fact"
    data_source: default
    public: false
    title: Carl Dwhprd Gold — Digital Fact
    description: >-
      Digital placement revenue and delivery for the Digital Analysis report (MSTR
      DIGITAL_FACT_VW over BTSDWH.DIGITAL_FACT). One row is a digital placement slice:
      region, year, month, campaign, channel, site, section, format, product, item, line,
      action type, business type, holding company, booking status, currency, agency, and
      client, plus the week and ad-server attributes carried on the fact. The exported
      SQL inner-joins every dimension, so a fact row with a missing region-scoped key
      (action type, either ad server, format, section, site) drops out of the report.
      Cube joins below are many_to_one, which keep the fact row and null the dimension.
      Apply source_system_region_key = 21 and calendar_year_key = 2026 in QuickSight;
      they are the report filter (Discovery Latin America, year 2026), not a cube filter.
      Master Channel, Holding Company, and Business Type were unanswered prompts and stay
      attributes. Current-rate USD measures are not modelled. DIGITAL_FACT_VW exposes PLAN_CURR_RATE
      as EXCHANGE_FACTOR from PLAN_CURR_CURRENCY_RATE_VW, outer-joined on
      campaign_currency_key. That view reads CURRENCY_HIST_PLANNED_RATE_STG, which is
      not in carl_dwhprd_gold_dev, and digital_fact itself has no plan_curr_rate column
      (confirmed in Glue, 2026-10-05). Product name is bts_product_dim.product_name.
      Campaign currency is bts_currency_dim.currency_code. Dev probe, region 21 and
      year 2026 (97,772 rows): every new dimension key is unique, so the joins do not
      fan out. campaign_dim matches 95,730. The other joins match all 97,772.
    dimensions:
      - name: action_type_basis
        sql: |-
          (
            SELECT hop1.action_type_basis
            FROM {{ catalog('dwhprd_gold') }}.action_type_dim hop1
            WHERE {CUBE}.action_type_key = hop1.action_type_key AND {CUBE}.source_system_region_key = hop1.source_system_region_key
          )
        type: string
        title: Action Type Basis
        description: Basis the action type is priced or delivered on.
      - name: action_type_desc
        sql: |-
          (
            SELECT hop1.action_type_desc
