        type: number
        title: Source System Region Key
        description: >-
          Foreign key to source_system_region_dim. Report filter value 21 is Discovery
          Latin America. Also part of the region-scoped dimension joins.
      - name: calendar_year_key
        sql: calendar_year_key
        type: number
        title: Calendar Year Key
        description: Foreign key to calendar_year_dim. Report filter value 2026.
      - name: calendar_month_key
        sql: calendar_month_key
        type: number
        title: Calendar Month Key
        description: Foreign key to calendar_month_dim. Quarter is reached from that dim, not from this fact.
      - name: campaign_key
