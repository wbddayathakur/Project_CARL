        type: number
        title: Campaign Key
        description: >-
          Foreign key to campaign_dim. Delivery type is reached through campaign_dim.
          For source_system_region_key 21 and calendar_year_key 2026, 95,730 of 97,772
          fact rows match (probed 2026-10-05).
      - name: campaign_id
        sql: campaign_id
        type: string
        title: Campaign ID (fact)
        description: >-
          Campaign identifier denormalized on the fact. The view shows campaign_dim.campaign_id
          so the two do not collide.
      - name: channel_key
        sql: channel_key
        type: number
        title: Channel Key
        description: Foreign key to channel_dim.
      - name: site_key
        sql: site_key
        type: number
        title: Site Key
        description: Foreign key to site_dim. The report also matches source_system_region_key.
      - name: section_key
        sql: section_key
        type: number
        title: Section Key
        description: Foreign key to section_dim. The report also matches source_system_region_key.
      - name: format_key
        sql: format_key
        type: number
        title: Format Key
        description: Foreign key to format_dim. The report also matches source_system_region_key.
      - name: product_key
        sql: product_key
        type: number
        title: Product Key
        description: >-
          Foreign key to bts_product_dim (BTSDWH.PRODUCT_DIM). product_dim is the
          ADSALESDWH product master and has no product name. product_key is unique
          on bts_product_dim: 41,804 of 41,804 rows on 2026-10-15.
      - name: action_type_key
        sql: action_type_key
        type: number
        title: Action Type Key
        description: Foreign key to action_type_dim. The report also matches source_system_region_key.
      - name: business_type_key
        sql: business_type_key
        type: number
        title: Business Type Key
        description: Foreign key to business_type_dim. Unanswered prompt; not a filter.
      - name: holding_company_key
        sql: holding_company_key
        type: number
        title: Holding Company Key
        description: >-
          Foreign key to holding_company_dim on this fact, not through campaign_dim.
          Unanswered prompt; not a filter.
      - name: spot_booking_status_key
        sql: spot_booking_status_key
        type: number
        title: Spot Booking Status Key
        description: Foreign key to spot_booking_status_dim.
      - name: campaign_currency_key
        sql: campaign_currency_key
        type: number
        title: Campaign Currency Key
        description: >-
          Foreign key to bts_currency_dim. CAMPAIGN_CURRENCY_DIM is a view over
          BTSDWH.CURRENCY_DIM. currency_dim is a different currency master, and joining
          it on this key returns the wrong code. Dev probe 2026-10-15, region 21 and
          years 2025-2026: every fact row matches bts_currency_dim once, and the codes
          are USD, ARS, BRL, CLP, MXN, COP, and EUR.
      - name: agency_key
