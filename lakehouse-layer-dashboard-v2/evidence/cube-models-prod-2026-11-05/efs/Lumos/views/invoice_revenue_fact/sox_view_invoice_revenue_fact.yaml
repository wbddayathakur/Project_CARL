views:
  - name: sox_view_invoice_revenue_fact
    public: true
    title: SOX — Invoice Revenue Fact
    description: Business view for sox on invoice_revenue_fact.
    meta:
      view_scope: business
      business: sox
      fact_table: invoice_revenue_fact
    cubes:
      - join_path: cube_carl_dwhprd_gold_invoice_revenue_fact
        includes:
          - actual_air_daypart_key
          - advertiser_key
          - as_sold_unequiv_rate
          - avg_equiv30_unit_rate
          - buy_type_key
          - buying_agency_key
          - deal_revenue_snapshot_key
          - deal_revenue_status_key
          - deal_revision_key
          - eqv30_spots
          - market_key
          - natl_comm_acm_net_corp_cpm
          - natl_comm_ecm_net_corp_cpm
          - natl_comm_pal_net_corp_cpm
          - network_key
          - order_line_sell_key
          - order_revision_key
          - property_key
          - ratecard_pct
          - ratecard_unequiv_rate
          - rateclass_key
          - revenue
          - revenue_eff_bcast_month_key
          - revenue_eff_bcast_qtr_key
          - revenue_eff_bcast_year_key
          - revenue_eff_cal_month_key
          - revenue_eff_cal_qtr_key
          - revenue_effective_day_key
          - selling_title_daypart_key
          - unit_type_key
          - account_property_category
          - account_property_category_id
          - name: act_air_daypart_day_time_name
            description: actual_air_daypart_dim.act_air_daypart_day_time_name looked up by actual_air_daypart_key via a correlated subquery, for the same reason as net_name_fact above.
              See that member's description.
          - adv_id
          - adv_name
          - adv_name_id
          - bcast_qtr_desc
          - name: revenue_eff_bcast_month_name
            alias: broadcast_month_name
          - broadcast_qtr_num
          - name: revenue_bcast_year
            alias: broadcast_year
          - buy_type_desc
          - buy_type_sales_group_desc
          - buy_type_sales_group_key
          - buying_agency_id
          - buying_agency_name
          - buying_agency_name_id
          - cal_qtr_desc
          - name: revenue_eff_calendar_month_name
            alias: calendar_month_name
          - calendar_qtr_num
          - name: revenue_eff_cal_qtr_calendar_year
            alias: calendar_year
          - name: property_common_property_series_name
            alias: common_property_series_name
            title: Common Property Series
          - name: revenue_effective_day_date
            alias: day_date
            description: 'revenue_effective_day_dim.day_date looked up by revenue_effective_day_key via a correlated subquery, for the same reason as net_name_fact above. This one matters
              for pivot columns specifically: QuickSight emits a second DENSE_RANK over the truncated column field (for example DATE_TRUNC(''week'', day_date + INTERVAL ''1'' DAY) -
              INTERVAL ''1'' DAY). When that expression resolved through the revenue_effective_day_dim join, Cube planned it as a multiplied measure and Athena rejected the generated
              SQL with EXPRESSION_NOT_AGGREGATE, because the rank expression no longer matched the grouped one. Resolving it on this cube keeps rank and GROUP BY expressions identical.'
          - deal_cancelled_flag
          - deal_key
          - deal_revenue_snapshot_desc
          - deal_revenue_status_desc
          - deal_revision_num
          - deal_year
          - gab_deal_id
          - last_modified_date
          - last_revision_audit_num
          - last_revision_user
          - name: lsni_external_deal_id
            title: Broadway Deal Id
          - name: market_desc
            description: market_dim.market_desc looked up by market_key via a correlated subquery, for the same reason as net_name_fact above. See that member's description.
          - name: net_name
            description: 'network_dim.net_name looked up by network_key via a correlated subquery, so the value is resident on this fact cube and usable in QuickSight pivot row/column
              ranking. See the comment above this block for why. Identical value and NULL semantics to the network_dim join: NULL when network_key has no matching dimension row.'
          - order_line_num
          - order_num
          - order_sales_asst_id
          - order_sales_asst_name
          - order_status_desc
          - order_status_key
          - original_order_date
          - name: primary_ae
            title: Buying AE
          - primary_ae_sales_region_name
          - primary_ae_sales_team
          - rateclass_desc
          - sell_title_dpart_selling_desc
          - super_deal_id
          - super_deal_status_desc
          - unit_type_desc
