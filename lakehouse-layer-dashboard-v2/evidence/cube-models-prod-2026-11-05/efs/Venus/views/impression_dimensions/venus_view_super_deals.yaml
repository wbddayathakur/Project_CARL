views:
  - name: venus_view_super_deals
    public: true
    title: Super — Impression Dimensions
    description: >-
      Business view for super deals on impression_dimensions.
      The super total is super_dollar_liability. dollar_liability is the sum of member liabilities.
    meta:
      view_scope: business
      business: venus
      fact_table: impression_dimensions
    cubes:
      - join_path: cube_venus_silver_serving_impression_dimensions
        includes:
          - record_count
          - name: combo_ind
            title: Combo Indicator
          - name: deal_id
            title: Deal Id
          - name: opportunity_id
            title: Opportunity Id
          - name: network_id
            title: Network Id
          - name: property_id
            title: Property Id
          - name: division
            title: Division
          - name: daypart
            title: Daypart
          - name: selling_title
            title: Selling Title
          - name: impression_type
            title: Impression Type
          - name: calc_version_no
            title: Calc Version No
          - name: created_date
            title: Created Date
          - name: deal_start_date
            title: Deal Start Date
          - name: deal_end_date
            title: Deal End Date
          - name: is_latest_deal_version
            title: Is Latest Deal Version
          - name: super_deal_id
            title: Super Deal Id
          - name: channel
            title: Channel
          - name: super_cost
            title: Cost
          - name: super_guaranteed_impressions
            title: Guaranteed Impressions
          - name: super_guaranteed_actual_impressions
            title: Guaranteed Actual Impressions
          - name: super_guaranteed_preactual_impressions
            title: Guaranteed Pre-Actual Impressions
          - name: super_delivered_impressions
            title: Delivered Impressions
          - name: super_delivered_actual_impressions
            title: Delivered Actual Impressions
          - name: super_delivered_preactual_impressions
            title: Delivered Pre-Actual Impressions
          - name: super_delivery_status
            title: Delivery Status
          - name: market_type_id
            title: Market Type Id
          - name: super_adu_units_count
            title: ADU Units
          - name: super_unaired_unit_count
            title: Unaired Units
          - name: super_recap_units_count
            title: Recap Units
          - name: advertiser_id
            title: Advertiser Id
          - name: agency_id
            title: Agency Id
          - name: super_cpm
            title: CPM
          - name: super_variance
            title: Variance
          - name: super_pacing
            title: Pacing
          - name: super_dollar_liability
            title: Super Deal Dollar Liability
          - name: standard_guaranteed_impressions
            title: Standard Guaranteed Impressions
