cubes:
  - name: cube_neo_gold_rpt_package_performance
    sql_table: "{{ catalog('neo_gold') }}.rpt_package_performance"
    public: false
    data_source: default
    title: NEO Package Performance
    description: >
      Package-level delivery from neo_gold.rpt_package_performance.
      Powers Reporting Suite "By package" tables and Campaign Cockpit top packages.
    dimensions:
      - name: event_date_et
        sql: CAST({CUBE}.event_date_et AS TIMESTAMP)
        type: time
        title: Event Date
        description: Date of delivery in Eastern Time
      - name: deal_id
        sql: '{CUBE}.deal_id'
        type: number
        title: Deal ID
        description: NEO internal deal identifier
      - name: deal_name
        sql: '{CUBE}.deal_name'
        type: string
        title: Deal Name
        description: Deal / placement name
      - name: campaign_id
        sql: '{CUBE}.campaign_id'
        type: number
        title: Campaign ID
        description: NEO campaign identifier
      - name: package_id
        sql: '{CUBE}.package_id'
        type: string
        primary_key: true
        title: Package ID
        description: Insertion order / package identifier
      - name: package_name
        sql: '{CUBE}.package_name'
        type: string
        title: Package Name
        description: Package / insertion order name
      - name: advertiser_id
        sql: '{CUBE}.advertiser_id'
        type: string
        title: Advertiser ID
        description: Advertiser identifier in NEO
      - name: advertiser_name
        sql: '{CUBE}.advertiser_name'
        type: string
        title: Advertiser Name
        description: Advertiser / brand name
      - name: agency_id
        sql: '{CUBE}.agency_id'
        type: number
        title: Agency ID
        description: Agency identifier in NEO
      - name: agency_name
        sql: '{CUBE}.agency_name'
        type: string
        title: Agency Name
        description: Agency managing the deal
    measures:
      - name: count
        type: count
        title: Row Count
        description: Number of package delivery rows
      - name: total_impressions
        sql: '{CUBE}.impressions'
        type: sum
        title: Package Impressions
        description: Delivered impressions by package
      - name: total_revenue
        sql: '{CUBE}.revenue'
        type: sum
        title: Package Spend ($)
        description: Delivered spend by package
      - name: total_completions
        sql: '{CUBE}.completions'
        type: sum
        title: Package Completions
        description: Completed views by package
      - name: avg_vcr
        sql: >
          CASE
            WHEN SUM({CUBE}.impressions) > 0
            THEN (CAST(SUM({CUBE}.completions) AS DOUBLE) / SUM({CUBE}.impressions)) * 100
            ELSE 0
          END
        type: number
        title: Video Completion Rate (%)
        description: Completions divided by impressions × 100
      - name: effective_cpm
        sql: >
          CASE
            WHEN SUM({CUBE}.impressions) > 0
            THEN (SUM({CUBE}.revenue) / SUM({CUBE}.impressions)) * 1000
            ELSE 0
          END
        type: number
        title: Effective CPM ($)
        description: Revenue per thousand impressions by package
