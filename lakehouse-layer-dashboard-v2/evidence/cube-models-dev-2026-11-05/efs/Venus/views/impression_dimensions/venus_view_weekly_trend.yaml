views:
  - name: venus_view_weekly_trend
    public: true
    title: Weekly Trend
    description: >-
      Same fields as the delivery summary. Week Start is the Monday of the
      week the calc version was created. Filter Next Version In Week to not
      set to keep the latest version created in that week. A week with no new
      version has no row. Group by Week Start for the trend.
