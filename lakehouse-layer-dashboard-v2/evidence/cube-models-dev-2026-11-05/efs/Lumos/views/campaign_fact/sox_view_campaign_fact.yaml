views:
  - name: sox_view_campaign_fact
    public: true
    title: SOX — Campaign Fact
    description: >-
      Business view for sox on campaign_fact. KNOWN GAPS
      (see cube_carl_dwhprd_gold_campaign_fact's description): currency-converted ("Current Rate"/"Hist Rate")
      measures, Product Name/Category and Deal ID/Name are not modelled — no confirmed source for
      PLAN_CURR_RATE/PLAN_HIST_RATE, and product_dim/deal_dim are confirmed name collisions with unrelated US
      ad-sales tables.
    meta:
      view_scope: business
      business: sox
      fact_table: campaign_fact
    cubes:
      - join_path: cube_carl_dwhprd_gold_campaign_fact
        includes:
          - campaign_ccp
          - campaign_cps
          - campaign_cpt
          - invoice_currency_code
