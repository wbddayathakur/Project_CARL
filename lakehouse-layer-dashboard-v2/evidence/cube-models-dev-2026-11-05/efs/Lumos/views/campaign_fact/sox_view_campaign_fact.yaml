          - campaign_budget_loc
          - campaign_invoice_value_loc
          - gross_revenue_loc
          - campaign_net_revenue_loc
          - campaign_net_net_revenue_loc
          - agency_commission_loc
          - agency_incentive_loc
          - sales_commission_loc
          - campaign_spots_booked
          - campaign_spots_target
          - campaign_spots_price_loc
          - campaign_tax_value_loc
          - campaign_ratings_booked
          - campaign_ratings_delivered
          - campaign_ratings_sold
          - campaign_impacts_booked
          - campaign_impacts_delivered
          - campaign_impacts_sold
          - agency_commission_pct_avg
          - agency_incentive_pct_avg
          - rep_commission_pct_avg
          - sales_rep_name
          - sales_rep_team_desc
          - sales_rep_revenue_share_avg
          - agency_group_name
          - agency_id
          - agency_name
          - name: base_currency_code
