views:
  - name: international_view_monthly_order_tracker_chile_version_gaston
    public: true
    title: International — Monthly Order Tracker Chile Version Gaston
    description: >-
      Monthly Order Tracker Chile Version Gaston for Discovery Latin America. Campaign spots and
      revenue against target and budget by month, campaign, channel and sales rep, with the deal,
      customer reference, invoice holding company, contract type, consumption indicator, invoice-to
      and billing status, and the campaign measures in local currency, current-rate USD and
      historical-rate USD. Reads cube_carl_dwhprd_gold_campaign_fact. Apply in QuickSight:
      source_system_region_key = 21, calendar_year_key = 2026, and the report's 54 holding_company_key
      and 103 master_channel values (listed in the contract's sql.sql). The report has no view
      filter. The report grid shows Month, Holding Company, Deal Name, Revenue Event, Customer Ref,
      Invoice Holding Company, Campaign, Business Type, Contract Type, Channel, Agency, Client,
      Campaign Desc, Product, Campaign Start and End Date, Sales Rep, Campaign Status, Base Currency,
      Consumption Indicator, Invoice To, Billing Status and Billing Status Note, with Agency
      Commission %, Campaign Spots Target, Campaign Spots Booked, Campaign Budget LOC, Gross Revenue
      LOC, Revenue Variance and Gross Revenue Curr Rate(USD). Every other column is a report object
      outside the grid.
    meta:
      view_scope: business
      business: international
      fact_table: monthly_order_tracker_chile_version_gaston
      mstr_report_name: Monthly Order Tracker Chile Version Gaston
      catalog_key: lumos_carl_dwhprd_gold
      ai_context: >
        Use this view for the Monthly Order Tracker Chile Version Gaston. Filter
        source_system_region_key = 21 and calendar_year_key = 2026, and to match the report also
        holding_company_key in the report's 54 keys and master_channel in its 103 master channels
        (both lists are in the contract's sql.sql). The grid grain is calendar_month_key,
        campaign_id, channel_name, sales_rep_name and product_key. Group by product_key as well as
        product_name: campaign C0228221 has product keys 2174 and 33965, both named CLARO, and
        MicroStrategy shows a row for each, so grouping by name alone merges them and Agency
        Commission % on that row reads 10% instead of two 10% rows. Measures are multiplied by
        sales_rep_revenue_share, with a missing share treated as 1, the same as CAMPAIGN_FACT_VW.
        Current-rate and historical-rate USD measures multiply the LOC formula by the planned
        exchange factor; a row with no rate is left out of those sums. revenue_variance =
        campaign_budget_loc - gross_revenue_loc, after the totals. agency_commission_pct is the
        average row-level fraction (0.1 = 10%). The Month label is calendar_month_name padded to nine
        characters, one space and calendar_year, as in the MicroStrategy export ("January   2026").
        Filter on calendar_month_key, not on the label. Holding Company is read through the campaign;
        Invoice Holding Company through the fact's invoice holding company key. Billing Status and
        Billing Status Note are per campaign, month and region. Product, deal, invoice-to, sales rep
        and every currency attribute come from the BTS lookups; a campaign with no sales rep reads
        DLA N/A.
