views:
  - name: international_view_monthly_order_tracker_with_invoicing_info
    public: true
    title: International — Monthly Order Tracker with Invoicing Info
    description: >-
      Monthly Order Tracker with Invoicing Info for Discovery Latin America. Campaign spots and
      revenue against target and budget by month, campaign, channel and sales rep, with the deal's
      invoicing setup (master deal, invoice level, invoice recipient, invoice holding company), contract
      type and billing status, and the campaign measures in local currency, current-rate USD and
      historical-rate USD. Reads cube_carl_dwhprd_gold_campaign_fact. Apply in QuickSight:
      source_system_region_key = 21, calendar_year_key = 2026, and the report's 54 holding_company_key
      and 103 master_channel values (listed in the contract's sql.sql). View filter, also in
      QuickSight: client_name <> DISCOVERY LATIN AMERICA. The report is paged by Month; the grid
      shows Holding Company, Master Deal Name, Deal Name, Invoice Level Description, Contract Type,
      Campaign, Agency, Client, Campaign Desc, Revenue Event, Campaign Start and End Date, Channel,
      Invoice Holding Company, Invoice Recipient Name, Sales Rep, Campaign Status, Billing Status,
      Base Currency and Campaign Discount/Surcharge %, with Agency Commission %, Agency Incentive %,
      Campaign Spots Target, Campaign Spots Booked, Campaign Budget LOC, Gross Revenue LOC, Revenue
      Variance and Gross Revenue Curr Rate(USD). Every other column is a report object outside the
      grid.
    meta:
      view_scope: business
      business: international
      fact_table: monthly_order_tracker_with_invoicing_info
      mstr_report_name: Monthly Order Tracker with Invoicing Info
      catalog_key: lumos_carl_dwhprd_gold
      ai_context: >
        Use this view for the Monthly Order Tracker with Invoicing Info. Filter
        source_system_region_key = 21 and calendar_year_key = 2026, and to match the report also
        holding_company_key in the report's 54 keys and master_channel in its 103 master channels
        (both lists are in the contract's sql.sql). Apply the view filter client_name <> 'DISCOVERY
        LATIN AMERICA'. The report pages by Month, so pick one calendar_month_key at a time to read
        it like MicroStrategy. The grid grain is calendar_month_key, campaign_id, channel_name and
        sales_rep_name. Measures are multiplied by sales_rep_revenue_share, with a missing share
        treated as 1, the same as CAMPAIGN_FACT_VW. revenue_variance = campaign_budget_loc -
        gross_revenue_loc, after the totals. agency_commission_pct and agency_incentive_pct are
        average row-level fractions (0.1 = 10%). The Month label is calendar_month_name padded to
        nine characters, one space and calendar_year ("January   2026"). Holding Company is read
        through the campaign; Invoice Holding Company through the fact's invoice holding company key.
        Master Deal Name, Invoice Level Description and Invoice Recipient Name are on the deal
        (bts_deal_dim); Master Deal Name reads N/A for a deal with no master deal. Billing Status is
        per campaign, month and region. A campaign with no sales rep reads DLA N/A.
