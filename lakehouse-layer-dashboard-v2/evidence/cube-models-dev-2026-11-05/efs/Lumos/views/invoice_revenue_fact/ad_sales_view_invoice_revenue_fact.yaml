views:
  - name: ad_sales_view_invoice_revenue_fact
    public: true
    title: Ad Sales — Invoice Revenue Fact
    description: >-
      Business view for ad_sales on invoice_revenue_fact.
      CLARIFICATIONS (CARL-3631 dev QuickSight validation): (1) MSTR's "Booked Revenue"/"Revenue" measure
      is this view's Gross Revenue — there is no separate Booked Revenue column; Gross Revenue is also the
      correct base for Net Revenue/Agency Commission (see the Gross vs Net for $0 billing report), so it
      keeps that name rather than being renamed. (2) "Sold LOA Network"/"Sold LOA Market"/"Sold LOA
      Guar/Target Demographic"/"Sold LOA Unit Broadcast Quarter" (Sports SLOA reports) are the same
      Network/Market/Guar/Target Demographic/Unit Broadcast Quarter fields already in this view — already
      scoped to the Sold-LOA snapshot once filtered on Deal Revenue Snapshot = "Sold-LOA/1st to Order/CB
      Hold"; not a separate role-played dimension. (3) MSTR's displayed "Broadcast Quarter"/"Calendar
      Quarter" text is a computed "4th Qtr 2026"-style string (ordinal quarter + year), not necessarily
      identical formatting to bcast_qtr_desc/cal_qtr_desc here — confirm before treating as an exact
      match. (4) Some MSTR filter values (Product Category, Program Average Selling Daypart) carry a
      source-system ID prefix/suffix not present in this view's clean description fields — prod_cat_name_id
      is available as the numeric counterpart for Product Category. (5) CARL-3016 Invoiced-Booked Revenue by Team
      uses a single path invoice → team_ae_bridge (ae_fraction_fact) → member / sales team dims. Team member and
      fraction are month-aligned (unit broadcast month + acct_cov_team_member_key); coverage team member labels
      are members with a fraction row for that invoice month, not every member on the team key alone. Do not sum
      Gross Revenue at invoice-only grain while this path is active. Finance/sox views omit these paths.
      (6) CARL-3953 Theatrical Deals - Various: MSTR view filters on hundreds of distinct brand_key values
      (many labeled VARIOUS). Filter on Brand (ID), not brand_name alone, to match MSTR scope.
    meta:
      view_scope: business
      business: ad_sales
      fact_table: invoice_revenue_fact
    cubes:
