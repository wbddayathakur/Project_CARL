views:
  - name: international_view_digital_fact
    public: true
    title: International — Digital Analysis
    description: >-
      Business view for international on digital_fact (MSTR Digital Analysis, Discovery
      Latin America). Apply in QuickSight: source_system_region_key = 21 AND
      calendar_year_key = 2026. Master Channel, Holding Company, and Business Type are
      attributes, not filters. Current-rate USD gross and net are sums of the local
      amount times the plan current rate looked up by campaign currency. Current-rate
      price is the average of local price times that rate. Campaign Currency is
      bts_currency_dim.currency_code. Product is bts_product_dim.product_name. Price,
      agency commission %, rep commission %, and agency incentive % are averages. Week
      number is calendar_week_num (view alias CAL_MONTH_WEEK_NUM).
    meta:
      view_scope: business
      business: international
      fact_table: digital_fact
    cubes:
      - join_path: cube_carl_dwhprd_gold_digital_fact
        includes:
          - source_system_region_key
          - calendar_year_key
          - calendar_month_key
          - campaign_key
          - channel_key
          - site_key
          - section_key
          - format_key
          - product_key
          - action_type_key
          - business_type_key
          - holding_company_key
          - spot_booking_status_key
          - campaign_currency_key
          - agency_key
          - client_key
          - digital_item_adserver_key
          - digital_line_adserver_key
          - name: calendar_week_num
            title: Cal Month Week Number
          - cal_month_week_start_dt
          - cal_month_week_end_dt
          - digital_item_num
          - digital_item_start_dt
          - digital_item_end_dt
          - digital_line_num
