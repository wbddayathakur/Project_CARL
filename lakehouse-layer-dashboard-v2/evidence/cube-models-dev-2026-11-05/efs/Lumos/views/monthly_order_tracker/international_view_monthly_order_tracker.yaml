views:
  - name: international_view_monthly_order_tracker
    public: true
    title: International — Monthly Order Tracker
    description: >-
      Monthly Order Tracker for Discovery Latin America. Campaign spots and revenue against target
      and budget by month, campaign and channel, with campaign, agency, client, product, deal,
      sales rep, channel and currency attributes, and the campaign measures in local currency,
      current-rate USD and historical-rate USD. Reads cube_carl_dwhprd_gold_campaign_fact. Apply in
      QuickSight: source_system_region_key = 21 and calendar_year_key = 2025. The report has no view
      filter, and its Holding Company and Master Channel prompts are unanswered. The report grid
      shows Month, Holding Company, Channel, Campaign Start and End Date, Client, Campaign and
      Campaign Status, with Campaign Spots Target, Campaign Spots Booked, Spot Variance, Campaign
      Budget LOC, Gross Revenue LOC, Campaign Net Net Revenue LOC and Revenue Variance. Every other
      column is a report object outside the grid.
    meta:
      view_scope: business
      business: international
      fact_table: monthly_order_tracker
      mstr_report_name: Monthly Order Tracker
      catalog_key: lumos_carl_dwhprd_gold
      ai_context: >
        Use this view for the Monthly Order Tracker. Filter source_system_region_key = 21 and
        calendar_year_key = 2025. The grid grain is calendar_month_key, campaign_id and
        channel_name. Measures are multiplied by sales_rep_revenue_share, with a missing share
        treated as 1, the same as CAMPAIGN_FACT_VW; Sales Rep is not on the grid, so the shares add
        back to the campaign total. Current-rate and historical-rate USD measures multiply the LOC
        formula by the planned exchange factor; a row with no rate is left out of those sums.
        revenue_variance = campaign_budget_loc - gross_revenue_loc and spot_variance =
        campaign_spots_target - campaign_spots_booked, both after the totals. The Month label is
        calendar_month_name, one space and calendar_year. calendar_month_name is padded to nine
        characters in gold, so the label reads "January   2025" and "December  2025", the same as
        the MicroStrategy export. Filter on calendar_month_key, not on the label. Holding Company
        is read through the campaign. Product, deal, sales rep and every currency attribute come
        from the BTS lookups; a campaign with no sales rep reads DLA N/A.
    cubes:
      - join_path: cube_carl_dwhprd_gold_campaign_fact
        includes:
