views:
  - name: international_view_amnistia_argentina
    public: true
    title: International — Reporte de Transmision Amnistia - Argentina
    description: >-
      Transmission report for Asociacion Civil Pro Amnistia in Argentina.
      Reads cube_carl_dwhprd_gold_amnistia_spot_fact, which keeps
      source_system_region_key = 21. Apply in QuickSight: holding company
      ARGENTINA, day_date from 2024-01-01 through 2040-12-31, the answered
      business-type prompt, the answered spot-daypart prompt, the answered
      master channels, client ASOCIACION CIVIL PRO AMNISTIA, and spot status
      Scheduled, Hold, Transmitted, Invoiced, and Rejected.
      Those filters are not on the cube. Equivalent spots divide Spot
      Seconds by 30. Month is calendar_month_label from the month cube.
      Week Start and End Date is calendar_week_label from the week cube.
      Date is cast to timestamp(3). Spot Daypart Name and Spot Daypart Name
      Prompt come from spot_daypart_dim. Sales Rep Team comes from
      sales_rep_team_dim.
    meta:
      view_scope: business
      business: international
      fact_table: spot_fact
      mstr_report_name: Reporte de Transmision Amnistia - Argentina
      catalog_key: lumos_carl_dwhprd_gold
      ai_context: >
        Use this view for Reporte de Transmision Amnistia - Argentina.
        The view already keeps source_system_region_key = 21. Filter holding company ARGENTINA,
        the business-type prompt, the master-channel list, client
        ASOCIACION CIVIL PRO AMNISTIA, and the five spot statuses.
        Measures multiply by sales_rep_revenue_share, with a missing share
        treated as 1. USD measures multiply by the planned exchange factor
        inside the spot cube. Filter Spot Daypart Name Prompt to the
        answered daypart list.
    cubes:
      - join_path: cube_carl_dwhprd_gold_amnistia_spot_fact
