views:
  - name: international_view_quarterly_business_review_net_aur
    public: true
    title: International — Quarterly Business Review Net_AUR Analysis
    description: >-
      Quarterly Business Review Net_AUR Analysis. Booked spots, equivalent
      spots, and net revenue for Discovery Latin America by holding company,
      agency, client, master channel, channel, spot daypart group, campaign,
      charge type, year, month, quarter, base currency, and 30-minute slot.
      Apply in QuickSight: source_system_region_key 21 and calendar_month_key
      202412. Those filters are not on the cube. Equivalent spots are
      share-weighted spot seconds divided by 30. Attributes the engine rolls
      up stay on this view. Percent-of-total members carry the amount.
    meta:
      view_scope: business
      business: international
      fact_table: spot_fact
      mstr_report_name: Quarterly Business Review Net_AUR Analysis
      catalog_key: lumos_carl_dwhprd_gold
      ai_context: >
        Use this view for Quarterly Business Review Net_AUR Analysis. Filter
        source_system_region_key = 21 and calendar_month_key = 202412.
        Measures multiply by sales_rep_revenue_share, with a missing share
        treated as 1. equivalent_spots = spot_seconds / 30.
        net_revenue_loc = sum(gross_revenue * share * (1 - agency_commission_pct)).
        net_revenue_current_rate_usd applies the current planned exchange
        factor to that same product.
    cubes:
      - join_path: cube_carl_dwhprd_gold_spot_fact
