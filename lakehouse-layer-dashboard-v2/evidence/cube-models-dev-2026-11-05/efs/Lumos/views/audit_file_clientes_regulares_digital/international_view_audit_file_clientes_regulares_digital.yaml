views:
  - name: international_view_audit_file_clientes_regulares_digital
    public: true
    title: International — Audit File Clientes Regulares DIGITAL
    description: >-
      Audit File Clientes Regulares DIGITAL for Discovery Latin America. Digital gross revenue of the
      MEXICO holding company by SAP GL account, month, campaign, sales rep, channel, agency, client,
      deal, product, invoice holding company and base currency, with the campaign measures in local
      currency, current-rate USD and historical-rate USD. Reads cube_carl_dwhprd_gold_campaign_fact.
      Apply in QuickSight: source_system_region_key = 21, holding_company_key = 11 and
      calendar_month_key 202401 to 202412, plus the report's view filter sap_gl_account in DIGITAL,
      DIGITALREP and DPLUSDLA. The report grid shows Sap GL Account, Campaign Status, Month, Holding
      Company, Invoice Holding Company, Sales Rep, Channel, Agency, Client, Deal Name, Campaign,
      Product, Campaign Desc and Base Currency, with Gross Revenue LOC. Every other column is a report
      object outside the grid.
    meta:
      view_scope: business
      business: international
      fact_table: audit_file_clientes_regulares_digital
      mstr_report_name: Audit File Clientes Regulares DIGITAL
      catalog_key: lumos_carl_dwhprd_gold
      ai_context: >
        Use this view for the Audit File Clientes Regulares DIGITAL report. Filter
        source_system_region_key = 21, holding_company_key = 11 (MEXICO, the campaign's holding
        company) and calendar_month_key between 202401 and 202412, and keep sap_gl_account in
        DIGITAL, DIGITALREP and DPLUSDLA (MicroStrategy's view filter). The grid grain is
        sap_gl_account, calendar_month_key, campaign_id, sales_rep_name, channel_name, agency_name,
        client_name, deal_name, product_name, invoice_holding_company_name and base_currency_code.
        Measures are multiplied by sales_rep_revenue_share, with a missing share treated as 1, the
        same as CAMPAIGN_FACT_VW; Sales Rep is on the grid, so each row is that rep's share. A campaign
        with no sales rep reads DLA N/A. Holding Company is read through the campaign; Invoice Holding
        Company is the fact's invoice-side holding company (names like INV DISCOVERY NETWORKS MEXICO).
        Deal Name holds the deal code (D0010650). Base Currency is on the grid, so a row never mixes
        currencies but a grand total does. The Month label is calendar_month_name, one space and
        calendar_year, padded to nine characters ("January   2024"); filter on calendar_month_key, not
        on the label.
    cubes:
      - join_path: cube_carl_dwhprd_gold_campaign_fact
        includes:
          - sap_gl_account
          - name: campaign_status_name
            title: Campaign Status
          - calendar_year_key
