views:
  - name: international_view_monthly_revenue_share
    public: true
    title: "International — Monthly Revenue Share (From Campaign)"
    description: >-
      Monthly Revenue Share (From Campaign). Share-weighted campaign amounts for
      source_system_region_key 21 and calendar_month_key 202004. Apply in
      QuickSight a view filter that keeps sales_rep_revenue_share other than 1,
      which MicroStrategy shows as 100.00 percent. That filter is not on the cube.
      The subtotal is a grid total. Sales Rep comes from bts_sales_rep_dim. The
      SQL sums gross revenue at the historical rate with SUM DISTINCT;
      gross_revenue_hist_rate_usd is the ordinary sum of that product. Attributes
      the engine rolls up stay on this view.
    meta:
      view_scope: business
      business: international
      fact_table: campaign_fact
      mstr_report_name: Monthly Revenue Share (From Campaign)
      catalog_key: lumos_carl_dwhprd_gold
      ai_context: >
        Use this view for Monthly Revenue Share (From Campaign). Filter
        source_system_region_key = 21, calendar_month_key = 202004, and
        sales_rep_revenue_share not equal to 1. Amount measures multiply by
        sales_rep_revenue_share. Percent measures are averages of the rate columns.
    cubes:
      - join_path: cube_carl_dwhprd_gold_campaign_fact
        includes:
          - name: source_system_region_key
            title: Source System Region Key
          - name: calendar_month_key
            title: Month Key
          - name: sales_rep_revenue_share
            title: Sales Rep Revenue Share Raw
          - name: source_region_name
            alias: source_region
            title: Source Region
          - name: source_region_name
            title: Source System Region
          - name: holding_company_name
            title: Holding Company
          - name: sales_rep_team_desc
            title: Sales Rep Team
          - name: bts_sales_rep_name
            title: Sales Rep
          - name: calendar_month_label
            title: Month
