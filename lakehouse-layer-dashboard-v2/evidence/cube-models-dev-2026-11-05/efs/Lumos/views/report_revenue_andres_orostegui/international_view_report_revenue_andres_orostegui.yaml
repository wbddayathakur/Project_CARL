views:
  - name: international_view_report_revenue_andres_orostegui
    public: true
    title: "International — Report Revenue Andres Orostegui"
    description: >-
      Report Revenue Andres Orostegui. Share-weighted campaign revenue. Apply in
      QuickSight: source_system_region_key 21, calendar_year_key 2025 and 2026,
      country_key 4 (CHILE), and sales_rep_key 401 (Andres Orostegui). Those
      filters are not on the cube. Campaign Budget Net LOC is Campaign Budget LOC
      minus Agency Commission LOC after both sums. Sales Rep comes from
      bts_sales_rep_dim. Attributes the engine rolls up stay on this view.
    meta:
      view_scope: business
      business: international
      fact_table: campaign_fact
      mstr_report_name: Report Revenue Andres Orostegui
      catalog_key: lumos_carl_dwhprd_gold
      ai_context: >
        Use this view for Report Revenue Andres Orostegui. Filter
        source_system_region_key = 21, calendar_year_key in 2025 and 2026,
        country_key = 4, and sales_rep_key = 401. Measures multiply by
        sales_rep_revenue_share. Campaign Budget Net LOC subtracts agency
        commission from campaign budget.
    cubes:
      - join_path: cube_carl_dwhprd_gold_campaign_fact
