views:
  - name: international_view_monthly_tracker_portafolio_cristian_lavao
    public: true
    title: International — Monthly Tracker - Portafolio Cristian Lavao
    description: >-
      Monthly Tracker - Portafolio Cristian Lavao (Reporte Ingresos Cristian Lavao) for Discovery
      Latin America. Campaign spots and revenue against target and budget by sales rep, with
      campaign, agency, client, product, deal, contract, channel and currency attributes, and the
      campaign measures in local currency, current-rate USD and historical-rate USD. Reads
      cube_carl_dwhprd_gold_campaign_fact. Apply in QuickSight: source_system_region_key = 21,
      calendar_year_key = 2023, the report's master_channel list and its holding_company_key list.
      The report's view filter is sales_rep_name in (Monica Echeverry, Juan Gomez) and
      calendar_month_key in (202301, 202302). None of these filters are on the cube. The report grid
      shows Client, Agency, Deal Name, Deal Type, Contract Type, Campaign, Campaign Start and End
      Date, Product, Campaign Status, Base Currency and Sales Rep, with Campaign Spots Target,
      Campaign Spots Booked, Spot Variance, Campaign Budget LOC, Gross Revenue LOC and Revenue
      Variance. Month is filtered but not on the grid, so each row totals January and February.
      Every other column is a report object outside the grid.
    meta:
      view_scope: business
      business: international
      fact_table: monthly_tracker_portafolio_cristian_lavao
      mstr_report_name: Monthly Tracker - Portafolio Cristian Lavao
      catalog_key: lumos_carl_dwhprd_gold
      ai_context: >
        Use this view for the Monthly Tracker - Portafolio Cristian Lavao. Filter
        source_system_region_key = 21 and calendar_year_key = 2023. The report view filter is
        sales_rep_name in Monica Echeverry and Juan Gomez, and calendar_month_key in 202301 and
        202302. Cristian Lavao is the portfolio in the title, not a sales rep filter. Measures are
        multiplied by sales_rep_revenue_share, with a missing share treated as 1, the same as
        CAMPAIGN_FACT_VW, so a campaign split between two reps shows each rep's share.
        Current-rate and historical-rate USD measures multiply the LOC formula by the planned
        exchange factor; a row with no rate is left out of those sums. revenue_variance =
        campaign_budget_loc - gross_revenue_loc and spot_variance = campaign_spots_target -
        campaign_spots_booked, both after the totals. The Month label is calendar_month_name, one
        space and calendar_year. calendar_month_name is padded to nine characters in gold, so the
        label reads "January   2023" and "July      2024", the same as the MicroStrategy filter.
        Filter on calendar_month_key, not on the label.
        Product, deal and every currency attribute come from the BTS lookups.
