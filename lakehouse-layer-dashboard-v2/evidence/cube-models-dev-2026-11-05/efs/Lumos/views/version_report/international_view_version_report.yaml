views:
  - name: international_view_version_report
    public: true
    title: International — version report
    description: >-
      version report. Spot version attributes for Discovery Latin America.
      Apply in QuickSight: source_system_region_key 21, holding company key 1
      (ARGENTINA), and calendar_month_key 202410. The seconds prompt is 30.
      Equivalent spots are share-weighted spot seconds divided by 30.
      Those filters are not on the cube. Sales Rep comes from bts_sales_rep_dim.
      Attributes the engine rolls up stay on this view. Percent-of-total
      members carry the amount; MicroStrategy divides by the grid total.
    meta:
      view_scope: business
      business: international
      fact_table: spot_fact
      mstr_report_name: version report
      catalog_key: lumos_carl_dwhprd_gold
      ai_context: >
        Use this view for the version report. Filter source_system_region_key = 21,
        holding_company_key = 1, and calendar_month_key = 202410. Measures multiply
        by sales_rep_revenue_share. Dynamic Booked Equivalent Spots divides spot
        seconds by 30.
    cubes:
      - join_path: cube_carl_dwhprd_gold_spot_fact
        includes:
          - name: source_system_region_key
            title: Source System Region Key
          - name: calendar_month_key
            title: Month Key
