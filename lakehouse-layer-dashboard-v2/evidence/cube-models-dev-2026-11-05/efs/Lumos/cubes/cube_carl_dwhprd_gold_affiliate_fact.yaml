cubes:
  - name: cube_carl_dwhprd_gold_affiliate_fact
    sql: >
      SELECT af.customer_key, af.affiliate_key, af.sap_geography_key, af.sap_profit_center_key, af.sap_platform_key,
             af.pack_type, af.reason_to_exclude, af.sap_region_key, af.network_key, af.base_currency_key,
             af.billing_period_key, af.contract_key, af.contract_currency_key, af.country_key, af.effective_on,
             af.invoice_key, af.inv_process_status_key, af.invoice_type_key, af.link_type, af.local_currency_key,
             af.calendar_month_key, af.new_package_key, af.package_key, af.package_replace_ind, af.calendar_qtr_key,
             af.rate_type_key, af.sap_company_code_key, af.source_system_key, af.vip_customer, af.calendar_year_key,
             af.invoice_currency_key, af.revenue_type_key, af.subs_indicator, af.new_actual_subs, af.new_billable_subs
        FROM {{ catalog('dwhprd_gold') }}.affiliate_fact af
      UNION ALL
      SELECT ext.customer_key, CAST(0 AS DECIMAL(38,10)) AS affiliate_key, ext.sap_geography_key,
             ext.sap_profit_center_key, ext.sap_platform_key, 'External Source' AS pack_type,
             '0' AS reason_to_exclude, ext.sap_region_key, CAST(0 AS DECIMAL(38,10)) AS network_key,
             CAST(0 AS DECIMAL(38,10)) AS base_currency_key, CAST(0 AS DECIMAL(38,10)) AS billing_period_key,
             CAST(0 AS DECIMAL(38,10)) AS contract_key, CAST(0 AS DECIMAL(38,10)) AS contract_currency_key,
             CAST(0 AS DECIMAL(38,10)) AS country_key, CAST(NULL AS TIMESTAMP) AS effective_on,
             CAST(0 AS DECIMAL(38,10)) AS invoice_key, CAST(0 AS DECIMAL(38,10)) AS inv_process_status_key,
             CAST(0 AS DECIMAL(38,10)) AS invoice_type_key, '0' AS link_type,
             CAST(0 AS DECIMAL(38,10)) AS local_currency_key, ext.calendar_month_key,
             CAST(0 AS DECIMAL(38,10)) AS new_package_key, CAST(0 AS DECIMAL(38,10)) AS package_key,
             'Y' AS package_replace_ind, ext.calendar_qtr_key, CAST(0 AS DECIMAL(38,10)) AS rate_type_key,
             ext.sap_company_code_key, ext.source_system_key, ext.vip_customer, ext.calendar_year_key,
             ext.invoice_currency_key, CAST(0 AS DECIMAL(38,10)) AS revenue_type_key, 'Y' AS subs_indicator,
             ext.new_actual_subs, ext.new_billable_subs
        FROM {{ catalog('dwhprd_gold') }}.ext_src_affiliate_fact ext
    data_source: default
    public: false
    title: Carl Dwhprd Gold — Affiliate Fact
    description: >-
      Affiliate carriage and subscriber counts from five affiliate billing systems (DLA/DNA/DNE/DNR/EXT), joined
      to SAP master data. Same international source system as the campaign_fact star — country_dim,
      currency_dim, calendar_month_dim and calendar_qtr_dim are the exact same physical Glue tables and cubes
      already authored there, confirming the shared-dimension question sox-triage.md left open.

      QUERY-BACKED, 2026-08-28 — added a UNION ALL with ext_src_affiliate_fact to reproduce Oracle's
      DNIAFFDWH.AFFILIATE_FACT_VW, which the Pack Type filter actually depends on: `Pack Type =
      'External Source'` rows physically live only in ext_src_affiliate_fact (923,563 rows), never in
      affiliate_fact itself (confirmed via Athena — 0 rows match that value there). Found by
      `semantic-authoring re-coverage` flagging ext_src_affiliate_fact as reconstructed-but-unread, the same
      shape as the campaign_fact/sales_rep_fraction_fact query-backed join. Oracle's view fills every
      FK ext_src_affiliate_fact lacks (country/invoice/contract/package/currencies/etc.) with a sentinel 0 (or
      '0' for text columns) — reproduced exactly here so numbers reconcile to MicroStrategy. Every dimension
      joined from this cube resolves those sentinel rows to NULL rather than dropping them, since Cube always
      compiles its join graph as a LEFT JOIN with this fact on the left (confirmed against Cube's own docs) —
      unlike the raw AI-reverse-engineered transformation.sql, which INNER JOINs 14 dimensions and would
      silently return zero External Source rows if run directly against Athena. sap_exchange_rate (also flagged
      by re-coverage, also read by the same Oracle view for an EXCHANGE_RATE column) is deliberately NOT added
      here — MicroStrategy's own SELECT never surfaces exchange_rate, so there is nothing currently needing it.

      RESOLVED — SAP GL Account exclusion needs no dedup after all. MicroStrategy's metric definitions carry an
      aggregation-level qualifier on the sum of New Actual/Billable Subs — MSTR's own notation for "sum, with SAP
      GL Account excluded from the aggregation level" — which was initially read as meaning the fact repeats an
      identical subscriber count once
      per SAP GL Account row (the same shape as cube_carl_dwhprd_gold_req_rights_participant_contribution's
      dedup-then-sum pattern) and would need a MAX-based dedup before summing. Checked against dev data instead of
      assumed: grouping affiliate_fact at MicroStrategy's own 8-key aggregation grain (affiliate, customer,
      geography, month, pack_type, platform, profit_center, region) finds 410,550 combos with more than one row
      (1,305,309 rows total) — but only 16% of those combos (65,843) carry an identical new_actual_subs value
      across their duplicate rows, and only 14.5% (59,579) for new_billable_subs. If this were a repeated-value
      GL-account pattern, that figure would be at or near 100%; instead the overwhelming majority of duplicate
      combos carry genuinely different values, meaning they are separate legitimate contributions (e.g. different
      invoices/contracts active in the same month) that should be added, not deduplicated. This cube therefore
      defines new_actual_subs/new_billable_subs as plain sum measures — mathematically identical to MicroStrategy's
      own two-stage aggregation (its SQL groups at ~34-attribute grain, then its analytical engine sums again at
      the 8-key grain; summing twice at progressively coarser grains equals summing once at the coarsest,
      with no join fan-out in between to invalidate that). Flagged for business confirmation since it reverses an
      earlier, unverified assumption, but shipped rather than blocked given the data now supports it.

      KNOWN GAPS: `new_package_dim` and `new_contract_dim` (a package/contract "before/after" swap pair, the same
      shape as cube_carl_dwhprd_gold_package_dim's own before/after role) do not exist anywhere in the ingested
      catalog (`aws glue get-table` returns EntityNotFoundException for both) — the "New Package ID/Name" and
      "New Contract" fields are not modelled. `network_dim` is a confirmed collision, not the affiliate-billing
      network: probed against dev data, joining affiliate_fact.network_key to network_dim.network_key produces a
      51.6% orphan rate (1,585,191 of 3,073,121 rows) — far too high to be the same table. Network Name is not
      modelled.

      RESOLVED — invoice_dim is NOT a collision. sox-triage.md flagged this table name alongside network_dim as a
      possible US-ad-sales collision (missing an INVOICE_NO-equivalent column). Probing the join found 0% orphan
      (all 3,073,121 rows match), and cube_carl_dwhprd_gold_invoice_dim already existed in this model — generically
      authored, exposing invoice_id and invoice_type_desc — reused as-is here rather than re-declared, which
      avoided a duplicate-cube-name conflict caught by semantic-authoring audit's unknown_view_member check
      against finance_view_invoice_revenue_fact. invoice_dim is the single shared physical table across both the
      finance/invoice_revenue_fact star and this affiliate star; no separate affiliate-only table exists.

      DATA-QUALITY GAP — country_dim is significantly under-populated for this fact's country universe. All other
      19 joins on this cube probed 0% orphan against dev data (perfectly clean), but country_dim — the same
      cube reused from the campaign_fact, confirming it as a genuinely shared physical table — orphans
      65.9% of affiliate_fact's 3,073,121 rows (2,024,071 unmatched). country_dim currently holds only 92 rows with
      country_key ranging -2 to 89, while affiliate_fact's unmatched country_key values run into the 300s (e.g.
      93, 152, 246, 266, 303, 362) — real-looking, non-null, non-sentinel IDs outside that range, not a wrong-table
      mismatch. This looks like country_dim was populated only for the countries campaign_fact's APAC scope
      touches, and was never backfilled with the fuller country list affiliate_fact's five global billing systems
      (DLA/DNA/DNE/DNR/EXT) reference. Kept as a declared join (same key space, correct table) rather than dropped,
      but Country Name/Reporting Country Name will read NULL for roughly two-thirds of rows until country_dim is
      backfilled — flagged to the ingestion team rather than worked around here.
    dimensions:
