          )
        type: string
        title: Active Indicator
        description: Whether this affiliate is currently active.
      - name: affiliate_cd
        sql: |-
          (
            SELECT hop1.affiliate_cd
            FROM {{ catalog('dwhprd_gold') }}.affiliate_dim hop1
            WHERE {CUBE}.affiliate_key = hop1.affiliate_key
          )
        type: string
        title: Affiliate Code
        description: Natural code identifying the affiliate.
      - name: affiliate_name
        sql: |-
          (
            SELECT hop1.affiliate_name
            FROM {{ catalog('dwhprd_gold') }}.affiliate_dim hop1
