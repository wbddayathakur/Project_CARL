  - name: cube_carl_dwhprd_gold_rateclass_dim
    sql_table: "{{ catalog('dwhprd_gold') }}.rateclass_dim"
    data_source: default
    public: false
    title: Carl Dwhprd Gold — Rateclass Dim
    description: >-
      A dimension table that defines rate classes used in advertising sales, including their codes and descriptions. Each
      rate class represents a category of pricing or programming type applied to ad inventory.
    dimensions:
      - name: create_ts
        sql: create_ts
        type: time
        title: Create Ts
        description: Timestamp when the rate class record was originally created.
      - name: end_ts
        sql: end_ts
        type: time
        title: End Ts
        description: Timestamp marking the end of validity for this rate class record; empty if currently active.
      - name: ingest_timestamp_utc
        sql: ingest_timestamp_utc
        type: time
        title: Ingest Timestamp Utc
        description: UTC timestamp indicating when the record was loaded into the gold layer.
      - name: rateclass_code
        sql: rateclass_code
        type: string
        title: Rateclass Code
        description: Short code representing the rate class (e.g., DR-UADR, PP, DCI Corp).
      - name: rateclass_desc
        sql: rateclass_desc
        type: string
        title: Rateclass
        description: Full descriptive name of the rate class explaining its purpose or category.
      - name: rateclass_category
        sql: >
          CASE
            WHEN {CUBE}.rateclass_desc IN (
              'National',
              'Ad-Enh Interstitial - National'
            )
              THEN 'National'
            WHEN {CUBE}.rateclass_desc LIKE 'DR%'
              OR {CUBE}.rateclass_desc = 'Bonus'
              THEN 'DR'
            ELSE {CUBE}.rateclass_desc
          END
        type: string
        title: Rateclass (MSTR Category)
        description: >-
          MSTR-aligned rateclass grouping, verified against the Sports Linear Holes Data
          25-26 Booked export in qa: every one of its 11,882 rows matches to the cent with
          this grouping applied. "National" and "Ad-Enh Interstitial - National" group to
          National; everything beginning "DR", plus "Bonus", groups to DR. Note that
          "DR - National" groups to DR and not to National -- it reads like a national
          variant and is not one, which is the whole reason this dimension is spelled out
          rather than inferred from the name. Anything else keeps its own description.
      - name: rateclass_id
        sql: rateclass_id
        type: number
        title: Rateclass Id
        description: Business identifier for the rate class from the source system.
      - name: rateclass_key
        sql: rateclass_key
        type: number
        title: Rateclass Key
        description: Surrogate key uniquely identifying each rate class record.
        primary_key: true
      - name: source_file
        sql: source_file
        type: string
        title: Source File
        description: S3 path to the source parquet file from which this record was ingested.
      - name: update_ts
        sql: update_ts
        type: time
        title: Update Ts
        description: Timestamp when the rate class record was last updated.
