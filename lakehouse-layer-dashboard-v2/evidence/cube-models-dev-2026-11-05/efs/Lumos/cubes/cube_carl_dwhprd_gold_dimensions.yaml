  - name: cube_carl_dwhprd_gold_calendar_week_dim
    sql: >
      SELECT calendar_week_key,
             'WEEK ' || CAST(calendar_week_num AS VARCHAR) || ', ' || CAST(calendar_year AS VARCHAR)
               AS calendar_week_desc,
             min(calendar_week_begin_date) AS calendar_week_begin_date,
             min(calendar_week_end_date) AS calendar_week_end_date,
             date_format(min(calendar_week_begin_date), '%m/%d/%Y') || ' - ' ||
               date_format(min(calendar_week_end_date), '%m/%d/%Y') AS calendar_week_label
        FROM {{ catalog('dwhprd_gold') }}.day_dim
       WHERE calendar_year > 2012
         AND calendar_year <= year(current_date) + 1
       GROUP BY calendar_week_key, calendar_week_num, calendar_year
    data_source: default
    public: false
    title: Carl Dwhprd Gold — Calendar Week Dim
    description: >-
      BTSDWH.CALENDAR_WEEK_DIM, a grouped view of day_dim. One row per
      calendar_week_key. Probed 2026-10-23: 795 grouped rows and 795 distinct
      keys for calendar years after 2012 through next year. Joining day_dim
      itself on calendar_week_key would fan the fact out, so the week label
      and the week date range live here.
    dimensions:
      - name: calendar_week_key
        sql: calendar_week_key
        type: number
        title: Calendar Week Key
        description: Surrogate key for the calendar week. Primary key of this cube.
        primary_key: true
      - name: calendar_week_desc
        sql: calendar_week_desc
        type: string
        title: Calendar Week
        description: >-
          Week label, WEEK <number>, <year>. Break Analysis shows this as Week.
      - name: calendar_week_begin_date
        sql: calendar_week_begin_date
        type: time
        title: Calendar Week Begin Date
        description: First day of the calendar week.
      - name: calendar_week_end_date
        sql: calendar_week_end_date
        type: time
        title: Calendar Week End Date
        description: Last day of the calendar week.
      - name: calendar_week_label
        sql: calendar_week_label
        type: string
        title: Calendar Week Start and End Date
        description: >-
          Week start and end as MM/DD/YYYY - MM/DD/YYYY. The value is computed
          in this cube's SQL. The SQL API selects calendar_week_label. Break
          Analysis shows this as Week Start and End Date. 4 October 2025 is
          10/01/2025 - 10/07/2025.
    measures:
      - name: record_count
        sql: '*'
        type: count
        title: Record Count
        description: Row count for smoke queries.
