  - name: cube_carl_dwhprd_gold_charge_type_dim
    sql_table: "{{ catalog('dwhprd_gold') }}.charge_type_dim"
    data_source: default
    public: false
    title: Carl Dwhprd Gold — Charge Type Dim
    description: >-
      Charge type lookup (BTSDWH.CHARGE_TYPE_DIM). One row per
      charge_type_key. Loaded for WBDL AUR Review on 2026-10-21: 3 rows.
      Key 1 is Chargable, key 2 is Non-Chargeable, key 0 is N/A. The report
      keeps Chargable in QuickSight. That filter is not on this cube.
    dimensions:
      - name: charge_type_key
        sql: charge_type_key
        type: number
        title: Charge Type Key
        description: Surrogate key uniquely identifying each charge type.
        primary_key: true
      - name: charge_type_code
        sql: charge_type_code
        type: string
        title: Charge Type Code
        description: Short charge type code. Chargable is CHG.
      - name: charge_type_name
        sql: charge_type_name
        type: string
        title: Charge Type Name
        description: >-
          Charge type name as stored, including the spelling Chargable.
          WBDL AUR Review filters to that name in QuickSight.
    measures:
      - name: record_count
        sql: '*'
        type: count
        title: Record Count
        description: Row count for smoke queries.
  - name: cube_carl_dwhprd_gold_plan_curr_currency_rate
    sql_table: "{{ catalog('dwhprd_gold') }}.plan_curr_currency_rate"
    data_source: default
    public: false
    title: Carl Dwhprd Gold — Plan Current Currency Rate
    description: >-
      BTSDWH.PLAN_CURR_CURRENCY_RATE_VW, loaded 2026-10-21. One row per
      base_currency_key. Probed on carl_dwhprd_gold_dev: 128 rows and 128
      distinct keys. exchange_factor is PLAN_CURR_RATE. WBDL AUR Review joins
      this many-to-one from spot_fact on base_currency_key and multiplies
      price and net revenue by exchange_factor. Break Analysis multiplies
      break_price by the same factor inside the break fact SQL, outer-joined
      on base_currency_key, and does not join this cube.
    dimensions:
      - name: base_currency_key
        sql: base_currency_key
        type: number
        title: Base Currency Key
        description: >-
          Currency key this current planned rate applies to. Unique on this table.
        primary_key: true
      - name: from_currency
        sql: from_currency
        type: string
        title: From Currency
        description: Source currency code for the planned rate.
      - name: to_currency
        sql: to_currency
        type: string
        title: To Currency
        description: Target currency code for the planned rate.
      - name: exchange_factor
        sql: exchange_factor
        type: number
        title: Exchange Factor
        description: >-
          Current planned conversion factor to USD (PLAN_CURR_RATE). WBDL AUR
          Review multiplies spot price and net revenue by this factor. Break
          Analysis uses the same factor on break price. Not a grid column.
    measures:
      - name: record_count
        sql: '*'
        type: count
        title: Record Count
        description: Row count for smoke queries.
  - name: cube_carl_dwhprd_gold_bts_program_dim
    sql_table: "{{ catalog('dwhprd_gold') }}.bts_program_dim"
    data_source: default
