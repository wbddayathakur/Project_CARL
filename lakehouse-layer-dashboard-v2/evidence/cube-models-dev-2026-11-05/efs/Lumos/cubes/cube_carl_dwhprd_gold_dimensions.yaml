  - name: cube_carl_dwhprd_gold_dc_episode_dim
    sql_table: "{{ catalog('dwhprd_gold') }}.dc_episode_dim"
    data_source: default
    public: false
    title: Carl Dwhprd Gold — Dc Episode Dim
    description: >-
      Distribution-channel-scoped episode facts: per (episode, distribution channel) pair, when that channel first
      and most recently aired the episode. "DC" prefixes throughout this table and its season/show counterparts
      (dc_season_dim, dc_show_dim) stand for Distribution Channel, not "Data Center" or "Direct Consumer" — confirm
      by the join shape (one row per episode/channel pair) if this is ever ambiguous again. Distinct from
      episode_dim (the advertising-side dimension keyed on property_key/network_key) and from season_dim/show_dim
      (the plain content dimensions, not channel-scoped). Only the columns needed so far are modelled; the table
      carries many more distribution-channel timing/count columns not currently read.
    dimensions:
      - name: dc_episode_key
        sql: dc_episode_key
        type: number
        title: Dc Episode Key
        description: Unique surrogate key identifying each (episode, distribution channel) pair.
        primary_key: true
      - name: dc_eps_days_fm_last_airing
        sql: dc_eps_days_fm_last_airing
        type: number
        title: Dc Eps Days From Last Airing
        description: Days elapsed since this episode last aired on this distribution channel.
      - name: dc_eps_last_air_bday_key
        sql: dc_eps_last_air_bday_key
        type: number
        title: Dc Eps Last Air Bday Key
        description: >-
          Day key (YYYYMMDD) of this episode's most recent airing on this distribution channel.
      - name: dc_eps_next_air_bday_key
        sql: dc_eps_next_air_bday_key
        type: number
        title: Dc Eps Next Air Bday Key
        description: >-
          Day key (YYYYMMDD) of this episode's next scheduled airing on this distribution channel; 21001231 is used
          as a sentinel for "none scheduled" and should be blanked out when parsed into a date.
      - name: dc_eps_reg_days_fm_last_airing
        sql: dc_eps_reg_days_fm_last_airing
        type: number
        title: Dc Eps Regional Days From Last Airing
        description: Days elapsed since this episode last aired on this distribution channel's region.
      - name: dc_eps_reg_last_air_bday_key
        sql: dc_eps_reg_last_air_bday_key
        type: number
        title: Dc Eps Regional Last Air Bday Key
        description: Day key (YYYYMMDD) of this episode's most recent airing on this distribution channel's region.
      - name: dc_eps_reg_next_air_bday_key
        sql: dc_eps_reg_next_air_bday_key
        type: number
        title: Dc Eps Regional Next Air Bday Key
        description: Day key (YYYYMMDD) of this episode's next scheduled airing on this distribution channel's region.
      - name: dc_eps_slot_length
        sql: dc_eps_slot_length
        type: number
        title: Dc Eps Slot Length
        description: >-
          Distribution-channel-scoped episode slot length. Not currently used by any view — airings_fact carries its
          own eps_slot_length column directly, which is read instead (see that fact's description for
          why the MicroStrategy source's own EPISODE_DIM join could not be used). This cube also carries season_key
          and show_key (a season/show can be inferred from an episode/channel pair), but airings_fact does not join
          through here for those — it holds its own season_key/show_key directly, joined straight to
          cube_carl_dwhprd_gold_season_dim/show_dim, to avoid a cycle in the join graph.
  - name: cube_carl_dwhprd_gold_dc_season_dim
    sql: >
      SELECT * FROM (
        SELECT *, row_number() OVER (PARTITION BY dc_season_key ORDER BY update_ts DESC) AS dedupe_rn
        FROM {{ catalog('dwhprd_gold') }}.dc_season_dim
      ) WHERE dedupe_rn = 1
    data_source: default
    public: false
    title: Carl Dwhprd Gold — Dc Season Dim
    description: >-
      Distribution-channel-scoped season facts: per (season, distribution channel) pair, when that channel premiered
      and most recently/next aired the season, regionally and channel-wide. Query-backed for the same reason as
      cube_carl_dwhprd_gold_season_dim — probed against dev data with 79 duplicate rows on dc_season_key, deduplicated
      here by keeping the most-recently-updated row per key. See cube_carl_dwhprd_gold_dc_episode_dim for what "DC"
      means in this table family. Only the columns needed so far are modelled.
    dimensions:
      - name: dc_season_key
        sql: dc_season_key
        type: number
        title: Dc Season Key
        description: Unique key identifying each (season, distribution channel) pair, post-deduplication.
        primary_key: true
      - name: dc_seas_days_fm_last_airing
        sql: dc_seas_days_fm_last_airing
        type: number
        title: Dc Seas Days From Last Airing
        description: Days elapsed since this season last aired on this distribution channel.
      - name: dc_seas_last_air_bday_key
        sql: dc_seas_last_air_bday_key
        type: number
        title: Dc Seas Last Air Bday Key
        description: Day key (YYYYMMDD) of this season's most recent airing on this distribution channel.
      - name: dc_seas_next_air_bday_key
        sql: dc_seas_next_air_bday_key
        type: number
        title: Dc Seas Next Air Bday Key
        description: Day key (YYYYMMDD) of this season's next scheduled airing on this distribution channel.
      - name: dc_seas_prem_bday_key
        sql: dc_seas_prem_bday_key
        type: number
        title: Dc Seas Prem Bday Key
        description: >-
          Day key (YYYYMMDD) this season premiered on this distribution channel. Anchor date for '
          Year Grouping derived dimension, which buckets each airing by elapsed months since this date.
      - name: dc_seas_prem_date
        sql: >-
          CASE WHEN {CUBE}.dc_seas_prem_bday_key IS NULL OR {CUBE}.dc_seas_prem_bday_key = 0 THEN NULL ELSE
          date_parse(CAST(CAST({CUBE}.dc_seas_prem_bday_key AS BIGINT) AS VARCHAR), '%Y%m%d') END
        type: time
        title: Distribution Channel Season Premiere Date
        description: >-
          dc_seas_prem_bday_key (YYYYMMDD integer) parsed into an actual date — the "Distribution Channel Season
          Premiere Date" attribute, previously exposed only
          as the raw undecoded key. Same CAST-to-BIGINT-then-VARCHAR-then-date_parse idiom proven by year_grouping
          against this exact column (decimal(38,10), hence the BIGINT hop), guarded against NULL/0 the same way.
      - name: dc_seas_reg_last_air_bday_key
        sql: dc_seas_reg_last_air_bday_key
        type: number
        title: Dc Seas Reg Last Air Bday Key
        description: Day key (YYYYMMDD) of this season's most recent airing on this distribution channel's region.
      - name: dc_seas_reg_days_fm_last_airng
        sql: dc_seas_reg_days_fm_last_airng
        type: number
        title: Dc Seas Regional Days From Last Airing
        description: Days elapsed since this season last aired on this distribution channel's region.
      - name: dc_seas_reg_next_air_bday_key
        sql: dc_seas_reg_next_air_bday_key
        type: number
        title: Dc Seas Reg Next Air Bday Key
        description: Day key (YYYYMMDD) of this season's next scheduled airing on this distribution channel's region.
      - name: dc_seas_reg_prem_bday_key
        sql: dc_seas_reg_prem_bday_key
        type: number
        title: Dc Seas Reg Prem Bday Key
        description: Day key (YYYYMMDD) this season premiered on this distribution channel's region.
      - name: dc_seas_reg_prem_date
        sql: >-
          CASE WHEN {CUBE}.dc_seas_reg_prem_bday_key IS NULL OR {CUBE}.dc_seas_reg_prem_bday_key = 0 THEN NULL ELSE
          date_parse(CAST(CAST({CUBE}.dc_seas_reg_prem_bday_key AS BIGINT) AS VARCHAR), '%Y%m%d') END
        type: time
        title: Season Regional Premiere Date
        description: >-
          dc_seas_reg_prem_bday_key (YYYYMMDD integer) parsed into an actual date — the "Season Regional Premiere
          Date" attribute, previously exposed only as the
          raw undecoded key. Same idiom and decimal(38,10)-via-BIGINT rationale as dc_seas_prem_date.
