  - name: cube_carl_dwhprd_gold_req_rights_participant_contribution
    sql: >
      SELECT internal_offer_key, participating_entity_key,
             MAX(participant_contr_amount) AS participant_contr_amount,
             MAX(participant_contr_per_hour) AS participant_contr_per_hour
        FROM {{ catalog('dwhprd_gold') }}.req_rights_episode_fact
       GROUP BY internal_offer_key, participating_entity_key
    data_source: default
    public: false
    title: Carl Dwhprd Gold — Req Rights Participant Contribution
    description: >-
      Query-backed, not a physical table — same technique as cube_carl_dwhprd_gold_season_dim's de-duplicating
      query. req_rights_episode_fact carries two contribution metrics (Total Participant Contribution Amount, Total
      Participant Contribution Per Hour) that MicroStrategy computes at internal-offer x participating-entity
      grain, not episode grain: every episode row under the same (internal_offer_key, participating_entity_key)
      pair repeats the identical value. A plain sum() over the fact multiplies each contribution by the number of
      episode rows underneath it. This cube collapses the fact to one row per (internal_offer_key,
      participating_entity_key) pair first — MAX is a dedupe, not an aggregation, since the value is constant per
      pair — so the measures here sum safely at that grain. As with total_hours_offered on internal_offer_dim,
      combining these measures in the same query as an episode-grain dimension from req_rights_episode_fact
      directly (rather than through this cube) would reintroduce the fan-out; no SOX view does that.
    dimensions:
      - name: internal_offer_key
        sql: internal_offer_key
        type: number
        title: Internal Offer Key
        description: Foreign key to internal_offer_dim. Part of this cube's composite key.
        primary_key: true
      - name: participant_contr_amount
        sql: participant_contr_amount
        type: number
        title: Participant Contribution Amount (raw)
        description: Deduplicated participant contribution amount for one internal-offer/participating-entity pair.
      - name: participant_contr_per_hour
        sql: participant_contr_per_hour
        type: number
        title: Participant Contribution Per Hour (raw)
        description: Deduplicated participant contribution per hour for one internal-offer/participating-entity pair.
      - name: participating_entity_key
        sql: participating_entity_key
        type: number
        title: Participating Entity Key
        description: Foreign key to entity_dim, in the Participating Entity role. Part of this cube's composite key.
        primary_key: true
    measures:
      - name: total_participant_contribution_amount
        sql: participant_contr_amount
        type: sum
        title: Total Participant Contribution Amount
        description: >-
          Sum of participant contribution amounts, one per (internal offer, participating entity) pair — see the
          cube description for why this must be summed at that de-duplicated grain rather than off the raw fact.
      - name: total_participant_contribution_per_hour
        sql: participant_contr_per_hour
        type: sum
        title: Total Participant Contribution Per Hour
        description: >-
          Sum of participant contribution-per-hour amounts, one per (internal offer, participating entity) pair —
          see the cube description for why this must be summed at that de-duplicated grain rather than off the raw
          fact.
  - name: cube_carl_dwhprd_gold_entity_dim
    sql_table: "{{ catalog('dwhprd_gold') }}.entity_dim"
    data_source: default
    public: false
    title: Carl Dwhprd Gold — Entity Dim
    description: >-
      A company/business-entity master, one row per entity (studio, network group, production company, etc.). Role-
      played by req_rights_episode_fact under five names — Offering Entity (offering_entity_key, joined directly),
      Participating Entity, Originating Entity, Primary Contracting Entity and Primary Prod Business Company
      (the other four, read via correlated-subquery dimensions on the fact cube rather than a second join, since a
      fact can only join a given cube once). Confirms an open question from the SOX batch triage
      (docs/ingestion-requests/2026-08-18-lumos-sox.md): these five MicroStrategy tables are one physical table in
      five roles, not five separate tables. Also role-played by season_dim (as Season Controlling Entity, via
      season_cont_entity_key), show_dim (as Show Controlling Entity, via show_cont_entity_key), and
      deal_io_part_prog_dim (as Originating Entity, via originating_entity_key) —
      three more MicroStrategy role-play tables resolved to this same physical table. None of these three declare a
      `joins:` edge to this cube: cube-sql's automatic join-path resolver treats every declared edge as a candidate
      route regardless of which view field uses it, so a second edge into an already-joined cube (airings_fact joins
      entity_dim directly, in the Controlling Entity role) creates a genuine multi-path ambiguity the moment any
      query touches two of these cubes together — not just when the specific role-play field is selected. All three
      are read via correlated-subquery dimensions on cube_carl_dwhprd_gold_airings_fact instead, matching the
      req_rights_episode_fact precedent above.
