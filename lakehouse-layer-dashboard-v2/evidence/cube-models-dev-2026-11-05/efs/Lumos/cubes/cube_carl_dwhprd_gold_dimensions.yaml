    data_source: default
    public: false
    title: Carl Dwhprd Gold — Product Dim (Advertiser Default)
    description: >-
      A second cube over the same product_dim table, reached from advertiser_dim on
      adv_default_prod_cat_key rather than from a fact's own product_key. It exists because a report can ask
      for both product-category readings at once — the advertiser's standing category and the category of the
      product actually sold — and those are different rows of product_dim. Declaring them as two join_paths to
      one cube does not give two join instances: Cube collapses them and whichever path it picks answers both
      members, so the product-of-sale reading silently returns the advertiser's default. CNNE Data hit this on
      122 of 867 rows. Keep this cube distinct from cube_carl_dwhprd_gold_product_dim; do not merge them.
    dimensions:
      - name: prod_cat_name
        sql: prod_cat_name
        type: string
        title: Advertiser Primary Product Category
        description: >-
          The advertiser's standing product category, i.e. the category on the product referenced by
          advertiser_dim.adv_default_prod_cat_key. This is not the category of the product sold on the
          transaction — for that use cube_carl_dwhprd_gold_product_dim.prod_cat_name.
      - name: prod_cat_name_id
        sql: >-
          {CUBE}.prod_cat_name || ' (' || CAST({CUBE}.prod_id AS VARCHAR) || ')'
        type: string
        title: Advertiser Primary Product Category (ID)
        description: >-
