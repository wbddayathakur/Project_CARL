  - name: cube_carl_dwhprd_gold_season_dim
    sql: >
      SELECT * FROM (
        SELECT *, row_number() OVER (PARTITION BY season_key ORDER BY update_ts DESC) AS dedupe_rn
        FROM {{ catalog('dwhprd_gold') }}.season_dim
      ) WHERE dedupe_rn = 1
    data_source: default
    public: false
    title: Carl Dwhprd Gold — Season Dim
    description: >-
      Season_dim is a dimension table that contains comprehensive attributes and metadata for television seasons, including
      descriptive information, premiere and airing dates across multiple regions (global, US, DNI), episode counts, and distribution/deal
      information. Each row represents a unique season with its associated show, inventory status, and broadcast history.
      Read through a de-duplicating query rather than straight from the table: season keys 218668 (Ghost Adventures season
      20) and 222533 (Harry Potter: Wizards of Baking) each landed twice, identical in every column including the load timestamps,
      so this is a double load and not a slowly changing dimension. Left alone the second copy doubles revenue on the 1,102
      invoice rows that reach those two seasons — too few for anyone to notice, and wrong. Drop the wrapper once the duplicates
      are gone upstream.
    dimensions:
      - name: corporate_ind
        sql: corporate_ind
        type: string
        title: Corporate Ind
        description: Flag indicating whether the season is corporate-owned content (Y/N).
      - name: create_ts
        sql: create_ts
        type: time
        title: Create Ts
        description: Timestamp when the record was created in the data warehouse.
      - name: end_ts
        sql: end_ts
        type: time
        title: End Ts
        description: Timestamp indicating when the record became inactive or was soft-deleted.
      - name: ingest_timestamp_utc
        sql: ingest_timestamp_utc
        type: time
        title: Ingest Timestamp Utc
        description: UTC timestamp indicating when the record was ingested into the data warehouse.
      - name: premiere_date
        sql: premiere_date
        type: time
        title: Premiere Date
        description: Date and time when the season premiered globally.
      - name: seas_active_episode_lengths
        sql: seas_active_episode_lengths
        type: string
        title: Seas Active Episode Lengths
        description: Formatted string listing the lengths of active episodes in the season.
      - name: seas_active_hours
        sql: seas_active_hours
        type: number
        title: Seas Active Hours
        description: Total hours of active episodes in the season.
      - name: seas_br_dc_list
        sql: seas_br_dc_list
        type: string
        title: Seas Br Dc List
        description: Pipe-delimited list of broadcast rights distribution channels for the season.
      - name: seas_br_dc_reg_list
        sql: seas_br_dc_reg_list
        type: string
        title: Seas Br Dc Reg List
