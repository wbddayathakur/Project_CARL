  - name: cube_carl_dwhprd_gold_order_line_dim
    sql_table: "{{ catalog('dwhprd_gold') }}.order_line_dim"
    data_source: default
    public: false
    title: Carl Dwhprd Gold — Order Line Dim
    description: >-
      A dimension table that stores individual order line details, including flight dates, status, and links back to the
      parent order and deal. Each row represents one line of an order revision; `order_line_sell_dim` is the sell-side
      counterpart that the fact table joins to first.
    dimensions:
      - name: create_ts
        sql: create_ts
        type: time
        title: Create Ts
        description: Timestamp when the order line record was created.
      - name: deal_id
        sql: deal_id
        type: number
        title: Deal Id
        description: Identifier for the deal this order line belongs to.
      - name: deal_revenue_snapshot_key
        sql: deal_revenue_snapshot_key
        type: number
        title: Deal Revenue Snapshot Key
        description: Foreign key reference to a snapshot of deal revenue at a specific point in time.
      - name: end_ts
        sql: end_ts
        type: time
        title: End Ts
        description: Timestamp marking the end of validity for this order line record version.
      - name: ingest_timestamp_utc
        sql: ingest_timestamp_utc
        type: time
        title: Ingest Timestamp Utc
        description: UTC timestamp indicating when the record was ingested into the data warehouse.
      - name: order_id
        sql: order_id
        type: number
        title: Order Id
        description: Identifier for the parent order this line belongs to.
      - name: order_line_audit_num
        sql: order_line_audit_num
        type: number
        title: Order Line Audit Num
        description: Audit trail number associated with this order line.
      - name: order_line_crt_audit_num
        sql: order_line_crt_audit_num
        type: number
        title: Order Line Crt Audit Num
        description: Audit number for the order line creation event.
      - name: order_line_flight_end_date
        sql: order_line_flight_end_date
        type: time
        title: Order Line Flight End Date
        description: End date of this order line's flight or campaign period.
      - name: order_line_flight_start_date
        sql: order_line_flight_start_date
        type: time
        title: Order Line Flight Start Date
        description: Start date of this order line's flight or campaign period.
      - name: order_line_num
        sql: order_line_num
        type: number
        title: Order Line Num
        description: Human-readable line number within the parent order.
      - name: order_line_revision_key
        sql: order_line_revision_key
        type: number
        title: Order Line Revision Key
        description: Unique surrogate key identifying each order line revision record.
        primary_key: true
      - name: order_line_status_key
        sql: order_line_status_key
        type: number
        title: Order Line Status Key
        description: Foreign key reference to the status of the order line.
      - name: order_revision_key
        sql: order_revision_key
        type: number
        title: Order Revision Key
        description: Foreign key reference to the parent order revision this line belongs to.
      - name: source_file
        sql: source_file
        type: string
        title: Source File
        description: Name or path of the source file from which this record was ingested.
      - name: update_ts
        sql: update_ts
        type: time
        title: Update Ts
        description: Timestamp when the order line record was last updated.
  - name: cube_carl_dwhprd_gold_order_line_sell_dim
    sql_table: "{{ catalog('dwhprd_gold') }}.order_line_sell_dim"
    data_source: default
    public: false
    title: Carl Dwhprd Gold — Order Line Sell Dim
    description: >-
      A dimension table that stores the sell-side view of an order line — the record `invoice_revenue_fact` joins to
      directly via `order_line_sell_key`. It carries `order_line_revision_key`, which is what reaches `order_line_dim`
      for the line number MicroStrategy displays.
    dimensions:
      - name: aei_event_key
        sql: aei_event_key
        type: number
        title: Aei Event Key
        description: Foreign key reference to an associated AEI (addressable event inventory) event.
      - name: billobard_ind
        sql: billobard_ind
        type: string
        title: Billobard Ind
        description: Indicator flag from the source system; name preserved as ingested (sic).
      - name: create_ts
        sql: create_ts
        type: time
        title: Create Ts
        description: Timestamp when the order line sell record was created.
      - name: deal_id
        sql: deal_id
        type: number
        title: Deal Id
        description: Identifier for the deal this sell-side order line belongs to.
      - name: deal_revenue_snapshot_key
        sql: deal_revenue_snapshot_key
        type: number
        title: Deal Revenue Snapshot Key
        description: Foreign key reference to a snapshot of deal revenue at a specific point in time.
      - name: end_ts
        sql: end_ts
        type: time
        title: End Ts
        description: Timestamp marking the end of validity for this order line sell record version.
      - name: ingest_timestamp_utc
        sql: ingest_timestamp_utc
