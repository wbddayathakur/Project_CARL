cubes:
  - name: cube_carl_dwhprd_gold_account_dim
    sql_table: "{{ catalog('dwhprd_gold') }}.account_dim"
    data_source: default
    public: false
    title: Carl Dwhprd Gold — Account Dim
    description: >-
      A dimension table containing account master data including account identifiers, associated agencies, networks, advertisers,
      and broadcast periods. Each row represents a unique account with its geographic location, account type, and property
      category classification.
    dimensions:
      - name: account_bcast_end_date
        sql: account_bcast_end_date
        type: time
        title: Account Bcast End Date
        description: Date when the account broadcast period ends; may be null for active accounts.
      - name: account_bcast_start_date
        sql: account_bcast_start_date
        type: time
        title: Account Bcast Start Date
        description: Date when the account broadcast period begins.
      - name: account_id
        sql: account_id
        type: number
        title: Account Id
        description: Business identifier for the account.
      - name: account_key
        sql: account_key
        type: number
        title: Account Key
        description: Unique surrogate key for the account dimension.
        primary_key: true
      - name: account_property_category_key
        sql: account_property_category_key
        type: number
        title: Account Property Category Key
        description: Foreign key reference to the account property category dimension.
      - name: account_property_category
        sql: >-
          (SELECT pcd.property_category FROM {{ catalog('dwhprd_gold') }}.property_category_dim pcd WHERE
          pcd.property_category_key = {CUBE}.account_property_category_key)
        type: string
        title: Account Property Category
        description: >-
          property_category_dim.property_category looked up by account_property_category_key via a correlated
          subquery, since property_category_dim is already joined once directly from invoice_revenue_fact (Order
          Property Category role, via invoice_revenue_fact.property_category_key). MSTR's
          ACCOUNT_PROPERTY_CATEGORY_DIM view (ADSALESDWH.ACCOUNT_PROPERTY_CATEGORY_DIM) is a pure rename over
          PROPERTY_CATEGORY_DIM — no join, no filter — confirming this is a role-play of the same dimension, not a
          distinct table. Probed against dev data: property_category_dim is unique on property_category_key (no
          fan-out risk), and every one of 406,836 account_dim rows has a matching property_category_dim row (0%
          orphan).
      - name: account_property_category_id
        sql: >-
          (SELECT pcd.property_category_id FROM {{ catalog('dwhprd_gold') }}.property_category_dim pcd WHERE
          pcd.property_category_key = {CUBE}.account_property_category_key)
        type: number
        title: Account Property Category ID
        description: >-
          property_category_dim.property_category_id looked up by account_property_category_key via a correlated
          subquery, for the same reason as account_property_category above.
      - name: account_type
        sql: account_type
        type: string
        title: Account Type
        description: Classification code indicating the type of account.
      - name: advertiser_key
        sql: advertiser_key
        type: number
        title: Advertiser Key
        description: Foreign key reference to the advertiser dimension.
      - name: buying_agency_key
        sql: buying_agency_key
        type: number
        title: Buying Agency Key
        description: Foreign key reference to the buying agency dimension.
      - name: client_city
        sql: client_city
        type: string
        title: Client City
        description: City where the client is located.
      - name: client_state
        sql: client_state
        type: string
        title: Client State
        description: State or province where the client is located.
      - name: create_ts
        sql: create_ts
        type: time
        title: Create Ts
        description: Timestamp when the account record was created.
      - name: end_ts
        sql: end_ts
        type: time
        title: End Ts
        description: Timestamp marking the end of the account's validity period; may be null for active records.
      - name: ingest_timestamp_utc
        sql: ingest_timestamp_utc
        type: time
        title: Ingest Timestamp Utc
        description: UTC timestamp indicating when the record was ingested into the data warehouse.
      - name: network_account_id
        sql: network_account_id
        type: number
        title: Network Account Id
        description: Network-specific identifier for the account.
      - name: network_key
        sql: network_key
        type: number
        title: Network Key
        description: Foreign key reference to the network dimension.
      - name: planning_agency_key
        sql: planning_agency_key
        type: number
        title: Planning Agency Key
        description: Foreign key reference to the planning agency dimension.
      - name: source_file
        sql: source_file
        type: string
        title: Source File
        description: Source file path indicating where the record was loaded from.
      - name: sub_account
        sql: sub_account
        type: string
        title: Sub Account
        description: Sub-account name or identifier within the account.
      - name: territory_desc
        sql: territory_desc
        type: string
        title: Territory
        description: Description of the territory associated with the account.
      - name: territory_key
        sql: territory_key
        type: number
        title: Territory Key
        description: Foreign key reference to the territory dimension.
      - name: update_ts
        sql: update_ts
        type: time
        title: Update Ts
        description: Timestamp when the account record was last updated.
  - name: cube_carl_dwhprd_gold_actual_air_daypart_dim
