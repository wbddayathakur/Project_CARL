        description: Flag indicating whether the advertiser is currently active.
      - name: adv_addr_line1
        sql: adv_addr_line1
        type: string
        title: Adv Addr Line1
        description: First line of the advertiser's street address.
      - name: adv_addr_line2
        sql: adv_addr_line2
        type: string
        title: Adv Addr Line2
        description: Second line of the advertiser's street address (apartment, suite, etc.).
      - name: adv_city
        sql: adv_city
        type: string
        title: Adv City
        description: City where the advertiser is located.
      - name: adv_default_prod_cat_key
        sql: adv_default_prod_cat_key
        type: number
        title: Advertiser Default Product Category Key
        description: Foreign key reference to the default product category dimension for this advertiser.
      - name: adv_end_date
        sql: adv_end_date
        type: time
        title: Adv End Date
        description: The effective end date when this advertiser record ceased to be active.
      - name: adv_id
        sql: adv_id
        type: number
        title: Advertiser ID
        description: Business identifier for the advertiser from the source system.
      - name: adv_inactive_flag
        sql: adv_inactive_flag
        type: string
        title: Adv Inactive Flag
        description: Flag indicating whether the advertiser is marked as inactive.
      - name: adv_name
        sql: adv_name
        type: string
        title: Advertiser
        description: The legal or business name of the advertiser.
      - name: adv_name_id
        sql: >-
          {CUBE}.adv_name || ' (' || CAST({CUBE}.adv_id AS VARCHAR) || ')'
        type: string
        title: Advertiser (ID)
        description: >-
          Advertiser name with its business ID suffixed in parentheses, e.g. "ABBOTT DIABETES CARE (12268)" —
          reproduces MicroStrategy's display format exactly. Confirmed live in MSTR's own generated SQL
          (`"ADV_NAME"||' ('||"ADV_ID"||')' "ADV_NAME"`), which concatenates the same two fields already modeled
          separately here (adv_name, adv_id).
      - name: adv_primary_phone
        sql: adv_primary_phone
        type: string
        title: Adv Primary Phone
        description: Primary phone number for contacting the advertiser.
      - name: adv_reporting_parent
        sql: adv_reporting_parent
        type: string
        title: Adv Reporting Parent
        description: Identifier for the parent advertiser entity used for consolidated reporting purposes.
      - name: adv_start_date
        sql: adv_start_date
        type: time
        title: Adv Start Date
        description: The effective start date when this advertiser record became active.
      - name: adv_state
        sql: adv_state
        type: string
        title: Adv State
        description: State or province where the advertiser is located.
      - name: adv_zip
        sql: adv_zip
        type: string
        title: Adv Zip
        description: Postal code for the advertiser's address.
      - name: advertiser_key
        sql: advertiser_key
        type: number
        title: Advertiser Key
        description: Surrogate key uniquely identifying each advertiser record in the dimension table.
        primary_key: true
      - name: create_ts
        sql: create_ts
        type: time
        title: Create Ts
        description: Timestamp when this record was initially created in the data warehouse.
      - name: end_ts
        sql: end_ts
        type: time
        title: End Ts
        description: Timestamp marking the end of validity for this version of the advertiser record in a slowly changing
          dimension.
      - name: ingest_timestamp_utc
        sql: ingest_timestamp_utc
        type: time
        title: Ingest Timestamp Utc
        description: UTC timestamp indicating when this record was ingested into the data warehouse.
      - name: source_file
        sql: source_file
        type: string
        title: Source File
        description: Name of the source file from which this record was ingested.
      - name: update_ts
        sql: update_ts
        type: time
        title: Update Ts
        description: Timestamp when this record was last updated in the data warehouse.
    joins:
      - name: cube_carl_dwhprd_gold_adv_default_product_dim
        sql: '{CUBE}.adv_default_prod_cat_key = {cube_carl_dwhprd_gold_adv_default_product_dim}.product_key'
        relationship: many_to_one
