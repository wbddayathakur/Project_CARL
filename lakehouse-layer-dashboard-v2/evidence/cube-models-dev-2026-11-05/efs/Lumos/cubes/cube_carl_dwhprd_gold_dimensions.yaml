  - name: cube_carl_dwhprd_gold_campaign_dim
    sql_table: "{{ catalog('dwhprd_gold') }}.campaign_dim"
    data_source: default
    public: false
    title: Carl Dwhprd Gold — Campaign Dim
    description: >-
      APAC ad-sales campaign hub, a different source system from the US ad-sales star used elsewhere. One row per
      campaign, carrying campaign-level attributes (ID, description, commission/tax/discount percentages,
      start/end dates) plus the keys for eight snowflaked dimensions (agency_group, client_group, holding_company,
      campaign_delivery_type, campaign_status, campaign_currency) that hang off this dim rather than off
      campaign_fact directly. campaign_currency_key resolves through cube_carl_dwhprd_gold_currency_dim, the same
      physical currency table joined directly off campaign_fact in the Base/Invoice Currency roles. Probed
      against dev data: all four snowflaked joins carry a small but non-zero orphan rate — campaign_status_dim
      0.66% (3,265/493,338), campaign_delivery_type_dim 0.13% (650/493,338), holding_company_dim 0.17%
      (838/493,338), currency_dim (campaign currency role) 0.0004% (2/493,338) — small enough to treat as normal
      data-quality noise rather than a modelling gap, unlike the much larger sales-rep-allocation gap flagged on
      cube_carl_dwhprd_gold_campaign_fact.
    dimensions:
      - name: campaign_key
        sql: campaign_key
        type: number
        title: Campaign Key
        description: Surrogate key uniquely identifying each campaign.
        primary_key: true
      - name: campaign_id
        sql: campaign_id
        type: string
        title: Campaign ID
        description: Natural identifier for the campaign.
      - name: campaign_desc
        sql: campaign_desc
        type: string
        title: Campaign Description
        description: Free-text campaign description.
      - name: campaign_status_key
        sql: campaign_status_key
        type: number
        title: Campaign Status Key
        description: Foreign key to campaign_status_dim.
      - name: campaign_currency_key
        sql: campaign_currency_key
        type: number
        title: Campaign Currency Key
        description: Foreign key to currency_dim, in the Campaign Currency role.
      - name: campaign_delivery_type_key
        sql: campaign_delivery_type_key
        type: number
        title: Campaign Delivery Type Key
        description: Foreign key to campaign_delivery_type_dim.
      - name: agency_group_key
        sql: agency_group_key
        type: number
        title: Agency Group Key
        description: Foreign key to agency_group_dim.
      - name: client_group_key
        sql: client_group_key
        type: number
        title: Client Group Key
        description: Foreign key to client_group_dim.
      - name: holding_company_key
        sql: holding_company_key
        type: number
        title: Holding Company Key
        description: >-
          Foreign key to holding_company_dim.
      - name: campaign_commission_pct
        sql: TRY_CAST(campaign_commission_pct AS DOUBLE) * 100
        type: number
        title: Campaign Commission %
        description: >-
          Campaign-level commission percentage, scaled to a display percentage (MSTR multiplies by 100). Glue type
          is varchar despite the name (probed live: one row holds the garbage value "ITALY NA"), so wrapped in
          TRY_CAST rather than CAST — an unqualified CAST throws and fails the whole query on that one bad row,
          while TRY_CAST yields NULL for it and lets every other row resolve normally.
      - name: campaign_tax_pct
        sql: TRY_CAST(campaign_tax_pct AS DOUBLE) * 100
        type: number
        title: Campaign Tax %
        description: >-
          Campaign-level tax percentage, scaled to a display percentage (MSTR multiplies by 100). Same varchar/
          TRY_CAST rationale as campaign_commission_pct — probed live, same bad row affects both columns.
      - name: campaign_disc_sur_pct
        sql: campaign_disc_sur_pct
        type: string
        title: Campaign Discount/Surcharge %
        description: >-
          Campaign-level discount or surcharge percentage. Glue type is string, not numeric, despite the name —
          reproduced faithfully rather than cast.
      - name: campaign_start_end_date
        sql: >-
          date_format(campaign_start_date, '%m/%d/%Y') || ' - ' || date_format(campaign_end_date, '%m/%d/%Y')
        type: string
        title: Campaign Start and End Date
        description: >-
          Formatted start/end date range, reproducing MSTR's custom column (CustCol_40) exactly — both dates as
          MM/DD/YYYY, concatenated with ' - '. Uses date_format (MySQL-style
          %m/%d/%Y tokens), not to_char: probed live against Athena — to_char('MM/DD/YYYY') throws
          "INVALID_FUNCTION_ARGUMENT: Failed to tokenize string [M] at offset [0]" on this engine, since Trino's
          to_char expects a different token syntax than the Oracle/Teradata-style pattern MSTR used.
      - name: agency_key
        sql: agency_key
        type: number
        title: Agency Key
        description: >-
          Foreign key to agency_dim. Items and Placements and Items & Placements &
          Targets reach agency through this campaign key, not from the placement or
          target fact.
      - name: client_key
        sql: client_key
        type: number
        title: Client Key
        description: >-
          Foreign key to client_dim. Items & Placements & Targets reaches client
          through this campaign key.
      - name: contract_basis_key
        sql: contract_basis_key
        type: number
        title: Contract Basis Key
        description: >-
          Foreign key to contract_basis_dim. Items and Placements excludes keys
          (2, 5, 8, -2, -1, 0) in QuickSight, not as a cube filter. MSTR also
          matches source_system_region_key on the fact when it reads the dim.
      - name: contract_type_key
        sql: contract_type_key
        type: number
        title: Contract Type Key
        description: Foreign key to contract_type_dim.
      - name: campaign_start_date
        sql: campaign_start_date
        type: time
        title: Campaign Start Date
        description: >-
          Campaign start date. Items & Placements & Targets shows this as its own
          attribute. Items and Placements only shows it inside campaign_start_end_date.
          Both reports filter on this column in QuickSight; it is not a cube filter.
      - name: campaign_end_date
        sql: campaign_end_date
        type: time
        title: Campaign End Date
        description: >-
          Campaign end date. An attribute, not a filter — both reports left the
          campaign/contract end-date prompt unanswered.
      - name: revenue_event_desc
        sql: revenue_event_desc
        type: string
        title: Revenue Event
        description: >-
          Campaign-level revenue event description. Items & Placements & Targets
          shows this, not item_revenue_event on bts_items.
      - name: invoice_calendar
        sql: invoice_calendar
        type: string
        title: Invoice Calendar
        description: >-
          Invoice calendar on the campaign. Power BI - Revenue Events selects it
          and the analytical engine rolls it up before display.
      - name: deal_key
        sql: deal_key
        type: number
        title: Deal Key
        description: >-
          Foreign key to deal_dim. Items Rpt reaches the deal through the campaign.
      - name: campaign_target_value_loc
        sql: campaign_target_value_loc
        type: number
        title: Campaign Target Value LOC
        description: Campaign target value in local currency. Selected by Items Rpt.
      - name: campaign_target_value_usd
        sql: campaign_target_value_usd
        type: number
        title: Campaign Target Value USD
        description: Campaign target value in USD. Selected by Items Rpt.
      - name: campaign_target_spots
        sql: campaign_target_spots
        type: number
        title: Campaign Target Spots
        description: Campaign target spot count. Selected by Items Rpt.
    joins:
      - name: cube_carl_dwhprd_gold_campaign_status_dim
        sql: '{CUBE}.campaign_status_key = {cube_carl_dwhprd_gold_campaign_status_dim}.campaign_status_key'
        relationship: many_to_one
      - name: cube_carl_dwhprd_gold_campaign_delivery_type_dim
        sql: >-
          {CUBE}.campaign_delivery_type_key =
          {cube_carl_dwhprd_gold_campaign_delivery_type_dim}.campaign_delivery_type_key
        relationship: many_to_one
      - name: cube_carl_dwhprd_gold_agency_group_dim
        sql: '{CUBE}.agency_group_key = {cube_carl_dwhprd_gold_agency_group_dim}.agency_group_key'
        relationship: many_to_one
      - name: cube_carl_dwhprd_gold_client_group_dim
        sql: '{CUBE}.client_group_key = {cube_carl_dwhprd_gold_client_group_dim}.client_group_key'
        relationship: many_to_one
      - name: cube_carl_dwhprd_gold_holding_company_dim
        sql: '{CUBE}.holding_company_key = {cube_carl_dwhprd_gold_holding_company_dim}.holding_company_key'
        relationship: many_to_one
      - name: cube_carl_dwhprd_gold_currency_dim
        sql: '{CUBE}.campaign_currency_key = {cube_carl_dwhprd_gold_currency_dim}.currency_key'
        relationship: many_to_one
      - name: cube_carl_dwhprd_gold_agency_dim
        sql: '{CUBE}.agency_key = {cube_carl_dwhprd_gold_agency_dim}.agency_key'
        relationship: many_to_one
      - name: cube_carl_dwhprd_gold_client_dim
        sql: '{CUBE}.client_key = {cube_carl_dwhprd_gold_client_dim}.client_key'
        relationship: many_to_one
      - name: cube_carl_dwhprd_gold_contract_basis_dim
        sql: '{CUBE}.contract_basis_key = {cube_carl_dwhprd_gold_contract_basis_dim}.contract_basis_key'
        relationship: many_to_one
      - name: cube_carl_dwhprd_gold_contract_type_dim
        sql: '{CUBE}.contract_type_key = {cube_carl_dwhprd_gold_contract_type_dim}.contract_type_key'
        relationship: many_to_one
      - name: cube_carl_dwhprd_gold_deal_dim
        sql: '{CUBE}.deal_key = {cube_carl_dwhprd_gold_deal_dim}.deal_key'
        relationship: many_to_one
      - name: cube_carl_dwhprd_gold_bts_currency_dim
        sql: '{CUBE}.campaign_currency_key = {cube_carl_dwhprd_gold_bts_currency_dim}.currency_key'
        relationship: many_to_one
      - name: cube_carl_dwhprd_gold_bts_deal_dim
        sql: '{CUBE}.deal_key = {cube_carl_dwhprd_gold_bts_deal_dim}.deal_key'
        relationship: many_to_one
