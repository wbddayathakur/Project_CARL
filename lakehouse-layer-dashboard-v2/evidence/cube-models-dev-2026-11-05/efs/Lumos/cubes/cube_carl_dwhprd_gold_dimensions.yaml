  - name: cube_carl_dwhprd_gold_time_dim
    sql_table: "{{ catalog('dwhprd_gold') }}.time_dim"
    data_source: default
    public: false
    title: Carl Dwhprd Gold — Time Dim
    description: >-
      A time-of-day dimension, one row per distinct time value. Role-played by airings_fact as Local Broadcast Time
      (local_bcast_time_key, joined directly) — probed clean against dev data (near-zero orphan rate).
      time_hour_plus is the "broadcast day" hour (a broadcast day runs past midnight, so hours 24-29 represent
      12am-5am the next calendar morning); the custom_daypart derived dimension below buckets it into Prime
      (20, 21, 22 — 8-11pm) versus everything else.
    dimensions:
      - name: create_ts
        sql: create_ts
        type: time
        title: Create Ts
        description: Timestamp when this record was created in the data warehouse.
      - name: custom_daypart
        sql: >-
          CASE WHEN {CUBE}.time_hour_plus IS NULL THEN NULL WHEN {CUBE}.time_hour_plus IN (20, 21, 22) THEN
          'Prime (8-11pm)' ELSE 'Non-Prime' END
        type: string
        title: Custom Daypart
        description: >-
          Two-way prime split on the broadcast-day hour, read via airings_fact's Local Broadcast Time role.
          MicroStrategy's export encodes this as
          one of 20 AIREDCOUNT/GODWFLAG measure pairs (10 elapsed-month bands x 2 dayparts); here it is one of two
          dimensions the aired_count measure is grouped or filtered by instead — see year_grouping (on
          dc_season_dim) and aired_count. Defined here rather than on airings_fact because Cube.js does not allow a
          member's SQL to reference the same foreign cube's column more than once in one formula; a same-cube
          self-reference has no such limit.
      - name: end_ts
        sql: end_ts
        type: time
        title: End Ts
        description: Timestamp marking the end of validity for this record version.
      - name: time_24
        sql: time_24
        type: string
        title: Time (24hr)
        description: Time formatted as 24-hour clock, e.g. 20:00.
      - name: time_hour_plus
        sql: time_hour_plus
        type: number
        title: Time Hour Plus
        description: >-
          Broadcast-day hour (can exceed 23 for times after midnight, attributed back to the prior broadcast day).
          Source of the Custom Daypart split above: 20/21/22 is Prime, everything else is not.
      - name: time_key
        sql: time_key
        type: number
        title: Time Key
        description: Unique surrogate key identifying each time-of-day record.
        primary_key: true
      - name: time_w_secs
        sql: time_w_secs
        type: string
        title: Time (with seconds)
        description: >-
          Clock time with seconds, e.g. 12:00:57am. Break Analysis reads start
          time, the 30-minute slot, and end time from bts_time_dim, not this table.
      - name: time_wo_secs
        sql: time_wo_secs
        type: string
        title: Time (without seconds)
        description: Time formatted without a seconds component, e.g. 8:00PM.
      - name: time_wo_secs_plus
        sql: time_wo_secs_plus
        type: string
        title: Time (without seconds, broadcast-day)
        description: >-
          Broadcast-day time without seconds, e.g. 8:00PM.
      - name: source_file
        sql: source_file
        type: string
        title: Source File
        description: Name or path of the source file from which this record was ingested.
      - name: update_ts
        sql: update_ts
        type: time
        title: Update Ts
        description: Timestamp when this record was last updated.
