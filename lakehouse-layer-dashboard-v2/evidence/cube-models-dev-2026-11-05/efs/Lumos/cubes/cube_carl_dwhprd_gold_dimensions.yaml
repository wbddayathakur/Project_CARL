      493,471 rows, and none of the three key columns is null. Items and Placements and Items & Placements & Targets inner-join from the
      placement or target fact on those three keys. Items Rpt starts on this
      table and reaches the campaign through campaign_key. Cube joins are
      many_to_one, which keep the fact row and null the item. Every placement
      and every target row matches an item (0 orphans). Item GRP and item value
      columns are attributes. They repeat on every placement or target of the
