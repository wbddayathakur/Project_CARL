  - name: cube_carl_dwhprd_gold_program_daypart_dim
    sql_table: "{{ catalog('dwhprd_gold') }}.program_daypart_dim"
    data_source: default
    public: false
    title: Carl Dwhprd Gold — Program Daypart Dim
    description: >-
      Program selling daypart for an airing. MicroStrategy joins PROGRAM_DAYPART_DIM on both
      program_daypart_key and network_key. program_daypart_key lives on program_airing_dim, not on
      invoice_revenue_fact. Only the selling description is exposed; the rest of the gold table is
      left off this cube until a report needs it.
    dimensions:
      - name: network_key
        sql: network_key
        type: number
        title: Network Key
        description: Network that owns this program daypart. Part of the MicroStrategy join.
      - name: program_daypart_key
        sql: program_daypart_key
        type: number
        primary_key: true
        title: Program Daypart Key
        description: >-
          Program daypart key from the airing. Unique on the current gold load. The join still
          includes network_key because that is how MicroStrategy joins PROGRAM_DAYPART_DIM.
      - name: program_daypart_selling_desc
        sql: program_daypart_selling_desc
        type: string
        title: Program Selling Daypart
        description: Selling description of the program daypart (PROGRAM_DAYPART_SELLING_DESC).
  # CARL-4185 CNN Current Booked. PROGRAM_AVERAGE_DIM and TELECAST_DIM landed in gold on 2026-10-27.
  # Only the join key and the report label are on each cube. program_avg_daypart_dim is a different table.
  - name: cube_carl_dwhprd_gold_program_average_dim
    sql_table: "{{ catalog('dwhprd_gold') }}.program_average_dim"
    data_source: default
    public: false
    title: Carl Dwhprd Gold — Program Average Dim
    description: >-
      Program average label for an invoice spot. MicroStrategy joins PROGRAM_AVERAGE_DIM on
      INVOICE_REVENUE_FACT.PROGRAM_AVG_KEY and selects PROGRAM_AVG_DESC. This is not
      program_avg_daypart_dim.
    dimensions:
      - name: program_avg_key
        sql: program_avg_key
        type: number
        primary_key: true
        title: Program Average Key
        description: Surrogate key for the program average. MicroStrategy joins on PROGRAM_AVG_KEY.
      - name: program_avg_desc
        sql: program_avg_desc
        type: string
        title: Program Average
        description: Program average name from PROGRAM_AVERAGE_DIM.PROGRAM_AVG_DESC.
