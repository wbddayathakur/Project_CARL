  - name: cube_carl_dwhprd_gold_calendar_month_dim
    sql: >
      SELECT m.*,
             m.calendar_month_name || ' ' || CAST(m.calendar_year AS VARCHAR) AS calendar_month_label
        FROM {{ catalog('dwhprd_gold') }}.calendar_month_dim m
    data_source: default
    public: false
    title: Carl Dwhprd Gold — Calendar Month Dim
    description: >-
      Calendar month/quarter/year rollup dimension, joined directly off campaign_fact via calendar_month_key.
      Carries the full month-through-year rollup inline; calendar_qtr_dim is joined separately off the same fact
      via its own calendar_qtr_key FK, not derived from this cube's hierarchy.
      calendar_month_label is computed in this SQL, on this table alone. The SQL API
      join then selects that column. It does not concatenate calendar_year in the
      outer query, where calendar_year_dim has the same column name. CLab Revenue
      in QA on 2026-10-24 failed the QuickSight group-by on Month for that reason.
    dimensions:
      - name: calendar_month_key
        sql: calendar_month_key
        type: number
        title: Calendar Month Key
        description: Surrogate key uniquely identifying each calendar month.
        primary_key: true
      - name: calendar_month_name
        sql: calendar_month_name
        type: string
        title: Calendar Month Name (raw)
        description: Raw month name. Use calendar_month_label for the formatted "Month" value.
      - name: calendar_year
        sql: calendar_year
        type: number
        title: Calendar Year (raw)
        description: Raw calendar year, used to build calendar_month_label.
      - name: calendar_month_label
        sql: calendar_month_label
        type: string
        title: Month
        description: >-
          Formatted "<Month Name> <Year>" label, reproducing MSTR's custom column
          (CustCol_400/CustCol_3). The value is the calendar_month_label column
          computed in this cube's SQL from calendar_month_name and calendar_year
          on calendar_month_dim. The SQL API selects that column. CLab Revenue
          in QA on 2026-10-24 failed when QuickSight grouped by Month, because
          the old expression named calendar_year in a join that also included
          calendar_year_dim.
      - name: calendar_month_num
        sql: calendar_month_num
        type: number
        title: Calendar Month Number
        description: >-
          Month number (1-12). Present on calendar_month_dim in Glue (int). The Digital
          Analysis report reads this from the month dimension.
      - name: calendar_qtr_key
        sql: calendar_qtr_key
        type: number
        title: Calendar Quarter Key
        description: >-
          Foreign key to calendar_qtr_dim. Present on calendar_month_dim in Glue (int).
          Digital Analysis reaches quarter through the month. For region 21 and year 2026,
          every digital_fact row matched a quarter (probed 2026-10-05).
    joins:
      - name: cube_carl_dwhprd_gold_calendar_qtr_dim
        sql: '{CUBE}.calendar_qtr_key = {cube_carl_dwhprd_gold_calendar_qtr_dim}.calendar_qtr_key'
        relationship: many_to_one
  - name: cube_carl_dwhprd_gold_calendar_qtr_dim
