    public: false
    title: Carl Dwhprd Gold — Actual Air Daypart Dim
    description: >-
      A dimension table that defines actual air dayparts, representing specific time slots and day combinations used for broadcast
      scheduling and selling. It contains daypart characteristics, network associations, groupings, and validity dates for
      tracking daypart definitions over time.
    dimensions:
      - name: act_air_daypart_day_time_name
        sql: act_air_daypart_day_time_name
        type: string
        title: Actual Aired Daytime Daypart
        description: Human-readable name describing the daypart's day and time characteristics.
      - name: act_air_daypart_days
        sql: act_air_daypart_days
        type: number
        title: Act Air Daypart Days
        description: Number of days per week that this daypart runs.
      - name: act_air_daypart_end_date
        sql: act_air_daypart_end_date
        type: time
        title: Act Air Daypart End Date
        description: Effective end date when this daypart definition ceased to be active.
      - name: act_air_daypart_group_desc
        sql: act_air_daypart_group_desc
        type: string
        title: Actual Aired Daypart Group
        description: Description of the daypart group or category.
      - name: act_air_daypart_group_key
        sql: act_air_daypart_group_key
        type: number
        title: Act Air Daypart Group Key
        description: Key linking to a daypart group or category for organizational purposes.
      - name: act_air_daypart_hours
        sql: act_air_daypart_hours
        type: number
        title: Act Air Daypart Hours
        description: Number of hours per day that comprise this daypart.
      - name: act_air_daypart_id
        sql: act_air_daypart_id
        type: number
        title: Act Air Daypart Id
        description: Business identifier for the actual air daypart.
      - name: act_air_daypart_selling_desc
        sql: act_air_daypart_selling_desc
        type: string
        title: Actual Aired Selling Daypart
        description: Description of the daypart used for sales and commercial purposes.
      - name: act_air_daypart_start_date
        sql: act_air_daypart_start_date
        type: time
        title: Act Air Daypart Start Date
        description: Effective start date when this daypart definition became active.
      - name: act_air_daypart_summary_desc
        sql: act_air_daypart_summary_desc
        type: string
        title: Actual Aired Daypart Summary
        description: Description of the daypart summary category or classification.
      - name: act_air_daypart_summary_key
        sql: act_air_daypart_summary_key
        type: number
        title: Act Air Daypart Summary Key
        description: Key linking to a daypart summary grouping or classification.
      - name: act_air_daypart_total_hours
        sql: act_air_daypart_total_hours
        type: number
        title: Act Air Daypart Total Hours
        description: Total hours per week for this daypart (hours × days).
      - name: act_air_total_day_ind_desc
        sql: act_air_total_day_ind_desc
        type: string
        title: Actual Aired Total Day Ind
        description: Description indicating whether this daypart is a total day or partial day classification.
      - name: act_air_total_day_ind_key
        sql: act_air_total_day_ind_key
        type: number
        title: Act Air Total Day Ind Key
        description: Key indicating whether this daypart represents a total day or partial day indicator.
      - name: actual_air_daypart_key
        sql: actual_air_daypart_key
        type: number
        title: Actual Aired Daypart Key
        description: Surrogate key uniquely identifying each daypart record in the dimension table.
        primary_key: true
      - name: create_ts
        sql: create_ts
        type: time
        title: Create Ts
        description: Timestamp when the record was created in the data warehouse.
      - name: end_ts
        sql: end_ts
        type: time
        title: End Ts
        description: Timestamp marking the end of validity for this record version in a slowly changing dimension.
      - name: ingest_timestamp_utc
        sql: ingest_timestamp_utc
        type: time
        title: Ingest Timestamp Utc
        description: UTC timestamp when the record was ingested into the data warehouse.
      - name: net_name
        sql: net_name
        type: string
        title: Net Name
        description: Name of the network associated with this daypart.
      - name: network_key
        sql: network_key
        type: number
        title: Network Key
        description: Foreign key linking to the network dimension table.
      - name: source_file
        sql: source_file
        type: string
        title: Source File
        description: Name of the source file from which this record was ingested.
      - name: update_ts
        sql: update_ts
        type: time
        title: Update Ts
        description: Timestamp when the record was last updated in the data warehouse.
  - name: cube_carl_dwhprd_gold_advertiser_dim
    sql_table: "{{ catalog('dwhprd_gold') }}.advertiser_dim"
    data_source: default
    public: false
    title: Carl Dwhprd Gold — Advertiser Dim
    description: >-
      A dimension table containing core advertiser information including contact details, address, and status flags. This
      table maintains a complete history of advertiser records with effective dating and audit timestamps.
    dimensions:
      - name: adv_active_flag
        sql: adv_active_flag
