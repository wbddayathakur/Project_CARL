  # Members are inherited from cube_carl_dwhprd_gold_spot_fact.
  - name: cube_carl_dwhprd_gold_amnistia_spot_fact
    extends: cube_carl_dwhprd_gold_spot_fact
    sql: >
      SELECT sf.spot_id, sf.source_system_region_key, sf.campaign_key, sf.channel_key,
             sf.day_key, sf.break_key, sf.business_type_key, sf.base_currency_key,
             sf.base_currency_year, sf.spot_time_key, sf.charge_type_key, sf.spot_status_key,
             sf.calendar_month_key, sf.calendar_qtr_key, sf.calendar_year_key,
             sf.calendar_week_key, sf.program_key, sf.product_key, sf.corp_daypart_key,
             sf.country_key, sf.spot_daypart_key,
             sf.spot_length, sf.spot_length_factor, sf.spots_booked, sf.spot_seconds,
             sf.spot_clock_number, sf.spot_cpt, sf.spot_cps, sf.spot_cpp,
             sf.spot_version_length,
             CAST(sf.spot_version_last_air_date AS timestamp(3)) AS spot_version_last_air_date,
             CAST(sf.spot_version_expiry_date AS timestamp(3)) AS spot_version_expiry_date,
             sf.spot_crt_1, sf.spot_crt_2, sf.spot_crt_3, sf.spot_crt_4,
             sf.spot_clock_hour,
             sf.broadcast_month_key, sf.broadcast_week_key, sf.broadcast_year_key,
             sf.demographic_key,
             sf.spot_price, sf.gross_revenue, sf.agency_commission_pct,
             sf.agency_commission_pct * 100 AS agency_commission_pct_points,
             sf.rep_commission_pct, sf.agency_incentive_pct,
             sf.spot_actual_impacts, sf.spot_actual_imps_base_length,
             sf.spot_actual_rat_base_length, sf.spot_actual_ratings,
             srf.sales_rep_key, srf.sales_rep_name, srf.sales_rep_revenue_share,
             srf.sales_rep_team_key, srf.sales_rep_team_desc,
             CASE
               WHEN rep.sales_rep_name IS NOT NULL THEN rep.sales_rep_name
               WHEN sf.source_system_region_key = 30 THEN 'ITALY N/A'
               WHEN sf.source_system_region_key = 20 THEN 'DNAP N/A'
               ELSE 'DLA N/A'
             END AS bts_sales_rep_name,
             curr.exchange_factor AS plan_curr_exchange_factor,
             hist.exchange_factor AS plan_hist_exchange_factor,
             date_format(
               date_add(
                 'day',
                 -((day_of_year(CAST(d.day_date AS date)) - 1) % 7),
                 CAST(d.day_date AS date)
               ),
               '%m/%d'
             ) AS week_of
        FROM {{ catalog('dwhprd_gold') }}.spot_fact sf
        LEFT JOIN {{ catalog('dwhprd_gold') }}.sales_rep_fraction_fact srf
          ON sf.campaign_key = srf.campaign_key
        LEFT JOIN {{ catalog('dwhprd_gold') }}.bts_sales_rep_dim rep
          ON srf.sales_rep_key = rep.sales_rep_key
        LEFT JOIN {{ catalog('dwhprd_gold') }}.day_dim d
          ON sf.day_key = d.day_key
        LEFT JOIN {{ catalog('dwhprd_gold') }}.plan_curr_currency_rate curr
          ON sf.base_currency_key = curr.base_currency_key
        LEFT JOIN {{ catalog('dwhprd_gold') }}.plan_hist_currency_rate hist
          ON sf.base_currency_key = hist.base_currency_key
         AND sf.base_currency_year = hist.base_currency_year
       WHERE sf.source_system_region_key = 21
    public: false
    title: Carl Dwhprd Gold — Amnistia Spot Fact
    description: >-
      Spot fact for Reporte de Transmision Amnistia - Argentina. Same SQL as
      cube_carl_dwhprd_gold_spot_fact, limited to source_system_region_key = 21.
      Campaign ids C0125494, C0125495, and C0128072 also exist in region 30.
      Those Italy rows are 30, 60, and 34 spots. Leaving them in the view made
      Spots Booked 93, 86, and 61. Region 21 is 63, 26, and 27, and each
      campaign's sales-rep shares sum to 1.
