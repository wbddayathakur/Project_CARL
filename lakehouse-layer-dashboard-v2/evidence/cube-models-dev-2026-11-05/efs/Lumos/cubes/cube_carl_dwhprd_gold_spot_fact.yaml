    measures:
      - name: record_count
        sql: '*'
        type: count
        title: Record Count
        description: >-
          Row count after the sales-rep join. A campaign with several reps
          counts once per rep. For a smoke query, not the Spots Booked metric.
        meta:
          source: generated
          used_by_report_ids: []
      - name: spots_booked
        sql: "{CUBE}.spots_booked * COALESCE({CUBE}.sales_rep_revenue_share, 1)"
        type: sum
        title: Spots Booked
        description: >-
          Sum of spots_booked multiplied by sales-rep revenue share. An
          unallocated campaign uses share 1, matching SPOT_FACT_VW's
          NVL(SALES_REP_REVENUE_SHARE, 1).
      - name: spot_seconds
        sql: "{CUBE}.spot_seconds * COALESCE({CUBE}.sales_rep_revenue_share, 1)"
        type: sum
        title: Spot Seconds
        description: >-
          Sum of spot_seconds multiplied by sales-rep revenue share. An
          unallocated campaign uses share 1.
      - name: equivalent_spots
        sql: "{spot_seconds} / 30"
        type: number
        title: Dynamic Booked Equivalent Spots
        description: >-
          Spot Seconds divided by 30. The 30 is the answered Spot Analysis
          prompt for seconds in one spot. It is not a filter and not a column.
      - name: spot_price_loc
        sql: "{CUBE}.spot_price * COALESCE({CUBE}.sales_rep_revenue_share, 1)"
        type: sum
        title: Spot Price LOC
        description: >-
          Sum of spot_price in local currency, multiplied by sales-rep revenue
          share. An unallocated campaign uses share 1. This is the
          local-currency price.
      - name: net_revenue_loc
        sql: >-
          CAST({CUBE}.gross_revenue AS DOUBLE) * COALESCE({CUBE}.sales_rep_revenue_share, 1)
          * (1 - {CUBE}.agency_commission_pct)
        type: sum
        title: Net Revenue LOC (Spots)
        description: >-
          Sum of gross_revenue * sales-rep revenue share * (1 - agency_commission_pct),
          in local currency. gross_revenue is cast to DOUBLE before multiplying,
          because the three decimal(38,10) factors overflow Athena's decimal
          precision when summed. An unallocated campaign uses share 1. This is
          not a sum of a stored net-revenue column. This is the
          local-currency net.
      - name: spot_price_current_rate_usd
        sql: >-
          CAST({CUBE}.spot_price AS DOUBLE) * COALESCE({CUBE}.sales_rep_revenue_share, 1)
          * CAST({CUBE}.plan_curr_exchange_factor AS DOUBLE)
        type: sum
        title: Spot Price Current Rate (USD)
        description: >-
          Sum of spot price times sales-rep revenue share times the current
          planned exchange factor. An unallocated campaign uses share 1. A
          missing rate makes the product null, so that spot is left out of
          the sum. This is the numerator of the WBDL average unit rate. It
          is not itself a column on the WBDL grid. spot_price and the rate
          are cast to DOUBLE before multiplying so the decimal factors do
          not overflow Athena.
      - name: net_revenue_current_rate_usd
        sql: >-
          CAST({CUBE}.gross_revenue AS DOUBLE) * COALESCE({CUBE}.sales_rep_revenue_share, 1)
          * (1 - {CUBE}.agency_commission_pct)
          * CAST({CUBE}.plan_curr_exchange_factor AS DOUBLE)
        type: sum
        title: Net Revenue Current Rate (USD - Spots)
        description: >-
          Sum of gross revenue times sales-rep revenue share times
          (1 - agency commission) times the current planned exchange factor.
          Same shape as net_revenue_loc, with the planned rate applied. An
          unallocated campaign uses share 1. A missing rate drops that spot
          from the sum. gross_revenue and the rate are cast to DOUBLE before
          multiplying.
      - name: avg_equiv_unit_current_rate_usd
        sql: "{spot_price_current_rate_usd} / NULLIF({equivalent_spots}, 0)"
        type: number
        title: Dynamic Avg Equiv Unit Current Rate (USD)
        description: >-
          Current-rate spot price divided by equivalent spots, after the
          grid totals. Equivalent spots are spot seconds divided by 30.
          This is not an average of the row-level rates.
      - name: avg_current_rate_usd_rounded
        sql: "ROUND({avg_equiv_unit_current_rate_usd}, 2)"
        type: number
        title: Avg Current Rate USD-ROUNDED
        description: >-
          Dynamic Avg Equiv Unit Current Rate(USD) rounded to 2 decimal
          places after the totals. Dashboard Spot Report - Argentina Q1'25
          calculates this in the view.
      - name: bonus_indicator
        sql: "CASE WHEN ROUND({avg_equiv_unit_current_rate_usd}, 2) = 0 THEN 'Bonus' ELSE 'Paid' END"
        type: string
        title: Bonus Indicator
        description: >-
          Bonus when the rounded current-rate equivalent unit rate is 0,
          otherwise Paid. Evaluated after the totals, at the query grain.
      - name: spot_price_hist_rate_usd
        sql: >-
          CAST({CUBE}.spot_price AS DOUBLE) * COALESCE({CUBE}.sales_rep_revenue_share, 1)
          * CAST({CUBE}.plan_hist_exchange_factor AS DOUBLE)
        type: sum
        title: Spot Price Hist Rate (USD)
        description: >-
          Sum of spot price times sales-rep share times the historical planned
          exchange factor. A missing rate leaves that spot out of the sum.
      - name: spot_actual_impacts
        sql: "{CUBE}.spot_actual_impacts * COALESCE({CUBE}.sales_rep_revenue_share, 1)"
        type: sum
        title: Spot Actual Impacts
        description: Sum of spot actual impacts times sales-rep share.
      - name: spot_actual_imps_base_length
        sql: "{CUBE}.spot_actual_imps_base_length * COALESCE({CUBE}.sales_rep_revenue_share, 1)"
        type: sum
        title: Spot Actual Imps Base Length
        description: Sum of base-length impacts times sales-rep share.
      - name: spot_actual_rat_base_length
        sql: "{CUBE}.spot_actual_rat_base_length * COALESCE({CUBE}.sales_rep_revenue_share, 1)"
        type: sum
        title: Spot Actual Ratings Base Length
        description: Sum of base-length ratings times sales-rep share.
      - name: spot_actual_ratings
        sql: "{CUBE}.spot_actual_ratings * COALESCE({CUBE}.sales_rep_revenue_share, 1)"
        type: sum
        title: Spot Actual Ratings
        description: Sum of spot actual ratings times sales-rep share.
      - name: agency_commission_loc
        sql: >-
          CAST({CUBE}.gross_revenue AS DOUBLE) * COALESCE({CUBE}.sales_rep_revenue_share, 1)
          * {CUBE}.agency_commission_pct
        type: sum
        title: Agency Commission LOC
        description: Sum of gross revenue times share times the agency commission rate, in local currency.
      - name: agency_commission_current_rate_usd
        sql: >-
          CAST({CUBE}.gross_revenue AS DOUBLE) * COALESCE({CUBE}.sales_rep_revenue_share, 1)
          * {CUBE}.agency_commission_pct
          * CAST({CUBE}.plan_curr_exchange_factor AS DOUBLE)
        type: sum
        title: Agency Commission Current Rate (USD)
        description: Agency commission in local currency times the current planned exchange factor.
      - name: agency_commission_hist_rate_usd
        sql: >-
          CAST({CUBE}.gross_revenue AS DOUBLE) * COALESCE({CUBE}.sales_rep_revenue_share, 1)
          * {CUBE}.agency_commission_pct
          * CAST({CUBE}.plan_hist_exchange_factor AS DOUBLE)
        type: sum
        title: Agency Commission Hist Rate (USD)
        description: Agency commission in local currency times the historical planned exchange factor.
      - name: sales_commission_loc
        sql: >-
          CAST({CUBE}.gross_revenue AS DOUBLE) * COALESCE({CUBE}.sales_rep_revenue_share, 1)
          * {CUBE}.rep_commission_pct
        type: sum
        title: Sales Commission LOC
        description: Sum of gross revenue times share times the rep commission rate, in local currency.
      - name: sales_commission_current_rate_usd
        sql: >-
          CAST({CUBE}.gross_revenue AS DOUBLE) * COALESCE({CUBE}.sales_rep_revenue_share, 1)
          * {CUBE}.rep_commission_pct
          * CAST({CUBE}.plan_curr_exchange_factor AS DOUBLE)
        type: sum
        title: Sales Commission Current Rate (USD)
        description: Sales commission in local currency times the current planned exchange factor.
      - name: sales_commission_hist_rate_usd
        sql: >-
          CAST({CUBE}.gross_revenue AS DOUBLE) * COALESCE({CUBE}.sales_rep_revenue_share, 1)
          * {CUBE}.rep_commission_pct
          * CAST({CUBE}.plan_hist_exchange_factor AS DOUBLE)
        type: sum
        title: Sales Commission Hist Rate (USD)
        description: Sales commission in local currency times the historical planned exchange factor.
      - name: net_revenue_hist_rate_usd
        sql: >-
          CAST({CUBE}.gross_revenue AS DOUBLE) * COALESCE({CUBE}.sales_rep_revenue_share, 1)
          * (1 - {CUBE}.agency_commission_pct)
          * CAST({CUBE}.plan_hist_exchange_factor AS DOUBLE)
        type: sum
        title: Net Revenue Hist Rate (USD)
        description: >-
          Net revenue in local currency times the historical planned exchange
          factor. This is SPOT_BASE_BREAK_PRICE_CURRENT1 in the report SQL.
      - name: net_net_revenue_loc
        sql: >-
          CAST({CUBE}.gross_revenue AS DOUBLE) * COALESCE({CUBE}.sales_rep_revenue_share, 1)
          * (1 - {CUBE}.agency_commission_pct) * (1 - {CUBE}.agency_incentive_pct)
        type: sum
        title: Net Net Revenue LOC
        description: Net revenue after the agency incentive, in local currency.
      - name: net_net_revenue_current_rate_usd
        sql: >-
          CAST({CUBE}.gross_revenue AS DOUBLE) * COALESCE({CUBE}.sales_rep_revenue_share, 1)
          * (1 - {CUBE}.agency_commission_pct) * (1 - {CUBE}.agency_incentive_pct)
          * CAST({CUBE}.plan_curr_exchange_factor AS DOUBLE)
        type: sum
        title: Net Net Revenue Current Rate (USD)
        description: Net net revenue in local currency times the current planned exchange factor.
      - name: net_net_revenue_hist_rate_usd
        sql: >-
          CAST({CUBE}.gross_revenue AS DOUBLE) * COALESCE({CUBE}.sales_rep_revenue_share, 1)
          * (1 - {CUBE}.agency_commission_pct) * (1 - {CUBE}.agency_incentive_pct)
          * CAST({CUBE}.plan_hist_exchange_factor AS DOUBLE)
        type: sum
        title: Net Net Revenue Hist Rate (USD)
        description: Net net revenue in local currency times the historical planned exchange factor.
      - name: avg_equiv_unit_rate
        sql: "{spot_price_loc} / NULLIF({equivalent_spots}, 0)"
        type: number
        title: Dynamic Avg Equiv Unit Rate
        description: Local spot price divided by equivalent spots after the totals. The divisor is 30 seconds.
      - name: avg_unequiv_spot_price_loc
        sql: "{spot_price_loc} / NULLIF({spots_booked}, 0)"
        type: number
        title: Avg Unequiv Spot Price LOC
        description: Local spot price divided by spots booked after the totals.
      - name: avg_equiv_unit_hist_rate_usd
        sql: "{spot_price_hist_rate_usd} / NULLIF({equivalent_spots}, 0)"
        type: number
        title: Dynamic Avg Equiv Unit Hist Rate (USD)
        description: Historical-rate spot price divided by equivalent spots after the totals.
      - name: avg_unequiv_spot_price_current_rate_usd
        sql: "{spot_price_current_rate_usd} / NULLIF({spots_booked}, 0)"
        type: number
        title: Avg Unequiv Spot Price Current Rate (USD)
        description: Current-rate spot price divided by spots booked after the totals.
      - name: avg_unequiv_spot_price_hist_rate_usd
        sql: "{spot_price_hist_rate_usd} / NULLIF({spots_booked}, 0)"
        type: number
        title: Avg Unequiv Spot Price Hist Rate (USD)
        description: Historical-rate spot price divided by spots booked after the totals.
      - name: pct_spot_price_loc
        sql: "{spot_price_loc}"
        type: number
        title: "% of Total Spot Price LOC"
        description: >-
          Local spot price. MicroStrategy divides this amount by its total
          after the grid is drawn. The member carries the amount.
      - name: pct_spot_price_current_rate_usd
        sql: "{spot_price_current_rate_usd}"
        type: number
        title: "% of Total Spot Price Current Rate USD)"
        description: >-
          Current-rate spot price. MicroStrategy divides this amount by its
          total after the grid is drawn. The member carries the amount.
      - name: pct_spot_price_hist_rate_usd
        sql: "{spot_price_hist_rate_usd}"
        type: number
        title: "% of Total Spot Price Hist Rate (USD)"
        description: >-
          Historical-rate spot price. MicroStrategy divides this amount by its
          total after the grid is drawn. The member carries the amount.

      - name: gross_revenue_loc
        sql: >-
          CAST({CUBE}.gross_revenue AS DOUBLE) * COALESCE({CUBE}.sales_rep_revenue_share, 1)
        type: sum
        title: Gross Revenue LOC
        description: Sum of gross revenue times sales-rep share, in local currency.
      - name: gross_revenue_current_rate_usd
        sql: >-
          CAST({CUBE}.gross_revenue AS DOUBLE) * COALESCE({CUBE}.sales_rep_revenue_share, 1)
          * CAST({CUBE}.plan_curr_exchange_factor AS DOUBLE)
        type: sum
        title: Gross Revenue Current Rate(USD)
        description: Gross revenue times share times the current planned exchange factor.
      - name: gross_revenue_hist_rate_usd
        sql: >-
          CAST({CUBE}.gross_revenue AS DOUBLE) * COALESCE({CUBE}.sales_rep_revenue_share, 1)
          * CAST({CUBE}.plan_hist_exchange_factor AS DOUBLE)
        type: sum
        title: Gross Revenue Hist Rate(USD)
        description: Gross revenue times share times the historical planned exchange factor.
      - name: agency_incentive_loc
        sql: >-
          CAST({CUBE}.gross_revenue AS DOUBLE) * COALESCE({CUBE}.sales_rep_revenue_share, 1)
          * (1 - {CUBE}.agency_commission_pct) * {CUBE}.agency_incentive_pct
        type: sum
        title: Agency Incentive LOC
        description: Rep-allocated agency incentive in local currency.
      - name: agency_incentive_current_rate_usd
        sql: >-
          CAST({CUBE}.gross_revenue AS DOUBLE) * COALESCE({CUBE}.sales_rep_revenue_share, 1)
          * (1 - {CUBE}.agency_commission_pct) * {CUBE}.agency_incentive_pct
          * CAST({CUBE}.plan_curr_exchange_factor AS DOUBLE)
        type: sum
        title: Agency Incentive Current Rate(USD)
        description: Agency incentive in local currency times the current planned exchange factor.
      - name: agency_incentive_hist_rate_usd
        sql: >-
          CAST({CUBE}.gross_revenue AS DOUBLE) * COALESCE({CUBE}.sales_rep_revenue_share, 1)
          * (1 - {CUBE}.agency_commission_pct) * {CUBE}.agency_incentive_pct
          * CAST({CUBE}.plan_hist_exchange_factor AS DOUBLE)
        type: sum
        title: Agency Incentive Hist Rate(USD)
        description: Agency incentive in local currency times the historical planned exchange factor.
      - name: agency_commission_pct_avg
        sql: agency_commission_pct
        type: avg
        title: Agency Commission %
        description: Average agency commission rate. The version report SQL averages this rate.
      - name: agency_incentive_pct_avg
        sql: agency_incentive_pct
        type: avg
        title: Agency Incentive %
        description: Average agency incentive rate. The version report SQL averages this rate.
      - name: rep_commission_pct_avg
        sql: rep_commission_pct
        type: avg
        title: Rep Commission %
        description: Average rep commission rate. The version report SQL averages this rate.
      - name: sales_rep_revenue_share_avg
        sql: sales_rep_revenue_share
        type: avg
        title: Sales Rep Revenue Share
        description: Average sales-rep revenue share. The version report SQL averages this share.
