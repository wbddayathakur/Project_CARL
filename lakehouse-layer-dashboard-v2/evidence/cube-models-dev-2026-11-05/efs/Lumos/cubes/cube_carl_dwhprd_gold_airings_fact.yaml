cubes:
  - name: cube_carl_dwhprd_gold_airings_fact
    sql_table: "{{ catalog('dwhprd_gold') }}.airings_fact"
    data_source: default
    public: false
    title: Carl Dwhprd Gold — Airings Fact
    description: >-
      One row per content airing (a scheduled broadcast instance), the content-airings star. Distinct from
      program_airing_dim (a different, non-fact table at program-airing grain covering a similar but not identical
      concept) and from the advertising-revenue star (invoice_revenue_fact). MicroStrategy's SQL calls both
      episode domains EPISODE_DIM, but this model keeps them separate: the existing advertising-side episode_dim
      path remains unchanged for episode_number, episode_id, and episode_short_desc, while the HIVEDWH
      hivedwh_episode_dim path joins by episode_key and supplies the content episode universe and its scheduling,
      premiere, distribution-channel, source-episode, and repackaging attributes. One consumer only needs
      EPISODE_SLOT_LENGTH, which this fact carries as its own column (no join needed); additive content_episode_*
      aliases expose selected HIVEDWH attributes without repointing the advertising members. This fact also
      supports a hybrid consumer that joins into the "deals and rights" star (deal_project_dim,
      deal_io_part_prog_dim, internal_offer_type_dim). EPS_REPACKAGE_TYPE_NAME is still unavailable because the
      HIVEDWH table carries the repackage type key but not its display name, so that attribute remains deferred.
    dimensions:
      - name: corporate_daypart_label
        sql: |-
          (
            SELECT hop1.corporate_daypart_selling_desc || ' (' || hop1.corporate_daypart_name || ')'
            FROM {{ catalog('dwhprd_gold') }}.corporate_daypart_dim hop1
            WHERE {CUBE}.corporate_daypart_key = hop1.corporate_daypart_key
          )
        type: string
        title: Corporate Daypart
        description: '"<selling description> (<name>)", e.g. "Prime (P)", read via airings_fact''s corporate_daypart_key join. Matches MicroStrategy''s own concatenation. Defined
          here rather than on airings_fact because Cube.js does not allow a member''s SQL to reference the same foreign cube''s columns more than once in one formula; a same-cube
          self-reference has no such limit.'
      - name: airing_month
        sql: |-
          (
            SELECT CASE WHEN hop1.calendar_month_name = 'N/A' THEN NULL ELSE TRIM(hop1.calendar_month_name) || ' ' || substr(CAST(hop1.calendar_month_key AS VARCHAR), 1, 4) END
            FROM {{ catalog('dwhprd_gold') }}.day_dim hop1
            WHERE {CUBE}.local_bcast_day_key = hop1.day_key
          )
        type: string
        title: Airing Month
        description: '"<Month name> <year>" label for a day, e.g. "March 2024", read via airings_fact''s Local Broadcast Day role. Defined here rather than on airings_fact because
          Cube.js does not allow a member''s SQL to reference the same foreign cube''s columns more than once in one formula; this needs calendar_month_name and calendar_month_key
          from this cube twice over, which only a same-cube self-reference allows.'
      - name: calendar_year
        sql: |-
          (
            SELECT hop1.calendar_year
            FROM {{ catalog('dwhprd_gold') }}.day_dim hop1
            WHERE {CUBE}.local_bcast_day_key = hop1.day_key
          )
        type: number
        title: Calendar Year
        description: Calendar year for this day.
      - name: calendar_year_key
        sql: |-
          (
            SELECT hop1.calendar_year_key
            FROM {{ catalog('dwhprd_gold') }}.day_dim hop1
            WHERE {CUBE}.local_bcast_day_key = hop1.day_key
          )
        type: number
        title: Calendar Year Key
        description: Surrogate key for the calendar year, equal to calendar_year on this table.
      - name: day_date
        sql: |-
          (
            SELECT hop1.day_date
            FROM {{ catalog('dwhprd_gold') }}.day_dim hop1
            WHERE {CUBE}.local_bcast_day_key = hop1.day_key
          )
        type: time
        title: Day Date
        description: The calendar date this row represents.
      - name: day_num_in_week
        sql: |-
          (
            SELECT hop1.day_num_in_week
            FROM {{ catalog('dwhprd_gold') }}.day_dim hop1
            WHERE {CUBE}.local_bcast_day_key = hop1.day_key
          )
        type: number
        title: Day Number In Week
        description: Numeric day-of-week position, pairs with day_of_week_short.
      - name: day_of_week_short
        sql: |-
          (
            SELECT hop1.day_of_week_short
            FROM {{ catalog('dwhprd_gold') }}.day_dim hop1
            WHERE {CUBE}.local_bcast_day_key = hop1.day_key
          )
        type: string
        title: Day Of Week (Short)
        description: Abbreviated day-of-week name, e.g. Mon.
      - name: dc_eps_days_fm_last_airing
        sql: |-
          (
            SELECT hop1.dc_eps_days_fm_last_airing
            FROM {{ catalog('dwhprd_gold') }}.dc_episode_dim hop1
            WHERE {CUBE}.dc_episode_key = hop1.dc_episode_key
          )
        type: number
        title: Dc Eps Days From Last Airing
        description: Days elapsed since this episode last aired on this distribution channel.
      - name: dc_eps_last_air_bday_key
        sql: |-
          (
            SELECT hop1.dc_eps_last_air_bday_key
            FROM {{ catalog('dwhprd_gold') }}.dc_episode_dim hop1
            WHERE {CUBE}.dc_episode_key = hop1.dc_episode_key
          )
        type: number
        title: Dc Eps Last Air Bday Key
        description: Day key (YYYYMMDD) of this episode's most recent airing on this distribution channel.
      - name: dc_eps_next_air_bday_key
        sql: |-
          (
            SELECT hop1.dc_eps_next_air_bday_key
            FROM {{ catalog('dwhprd_gold') }}.dc_episode_dim hop1
            WHERE {CUBE}.dc_episode_key = hop1.dc_episode_key
          )
        type: number
        title: Dc Eps Next Air Bday Key
        description: Day key (YYYYMMDD) of this episode's next scheduled airing on this distribution channel; 21001231 is used as a sentinel for "none scheduled" and should be blanked
          out when parsed into a date.
      - name: dc_eps_reg_days_fm_last_airing
        sql: |-
          (
            SELECT hop1.dc_eps_reg_days_fm_last_airing
            FROM {{ catalog('dwhprd_gold') }}.dc_episode_dim hop1
            WHERE {CUBE}.dc_episode_key = hop1.dc_episode_key
          )
        type: number
        title: Dc Eps Regional Days From Last Airing
        description: Days elapsed since this episode last aired on this distribution channel's region.
      - name: dc_eps_reg_last_air_bday_key
        sql: |-
          (
            SELECT hop1.dc_eps_reg_last_air_bday_key
            FROM {{ catalog('dwhprd_gold') }}.dc_episode_dim hop1
            WHERE {CUBE}.dc_episode_key = hop1.dc_episode_key
          )
        type: number
        title: Dc Eps Regional Last Air Bday Key
        description: Day key (YYYYMMDD) of this episode's most recent airing on this distribution channel's region.
      - name: dc_eps_reg_next_air_bday_key
        sql: |-
          (
            SELECT hop1.dc_eps_reg_next_air_bday_key
            FROM {{ catalog('dwhprd_gold') }}.dc_episode_dim hop1
            WHERE {CUBE}.dc_episode_key = hop1.dc_episode_key
          )
        type: number
        title: Dc Eps Regional Next Air Bday Key
        description: Day key (YYYYMMDD) of this episode's next scheduled airing on this distribution channel's region.
      - name: dc_seas_days_fm_last_airing
        sql: |-
          (
            SELECT hop1.dc_seas_days_fm_last_airing
            FROM (SELECT * FROM ( SELECT *, row_number() OVER (PARTITION BY dc_season_key ORDER BY update_ts DESC) AS dedupe_rn FROM {{ catalog('dwhprd_gold') }}.dc_season_dim ) WHERE
            dedupe_rn = 1) hop1
            WHERE {CUBE}.dc_season_key = hop1.dc_season_key
          )
        type: number
        title: Dc Seas Days From Last Airing
        description: Days elapsed since this season last aired on this distribution channel.
      - name: dc_seas_last_air_bday_key
        sql: |-
          (
            SELECT hop1.dc_seas_last_air_bday_key
            FROM (SELECT * FROM ( SELECT *, row_number() OVER (PARTITION BY dc_season_key ORDER BY update_ts DESC) AS dedupe_rn FROM {{ catalog('dwhprd_gold') }}.dc_season_dim ) WHERE
            dedupe_rn = 1) hop1
            WHERE {CUBE}.dc_season_key = hop1.dc_season_key
          )
        type: number
        title: Dc Seas Last Air Bday Key
        description: Day key (YYYYMMDD) of this season's most recent airing on this distribution channel.
      - name: dc_seas_next_air_bday_key
        sql: |-
          (
            SELECT hop1.dc_seas_next_air_bday_key
            FROM (SELECT * FROM ( SELECT *, row_number() OVER (PARTITION BY dc_season_key ORDER BY update_ts DESC) AS dedupe_rn FROM {{ catalog('dwhprd_gold') }}.dc_season_dim ) WHERE
            dedupe_rn = 1) hop1
            WHERE {CUBE}.dc_season_key = hop1.dc_season_key
          )
        type: number
        title: Dc Seas Next Air Bday Key
        description: Day key (YYYYMMDD) of this season's next scheduled airing on this distribution channel.
      - name: dc_seas_prem_bday_key
        sql: |-
          (
            SELECT hop1.dc_seas_prem_bday_key
            FROM (SELECT * FROM ( SELECT *, row_number() OVER (PARTITION BY dc_season_key ORDER BY update_ts DESC) AS dedupe_rn FROM {{ catalog('dwhprd_gold') }}.dc_season_dim ) WHERE
            dedupe_rn = 1) hop1
            WHERE {CUBE}.dc_season_key = hop1.dc_season_key
          )
        type: number
        title: Dc Seas Prem Bday Key
        description: Day key (YYYYMMDD) this season premiered on this distribution channel. Anchor date for ' Year Grouping derived dimension, which buckets each airing by elapsed
          months since this date.
      - name: dc_seas_prem_date
        sql: |-
          (
            SELECT CASE WHEN hop1.dc_seas_prem_bday_key IS NULL OR hop1.dc_seas_prem_bday_key = 0 THEN NULL ELSE date_parse(CAST(CAST(hop1.dc_seas_prem_bday_key AS BIGINT) AS VARCHAR),
            '%Y%m%d') END
            FROM (SELECT * FROM ( SELECT *, row_number() OVER (PARTITION BY dc_season_key ORDER BY update_ts DESC) AS dedupe_rn FROM {{ catalog('dwhprd_gold') }}.dc_season_dim ) WHERE
            dedupe_rn = 1) hop1
            WHERE {CUBE}.dc_season_key = hop1.dc_season_key
          )
        type: time
        title: Distribution Channel Season Premiere Date
        description: dc_seas_prem_bday_key (YYYYMMDD integer) parsed into an actual date — the "Distribution Channel Season Premiere Date" attribute, previously exposed only as the
          raw undecoded key. Same CAST-to-BIGINT-then-VARCHAR-then-date_parse idiom proven by year_grouping against this exact column (decimal(38,10), hence the BIGINT hop), guarded
          against NULL/0 the same way.
      - name: dc_seas_reg_days_fm_last_airng
        sql: |-
          (
            SELECT hop1.dc_seas_reg_days_fm_last_airng
            FROM (SELECT * FROM ( SELECT *, row_number() OVER (PARTITION BY dc_season_key ORDER BY update_ts DESC) AS dedupe_rn FROM {{ catalog('dwhprd_gold') }}.dc_season_dim ) WHERE
            dedupe_rn = 1) hop1
            WHERE {CUBE}.dc_season_key = hop1.dc_season_key
          )
        type: number
        title: Dc Seas Regional Days From Last Airing
        description: Days elapsed since this season last aired on this distribution channel's region.
      - name: dc_seas_reg_last_air_bday_key
        sql: |-
          (
            SELECT hop1.dc_seas_reg_last_air_bday_key
            FROM (SELECT * FROM ( SELECT *, row_number() OVER (PARTITION BY dc_season_key ORDER BY update_ts DESC) AS dedupe_rn FROM {{ catalog('dwhprd_gold') }}.dc_season_dim ) WHERE
            dedupe_rn = 1) hop1
            WHERE {CUBE}.dc_season_key = hop1.dc_season_key
          )
        type: number
        title: Dc Seas Reg Last Air Bday Key
        description: Day key (YYYYMMDD) of this season's most recent airing on this distribution channel's region.
      - name: dc_seas_reg_next_air_bday_key
        sql: |-
          (
            SELECT hop1.dc_seas_reg_next_air_bday_key
            FROM (SELECT * FROM ( SELECT *, row_number() OVER (PARTITION BY dc_season_key ORDER BY update_ts DESC) AS dedupe_rn FROM {{ catalog('dwhprd_gold') }}.dc_season_dim ) WHERE
            dedupe_rn = 1) hop1
            WHERE {CUBE}.dc_season_key = hop1.dc_season_key
          )
        type: number
        title: Dc Seas Reg Next Air Bday Key
        description: Day key (YYYYMMDD) of this season's next scheduled airing on this distribution channel's region.
      - name: dc_seas_reg_prem_bday_key
        sql: |-
          (
            SELECT hop1.dc_seas_reg_prem_bday_key
            FROM (SELECT * FROM ( SELECT *, row_number() OVER (PARTITION BY dc_season_key ORDER BY update_ts DESC) AS dedupe_rn FROM {{ catalog('dwhprd_gold') }}.dc_season_dim ) WHERE
            dedupe_rn = 1) hop1
            WHERE {CUBE}.dc_season_key = hop1.dc_season_key
          )
        type: number
        title: Dc Seas Reg Prem Bday Key
        description: Day key (YYYYMMDD) this season premiered on this distribution channel's region.
      - name: dc_seas_reg_prem_date
        sql: |-
          (
            SELECT CASE WHEN hop1.dc_seas_reg_prem_bday_key IS NULL OR hop1.dc_seas_reg_prem_bday_key = 0 THEN NULL ELSE date_parse(CAST(CAST(hop1.dc_seas_reg_prem_bday_key AS BIGINT) AS
            VARCHAR), '%Y%m%d') END
            FROM (SELECT * FROM ( SELECT *, row_number() OVER (PARTITION BY dc_season_key ORDER BY update_ts DESC) AS dedupe_rn FROM {{ catalog('dwhprd_gold') }}.dc_season_dim ) WHERE
            dedupe_rn = 1) hop1
            WHERE {CUBE}.dc_season_key = hop1.dc_season_key
          )
        type: time
        title: Season Regional Premiere Date
        description: dc_seas_reg_prem_bday_key (YYYYMMDD integer) parsed into an actual date — the "Season Regional Premiere Date" attribute, previously exposed only as the raw undecoded
          key. Same idiom and decimal(38,10)-via-BIGINT rationale as dc_seas_prem_date.
      - name: dc_season_year_grouping
        sql: |-
          CASE WHEN {CUBE}.local_bcast_day_key IS NULL OR {CUBE}.local_bcast_day_key = 0 OR (
            SELECT hop1.dc_seas_prem_bday_key
            FROM (SELECT * FROM ( SELECT *, row_number() OVER (PARTITION BY dc_season_key ORDER BY update_ts DESC) AS dedupe_rn FROM {{ catalog('dwhprd_gold') }}.dc_season_dim ) WHERE
            dedupe_rn = 1) hop1
            WHERE {CUBE}.dc_season_key = hop1.dc_season_key
          ) IS NULL THEN NULL WHEN date_diff('month', date_trunc('month', date_parse(CAST(CAST((
            SELECT hop1.dc_seas_prem_bday_key
            FROM (SELECT * FROM ( SELECT *, row_number() OVER (PARTITION BY dc_season_key ORDER BY update_ts DESC) AS dedupe_rn FROM {{ catalog('dwhprd_gold') }}.dc_season_dim ) WHERE
            dedupe_rn = 1) hop1
            WHERE {CUBE}.dc_season_key = hop1.dc_season_key
          ) AS BIGINT) AS VARCHAR), '%Y%m%d')), date_trunc('month', date_parse(CAST(CAST({CUBE}.local_bcast_day_key AS BIGINT) AS VARCHAR), '%Y%m%d'))) BETWEEN 0 AND 11 THEN '0-11 months'
          WHEN date_diff('month', date_trunc('month', date_parse(CAST(CAST((
            SELECT hop1.dc_seas_prem_bday_key
            FROM (SELECT * FROM ( SELECT *, row_number() OVER (PARTITION BY dc_season_key ORDER BY update_ts DESC) AS dedupe_rn FROM {{ catalog('dwhprd_gold') }}.dc_season_dim ) WHERE
            dedupe_rn = 1) hop1
            WHERE {CUBE}.dc_season_key = hop1.dc_season_key
          ) AS BIGINT) AS VARCHAR), '%Y%m%d')), date_trunc('month', date_parse(CAST(CAST({CUBE}.local_bcast_day_key AS BIGINT) AS VARCHAR), '%Y%m%d'))) BETWEEN 12 AND 22 THEN '12-22 months'
          WHEN date_diff('month', date_trunc('month', date_parse(CAST(CAST((
            SELECT hop1.dc_seas_prem_bday_key
            FROM (SELECT * FROM ( SELECT *, row_number() OVER (PARTITION BY dc_season_key ORDER BY update_ts DESC) AS dedupe_rn FROM {{ catalog('dwhprd_gold') }}.dc_season_dim ) WHERE
            dedupe_rn = 1) hop1
            WHERE {CUBE}.dc_season_key = hop1.dc_season_key
          ) AS BIGINT) AS VARCHAR), '%Y%m%d')), date_trunc('month', date_parse(CAST(CAST({CUBE}.local_bcast_day_key AS BIGINT) AS VARCHAR), '%Y%m%d'))) BETWEEN 23 AND 33 THEN '23-33 months'
          WHEN date_diff('month', date_trunc('month', date_parse(CAST(CAST((
            SELECT hop1.dc_seas_prem_bday_key
            FROM (SELECT * FROM ( SELECT *, row_number() OVER (PARTITION BY dc_season_key ORDER BY update_ts DESC) AS dedupe_rn FROM {{ catalog('dwhprd_gold') }}.dc_season_dim ) WHERE
            dedupe_rn = 1) hop1
            WHERE {CUBE}.dc_season_key = hop1.dc_season_key
          ) AS BIGINT) AS VARCHAR), '%Y%m%d')), date_trunc('month', date_parse(CAST(CAST({CUBE}.local_bcast_day_key AS BIGINT) AS VARCHAR), '%Y%m%d'))) BETWEEN 34 AND 44 THEN '34-44 months'
          WHEN date_diff('month', date_trunc('month', date_parse(CAST(CAST((
            SELECT hop1.dc_seas_prem_bday_key
            FROM (SELECT * FROM ( SELECT *, row_number() OVER (PARTITION BY dc_season_key ORDER BY update_ts DESC) AS dedupe_rn FROM {{ catalog('dwhprd_gold') }}.dc_season_dim ) WHERE
            dedupe_rn = 1) hop1
            WHERE {CUBE}.dc_season_key = hop1.dc_season_key
          ) AS BIGINT) AS VARCHAR), '%Y%m%d')), date_trunc('month', date_parse(CAST(CAST({CUBE}.local_bcast_day_key AS BIGINT) AS VARCHAR), '%Y%m%d'))) BETWEEN 45 AND 55 THEN '45-55 months'
          WHEN date_diff('month', date_trunc('month', date_parse(CAST(CAST((
            SELECT hop1.dc_seas_prem_bday_key
            FROM (SELECT * FROM ( SELECT *, row_number() OVER (PARTITION BY dc_season_key ORDER BY update_ts DESC) AS dedupe_rn FROM {{ catalog('dwhprd_gold') }}.dc_season_dim ) WHERE
            dedupe_rn = 1) hop1
            WHERE {CUBE}.dc_season_key = hop1.dc_season_key
          ) AS BIGINT) AS VARCHAR), '%Y%m%d')), date_trunc('month', date_parse(CAST(CAST({CUBE}.local_bcast_day_key AS BIGINT) AS VARCHAR), '%Y%m%d'))) BETWEEN 56 AND 66 THEN '56-66 months'
          WHEN date_diff('month', date_trunc('month', date_parse(CAST(CAST((
            SELECT hop1.dc_seas_prem_bday_key
            FROM (SELECT * FROM ( SELECT *, row_number() OVER (PARTITION BY dc_season_key ORDER BY update_ts DESC) AS dedupe_rn FROM {{ catalog('dwhprd_gold') }}.dc_season_dim ) WHERE
            dedupe_rn = 1) hop1
            WHERE {CUBE}.dc_season_key = hop1.dc_season_key
          ) AS BIGINT) AS VARCHAR), '%Y%m%d')), date_trunc('month', date_parse(CAST(CAST({CUBE}.local_bcast_day_key AS BIGINT) AS VARCHAR), '%Y%m%d'))) BETWEEN 67 AND 77 THEN '67-77 months'
          WHEN date_diff('month', date_trunc('month', date_parse(CAST(CAST((
            SELECT hop1.dc_seas_prem_bday_key
            FROM (SELECT * FROM ( SELECT *, row_number() OVER (PARTITION BY dc_season_key ORDER BY update_ts DESC) AS dedupe_rn FROM {{ catalog('dwhprd_gold') }}.dc_season_dim ) WHERE
            dedupe_rn = 1) hop1
            WHERE {CUBE}.dc_season_key = hop1.dc_season_key
          ) AS BIGINT) AS VARCHAR), '%Y%m%d')), date_trunc('month', date_parse(CAST(CAST({CUBE}.local_bcast_day_key AS BIGINT) AS VARCHAR), '%Y%m%d'))) BETWEEN 78 AND 88 THEN '78-88 months'
          WHEN date_diff('month', date_trunc('month', date_parse(CAST(CAST((
            SELECT hop1.dc_seas_prem_bday_key
            FROM (SELECT * FROM ( SELECT *, row_number() OVER (PARTITION BY dc_season_key ORDER BY update_ts DESC) AS dedupe_rn FROM {{ catalog('dwhprd_gold') }}.dc_season_dim ) WHERE
            dedupe_rn = 1) hop1
            WHERE {CUBE}.dc_season_key = hop1.dc_season_key
          ) AS BIGINT) AS VARCHAR), '%Y%m%d')), date_trunc('month', date_parse(CAST(CAST({CUBE}.local_bcast_day_key AS BIGINT) AS VARCHAR), '%Y%m%d'))) BETWEEN 89 AND 99 THEN '89-99 months'
          WHEN date_diff('month', date_trunc('month', date_parse(CAST(CAST((
            SELECT hop1.dc_seas_prem_bday_key
            FROM (SELECT * FROM ( SELECT *, row_number() OVER (PARTITION BY dc_season_key ORDER BY update_ts DESC) AS dedupe_rn FROM {{ catalog('dwhprd_gold') }}.dc_season_dim ) WHERE
            dedupe_rn = 1) hop1
            WHERE {CUBE}.dc_season_key = hop1.dc_season_key
          ) AS BIGINT) AS VARCHAR), '%Y%m%d')), date_trunc('month', date_parse(CAST(CAST({CUBE}.local_bcast_day_key AS BIGINT) AS VARCHAR), '%Y%m%d'))) BETWEEN 100 AND 110 THEN
          '100-110 months' ELSE NULL END
        type: string
        title: Year Grouping
        description: 'Elapsed-month band between this airing''s local broadcast month and the season''s premiere month on this distribution channel (dc_season_dim.dc_seas_prem_bday_key)
          — ten bands, months 0-11 through 100-110. See custom_daypart (on time_dim) for the other half of MicroStrategy''s 20-way AIREDCOUNT/GODWFLAG encoding this replaces. Uses
          Cube''s cross-cube dimension reference notation (dot inside the braces) against dc_season_dim, which is already directly joined from this fact — a prior version used a
          raw correlated subquery instead (on the mistaken assumption that Cube.js disallows cross-cube dimension references entirely; it does not, see
          docs.cube.dev/data-modeling/dimensions#from-other-cubes),
          which compiled fine but failed at query time against Athena with "NOT_SUPPORTED: Given correlated subquery is not supported" — Athena''s Trino engine only supports a correlated
          subquery whose outer-table reference is confined to the WHERE clause; referencing the outer column inside the subquery''s own SELECT list (as the date-diff calculation
          here needed to) is rejected outright, even with a single level of nesting. Also casts both decimal(38,10) key columns through BIGINT before VARCHAR/date_parse, since a
          direct decimal-to-VARCHAR cast renders as "20070706.0000000000" and breaks the ''%Y%m%d'' format string.'
      - name: dc_show_days_fm_last_airing
        sql: |-
          (
            SELECT hop1.dc_show_days_fm_last_airing
            FROM {{ catalog('dwhprd_gold') }}.dc_show_dim hop1
            WHERE {CUBE}.dc_show_key = hop1.dc_show_key
          )
        type: number
        title: Dc Show Days From Last Airing
        description: Days elapsed since this show last aired on this distribution channel.
      - name: dc_show_last_air_bday_key
        sql: |-
          (
            SELECT hop1.dc_show_last_air_bday_key
            FROM {{ catalog('dwhprd_gold') }}.dc_show_dim hop1
            WHERE {CUBE}.dc_show_key = hop1.dc_show_key
          )
        type: number
        title: Dc Show Last Air Bday Key
        description: Day key (YYYYMMDD) of this show's most recent airing on this distribution channel.
      - name: dc_show_next_air_bday_key
        sql: |-
          (
            SELECT hop1.dc_show_next_air_bday_key
            FROM {{ catalog('dwhprd_gold') }}.dc_show_dim hop1
            WHERE {CUBE}.dc_show_key = hop1.dc_show_key
          )
        type: number
        title: Dc Show Next Air Bday Key
        description: Day key (YYYYMMDD) of this show's next scheduled airing on this distribution channel.
      - name: dc_show_reg_days_fm_last_airng
        sql: |-
          (
            SELECT hop1.dc_show_reg_days_fm_last_airng
            FROM {{ catalog('dwhprd_gold') }}.dc_show_dim hop1
            WHERE {CUBE}.dc_show_key = hop1.dc_show_key
          )
        type: number
        title: Dc Show Regional Days From Last Airing
        description: Days elapsed since this show last aired on this distribution channel's region.
      - name: dc_show_reg_last_air_bday_key
        sql: |-
          (
            SELECT hop1.dc_show_reg_last_air_bday_key
            FROM {{ catalog('dwhprd_gold') }}.dc_show_dim hop1
            WHERE {CUBE}.dc_show_key = hop1.dc_show_key
          )
        type: number
        title: Dc Show Reg Last Air Bday Key
        description: Day key (YYYYMMDD) of this show's most recent airing on this distribution channel's region.
      - name: dc_show_reg_next_air_bday_key
        sql: |-
          (
            SELECT hop1.dc_show_reg_next_air_bday_key
            FROM {{ catalog('dwhprd_gold') }}.dc_show_dim hop1
            WHERE {CUBE}.dc_show_key = hop1.dc_show_key
          )
        type: number
        title: Dc Show Reg Next Air Bday Key
        description: Day key (YYYYMMDD) of this show's next scheduled airing on this distribution channel's region.
      - name: budget_category_desc
        sql: |-
          (
            SELECT hop2.budget_category_desc
            FROM {{ catalog('dwhprd_gold') }}.deal_io_part_prog_dim hop1
            LEFT JOIN {{ catalog('dwhprd_gold') }}.budget_category_dim hop2
              ON hop1.budget_category_key = hop2.budget_category_key
