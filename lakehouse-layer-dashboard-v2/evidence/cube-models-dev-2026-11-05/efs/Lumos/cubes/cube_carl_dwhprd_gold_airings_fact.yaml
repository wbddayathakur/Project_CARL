        type: number
        title: Airing Count (raw)
        description: Raw per-row airing count. Do not sum directly in ad-hoc queries; use the aired_count measure.
      - name: row_id
        sql: >-
          concat(cast({CUBE}.season_key as varchar), '|', cast({CUBE}.show_key as varchar), '|',
          cast({CUBE}.episode_key as varchar), '|', cast({CUBE}.distribution_channel_key as varchar), '|',
          cast({CUBE}.local_bcast_day_key as varchar), '|', cast({CUBE}.local_bcast_time_key as varchar), '|',
          cast({CUBE}.dc_episode_key as varchar), '|', cast({CUBE}.media_id as varchar), '|',
          cast({CUBE}.create_ts as varchar))
        type: string
        primary_key: true
        title: Row Id (synthetic)
        description: >-
          Cube.js requires a declared primary key on any cube that defines joins, for correct aggregate/pre-agg
          behavior. This table has no natural single-column row identifier — checked against dev data: no
          candidate column or combination tried was fully unique. This 9-column concatenation is the closest
          available proxy, resolving 49.4M of 55.6M rows (88.9%) to a distinct value; the remainder are genuine
          duplicate-looking rows in the source table (same key values, different underlying record), not a
          modelling gap here. Treat this as a technical surrogate for Cube's requirement, not a verified natural
          key — do not rely on it for exact per-row deduplication.
      - name: airing_future_count
