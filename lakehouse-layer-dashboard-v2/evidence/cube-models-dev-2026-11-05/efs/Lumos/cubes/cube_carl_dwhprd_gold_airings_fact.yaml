      - name: custom_daypart
        sql: |-
          (
            SELECT CASE WHEN hop1.time_hour_plus IS NULL THEN NULL WHEN hop1.time_hour_plus IN (20, 21, 22) THEN 'Prime (8-11pm)' ELSE 'Non-Prime' END
            FROM {{ catalog('dwhprd_gold') }}.time_dim hop1
            WHERE {CUBE}.local_bcast_time_key = hop1.time_key
          )
        type: string
        title: Custom Daypart
        description: Two-way prime split on the broadcast-day hour, read via airings_fact's Local Broadcast Time role. MicroStrategy's export encodes this as one of 20 AIREDCOUNT/GODWFLAG
          measure pairs (10 elapsed-month bands x 2 dayparts); here it is one of two dimensions the aired_count measure is grouped or filtered by instead — see year_grouping (on
          dc_season_dim) and aired_count. Defined here rather than on airings_fact because Cube.js does not allow a member's SQL to reference the same foreign cube's column more
          than once in one formula; a same-cube self-reference has no such limit.
      - name: time_wo_secs_plus
        sql: |-
          (
            SELECT hop1.time_wo_secs_plus
            FROM {{ catalog('dwhprd_gold') }}.time_dim hop1
            WHERE {CUBE}.local_bcast_time_key = hop1.time_key
          )
        type: string
        title: Time (without seconds, broadcast-day)
        description: Broadcast-day time without seconds, e.g. 8:00PM.
      - name: airing_count
