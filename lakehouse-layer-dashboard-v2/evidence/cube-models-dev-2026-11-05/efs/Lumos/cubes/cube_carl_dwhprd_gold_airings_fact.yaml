        type: number
        title: Distribution Channel Key
        description: Foreign key to distribution_channel_dim.
      - name: episode_key
        sql: episode_key
        type: number
        title: Episode Key
        description: >-
          Foreign key to episode_dim — the advertising-side dimension (property_key/network_key grain), not the
          content-side "EPISODE_DIM" MicroStrategy actually reads (see this cube's description for the
          collision). Joined anyway because episode_dim's episode_number/episode_id/episode_short_desc happen to
          overlap both tables' schemas — but probed against dev data at only 31.4% orphan-free (68.6% of
          airings_fact rows have no matching episode_dim row). Expect those three columns blank on most rows; see
          each column's own description on episode_dim.
      - name: participant_region_flag
        sql: participant_region_flag
        type: string
        title: Participant Region Flag (raw)
        description: Raw D/O/P/null code. Use participant_region_flag_desc for the decoded label.
      - name: deal_project_key
        sql: deal_project_key
        type: number
        title: Deal Project Key
        description: >-
          Foreign key to deal_project_dim, carrying the deal ID, title, contract ID and creation date for this
          airing's deal project.
      - name: deal_io_part_prog_key
        sql: deal_io_part_prog_key
        type: number
        title: Deal IO Participant Program Key
        description: >-
          Part of the composite key (with internal_offer_key) this fact joins deal_io_part_prog_dim on.
      - name: internal_offer_key
        sql: internal_offer_key
        type: number
        title: Internal Offer Key
        description: >-
          Part of the composite key (with deal_io_part_prog_key) this fact joins deal_io_part_prog_dim on.
      - name: internal_offer_type_key
        sql: internal_offer_type_key
        type: number
        title: Internal Offer Type Key
        description: >-
          Foreign key to internal_offer_type_dim, e.g. Borrow, Buy-In, N/A.
      - name: airing_property_id
        sql: airing_property_id
        type: number
        title: Airing Property Id
        description: >-
          Property identifier for this airing, carried directly on the fact.
      - name: participating_entity_key
        sql: participating_entity_key
        type: number
        title: Participating Entity Key
        description: >-
          Entity in the Participating Entity role. Read via
          participating_entity_name's correlated subquery rather than a join, since entity_dim is already joined
          once on this fact in the Controlling Entity role (see cube_carl_dwhprd_gold_entity_dim's description for
          the role-play pattern). Probed against dev data: 100% of fact rows have a matching entity_dim row (0%
          orphan) — unlike the equivalent role-play on req_rights_episode_fact, this one is fully populated.
      - name: participating_entity_name
        sql: >-
          (SELECT ed.entity_name FROM {{ catalog('dwhprd_gold') }}.entity_dim ed WHERE ed.entity_key =
          {CUBE}.participating_entity_key)
        type: string
        title: Participating Entity
        description: >-
          entity_dim.entity_name looked up by participating_entity_key via a correlated subquery, since entity_dim
          is already joined once on this fact in the Controlling Entity role — same role-play pattern as
          cube_carl_dwhprd_gold_req_rights_episode_fact's equivalent dimension, but fully populated here (see
          participating_entity_key's description).
      - name: participant_region_flag_desc
        sql: >-
          CASE WHEN {CUBE}.participant_region_flag = 'D' THEN 'Distribution channel region' WHEN
          {CUBE}.participant_region_flag = 'O' THEN 'Offering region' WHEN {CUBE}.participant_region_flag = 'P' THEN
          'Participating region' WHEN {CUBE}.participant_region_flag IS NULL THEN 'Not Assigned' ELSE NULL END
        type: string
        title: Participant Region Flag
        description: >-
          Decoded participant_region_flag — D/O/P/null map to Distribution channel region/Offering region/
          Participating region/Not Assigned respectively (any other raw value is left blank, matching
          MicroStrategy's own DECODE, which has no catch-all default).
      - name: season_cont_entity_name
        sql: >-
          (SELECT ed.entity_name FROM {{ catalog('dwhprd_gold') }}.season_dim sd JOIN {{ catalog('dwhprd_gold') }}.entity_dim ed
          ON ed.entity_key = sd.season_cont_entity_key WHERE sd.season_key = {CUBE}.season_key ORDER BY
          sd.update_ts DESC LIMIT 1)
        type: string
        title: Season Controlling Entity
        description: >-
          entity_dim.entity_name for season_dim's Season Controlling Entity role (season_dim.season_cont_entity_key),
          read via a correlated subquery through season_dim rather than a second join to entity_dim. entity_dim is
          already joined once directly from this fact (Controlling Entity role); Cube's SQL API (cube-sql, what
          QuickSight's data source speaks) cannot resolve a single query that needs entity_dim via more than one
          join path at once — unlike the REST/JS query engine, which handles this role-play fine. Reproduced live:
          selecting controlling_entity_name + season_cont_entity_name + show_cont_entity_name +
          originating_entity_name together via the SQL API failed with "Can't find join path to join
          'cube_carl_dwhprd_gold_airings_fact', ...'" while the identical REST query succeeded. Fixed by dropping
          this member's join_path in the view down to a same-cube subquery, matching the participating_entity_name
          precedent on this same cube. The subquery uses a plain JOIN to entity_dim inside it (not a second nested
          correlated subquery) — Athena/Trino's engine rejects a correlated subquery whose own WHERE clause value
          comes from another correlated subquery ("NOT_SUPPORTED: Given correlated subquery is not supported"),
          confirmed live on an earlier version of this fix; only a single level of outer-cube correlation is
          supported, with everything else expressed as ordinary joins inside that one subquery.
          ORDER BY update_ts DESC LIMIT 1 mirrors cube_carl_dwhprd_gold_season_dim's own de-dupe query (see that
          cube's description) — querying season_dim's raw table directly here (not through that cube's deduped
          SQL) hit the two known duplicate season_key rows live, failing with
          "SUBQUERY_MULTIPLE_ROWS: Scalar sub-query has returned multiple rows"; both known duplicates are
          identical in every column so which one LIMIT 1 keeps doesn't matter, but ORDER BY makes the pick
          deterministic rather than relying on engine-specific unordered-LIMIT behavior.
      - name: season_cont_region_long_name
        sql: >-
          (SELECT rd.region_long_name FROM {{ catalog('dwhprd_gold') }}.season_dim sd JOIN
          {{ catalog('dwhprd_gold') }}.entity_dim ed ON ed.entity_key = sd.season_cont_entity_key JOIN
          {{ catalog('dwhprd_gold') }}.region_dim rd ON rd.region_key = ed.region_key WHERE sd.season_key =
          {CUBE}.season_key ORDER BY sd.update_ts DESC LIMIT 1)
        type: string
        title: Season Controlling Region
        description: >-
          region_dim.region_long_name for the Season Controlling Entity's region, read via a single correlated
          subquery through season_dim with two plain internal JOINs (to entity_dim, then region_dim) rather than
          the three-hop join_path (season_dim.entity_dim.region_dim) — see season_cont_entity_name's description
          for why this has to be one correlated subquery with internal joins (not nested correlated subqueries)
          and why it needs the ORDER BY/LIMIT 1 de-dupe guard.
      - name: show_cont_entity_name
        sql: >-
          (SELECT ed.entity_name FROM {{ catalog('dwhprd_gold') }}.show_dim shd JOIN {{ catalog('dwhprd_gold') }}.entity_dim ed
          ON ed.entity_key = shd.show_cont_entity_key WHERE shd.show_key = {CUBE}.show_key ORDER BY shd.update_ts
          DESC LIMIT 1)
        type: string
        title: Show Controlling Entity
        description: >-
          entity_dim.entity_name for show_dim's Show Controlling Entity role (show_dim.show_cont_entity_key), read
          via a correlated subquery through show_dim rather than a second join to entity_dim — same cube-sql
          join-path limitation as season_cont_entity_name, same single-correlated-subquery-with-internal-join fix.
          show_dim isn't wrapped in a de-dupe query like season_dim is, but carries the same ORDER BY/LIMIT 1 guard
          defensively, on the same "cube can only join a given target once" reasoning.
      - name: show_cont_region_long_name
        sql: >-
          (SELECT rd.region_long_name FROM {{ catalog('dwhprd_gold') }}.show_dim shd JOIN {{ catalog('dwhprd_gold') }}.entity_dim
          ed ON ed.entity_key = shd.show_cont_entity_key JOIN {{ catalog('dwhprd_gold') }}.region_dim rd ON rd.region_key =
          ed.region_key WHERE shd.show_key = {CUBE}.show_key ORDER BY shd.update_ts DESC LIMIT 1)
        type: string
        title: Show Controlling Region
        description: >-
          region_dim.region_long_name for the Show Controlling Entity's region, read via a single correlated
          subquery through show_dim with two plain internal JOINs (to entity_dim, then region_dim) rather than the
          three-hop join_path (show_dim.entity_dim.region_dim) — see season_cont_entity_name's description for why,
          and show_cont_entity_name's for the defensive ORDER BY/LIMIT 1 guard.
      - name: originating_entity_name
        sql: >-
          (SELECT ed.entity_name FROM {{ catalog('dwhprd_gold') }}.deal_io_part_prog_dim dp JOIN
          {{ catalog('dwhprd_gold') }}.entity_dim ed ON ed.entity_key = dp.originating_entity_key WHERE
          dp.deal_io_part_prog_key = {CUBE}.deal_io_part_prog_key AND dp.internal_offer_key =
          {CUBE}.internal_offer_key)
        type: string
        title: Originating Entity
        description: >-
          entity_dim.entity_name for deal_io_part_prog_dim's Originating Entity role
          (deal_io_part_prog_dim.originating_entity_key), read via a correlated subquery through
          deal_io_part_prog_dim rather than a second join to entity_dim — same cube-sql join-path limitation as
          season_cont_entity_name. deal_io_part_prog_key + internal_offer_key is this table's declared composite
          key, so no duplicate-row guard is needed — confirmed live a bare LIMIT (without ORDER BY) actually
          breaks this shape, failing with the same "NOT_SUPPORTED: Given correlated subquery is not supported"
          error as the nested-subquery case: Trino's engine only supports LIMIT inside a correlated subquery when
          paired with ORDER BY (the "top-1 row" pattern used on season_cont_entity_name/show_cont_entity_name to
          dodge their dedupe issue); an unordered LIMIT on an otherwise-unique join takes a different, unsupported
          decorrelation path. Left as a plain single-row-by-construction correlated subquery instead.
      - name: total_airing_count
        sql: total_airing_count
        type: number
        title: Total Airing Count (raw)
        description: Raw per-row total airing count. Do not sum directly in ad-hoc queries; use the total_airing_count_sum measure.
      - name: eps_slot_length
        sql: eps_slot_length
        type: number
        title: Episode Slot Length
        description: >-
          Slot length for this airing's episode, carried directly on the fact. See this cube's description for
          why this is read from here rather than an episode_dim join.
      - name: local_bcast_day_key
        sql: local_bcast_day_key
        type: number
        title: Local Broadcast Day Key
        description: >-
          Foreign key to day_dim, in the Local Broadcast Day role — probed clean against dev data (0.09% orphan
          rate). Source of day_dim's own airing_month derived dimension and this fact's year_grouping derived
          dimension.
      - name: local_bcast_time_key
        sql: local_bcast_time_key
        type: number
        title: Local Broadcast Time Key
        description: >-
          Foreign key to time_dim, in the Local Broadcast Time role — probed clean against dev data (near-zero
          orphan rate). Source of time_dim's own custom_daypart derived dimension.
      - name: season_key
        sql: season_key
        type: number
        title: Season Key
        description: Foreign key to season_dim.
      - name: show_key
        sql: show_key
        type: number
        title: Show Key
        description: Foreign key to show_dim.
      - name: year_grouping
        sql: >-
          CASE WHEN {CUBE}.local_bcast_day_key IS NULL OR {CUBE}.local_bcast_day_key = 0 OR
          {cube_carl_dwhprd_gold_dc_season_dim.dc_seas_prem_bday_key} IS NULL THEN NULL WHEN
          date_diff('month', date_trunc('month', date_parse(CAST(CAST({cube_carl_dwhprd_gold_dc_season_dim.dc_seas_prem_bday_key}
          AS BIGINT) AS VARCHAR), '%Y%m%d')), date_trunc('month', date_parse(CAST(CAST({CUBE}.local_bcast_day_key AS
          BIGINT) AS VARCHAR), '%Y%m%d'))) BETWEEN 0 AND 11 THEN '0-11 months' WHEN date_diff('month',
          date_trunc('month', date_parse(CAST(CAST({cube_carl_dwhprd_gold_dc_season_dim.dc_seas_prem_bday_key} AS
          BIGINT) AS VARCHAR), '%Y%m%d')), date_trunc('month', date_parse(CAST(CAST({CUBE}.local_bcast_day_key AS
          BIGINT) AS VARCHAR), '%Y%m%d'))) BETWEEN 12 AND 22 THEN '12-22 months' WHEN date_diff('month',
          date_trunc('month', date_parse(CAST(CAST({cube_carl_dwhprd_gold_dc_season_dim.dc_seas_prem_bday_key} AS
          BIGINT) AS VARCHAR), '%Y%m%d')), date_trunc('month', date_parse(CAST(CAST({CUBE}.local_bcast_day_key AS
          BIGINT) AS VARCHAR), '%Y%m%d'))) BETWEEN 23 AND 33 THEN '23-33 months' WHEN date_diff('month',
          date_trunc('month', date_parse(CAST(CAST({cube_carl_dwhprd_gold_dc_season_dim.dc_seas_prem_bday_key} AS
          BIGINT) AS VARCHAR), '%Y%m%d')), date_trunc('month', date_parse(CAST(CAST({CUBE}.local_bcast_day_key AS
          BIGINT) AS VARCHAR), '%Y%m%d'))) BETWEEN 34 AND 44 THEN '34-44 months' WHEN date_diff('month',
          date_trunc('month', date_parse(CAST(CAST({cube_carl_dwhprd_gold_dc_season_dim.dc_seas_prem_bday_key} AS
          BIGINT) AS VARCHAR), '%Y%m%d')), date_trunc('month', date_parse(CAST(CAST({CUBE}.local_bcast_day_key AS
          BIGINT) AS VARCHAR), '%Y%m%d'))) BETWEEN 45 AND 55 THEN '45-55 months' WHEN date_diff('month',
          date_trunc('month', date_parse(CAST(CAST({cube_carl_dwhprd_gold_dc_season_dim.dc_seas_prem_bday_key} AS
          BIGINT) AS VARCHAR), '%Y%m%d')), date_trunc('month', date_parse(CAST(CAST({CUBE}.local_bcast_day_key AS
          BIGINT) AS VARCHAR), '%Y%m%d'))) BETWEEN 56 AND 66 THEN '56-66 months' WHEN date_diff('month',
          date_trunc('month', date_parse(CAST(CAST({cube_carl_dwhprd_gold_dc_season_dim.dc_seas_prem_bday_key} AS
          BIGINT) AS VARCHAR), '%Y%m%d')), date_trunc('month', date_parse(CAST(CAST({CUBE}.local_bcast_day_key AS
          BIGINT) AS VARCHAR), '%Y%m%d'))) BETWEEN 67 AND 77 THEN '67-77 months' WHEN date_diff('month',
          date_trunc('month', date_parse(CAST(CAST({cube_carl_dwhprd_gold_dc_season_dim.dc_seas_prem_bday_key} AS
          BIGINT) AS VARCHAR), '%Y%m%d')), date_trunc('month', date_parse(CAST(CAST({CUBE}.local_bcast_day_key AS
          BIGINT) AS VARCHAR), '%Y%m%d'))) BETWEEN 78 AND 88 THEN '78-88 months' WHEN date_diff('month',
          date_trunc('month', date_parse(CAST(CAST({cube_carl_dwhprd_gold_dc_season_dim.dc_seas_prem_bday_key} AS
          BIGINT) AS VARCHAR), '%Y%m%d')), date_trunc('month', date_parse(CAST(CAST({CUBE}.local_bcast_day_key AS
          BIGINT) AS VARCHAR), '%Y%m%d'))) BETWEEN 89 AND 99 THEN '89-99 months' WHEN date_diff('month',
          date_trunc('month', date_parse(CAST(CAST({cube_carl_dwhprd_gold_dc_season_dim.dc_seas_prem_bday_key} AS
          BIGINT) AS VARCHAR), '%Y%m%d')), date_trunc('month', date_parse(CAST(CAST({CUBE}.local_bcast_day_key AS
          BIGINT) AS VARCHAR), '%Y%m%d'))) BETWEEN 100 AND 110 THEN '100-110 months' ELSE NULL END
        type: string
        title: Year Grouping
        description: >-
          Elapsed-month band between this airing's local broadcast month and the season's premiere month on this
          distribution channel (dc_season_dim.dc_seas_prem_bday_key) — ten bands, months 0-11 through 100-110. See
          custom_daypart (on time_dim) for the other half of MicroStrategy's 20-way AIREDCOUNT/GODWFLAG encoding
          this replaces. Uses Cube's cross-cube dimension reference notation (dot inside the braces) against
          dc_season_dim, which is already directly joined from this fact — a prior version used a raw correlated
          subquery instead (on the mistaken assumption that Cube.js disallows cross-cube dimension references
          entirely; it does not, see docs.cube.dev/data-modeling/dimensions#from-other-cubes), which compiled fine
          but failed at query time against Athena with "NOT_SUPPORTED: Given correlated subquery is not
          supported" — Athena's Trino engine only supports a correlated subquery whose outer-table reference is
          confined to the WHERE clause; referencing the outer column inside the subquery's own SELECT list (as the
          date-diff calculation here needed to) is rejected outright, even with a single level of nesting. Also
          casts both decimal(38,10) key columns through BIGINT before VARCHAR/date_parse, since a direct
          decimal-to-VARCHAR cast renders as "20070706.0000000000" and breaks the '%Y%m%d' format string.
    joins:
      - name: cube_carl_dwhprd_gold_corporate_daypart_dim
        sql: '{CUBE}.corporate_daypart_key = {cube_carl_dwhprd_gold_corporate_daypart_dim}.corporate_daypart_key'
        relationship: many_to_one
      - name: cube_carl_dwhprd_gold_deal_project_dim
        sql: '{CUBE}.deal_project_key = {cube_carl_dwhprd_gold_deal_project_dim}.deal_project_key'
        relationship: many_to_one
      - name: cube_carl_dwhprd_gold_deal_io_part_prog_dim
        sql: >-
          {CUBE}.deal_io_part_prog_key = {cube_carl_dwhprd_gold_deal_io_part_prog_dim}.deal_io_part_prog_key AND
          {CUBE}.internal_offer_key = {cube_carl_dwhprd_gold_deal_io_part_prog_dim}.internal_offer_key
        relationship: many_to_one
      - name: cube_carl_dwhprd_gold_internal_offer_type_dim
        sql: '{CUBE}.internal_offer_type_key = {cube_carl_dwhprd_gold_internal_offer_type_dim}.internal_offer_type_key'
        relationship: many_to_one
      - name: cube_carl_dwhprd_gold_dc_episode_dim
        sql: '{CUBE}.dc_episode_key = {cube_carl_dwhprd_gold_dc_episode_dim}.dc_episode_key'
        relationship: many_to_one
      - name: cube_carl_dwhprd_gold_dc_season_dim
        sql: '{CUBE}.dc_season_key = {cube_carl_dwhprd_gold_dc_season_dim}.dc_season_key'
        relationship: many_to_one
      - name: cube_carl_dwhprd_gold_dc_show_dim
        sql: '{CUBE}.dc_show_key = {cube_carl_dwhprd_gold_dc_show_dim}.dc_show_key'
        relationship: many_to_one
      - name: cube_carl_dwhprd_gold_day_dim
        sql: '{CUBE}.local_bcast_day_key = {cube_carl_dwhprd_gold_day_dim}.day_key'
        relationship: many_to_one
      - name: cube_carl_dwhprd_gold_distribution_channel_dim
        sql: '{CUBE}.distribution_channel_key = {cube_carl_dwhprd_gold_distribution_channel_dim}.distribution_channel_key'
        relationship: many_to_one
      - name: cube_carl_dwhprd_gold_distribution_channel_hist_dim
        sql: >-
          {CUBE}.distribution_channel_hist_key =
          {cube_carl_dwhprd_gold_distribution_channel_hist_dim}.distribution_channel_hist_key
        relationship: many_to_one
      - name: cube_carl_dwhprd_gold_entity_dim
        sql: '{CUBE}.controlling_entity_key = {cube_carl_dwhprd_gold_entity_dim}.entity_key'
        relationship: many_to_one
      - name: cube_carl_dwhprd_gold_episode_dim
        sql: '{CUBE}.episode_key = {cube_carl_dwhprd_gold_episode_dim}.episode_key'
        relationship: many_to_one
      - name: cube_carl_dwhprd_gold_hivedwh_episode_dim
        sql: '{CUBE}.episode_key = {cube_carl_dwhprd_gold_hivedwh_episode_dim}.episode_key'
        relationship: many_to_one
      - name: cube_carl_dwhprd_gold_season_dim
        sql: '{CUBE}.season_key = {cube_carl_dwhprd_gold_season_dim}.season_key'
        relationship: many_to_one
      - name: cube_carl_dwhprd_gold_show_dim
        sql: '{CUBE}.show_key = {cube_carl_dwhprd_gold_show_dim}.show_key'
        relationship: many_to_one
      - name: cube_carl_dwhprd_gold_time_dim
        sql: '{CUBE}.local_bcast_time_key = {cube_carl_dwhprd_gold_time_dim}.time_key'
        relationship: many_to_one
    measures:
      - name: aired_count
        sql: airing_count
        type: sum
        title: Aired Count
        description: >-
          Sum of airing counts. Group or filter by year_grouping and/or custom_daypart to reproduce any of
          MicroStrategy's original 20 AIREDCOUNT columns; summing without those dimensions gives the all-bands,
          all-dayparts total.
      - name: future_airing_count
        sql: airing_future_count
        type: sum
        title: Future Airing Count
        description: Sum of future airing counts.
      - name: total_airing_count_sum
        sql: total_airing_count
        type: sum
        title: Total Airing Count
        description: >-
          Sum of total airing counts — selected by MicroStrategy's SQL but not exposed as a named template
          metric.
      - name: record_count
        sql: '*'
        type: count
        title: Record Count
        description: Row count for smoke queries.
        meta:
          source: generated
          used_by_report_ids: []
