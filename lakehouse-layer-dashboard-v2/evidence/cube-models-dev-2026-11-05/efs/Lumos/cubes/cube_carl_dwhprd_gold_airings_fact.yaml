        type: string
        title: Distribution Channel Has Changed
        description: >-
          Indicator for whether this airing's distribution channel has been renamed/changed historically,
          alongside distribution_channel_hist_dim's historical name.
      - name: distribution_channel_hist_key
        sql: distribution_channel_hist_key
        type: number
        title: Distribution Channel Hist Key
        description: >-
          Foreign key to distribution_channel_hist_dim — probed clean on fanout, but 10.3% of airings_fact rows have
          no matching history record (same rows as the corporate_daypart_key orphans below, suggesting a shared
          subset of airings with incomplete dimensional attribution).
      - name: distribution_channel_key
