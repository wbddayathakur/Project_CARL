        type: number
        title: Distribution Channel Region Key
        description: >-
          Region this airing's distribution channel serves, carried directly on the fact. MicroStrategy's SQL
          reads this key from the fact but the matching name (distr_chnl_region_name) from
          distribution_channel_dim rather than from here — both should agree for a given distribution_channel_key,
          but this fact-level copy is kept as-is to match the source rather than assumed identical.
      - name: dc_has_chng_flag
