          )
        type: string
        title: Base Currency Name
        description: Currency name for the fact row's base currency.
      - name: currency_symbol
        sql: |-
          (
            SELECT hop1.currency_symbol
            FROM {{ catalog('dwhprd_gold') }}.bts_currency_dim hop1
            WHERE {CUBE}.base_currency_key = hop1.currency_key
          )
        type: string
        title: Base Currency Symbol
        description: Currency symbol on bts_currency_dim.
      - name: adv_market_sector_desc
        sql: |-
          (
            SELECT hop1.adv_market_sector_desc
            FROM {{ catalog('dwhprd_gold') }}.adv_market_sector_dim hop1
            WHERE {CUBE}.adv_market_sector_key = hop1.adv_market_sector_key
          )
        type: string
        title: Adv Market Sector
        description: Advertising market sector description.
      - name: business_type_id
        sql: |-
          (
            SELECT hop1.business_type_id
            FROM {{ catalog('dwhprd_gold') }}.business_type_dim hop1
            WHERE {CUBE}.business_type_key = hop1.business_type_key
          )
        type: string
        title: Business Type ID
        description: Natural identifier for the business type.
      - name: campaign_end_date
        sql: |-
