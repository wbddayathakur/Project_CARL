            SELECT hop1.billing_status_desc
            FROM {{ catalog('dwhprd_gold') }}.billing_status_dim hop1
            WHERE {CUBE}.campaign_key = hop1.campaign_key
              AND {CUBE}.calendar_month_key = hop1.calendar_month_key
              AND {CUBE}.source_system_region_key = hop1.source_system_region_key
          )
        type: string
        title: Billing Status
        description: >-
          Billing status for this campaign and month in this region. billing_status_dim is unique on
          those three keys (376,102 rows, probed 2026-10-28), so there is at most one value. NULL when
          the campaign-month has no billing-status row. MicroStrategy inner-joins this table and drops
          such rows; every 2025 Discovery Latin America row has one.
      - name: billing_status_note
        sql: |-
          (
            SELECT hop1.billing_status_note
            FROM {{ catalog('dwhprd_gold') }}.billing_status_dim hop1
            WHERE {CUBE}.campaign_key = hop1.campaign_key
              AND {CUBE}.calendar_month_key = hop1.calendar_month_key
              AND {CUBE}.source_system_region_key = hop1.source_system_region_key
          )
        type: string
        title: Billing Status Note
        description: Free-text note on the billing status for this campaign, month and region. See billing_status_desc.
      - name: billing_status_updated_by
        sql: |-
          (
            SELECT hop1.billing_status_updated_by
            FROM {{ catalog('dwhprd_gold') }}.billing_status_dim hop1
            WHERE {CUBE}.campaign_key = hop1.campaign_key
              AND {CUBE}.calendar_month_key = hop1.calendar_month_key
              AND {CUBE}.source_system_region_key = hop1.source_system_region_key
          )
        type: string
        title: Billing Status Updated By
        description: User who last updated the billing status for this campaign, month and region. See billing_status_desc.
      - name: billing_status_updated_date
        sql: |-
          (
            SELECT CAST(hop1.billing_status_updated_date AS timestamp(3))
            FROM {{ catalog('dwhprd_gold') }}.billing_status_dim hop1
            WHERE {CUBE}.campaign_key = hop1.campaign_key
              AND {CUBE}.calendar_month_key = hop1.calendar_month_key
              AND {CUBE}.source_system_region_key = hop1.source_system_region_key
          )
        type: time
        title: Billing Status Updated Date
        description: >-
          When the billing status for this campaign, month and region was last updated. See
          billing_status_desc. Cast to timestamp(3) inside the lookup, so a SQL API query never
          returns timestamp with time zone.
      - name: bts_base_currency_name
        sql: |-
          (
            SELECT hop1.currency_name
            FROM {{ catalog('dwhprd_gold') }}.bts_currency_dim hop1
            WHERE {CUBE}.base_currency_key = hop1.currency_key
          )
        type: string
        title: Base Currency Name
        description: Base currency name on bts_currency_dim, the same list as bts_base_currency_code.
      - name: bts_base_currency_symbol
        sql: |-
          (
            SELECT hop1.currency_symbol
            FROM {{ catalog('dwhprd_gold') }}.bts_currency_dim hop1
            WHERE {CUBE}.base_currency_key = hop1.currency_key
          )
        type: string
        title: Base Currency Symbol
        description: Base currency symbol on bts_currency_dim.
      - name: deal_type_key
        sql: |-
          (
            SELECT hop1.deal_type_key
            FROM {{ catalog('dwhprd_gold') }}.bts_deal_dim hop1
            WHERE {CUBE}.deal_key = hop1.deal_key
          )
        type: number
        title: Deal Type Key
        description: Deal type key on bts_deal_dim, the ID form of Deal Type.
      - name: contract_basis_key
        sql: contract_basis_key
        type: number
        title: Contract Basis Key
        description: Foreign key to contract_basis_dim, carried on campaign_fact.
      - name: contract_basis_desc
        sql: |-
          (
            SELECT hop1.contract_basis_desc
            FROM {{ catalog('dwhprd_gold') }}.contract_basis_dim hop1
            WHERE {CUBE}.contract_basis_key = hop1.contract_basis_key
          )
        type: string
        title: Contract Basis
        description: >-
          Contract basis on contract_basis_dim, looked up by the fact row's contract_basis_key.
          MicroStrategy also joins on source_system_region_key. The table has that column, but it is
          not part of this join: contract_basis_key is unique on its own (14 rows) and matches every
          2023 Discovery Latin America fact row (probed 2026-10-29), so the one-key lookup returns
          the same value.
      - name: customer_ref
        sql: |-
          (
            SELECT hop1.customer_ref
            FROM {{ catalog('dwhprd_gold') }}.campaign_dim hop1
            WHERE {CUBE}.campaign_key = hop1.campaign_key
          )
        type: string
        title: Customer Ref
        description: Customer reference on campaign_dim. One value per campaign.
      - name: holding_company_key
        sql: |-
          (
            SELECT hop1.holding_company_key
            FROM {{ catalog('dwhprd_gold') }}.campaign_dim hop1
            WHERE {CUBE}.campaign_key = hop1.campaign_key
          )
        type: number
        title: Holding Company Key
        description: >-
          Holding company key on campaign_dim, the ID form of Holding Company. MicroStrategy filters
          holding company on this key through the campaign, not on the fact's own holding_company_key.
      - name: sap_gl_account
        sql: |-
          (
            SELECT hop1.sap_gl_account
            FROM {{ catalog('dwhprd_gold') }}.business_type_dim hop1
            WHERE {CUBE}.business_type_key = hop1.business_type_key
          )
        type: string
        title: Sap GL Account
        description: >-
          SAP GL account of the business type (BUSINESS_TYPE_DIM.SAP_GL_ACCOUNT), such as DIGITAL,
          DIGITALREP or DPLUSDLA. The Audit File Clientes Regulares reports filter on it.
      - name: agency_commission_pct_display
        sql: CAST({CUBE}.agency_commission_pct AS DOUBLE) * 100
        type: number
        title: Agency Commission %
        description: >-
          Fact-row agency commission percentage scaled to a display percentage, the MicroStrategy
          Agency Commission % attribute (AGENCY_COMMISSION_PCT * 100). For the averaged metric use
          agency_commission_pct_avg.
      - name: campaign_status_key
        sql: |-
          (
            SELECT hop1.campaign_status_key
            FROM {{ catalog('dwhprd_gold') }}.campaign_dim hop1
            WHERE {CUBE}.campaign_key = hop1.campaign_key
          )
        type: number
        title: Campaign Status Key
        description: Campaign status surrogate key from campaign_dim (CAMPAIGN_DIM.CAMPAIGN_STATUS_KEY), the key behind campaign_status_name.
      - name: client_group_key
        sql: |-
          (
            SELECT hop1.client_group_key
            FROM {{ catalog('dwhprd_gold') }}.campaign_dim hop1
            WHERE {CUBE}.campaign_key = hop1.campaign_key
          )
        type: number
        title: Client Group Key
        description: Client group surrogate key from campaign_dim (CAMPAIGN_DIM.CLIENT_GROUP_KEY), the key behind client_group_name.
      - name: campaign_currency_key
        sql: |-
          (
            SELECT hop1.campaign_currency_key
            FROM {{ catalog('dwhprd_gold') }}.campaign_dim hop1
            WHERE {CUBE}.campaign_key = hop1.campaign_key
          )
        type: number
        title: Campaign Currency Key
        description: Campaign currency surrogate key from campaign_dim (CAMPAIGN_DIM.CAMPAIGN_CURRENCY_KEY), the key behind campaign_currency_code and campaign_currency_name.
      - name: campaign_delivery_type_key
        sql: |-
          (
            SELECT hop1.campaign_delivery_type_key
            FROM {{ catalog('dwhprd_gold') }}.campaign_dim hop1
            WHERE {CUBE}.campaign_key = hop1.campaign_key
          )
        type: number
        title: Campaign Delivery Type Key
        description: Campaign delivery type surrogate key from campaign_dim (CAMPAIGN_DIM.CAMPAIGN_DELIVERY_TYPE_KEY), the key behind campaign_delivery_type_name.
      - name: consumption_indicator
        sql: '{CUBE}.consumption_indicator'
        type: string
        title: Consumption Indicator
        description: Consumption indicator carried on campaign_fact (CAMPAIGN_FACT_VW.CONSUMPTION_INDICATOR), X or blank.
      - name: invoice_to
        sql: |-
          (
            SELECT hop1.invoice_to
            FROM {{ catalog('dwhprd_gold') }}.bts_deal_dim hop1
            WHERE {CUBE}.deal_key = hop1.deal_key
          )
        type: string
        title: Invoice To
        description: Who the deal is invoiced to on BTSDWH.DEAL_DIM, for example Advertiser, Agent or Other.
      - name: master_deal_name
        sql: |-
          (
            SELECT hop1.master_deal_name
            FROM {{ catalog('dwhprd_gold') }}.bts_deal_dim hop1
            WHERE {CUBE}.deal_key = hop1.deal_key
          )
        type: string
        title: Master Deal Name
        description: Master deal of the deal on BTSDWH.DEAL_DIM, a deal code such as D0016333, or N/A when the deal has no master deal.
      - name: invoice_level_desc
        sql: |-
          (
            SELECT hop1.invoice_level_desc
            FROM {{ catalog('dwhprd_gold') }}.bts_deal_dim hop1
            WHERE {CUBE}.deal_key = hop1.deal_key
          )
        type: string
        title: Invoice Level Description
        description: Level the deal is invoiced at on BTSDWH.DEAL_DIM, Contract, Deal or Master Deal.
      - name: invoice_recipient_name
        sql: |-
          (
            SELECT hop1.invoice_recipient_name
            FROM {{ catalog('dwhprd_gold') }}.bts_deal_dim hop1
            WHERE {CUBE}.deal_key = hop1.deal_key
          )
        type: string
        title: Invoice Recipient Name
        description: Name of the party that receives the deal's invoices, on BTSDWH.DEAL_DIM.

    measures:
      - name: campaign_budget_loc
        sql: >-
          {CUBE}.campaign_budget * COALESCE({CUBE}.sales_rep_revenue_share, 1)
        type: sum
        title: Campaign Budget LOC
        description: Campaign budget allocated by sales-rep revenue share (unallocated campaigns default to 100%, matching CAMPAIGN_FACT_VW), summed. Local currency, unconverted.
      - name: campaign_invoice_value_loc
        sql: >-
          {CUBE}.campaign_invoice_value * COALESCE({CUBE}.sales_rep_revenue_share, 1)
        type: sum
        title: Campaign Invoice Value LOC
        description: Campaign invoice value allocated by sales-rep revenue share (unallocated campaigns default to 100%, matching CAMPAIGN_FACT_VW), summed. Local currency, unconverted.
      - name: gross_revenue_loc
        sql: >-
          {CUBE}.gross_revenue * COALESCE({CUBE}.sales_rep_revenue_share, 1)
        type: sum
        title: Gross Revenue LOC
        description: Gross revenue allocated by sales-rep revenue share (unallocated campaigns default to 100%, matching CAMPAIGN_FACT_VW), summed. Local currency, unconverted.
      - name: campaign_net_revenue_loc
        sql: >-
          CAST({CUBE}.gross_revenue AS DOUBLE) * COALESCE({CUBE}.sales_rep_revenue_share, 1) *
          (1 - {CUBE}.agency_commission_pct)
        type: sum
        title: Campaign Net Revenue LOC
        description: >-
          Rep-allocated gross revenue less agency commission, summed (unallocated campaigns default to 100%,
          matching CAMPAIGN_FACT_VW). Local currency, unconverted. Leading operand cast to DOUBLE — see cube
          description's decimal-overflow note; this measure's 3-term multiplication chain on decimal(38,10)
          columns otherwise overflows Trino's decimal arithmetic on SUM().
      - name: campaign_net_net_revenue_loc
        sql: >-
          CAST({CUBE}.gross_revenue AS DOUBLE) * COALESCE({CUBE}.sales_rep_revenue_share, 1) *
          (1 - {CUBE}.agency_commission_pct) * (1 - {CUBE}.agency_incentive_pct)
        type: sum
        title: Campaign Net Net Revenue LOC
        description: >-
          Rep-allocated gross revenue less agency commission, less agency incentive, summed (unallocated
          campaigns default to 100%, matching CAMPAIGN_FACT_VW). Local currency, unconverted. Leading operand
          cast to DOUBLE — see cube description's decimal-overflow note; this measure's 4-term multiplication
          chain on decimal(38,10) columns otherwise overflows Trino's decimal arithmetic on SUM().
      - name: agency_commission_loc
        sql: >-
          CAST({CUBE}.gross_revenue AS DOUBLE) * COALESCE({CUBE}.sales_rep_revenue_share, 1) *
          {CUBE}.agency_commission_pct
        type: sum
        title: Agency Commission LOC
        description: >-
          Rep-allocated agency commission amount, summed (unallocated campaigns default to 100%, matching
          CAMPAIGN_FACT_VW). Local currency, unconverted. Leading operand cast to DOUBLE — see cube
          description's decimal-overflow note; this measure's 3-term multiplication chain on decimal(38,10)
          columns otherwise overflows Trino's decimal arithmetic on SUM().
      - name: agency_incentive_loc
        sql: >-
          CAST({CUBE}.gross_revenue AS DOUBLE) * COALESCE({CUBE}.sales_rep_revenue_share, 1) *
          (1 - {CUBE}.agency_commission_pct) * {CUBE}.agency_incentive_pct
        type: sum
        title: Agency Incentive LOC
        description: >-
          Rep-allocated agency incentive amount, summed (unallocated campaigns default to 100%, matching
          CAMPAIGN_FACT_VW). Local currency, unconverted. Leading operand cast to DOUBLE — see cube
          description's decimal-overflow note; this measure's 4-term multiplication chain on decimal(38,10)
          columns otherwise overflows Trino's decimal arithmetic on SUM().
      - name: sales_commission_loc
        sql: >-
          CAST({CUBE}.gross_revenue AS DOUBLE) * COALESCE({CUBE}.sales_rep_revenue_share, 1) *
          {CUBE}.rep_commission_pct
        type: sum
        title: Sales Commission LOC
        description: >-
          Rep-allocated sales rep commission amount, summed (unallocated campaigns default to 100%, matching
          CAMPAIGN_FACT_VW). Local currency, unconverted. Leading operand cast to DOUBLE — see cube
          description's decimal-overflow note; this measure's 3-term multiplication chain on decimal(38,10)
          columns otherwise overflows Trino's decimal arithmetic on SUM().
      - name: campaign_spots_booked
        sql: >-
          {CUBE}.campaign_spots_booked * COALESCE({CUBE}.sales_rep_revenue_share, 1)
        type: sum
        title: Campaign Spots Booked
        description: Booked spot count, allocated by sales-rep revenue share (unallocated campaigns default to 100%, matching CAMPAIGN_FACT_VW), summed.
      - name: campaign_spots_target
        sql: >-
          {CUBE}.campaign_spots_target * COALESCE({CUBE}.sales_rep_revenue_share, 1)
        type: sum
        title: Campaign Spots Target
        description: Target spot count, allocated by sales-rep revenue share (unallocated campaigns default to 100%, matching CAMPAIGN_FACT_VW), summed.
      - name: campaign_spots_price_loc
        sql: >-
          {CUBE}.campaign_spots_price * COALESCE({CUBE}.sales_rep_revenue_share, 1)
        type: sum
        title: Campaign Spots Price LOC
        description: Spot price, allocated by sales-rep revenue share (unallocated campaigns default to 100%, matching CAMPAIGN_FACT_VW), summed. Local currency, unconverted.
      - name: campaign_tax_value_loc
        sql: >-
          {CUBE}.campaign_tax_value * COALESCE({CUBE}.sales_rep_revenue_share, 1)
        type: sum
        title: Campaign Tax Value LOC
        description: Campaign tax value, allocated by sales-rep revenue share (unallocated campaigns default to 100%, matching CAMPAIGN_FACT_VW), summed. Local currency, unconverted.
      - name: campaign_ratings_booked
        sql: >-
          {CUBE}.campaign_ratings_booked * COALESCE({CUBE}.sales_rep_revenue_share, 1)
        type: sum
        title: Campaign Ratings Booked
        description: Booked ratings, allocated by sales-rep revenue share (unallocated campaigns default to 100%, matching CAMPAIGN_FACT_VW), summed.
      - name: campaign_ratings_delivered
        sql: >-
          {CUBE}.campaign_ratings_delivered * COALESCE({CUBE}.sales_rep_revenue_share, 1)
        type: sum
        title: Campaign Ratings Delivered
        description: Delivered ratings, allocated by sales-rep revenue share (unallocated campaigns default to 100%, matching CAMPAIGN_FACT_VW), summed.
      - name: campaign_ratings_sold
        sql: >-
          {CUBE}.campaign_ratings_sold * COALESCE({CUBE}.sales_rep_revenue_share, 1)
        type: sum
        title: Campaign Ratings Sold
        description: Sold ratings, allocated by sales-rep revenue share (unallocated campaigns default to 100%, matching CAMPAIGN_FACT_VW), summed.
      - name: campaign_impacts_booked
        sql: >-
          {CUBE}.campaign_impacts_booked * COALESCE({CUBE}.sales_rep_revenue_share, 1)
        type: sum
        title: Campaign Impacts Booked
        description: Booked impacts, allocated by sales-rep revenue share (unallocated campaigns default to 100%, matching CAMPAIGN_FACT_VW), summed.
      - name: campaign_impacts_delivered
        sql: >-
          {CUBE}.campaign_impacts_delivered *
          COALESCE({CUBE}.sales_rep_revenue_share, 1)
        type: sum
        title: Campaign Impacts Delivered
        description: Delivered impacts, allocated by sales-rep revenue share (unallocated campaigns default to 100%, matching CAMPAIGN_FACT_VW), summed.
      - name: campaign_impacts_sold
        sql: >-
          {CUBE}.campaign_impacts_sold * COALESCE({CUBE}.sales_rep_revenue_share, 1)
        type: sum
        title: Campaign Impacts Sold
        description: Sold impacts, allocated by sales-rep revenue share (unallocated campaigns default to 100%, matching CAMPAIGN_FACT_VW), summed.
      - name: agency_commission_pct_avg
        sql: agency_commission_pct
        type: avg
        title: Agency Commission % (avg)
        description: Average row-level agency commission percentage across the query grain. Template column.
      - name: agency_incentive_pct_avg
        sql: agency_incentive_pct
        type: avg
        title: Agency Incentive % (avg)
        description: Average row-level agency incentive percentage across the query grain. Template column.
      - name: rep_commission_pct_avg
        sql: rep_commission_pct
        type: avg
        title: Rep Commission % (avg)
        description: Average row-level sales rep commission percentage across the query grain. Template column.
      - name: sales_rep_revenue_share_avg
        sql: sales_rep_revenue_share
        type: avg
        title: Sales Rep Revenue Share (avg)
        description: Average sales-rep revenue share fraction across the query grain. Template column.
      - name: campaign_spots_target_plain
        sql: "CASE WHEN {CUBE}.fact_row_rep_ordinal = 1 THEN {CUBE}.campaign_spots_target ELSE 0 END"
        type: sum
        title: Campaign Spots Target
        description: >-
          Sum of campaign_spots_target, once per campaign_fact row. Not multiplied by
          sales_rep_revenue_share. international_view_campaign_fact aliases this to
          campaign_spots_target. The share-weighted measure is campaign_spots_target.
      - name: campaign_spots_booked_plain
        sql: "CASE WHEN {CUBE}.fact_row_rep_ordinal = 1 THEN {CUBE}.campaign_spots_booked ELSE 0 END"
        type: sum
        title: Campaign Spots Booked
        description: >-
          Sum of campaign_spots_booked, once per campaign_fact row. Not multiplied by
          sales_rep_revenue_share. international_view_campaign_fact aliases this to
          campaign_spots_booked. The share-weighted measure is campaign_spots_booked.
      - name: campaign_spots_price_loc_plain
        sql: "CASE WHEN {CUBE}.fact_row_rep_ordinal = 1 THEN {CUBE}.campaign_spots_price ELSE 0 END"
        type: sum
        title: Campaign Spots Price LOC
        description: >-
          Sum of campaign_spots_price in local currency, once per campaign_fact row. Not
          multiplied by sales_rep_revenue_share. international_view_campaign_fact aliases this
          to campaign_spots_price_loc. The share-weighted measure is campaign_spots_price_loc.
      - name: campaign_budget_loc_plain
        sql: "CASE WHEN {CUBE}.fact_row_rep_ordinal = 1 THEN {CUBE}.campaign_budget ELSE 0 END"
        type: sum
        title: Campaign Budget LOC
        description: >-
          Sum of campaign_budget in local currency, once per campaign_fact row. Not multiplied
          by sales_rep_revenue_share. international_view_campaign_fact aliases this to
          campaign_budget_loc. The share-weighted measure is campaign_budget_loc.
      - name: agency_commission_loc_plain
        sql: >-
          CASE WHEN {CUBE}.fact_row_rep_ordinal = 1
            THEN CAST({CUBE}.gross_revenue AS DOUBLE) * {CUBE}.agency_commission_pct
            ELSE 0 END
        type: sum
        title: Agency Commission LOC
        description: >-
          Sum of gross_revenue * agency_commission_pct, once per campaign_fact row. gross_revenue
          is cast to DOUBLE before multiplying. Not multiplied by sales_rep_revenue_share.
          international_view_campaign_fact aliases this to agency_commission_loc. The
          share-weighted measure is agency_commission_loc.
      - name: campaign_invoice_value_loc_plain
        sql: "CASE WHEN {CUBE}.fact_row_rep_ordinal = 1 THEN {CUBE}.campaign_invoice_value ELSE 0 END"
        type: sum
        title: Campaign Invoice Value LOC
        description: >-
          Sum of campaign_invoice_value in local currency, once per campaign_fact row. Not
          multiplied by sales_rep_revenue_share. international_view_campaign_fact aliases this
          to campaign_invoice_value_loc. The share-weighted measure is campaign_invoice_value_loc.
      - name: campaign_net_revenue_loc_plain
        sql: >-
          CASE WHEN {CUBE}.fact_row_rep_ordinal = 1
            THEN CAST({CUBE}.gross_revenue AS DOUBLE) * (1 - {CUBE}.agency_commission_pct)
            ELSE 0 END
        type: sum
        title: Campaign Net Revenue LOC
        description: >-
          Sum of gross_revenue * (1 - agency_commission_pct), once per campaign_fact row. This is
          not a sum of the stored campaign_net_revenue column. gross_revenue is cast to DOUBLE
          before multiplying. Not multiplied by sales_rep_revenue_share.
          international_view_campaign_fact aliases this to campaign_net_revenue_loc. The
          share-weighted measure is campaign_net_revenue_loc.
      - name: campaign_tax_value_loc_plain
        sql: "CASE WHEN {CUBE}.fact_row_rep_ordinal = 1 THEN {CUBE}.campaign_tax_value ELSE 0 END"
        type: sum
        title: Campaign Tax Value LOC
        description: >-
          Sum of campaign_tax_value in local currency, once per campaign_fact row. Not multiplied
          by sales_rep_revenue_share. international_view_campaign_fact aliases this to
          campaign_tax_value_loc. The share-weighted measure is campaign_tax_value_loc.
      - name: campaign_budget_net_loc
        sql: "{campaign_budget_loc} - {agency_commission_loc}"
        type: number
        title: Campaign Budget Net LOC
        description: >-
          Campaign Budget LOC minus Agency Commission LOC, after both sums. The Andres report calculates this in the view.
      - name: deal_type_count
        sql: "{bts_deal_type_key}"
        type: count_distinct
        title: Count (Deal Type)
        description: Distinct bts deal type keys. Non-Linear Report (2026) shows this count.

      - name: campaign_budget_current_rate_usd
        sql: >-
          CAST({CUBE}.campaign_budget AS DOUBLE) * COALESCE({CUBE}.sales_rep_revenue_share, 1)
          * CAST({CUBE}.plan_curr_exchange_factor AS DOUBLE)
        type: sum
        title: Campaign Budget Current Rate(USD)
        description: >-
          Campaign Budget in local currency times the current planned exchange factor. A missing rate drops that row from the sum.

      - name: campaign_budget_hist_rate_usd
        sql: >-
          CAST({CUBE}.campaign_budget AS DOUBLE) * COALESCE({CUBE}.sales_rep_revenue_share, 1)
          * CAST({CUBE}.plan_hist_exchange_factor AS DOUBLE)
        type: sum
        title: Campaign Budget Hist Rate(USD)
        description: >-
          Campaign Budget in local currency times the historical planned exchange factor. A missing rate drops that row from the sum.

      - name: campaign_invoice_value_current_rate_usd
        sql: >-
          CAST({CUBE}.campaign_invoice_value AS DOUBLE) * COALESCE({CUBE}.sales_rep_revenue_share, 1)
          * CAST({CUBE}.plan_curr_exchange_factor AS DOUBLE)
        type: sum
        title: Campaign Invoice Value Current Rate(USD)
        description: >-
          Campaign Invoice Value in local currency times the current planned exchange factor. A missing rate drops that row from the sum.

      - name: campaign_invoice_value_hist_rate_usd
        sql: >-
          CAST({CUBE}.campaign_invoice_value AS DOUBLE) * COALESCE({CUBE}.sales_rep_revenue_share, 1)
          * CAST({CUBE}.plan_hist_exchange_factor AS DOUBLE)
        type: sum
        title: Campaign Invoice Value Hist Rate(USD)
        description: >-
          Campaign Invoice Value in local currency times the historical planned exchange factor. A missing rate drops that row from the sum.

      - name: gross_revenue_current_rate_usd
        sql: >-
          CAST({CUBE}.gross_revenue AS DOUBLE) * COALESCE({CUBE}.sales_rep_revenue_share, 1)
          * CAST({CUBE}.plan_curr_exchange_factor AS DOUBLE)
        type: sum
        title: Gross Revenue Current Rate(USD)
        description: >-
          Gross Revenue in local currency times the current planned exchange factor. A missing rate drops that row from the sum.

      - name: gross_revenue_hist_rate_usd
        sql: >-
          CAST({CUBE}.gross_revenue AS DOUBLE) * COALESCE({CUBE}.sales_rep_revenue_share, 1)
          * CAST({CUBE}.plan_hist_exchange_factor AS DOUBLE)
        type: sum
        title: Gross Revenue Hist Rate(USD)
        description: >-
          Gross Revenue in local currency times the historical planned exchange factor. A missing rate drops that row from the sum.

      - name: campaign_net_revenue_current_rate_usd
        sql: >-
          CAST({CUBE}.gross_revenue AS DOUBLE) * COALESCE({CUBE}.sales_rep_revenue_share, 1) * (1 - {CUBE}.agency_commission_pct)
          * CAST({CUBE}.plan_curr_exchange_factor AS DOUBLE)
        type: sum
        title: Campaign Net Revenue Current Rate(USD)
        description: >-
          Campaign Net Revenue in local currency times the current planned exchange factor. A missing rate drops that row from the sum.

      - name: campaign_net_revenue_hist_rate_usd
        sql: >-
          CAST({CUBE}.gross_revenue AS DOUBLE) * COALESCE({CUBE}.sales_rep_revenue_share, 1) * (1 - {CUBE}.agency_commission_pct)
          * CAST({CUBE}.plan_hist_exchange_factor AS DOUBLE)
        type: sum
        title: Campaign Net Revenue Hist Rate(USD)
        description: >-
          Campaign Net Revenue in local currency times the historical planned exchange factor. A missing rate drops that row from the sum.

      - name: campaign_net_net_revenue_current_rate_usd
        sql: >-
          CAST({CUBE}.gross_revenue AS DOUBLE) * COALESCE({CUBE}.sales_rep_revenue_share, 1) * (1 - {CUBE}.agency_commission_pct) * (1 - {CUBE}.agency_incentive_pct)
