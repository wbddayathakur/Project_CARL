      - name: revenue_variance
        sql: "{campaign_budget_loc} - {gross_revenue_loc}"
        type: number
        title: Revenue Variance
        description: >-
          Campaign Budget LOC minus Gross Revenue LOC, after both are summed at the query grain. Do
          not sum row-level differences. Positive when budget is above revenue.
      - name: spot_variance
        sql: "{campaign_spots_target} - {campaign_spots_booked}"
        type: number
        title: Spot Variance
        description: >-
          Campaign Spots Target minus Campaign Spots Booked, after both are summed. Confirmed
          2026-10-29: the Monthly Tracker - Portafolio Cristian Lavao export defines Spot Variance as
          the Campaign Spots Target metric minus the Campaign Spots Booked metric, calculated in the
          view after the rollup.
          The Billing Status Report export did not include the formula.

