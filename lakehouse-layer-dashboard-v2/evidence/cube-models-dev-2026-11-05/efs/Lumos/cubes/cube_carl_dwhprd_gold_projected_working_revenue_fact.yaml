    measures:
      - name: record_count
        sql: '*'
        type: count
        title: Record Count
        description: Row count for smoke queries.
        meta:
          source: generated
          used_by_report_ids: []
      - name: working_acm_net_corp_imps_000
        sql: CAST({CUBE}.acm_net_corp_estimated_imps AS DOUBLE) / 1000.0
        type: sum
        title: ACM Net Corporate Estimated Impressions (Thousands)
        description: >-
          ACM net corporate estimated impressions in thousands. Computed as the sum of ACM net corporate estimated impressions
          divided by 1000.
      - name: working_as_sold_cost
        sql: '{CUBE}.order_month_as_sold_cost'
        type: sum
        title: Working As-Sold Cost
        description: Total cost of working orders as sold. Computed as the sum of order month as-sold cost.
      - name: working_ratecard_cost
        sql: '{CUBE}.order_month_ratecard_cost'
        type: sum
        title: Working Ratecard Cost
        description: Total ratecard cost of working orders. Computed as the sum of order month ratecard cost.
      - name: working_revenue
        sql: '{CUBE}.working_revenue'
        type: sum
        title: Working Revenue
        description: Total revenue from working orders. Computed as the sum of working revenue.
      - name: working_eqv30_spots
        sql: '{CUBE}.order_month_eqv30_spots'
        type: sum
        title: Working Equiv30 Spots
        description: Sum of equivalent 30-second spots for working orders in the order month.
      - name: working_acm_guar_target_imps_000
        sql: CAST({CUBE}.acm_guar_target_estimated_imps AS DOUBLE) / 1000.0
        type: sum
        title: Working Guar/Target Estimated Impressions (ACM Guar, Thousands)
        description: >-
          ACM guaranteed/target estimated impressions for working orders, in thousands. Mirrors
          working_acm_net_corp_imps_000's shape (no multiply by spots — the source column is already
          a per-order-month total), but for the guaranteed/target demo rather than net corp.
      - name: working_num_spots
        sql: '{CUBE}.order_month_num_spots'
        type: sum
        title: Working Number of Spots
        description: Total number of spots on working orders. Computed as the sum of order month number of spots.
      - name: projected_working_revenue
        sql: '{CUBE}.projected_working_revenue'
        type: sum
        title: Projected Working Revenue
        description: >-
          Total projected revenue on working orders. Note this is projected_working_revenue, a different
          source column from working_revenue, and the two do not agree — compare working_revenue.
      - name: projected_working_revenue_000
        sql: CAST({CUBE}.projected_working_revenue AS DOUBLE) / 1000.0
        type: sum
        title: Projected Working Revenue (Thousands)
        description: Projected working revenue in thousands. The same source column as projected_working_revenue, divided by 1000.
      - name: working_ecm_net_corp_imps_000
        sql: CAST({CUBE}.ecm_net_corp_estimated_imps AS DOUBLE) / 1000.0
        type: sum
        title: ECM Net Corporate Estimated Impressions (Thousands)
        description: >-
          ECM net corporate estimated impressions in thousands. Same shape as
          working_acm_net_corp_imps_000, over the ECM estimate rather than ACM.
      - name: working_pal_net_corp_imps_000
        sql: CAST({CUBE}.pal_net_corp_estimated_imps AS DOUBLE) / 1000.0
        type: sum
        title: PAL Net Corporate Estimated Impressions (Thousands)
        description: >-
          PAL net corporate estimated impressions in thousands. Same shape as
          working_acm_net_corp_imps_000, over the PAL estimate rather than ACM.

      # Cash only — restricted to unit_type_group_key = 1, per finance's `measures.md` naming
      # convention (`cash_` = Cash unit types, `_000` = in thousands, `_guar`/`_tracking` = which
      # methodology column drives the test). Each reproduces one measure the Working-Pending Deals
      # reports compute inline in MSTR, where they arrive under generated aliases (WJXBFS1…a).
      - name: cash_working_revenue
        sql: (CASE WHEN {CUBE}.unit_type_group_key = 1 THEN {CUBE}.working_revenue ELSE NULL END)
        type: sum
        title: Cash Working Revenue
        description: Working revenue restricted to Cash unit types.
      - name: cash_working_revenue_acm3_guar
        sql: >-
          (CASE WHEN {CUBE}.unit_type_group_key = 1 THEN CASE WHEN {CUBE}.guar_est_methodology_key = 2
          THEN {CUBE}.working_revenue ELSE NULL END ELSE NULL END)
        type: sum
        title: Cash Working Revenue (ACM3 Guaranteed Methodology)
        description: Cash working revenue for rows whose guaranteed estimate methodology is ACM3.
      - name: cash_working_revenue_acm3_tracking
        sql: >-
          (CASE WHEN {CUBE}.unit_type_group_key = 1 THEN CASE WHEN {CUBE}.tracking_est_methodology_key = 2
          THEN {CUBE}.working_revenue ELSE NULL END ELSE NULL END)
        type: sum
        title: Cash Working Revenue (ACM3 Tracking Methodology)
        description: Cash working revenue for rows whose tracking estimate methodology is ACM3.
      - name: cash_working_revenue_ecm3_tracking
        sql: >-
          (CASE WHEN {CUBE}.unit_type_group_key = 1 THEN CASE WHEN {CUBE}.tracking_est_methodology_key = 3
          THEN {CUBE}.working_revenue ELSE NULL END ELSE NULL END)
        type: sum
        title: Cash Working Revenue (ECM3 Tracking Methodology)
        description: >-
          Cash working revenue for rows whose tracking estimate methodology is ECM3. The ECM3 counterpart
          of cash_working_revenue_acm3_tracking. Not listed in finance's `measures.md`, which covers only
          the ACM3 pair — added here because the Working-Pending Deals reports compute it.
      - name: cash_working_revenue_tracked
        sql: >-
          (CASE WHEN {CUBE}.unit_type_group_key = 1 THEN CASE WHEN {CUBE}.tracking_est_methodology_key = 0
          THEN NULL ELSE {CUBE}.working_revenue END ELSE NULL END)
        type: sum
        title: Cash Working Revenue (Tracked Methodology Only)
        description: >-
          Cash working revenue excluding rows whose tracking estimate methodology is N/A (key 0); any
          methodology counts, unlike the per-methodology measures above. Mirrors natl_comm_revenue_tracked
          on invoice_revenue_fact. On 2026 - Linear Pending (Revamp Pacing) (CARL-4311) MSTR generates this
          as alias WJXBFS3 and uses it as the numerator of [Working ACM Net Corp CPM], which it labels
          "Working Revenue - Post ACM" — i.e. "Post ACM" is this tracked-methodology cash working revenue,
          not a separate column.
      - name: cash_acm7_net_corp_imps_000
        sql: >-
          (CAST((CASE WHEN {CUBE}.unit_type_group_key = 1 THEN {CUBE}.acm7_net_corp_est_imps ELSE NULL END)
          AS DOUBLE) / 1000.0)
        type: sum
        title: Cash ACM7 Net Corporate Estimated Impressions (Thousands)
        description: ACM7 net corporate estimated impressions for Cash unit types, in thousands.
      - name: cash_acm7_net_sec_demo_imps_000
        sql: >-
          (CAST((CASE WHEN {CUBE}.unit_type_group_key = 1 THEN {CUBE}.acm7_net_sec_demo_est_imps ELSE NULL END)
          AS DOUBLE) / 1000.0)
        type: sum
        title: Cash ACM7 Net Secondary Demo Estimated Impressions (Thousands)
        description: >-
          ACM7 estimated impressions against the secondary demographic rather than net corporate,
          for Cash unit types, in thousands.
      - name: cash_acm_guar_target_imps_000_guar
        sql: >-
          (CAST((CASE WHEN {CUBE}.unit_type_group_key = 1 THEN CASE WHEN {CUBE}.guar_est_methodology_key = 2
          THEN {CUBE}.acm_guar_target_estimated_imps ELSE NULL END ELSE NULL END) AS DOUBLE) / 1000.0)
        type: sum
        title: Cash ACM Guar/Target Impressions (Guaranteed Methodology, Thousands)
        description: >-
          ACM guaranteed/target estimated impressions for Cash unit types whose guaranteed estimate
          methodology is ACM3, in thousands.
      - name: cash_acm_guar_target_imps_000_tracking
        sql: >-
          (CAST((CASE WHEN {CUBE}.unit_type_group_key = 1 THEN CASE WHEN {CUBE}.tracking_est_methodology_key = 2
          THEN {CUBE}.acm_guar_target_estimated_imps ELSE NULL END ELSE NULL END) AS DOUBLE) / 1000.0)
        type: sum
        title: Cash ACM Guar/Target Impressions (Tracking Methodology, Thousands)
        description: >-
          ACM guaranteed/target estimated impressions for Cash unit types whose tracking estimate
          methodology is ACM3, in thousands.
      - name: cash_ecm_guar_target_imps_000_tracking
        sql: >-
          (CAST((CASE WHEN {CUBE}.unit_type_group_key = 1 THEN CASE WHEN {CUBE}.tracking_est_methodology_key = 3
          THEN {CUBE}.ecm_guar_target_estimated_imps ELSE NULL END ELSE NULL END) AS DOUBLE) / 1000.0)
        type: sum
        title: Cash ECM Guar/Target Impressions (Tracking Methodology, Thousands)
        description: >-
          ECM guaranteed/target estimated impressions for Cash unit types whose tracking estimate
          methodology is ECM3, in thousands. `measures.md` flags this methodology test as possibly
          dead in dev, where tracking_est_methodology_key never holds 3 — the measure is still
          correct, it may simply match no rows there.
      - name: working_ratecard_pct
        sql: CAST({working_as_sold_cost} AS DOUBLE) / NULLIF({working_ratecard_cost}, 0)
        type: number
        title: '% Ratecard - Working Revenue'
        description: >-
          Working as-sold cost over working ratecard cost. MSTR defines it as [Working
          As Sold Cost] / [Working RateCard Cost], which is exactly this. A ratio of two sums rather than a sum of ratios,
          matching how MSTR divides after aggregation. Note this is the working-order counterpart of ratecard_pct on invoice_revenue_fact,
          which is built from unequivalised rates rather than costs, so the two are not interchangeable.

      # ---------------------------------------------------------------------------
      # Cash net-corp / PAL-guar building blocks for the CPM metrics on the
      # "2026 - Linear Pending (Revamp Pacing)" report (CARL-4311). Each reproduces
      # one of that report's generated WJXBFS aliases, restricted to Cash unit types
      # (unit_type_group_key = 1), same shape as the existing cash_* measures above.
      # The CPM ratios and total corp/demo imps below divide these after aggregation,
      # matching how MSTR's analytical engine computes them. guar_est_methodology_key:
      # 2 = ACM (ACM3) guaranteed, 1 = PAL guaranteed.
      # ---------------------------------------------------------------------------
      - name: cash_acm_net_corp_imps_000
        sql: >-
          (CAST((CASE WHEN {CUBE}.unit_type_group_key = 1 THEN {CUBE}.acm_net_corp_estimated_imps ELSE NULL END)
          AS DOUBLE) / 1000.0)
        type: sum
        title: Cash ACM Net Corporate Estimated Impressions (Thousands)
        description: >-
          ACM net corporate estimated impressions for Cash unit types, in thousands. Report alias WJXBFS5 on
          2026 - Linear Pending (Revamp Pacing); the Cash denominator of working_acm_net_corp_cpm.
      - name: cash_pal_net_corp_imps_000
        sql: >-
          (CAST((CASE WHEN {CUBE}.unit_type_group_key = 1 THEN {CUBE}.pal_net_corp_estimated_imps ELSE NULL END)
          AS DOUBLE) / 1000.0)
        type: sum
        title: Cash PAL Net Corporate Estimated Impressions (Thousands)
        description: >-
          PAL net corporate estimated impressions for Cash unit types, in thousands. Report alias WJXBFS6 on
          2026 - Linear Pending (Revamp Pacing); the Cash denominator of working_pal_net_corp_cpm.
      - name: cash_working_revenue_pal_guar
        sql: >-
          (CASE WHEN {CUBE}.unit_type_group_key = 1 THEN CASE WHEN {CUBE}.guar_est_methodology_key = 1
          THEN {CUBE}.working_revenue ELSE NULL END ELSE NULL END)
        type: sum
        title: Cash Working Revenue (PAL Guaranteed Methodology)
        description: >-
          Cash working revenue for rows whose guaranteed estimate methodology is PAL (key 1). Report alias WJXBFS7
          on 2026 - Linear Pending (Revamp Pacing); the PAL-guar numerator of working_guar_target_cpm_pal_guar.
          The PAL counterpart of cash_working_revenue_acm3_guar.
      - name: cash_pal_guar_target_imps_000_guar
        sql: >-
          (CAST((CASE WHEN {CUBE}.unit_type_group_key = 1 THEN CASE WHEN {CUBE}.guar_est_methodology_key = 1
          THEN {CUBE}.pal_guar_target_estimated_imps ELSE NULL END ELSE NULL END) AS DOUBLE) / 1000.0)
        type: sum
        title: Cash PAL Guar/Target Impressions (Guaranteed Methodology, Thousands)
        description: >-
          PAL guaranteed/target estimated impressions for Cash unit types whose guaranteed estimate methodology is
          PAL (key 1), in thousands. Report alias WJXBFS8 on 2026 - Linear Pending (Revamp Pacing); the PAL-guar
          denominator of working_guar_target_cpm_pal_guar. The PAL counterpart of cash_acm_guar_target_imps_000_guar.

      # ---------------------------------------------------------------------------
      # Working CPM metrics (CARL-4311). Each is a ratio of two Cash sums, divided
      # after aggregation (ratio of sums, not sum of ratios) exactly like
      # working_ratecard_pct, reproducing MSTR's analytical-engine metrics.
      # ---------------------------------------------------------------------------
      - name: working_acm_net_corp_cpm
        sql: CAST({cash_working_revenue_tracked} AS DOUBLE) / NULLIF({cash_acm_net_corp_imps_000}, 0)
        type: number
        title: Working ACM Net Corp CPM
        description: >-
          MSTR [Working ACM Net Corp CPM] = [Working Revenue - Post ACM - Unit Type Group in Cash] /
          [Working ACM Net Corp Est Imps - Unit Type Group in Cash] = cash_working_revenue_tracked (WJXBFS3) over
          cash_acm_net_corp_imps_000 (WJXBFS5). Ratio of sums, matching MSTR's divide-after-aggregation.
      - name: working_pal_net_corp_cpm
        sql: CAST({cash_working_revenue} AS DOUBLE) / NULLIF({cash_pal_net_corp_imps_000}, 0)
        type: number
        title: Working PAL Net Corp CPM
        description: >-
          MSTR [Working PAL Net Corp CPM] = [Working Revenue - Unit Type Group in Cash] /
          [Working PAL Net Corp Est Imps - Unit Type Group in Cash] = cash_working_revenue (WJXBFS1) over
          cash_pal_net_corp_imps_000 (WJXBFS6). Ratio of sums.
      - name: working_guar_target_cpm_acm_guar
        sql: CAST({cash_working_revenue_acm3_guar} AS DOUBLE) / NULLIF({cash_acm_guar_target_imps_000_guar}, 0)
        type: number
        title: Working Guar/Target Estimated CPM - ACM Guar
        description: >-
          MSTR [Working Guar/Target Estimated CPM - ACM Guar] = [Working Revenue - ACM Guar - Unit Type Group in Cash] /
          [Working Guar/Target Est Imps - ACM Guar - Unit Type Group in Cash] = cash_working_revenue_acm3_guar (WJXBFS4)
          over cash_acm_guar_target_imps_000_guar (WJXBFS2). Ratio of sums.
      - name: working_guar_target_cpm_pal_guar
        sql: CAST({cash_working_revenue_pal_guar} AS DOUBLE) / NULLIF({cash_pal_guar_target_imps_000_guar}, 0)
        type: number
        title: Working Guar/Target Estimated CPM - PAL Guar
        description: >-
          MSTR [Working Guar/Target Estimated CPM - PAL Guar] = [Working Revenue - PAL Guar - Unit Type Group in Cash] /
          [Working Guar/Target Est Imps - PAL Guar - Unit Type Group in Cash] = cash_working_revenue_pal_guar (WJXBFS7)
          over cash_pal_guar_target_imps_000_guar (WJXBFS8). Ratio of sums.

      # ---------------------------------------------------------------------------
      # Derived impression totals (CARL-4311). MSTR back-solves impressions from
      # Working Revenue and the CPM, preferring the ACM CPM when it is positive and
      # falling back to PAL otherwise. Working Revenue here is the overall measure
      # (not Cash-restricted), matching MSTR's {Working Revenue} reference.
      # ---------------------------------------------------------------------------
      - name: total_corp_imps
        sql: >-
          CASE WHEN {working_acm_net_corp_cpm} > 0
          THEN CAST({working_revenue} AS DOUBLE) / {working_acm_net_corp_cpm}
          ELSE CAST({working_revenue} AS DOUBLE) / NULLIF({working_pal_net_corp_cpm}, 0) END
        type: number
        title: Total Corp Imps
        description: >-
          MSTR total corp imps = IF([Working ACM Net Corp CPM] > 0, [Working Revenue] / [Working ACM Net Corp CPM],
          [Working Revenue] / [Working PAL Net Corp CPM]). Net-corporate impressions back-solved from working revenue
          and the net-corp CPM, preferring ACM and falling back to PAL.
      - name: total_demo_imps
        sql: >-
          CASE WHEN {working_guar_target_cpm_acm_guar} > 0
          THEN CAST({working_revenue} AS DOUBLE) / {working_guar_target_cpm_acm_guar}
          ELSE CAST({working_revenue} AS DOUBLE) / NULLIF({working_guar_target_cpm_pal_guar}, 0) END
        type: number
        title: Total Demo Imps
        description: >-
          MSTR total demo imps = IF([Working Guar/Target Estimated CPM - ACM Guar] > 0,
          [Working Revenue] / [Working Guar/Target Estimated CPM - ACM Guar],
          [Working Revenue] / [Working Guar/Target Estimated CPM - PAL Guar]). Guar/target demographic impressions
          back-solved from working revenue and the guar/target CPM, preferring ACM guar and falling back to PAL guar.
