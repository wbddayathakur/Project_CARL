cubes:
  - name: cube_carl_dwhprd_gold_projected_working_revenue_fact
    sql_table: "{{ catalog('dwhprd_gold') }}.projected_working_revenue_fact"
    data_source: default
    public: false
    title: Carl Dwhprd Gold — Projected Working Revenue Fact
    description: >-
      This fact table captures projected working revenue for advertising orders at a monthly grain, combining financial metrics
      (projected, budgeted, and working revenue) with demographic impressions across multiple estimation methodologies. Each
      row represents a unique combination of account, deal, order, and broadcast month with associated revenue figures and
      audience estimates.
    dimensions:
      - name: sub_account
        sql: |-
          (
            SELECT hop1.sub_account
            FROM {{ catalog('dwhprd_gold') }}.account_dim hop1
            WHERE {CUBE}.account_key = hop1.account_key
          )
        type: string
        title: Sub Account
        description: Sub-account name or identifier within the account.
      - name: client_ae_string
        sql: |-
          (
            SELECT hop1.client_ae_string
            FROM {{ catalog('dwhprd_gold') }}.acct_cov_team_dim hop1
            WHERE {CUBE}.acct_cov_team_key = hop1.acct_cov_team_key
          )
        type: string
        title: Client AE String
        description: Client account executive string for the coverage team (MSTR "Client AE String").
      - name: plan_ae_string
        sql: |-
          (
            SELECT hop1.plan_ae_string
            FROM {{ catalog('dwhprd_gold') }}.acct_cov_team_dim hop1
            WHERE {CUBE}.acct_cov_team_key = hop1.acct_cov_team_key
          )
        type: string
        title: Planning AE String
        description: Planning account executive string for the coverage team (MSTR "Planning AE String").
      - name: adv_default_prod_cat_name
        sql: |-
          (
            SELECT hop2.prod_cat_name
            FROM {{ catalog('dwhprd_gold') }}.advertiser_dim hop1
            LEFT JOIN {{ catalog('dwhprd_gold') }}.product_dim hop2
              ON hop1.adv_default_prod_cat_key = hop2.product_key
            WHERE {CUBE}.advertiser_key = hop1.advertiser_key
          )
        type: string
        title: Advertiser Primary Product Category
        description: The advertiser's standing product category, i.e. the category on the product referenced by advertiser_dim.adv_default_prod_cat_key. This is not the category
          of the product sold on the transaction — for that use cube_carl_dwhprd_gold_product_dim.prod_cat_name.
      - name: adv_id
        sql: |-
          (
            SELECT hop1.adv_id
            FROM {{ catalog('dwhprd_gold') }}.advertiser_dim hop1
            WHERE {CUBE}.advertiser_key = hop1.advertiser_key
          )
        type: number
        title: Advertiser ID
        description: Business identifier for the advertiser from the source system.
      - name: adv_name
        sql: |-
          (
            SELECT hop1.adv_name
            FROM {{ catalog('dwhprd_gold') }}.advertiser_dim hop1
            WHERE {CUBE}.advertiser_key = hop1.advertiser_key
          )
        type: string
        title: Advertiser
        description: The legal or business name of the advertiser.
      - name: adv_name_id
        sql: |-
          (
            SELECT hop1.adv_name || ' (' || CAST(hop1.adv_id AS VARCHAR) || ')'
            FROM {{ catalog('dwhprd_gold') }}.advertiser_dim hop1
            WHERE {CUBE}.advertiser_key = hop1.advertiser_key
          )
        type: string
        title: Advertiser (ID)
        description: Advertiser name with its business ID suffixed in parentheses, e.g. "ABBOTT DIABETES CARE (12268)" — reproduces MicroStrategy's display format exactly. Confirmed
          live in MSTR's own generated SQL (`"ADV_NAME"||' ('||"ADV_ID"||')' "ADV_NAME"`), which concatenates the same two fields already modeled separately here (adv_name, adv_id).
      - name: adv_reporting_parent
        sql: |-
          (
            SELECT hop1.adv_reporting_parent
            FROM {{ catalog('dwhprd_gold') }}.advertiser_dim hop1
            WHERE {CUBE}.advertiser_key = hop1.advertiser_key
          )
        type: string
        title: Adv Reporting Parent
        description: Identifier for the parent advertiser entity used for consolidated reporting purposes.
      - name: brand_name
        sql: |-
          (
            SELECT hop1.brand_name
            FROM {{ catalog('dwhprd_gold') }}.brand_dim hop1
            WHERE {CUBE}.brand_key = hop1.brand_key
          )
        type: string
        title: Brand
        description: Name of the brand (e.g. a movie-studio campaign name, or "Various" placeholder).
