  # ---------------------------------------------------------------------
  # Measurement
  # ---------------------------------------------------------------------

  - product_id: MIT-VIEWING-101
    name: Program Viewing & Universe Estimates
    domain: Measurement
    answers: >-
      What did a programme deliver by quarter hour and selling demo, and what
      universe should it be rated against?
    status: beta
    owner: CARL Data Engineering
    steward: Research & Measurement
    tables:
      - big_mit_bronze.program_viewing
      - big_mit_bronze.program_viewing_quarterhour
      - big_mit_bronze.program_viewing_sellingdemos
      - big_mit_bronze.universe_estimate
      - big_mit_bronze.timeperiod_quarterhour
