# Data product registry — the curated tier of the CARL Iceberg catalog.
#
# This is the only hand-maintained file in the agent, and it is what makes the
# published catalog usable by someone who does not know the schema. Everything
# else is collected. Adding an entry here is the act that promotes a table from
# "exists in Glue" to "you may build on this".
#
# status has four values and they are promises, not labels:
#   certified  an owner is accountable for it, the grain is fixed, breaking
#              changes get announced. Safe to cite in an intake request.
#   beta       real and refreshing, but the contract is not frozen yet.
#   proposed   designed, not built. Listed so intake can see it is coming and
#              attach demand to it instead of opening a duplicate request.
#   deprecated still there, do not build anything new on it.
#
# `answers` must be written as a question a business person would actually ask.
# If you cannot write one, the product is not ready to be listed.
#
# `tables` are physical bindings as database.table. The agent resolves them
# against the live catalog on every run, so a typo or a dropped table shows up
# as a broken binding in the report rather than silently passing.

meta:
  version: 1
  maintainer: Daya Thakur
  review_cadence: weekly
  source_of_truth: >-
    Physical tables are resolved live from the Glue catalog. Grain, owner and
    freshness promises come from this file and are only as good as its review.

products:

  # ---------------------------------------------------------------------
  # Linear & Digital Revenue — the built, running estate
  # ---------------------------------------------------------------------

  - product_id: LDR-PACING-001
    name: Pacing, Revenue & Budget by Month
    domain: Linear & Digital Revenue
    answers: >-
      How is each sales team pacing against budget this month, by network
      account and account executive?
    status: certified
    owner: CARL Data Engineering
    steward: Ad Sales Finance
    tables:
      - linear_digital_revenue_gold.fact_pacing_revenue_budget_month
      - linear_digital_revenue_silver.fact_pacing_revenue_budget_month
    cube_views:
      - finance_view_pacing_revenue_budget
    measures: [Budget Amount, Booked Revenue, Pacing Percent]
    dimensions: [Team, Net Account, AE Combo, Agency, Calendar Month]
    grain: One row per net account per AE combo per calendar month
    cadence: Daily at 10:00 ET
    freshness_sla_hours: 30
    environments: [dev, qa, stage, prod]
    query_athena: |
      SELECT * FROM linear_digital_revenue_gold.fact_pacing_revenue_budget_month
      WHERE calendar_month = date_trunc('month', current_date)
    related_requirements: [AP-2.1]

  - product_id: LDR-REVENUE-002
    name: Combined Revenue & Sales Holes
    domain: Linear & Digital Revenue
    answers: >-
      Where is revenue booked across linear and digital, and where are the
      unsold holes in the schedule?
    status: certified
    owner: CARL Data Engineering
    steward: Ad Sales Finance
    tables:
      - linear_digital_revenue_gold.combined_revenue_sales_holes_totals
      - linear_digital_revenue_silver.combined_revenue_sales_holes_totals
    cube_views:
      - finance_view_combined_revenue
    measures: [Combined Revenue, Sales Holes Total]
    dimensions: [Net Account, Sell Division, Network, Calendar Month]
    grain: One row per account per division per month
    cadence: Daily at 10:00 ET
    freshness_sla_hours: 30
    environments: [dev, qa, stage, prod]
    query_athena: |
      SELECT * FROM linear_digital_revenue_gold.combined_revenue_sales_holes_totals

