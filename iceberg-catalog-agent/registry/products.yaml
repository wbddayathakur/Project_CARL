    status: proposed
    owner: Daya Thakur
    steward: Jamie Jackette — Ad Products Finance
    tables:
      - adproducts_gold.fct_ad_revenue_bucketed
    cube_views:
      - adproducts_view_ad_revenue_bucketed
    measures:
      - Ad Innovation Revenue
      - DAT Revenue (All)
      - Overlap Revenue
      - DAT Revenue excl Overlap
      - Traditional Revenue
      - Total Deduplicated Revenue
    grain: One row per booked line per bucket
    cadence: Weekly close
    environments: []
    known_gaps:
      - The six bucket names still need business sign-off.
    related_requirements: [ADP-ICE-09, ADP-SEM-05]

  - product_id: ADP-YIELD-204
    name: Ad Product Yield
    domain: Ad Products
    answers: What is CPM and yield by vertical, format and quarter?
    status: proposed
    owner: Daya Thakur
    steward: Jamie Jackette — Ad Products Finance
    cube_views:
      - adproducts_view_yield
    measures: [CPM, Ad Innovation CPM, Traditional CPM, Yield $, Yield %]
    dimensions: [Property, Format, Calendar Quarter]
    grain: Vertical x format x quarter
    cadence: Weekly close
    environments: []
    known_gaps:
      - >-
        Depends on the In-front 1.9x impression multiplier becoming an
        effective-dated rule row rather than a constant repeated in 560
        formulas.
      - >-
        "Production Fee" is unmapped in the buy-type map, so $108,507 drops out
        of every breakdown while staying in the total.
    related_requirements: [ADP-SEM-06, ADP-ICE-10]

