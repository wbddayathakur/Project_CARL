    steward: Eric Yarsinsky / Maggie Mullane — ASR Marketplace Insights
    tables:
      - marketplace_insights_gold.fct_telecast_supply
      - marketplace_insights_gold.fct_telecast_demand
    cube_views:
      - marketplace_view_telecast_supply_demand
    measures: [Gross Impressions, Gross Spend, EQ30 Spot Count, CPM, Share of Spend, Power Ratio]
    dimensions: [Ownership, Network, Programming Genre, Program, Telecast, Buy Type, ADU, Demo, Viewing Methodology, Broadcast Month]
    grain: Telecast x broad demo (supply); telecast x buy type x ADU x spot length (demand)
    cadence: Monthly on Guideline delivery; weekly for MIT
    environments: []
    known_gaps:
      - Guideline Telecast is not landed in CARL (Bronze guideline_bronze proposed).
      - Panel Only MIT history before Big MIT reaches CARL only through marketshare_bronze.factprogram.
      - VAMI breakout ranking is contradictory between code and documentation (Q-01).
    related_requirements: [PN-01, PN-02, PN-03, PN-05, MSD-06, MSD-08, MSD-09]

