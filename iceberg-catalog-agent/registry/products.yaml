  # ---------------------------------------------------------------------
  # Ad Products — designed against the Week 35 workbook, not yet built
  # ---------------------------------------------------------------------

  - product_id: ADP-BOOKED-201
    name: Ad Product Booked Revenue
    domain: Ad Products
    answers: >-
      What ad-innovation revenue has been booked by product, property, site and
      format, and on what basis?
    status: proposed
    owner: Daya Thakur
    steward: Jamie Jackette — Ad Products Finance
    tables:
      - adproducts_gold.fct_ad_revenue_booked
    cube_views:
      - adproducts_view_ad_revenue_booked
    measures:
      - Net Revenue
      - Gross Revenue
      - Contracted Quantity
      - Booked Contracted Production Quantity
      - Adjusted Impressions
    dimensions:
      [Ad Product, Property, Site, Format, Cost Type, Sponsorship Package, Audience Flag, Calendar Month]
    grain: >-
      line_item x product x property x site x format x cost_type x package x
      audience_flag x calendar month
    cadence: Weekly close
    environments: []
    known_gaps:
      - >-
        Blocked on Operative exposing a line-item or order key. Without one
        there is no grain integrity and overlap can only be resolved at bucket
        level.
      - Audience flag is a header row in the workbook today, not a column.
    related_requirements: [AP-1.1, AP-1.2, ADP-ICE-01, ADP-ICE-07, ADP-SEM-02]

  - product_id: ADP-DELIVERY-202
    name: Ad Product Delivery
    domain: Ad Products
    answers: What did display actually deliver, by line item and ad unit?
    status: proposed
    owner: Daya Thakur
    steward: Jamie Jackette — Ad Products Finance
    tables:
      - adproducts_gold.fct_ad_delivery
    cube_views:
      - adproducts_view_ad_delivery
    measures: [Monetized Impressions, Gross Revenue Adjusted, Net Revenue]
    dimensions: [Ad Product, Site, Ad Unit, Format, Audience Flag, Activity Month]
    grain: line_item x product x site x ad_unit x format x audience_flag x activity month
    cadence: Weekly close
    environments: []
    known_gaps:
      - >-
        Kept deliberately separate from booked revenue because the two run on
        different calendars — booked on calendar quarter, delivered on activity
        quarter. Merging them silently is the failure mode this product exists
        to prevent.
      - >-
        $65.74M of $80.38M GAM revenue sits under product "Other", so yield by
        product cannot be completed for display until GAM line items carry a
        placement classification.
    related_requirements: [AP-1.2, ADP-ICE-08, ADP-SEM-03]

