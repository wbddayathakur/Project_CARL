  - product_id: MSI-SUPPLY-DEMAND-301
    name: Telecast Supply & Demand (Nielsen C3 x Guideline spend)
    domain: Research Market Share
    answers: >-
      How is WBD doing against peers on C3 impressions and benchmark ad spend,
      and what are WBD's share and power ratio by network, genre and quarter?
