    dimensions: [Media Parent Owner, Network, Category Group, Category, Subcategory, Buy Type, Broadcast Month]
    grain: AccuTV delivered grain (layout to be confirmed)
    cadence: Monthly on Guideline delivery
    environments: []
    known_gaps:
      - AccuTV is not landed in CARL and its file layout is undocumented.
    related_requirements: [PN-07, MSD-11]

