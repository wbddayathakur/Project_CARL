<p class="small">"Latest dated item" is the last date anyone has written down, not a forecast. Where items are undated, the sub-project cannot honestly be given an end date. Click a tile for the deliverables behind it.</p></div>

 h+=D.groups.map(g=>{const ss=S.filter(s=>s.g==g.id);return`<details class="grp" open style="border-color:${g.c}"><summary><span><b style="color:${g.c}">${esc(g.n)}</b> <span class="small">— ${esc(g.d)}</span></span><span class="small">${ss.length} sub-projects</span></summary><div class="tw"><table><tr><th style="width:22px"></th><th style="min-width:230px">Sub-project</th><th>Milestone ladder</th><th style="min-width:110px">Progress</th><th style="min-width:170px">Next milestone</th><th style="min-width:150px">Delivery date</th><th style="min-width:130px">Owner</th><th style="min-width:230px">Top blocker</th></tr>${ss.map(s=>`<tr class="cl" data-open="${s.id}"><td><span class="rag r${s.rag}"></span></td><td><b>${esc(s.name)}</b><div class="small">${esc(s.outcome)}</div></td><td>${ladder(s)}</td><td>${sbar(s.sp)}</td><td>${s.nxt?`${esc(s.nxt.n)}<div>${fd(s.nxt.eff)} ${chip(s.nxt.state)}</div>`:`<span class="small">No dated milestone</span>`}</td><td>${endText(s)}</td><td class="small">${esc(s.owner)}</td><td class="small">${esc(s.blocker)}</td></tr>`).join("")}</table></div></details>`}).join("");
 $("#plan").innerHTML=h;$$("[data-open]").forEach(e=>e.onclick=()=>openSub(e.dataset.open))})();

/* ---------- Drawer ---------- */
function openSub(id){const s=SUB[id],g=GR[s.g],dr=$("#drawer");
 const rows=s.items.map(r=>{const date=r.a&&r.bucket=="done"?`<b>${fd(r.a)}</b> <span class="small">actual</span>`:r.fc?`<s class="small">${fd(r.t)}</s> <b>${fd(r.fc)}</b>`:r.eff?`<b>${fd(r.eff,r.approx)}</b>`:"—";
  return`<tr><td><span class="bk" style="background:${r.kind=="ext"?"var(--ext)":BC[r.bucket]}"></span>${esc(r.n)}${r.key?`<div class="small">${lnk(r)}${r.kind=="rm"?"":""}</div>`:`<div class="small">${r.kind=="ext"?"product / dependency milestone":"no Jira epic"}</div>`}</td><td>${esc(r.st||"")}${r.sp&&r.sp[0]?`<div class="small">${r.sp[1]}/${r.sp[0]} SP</div>`:""}</td><td class="small">${esc(r.o||"")}</td><td class="small">${r.s?fd(r.s):"—"}</td><td>${date}</td><td>${chip(r.state)}</td><td class="small">${esc(r.note||"")}${r.src?` <i>[${esc(r.src)}]</i>`:""}</td></tr>`}).join("");
 dr.innerHTML=`<span class="x" onclick="$('#drawer').classList.remove('on')">×</span><span class="pill" style="background:${g.c};color:#fff">${esc(g.n)}</span><h2><span class="rag r${s.rag}"></span> ${esc(s.name)}</h2><div class="small">${esc(s.outcome)}</div>
<p><b>Phase:</b> ${esc(s.phase)}<br><b>Why ${{G:"green",A:"amber",R:"red"}[s.rag]}:</b> ${esc(s.why)}</p>${ladder(s)}
<div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px"><div class="card" style="margin:0"><div class="small">Delivery date</div>${endText(s)}</div><div class="card" style="margin:0"><div class="small">Progress (Jira SP)</div>${sbar(s.sp)}</div></div>
<h4>Deliverables (${s.items.length}) — ${s.n_done} done · ${s.n_open} open</h4><div class="tw"><table><tr><th>Deliverable</th><th>Status</th><th>Owner</th><th>Start</th><th>Target</th><th>Date state</th><th>Note [source]</th></tr>${rows}</table></div>
${s.ask?`<h4>Decision / ask</h4><div class="warn">${esc(s.ask)}</div>`:""}${s.blocker?`<h4>Top blocker</h4><p>${esc(s.blocker)}</p>`:""}
${s.docs.length?`<h4>Confluence</h4>${s.docs.map(x=>`<div><a href="${x.u}" target="_blank">${esc(x.t)}</a></div>`).join("")}`:""}`;dr.classList.add("on")}
document.addEventListener("keydown",e=>{if(e.key=="Escape")$("#drawer").classList.remove("on")});

/* ---------- Timeline ---------- */
(()=>{const T0=dt("2026-06-01"),T1=dt("2027-03-01"),PX=135,MN=9,W=PX*MN,x=v=>(dt(v)-T0)/(T1-T0)*W;let exp=new Set(),all=false,fg="ALL";
 const itemDate=r=>r.bucket=="done"?(r.a||null):r.eff;
 function draw(){const subs=D.subs.filter(s=>fg=="ALL"||s.g==fg);
  let h=`<div class="ctl"><button id="tgAll" class="${all?"on":""}">${all?"Hide":"Show"} deliverables</button><select id="tgG"><option value="ALL">All groups</option>${D.groups.map(g=>`<option value="${g.id}" ${fg==g.id?"selected":""}>${esc(g.n)}</option>`).join("")}</select><span class="small">Bar = first start → latest open date. Marker = one deliverable's date. Click a sub-project name to expand it.</span></div>
<div class="lg"><span><span class="mk dn" style="position:static;display:inline-block;background:var(--done)"></span> delivered</span><span><span class="mk" style="position:static;display:inline-block;background:var(--build)"></span> in build</span><span><span class="mk" style="position:static;display:inline-block;background:var(--req)"></span> to do / triage</span><span><span class="mk" style="position:static;display:inline-block;background:var(--block)"></span> blocked</span><span><span class="mk od" style="position:static;display:inline-block;background:#fff"></span> past its date</span><span><span class="mk ex" style="position:static;display:inline-block"></span> product milestone (month-level dates shown at month end)</span><span><span class="today" style="position:static;display:inline-block;height:12px"></span> today</span><span>(dates before June are pinned to the left edge)</span></div>
<div class="tl"><div class="tlh"><div class="lab">Sub-project</div><div style="display:flex;width:${W}px">${Array.from({length:MN},(_,i)=>{const m=(5+i)%12;return`<div class="mo" style="width:${PX}px">${MO[m]}${m==0||i==0?" "+(i<7?2026:2027):""}</div>`}).join("")}</div></div>`;
  D.groups.forEach(g=>{const ss=subs.filter(s=>s.g==g.id);if(!ss.length)return;h+=`<div class="band" style="background:${g.c}">${esc(g.n)}</div>`;
   ss.forEach(s=>{const its=s.items.filter(r=>itemDate(r)||r.s);const starts=s.items.filter(r=>r.kind!="ext"&&r.s).map(r=>r.s),ends=s.items.filter(r=>r.kind!="ext"&&itemDate(r)).map(itemDate);
    const a=starts.length?starts.sort()[0]:(ends.length?ends.sort()[0]:null),b=ends.length?ends.sort().slice(-1)[0]:null;
    const bar=a&&b?`<div class="gbar" style="left:${Math.max(0,x(a))}px;width:${Math.max(6,x(b)-Math.max(0,x(a)))}px;background:${RC[s.rag]}"></div>`:"";
    const mk=r=>{const v=itemDate(r);if(!v)return"";const od=r.bucket!="done"&&r.kind!="ext"&&(r.state=="overdue"||r.state=="fcpassed");let vv=v;if(r.approx){const q=dt(v);vv=new Date(q.getFullYear(),q.getMonth()+1,0).toISOString().slice(0,10)}
     return`<div class="mk ${r.kind=="ext"?"ex":r.bucket=="done"?"dn":""} ${od?"od":""}" style="left:${Math.max(2,x(vv)-7)}px;background:${BC[r.bucket]}" title="${esc(r.n)} — ${esc(r.st||"")} — ${fd(v,r.approx)}"></div>`};
    const grid=Array.from({length:MN},(_,i)=>`<div class="gl" style="left:${i*PX}px"></div>`).join(""),tl=`<div class="today" style="left:${x(D.today)}px"></div>`;
    const isE=all||exp.has(s.id);
    h+=`<div class="lane"><div class="lab" data-x="${s.id}"><span class="rag r${s.rag}"></span> ${isE?"▾":"▸"} ${esc(s.name)}${s.undated?` <span class="chip c-nodate">${s.undated} undated</span>`:""}</div><div class="track" style="width:${W}px">${grid}${bar}${tl}${s.items.map(mk).join("")}</div></div>`;
    if(isE)s.items.forEach(r=>{const v=itemDate(r),st=r.s?x(r.s):null;const barC=r.s&&v?`<div class="gbar" style="left:${Math.max(0,st)}px;width:${Math.max(4,x(v)-Math.max(0,st))}px;background:${r.kind=="ext"?"var(--ext)":BC[r.bucket]}"></div>`:"";
     h+=`<div class="lane child"><div class="lab" title="${esc(r.n)}">${r.kind=="ext"?"◇ ":""}${esc(r.n.length>46?r.n.slice(0,45)+"…":r.n)} ${r.key?`<span class="small">${r.key}</span>`:""}</div><div class="track" style="width:${W}px">${grid}${tl}${barC}${mk(r)}${v?"":`<div class="nd" style="left:${x(D.today)+8}px">${r.state=="ongoing"?"ongoing":"no date"}</div>`}</div></div>`})});
  });
  $("#timeline").innerHTML=h+`</div>`;
  $("#tgAll").onclick=()=>{all=!all;draw()};$("#tgG").onchange=e=>{fg=e.target.value;draw()};
  $$("#timeline [data-x]").forEach(e=>e.onclick=ev=>{const i=e.dataset.x;if(ev.shiftKey||ev.metaKey){openSub(i);return}exp.has(i)?exp.delete(i):exp.add(i);draw()})}
 draw()})();

/* ---------- What comes when ---------- */
(()=>{const rows=[];D.subs.forEach(s=>s.items.forEach(r=>{if(r.bucket=="done")return;rows.push({s,r})}));
 const bucket=({r})=>{if(r.state=="overdue")return"1 · Past its date, no new forecast";if(r.state=="fcpassed")return"2 · Forecast date already passed";if(!r.eff)return r.state=="ongoing"?"9 · Ongoing (no end date by design)":"8 · No date set";
  const n=days(r.eff);if(n<=7)return"3 · Next 7 days (to 28 Oct)";const q=dt(r.eff);if(q.getFullYear()==2026&&q.getMonth()==9)return"4 · Rest of October";if(q.getFullYear()==2026&&q.getMonth()==10)return"5 · November";if(q.getFullYear()==2026&&q.getMonth()==11)return"6 · December";return"7 · 2027"};
 let q="",fg="ALL",ext=true,nod=true;
 function draw(){let list=rows.filter(o=>(fg=="ALL"||o.s.g==fg)&&(ext||o.r.kind!="ext")&&(nod||o.r.eff)&&(!q||(o.s.name+o.r.n+(o.r.o||"")+(o.r.key||"")).toLowerCase().includes(q)));
  const B={};list.forEach(o=>(B[bucket(o)]=B[bucket(o)]||[]).push(o));
  let h=`<div class="ctl"><input type="text" id="wq" placeholder="Search deliverable, owner, Jira key…" value="${esc(q)}" style="width:280px"><select id="wg"><option value="ALL">All groups</option>${D.groups.map(g=>`<option value="${g.id}" ${fg==g.id?"selected":""}>${esc(g.n)}</option>`).join("")}</select><label><input type="checkbox" id="we" ${ext?"checked":""}> product milestones</label><label><input type="checkbox" id="wn" ${nod?"checked":""}> undated items</label><span class="small">${list.length} open deliverables</span></div>`;
  Object.keys(B).sort().forEach(k=>{const L=B[k].sort((a,b)=>(a.r.eff||"9").localeCompare(b.r.eff||"9"));h+=`<div class="card"><h3>${esc(k.slice(4))} <span class="small">(${L.length})</span></h3><div class="tw"><table><tr><th style="width:110px">Date</th><th style="min-width:200px">Sub-project</th><th style="min-width:300px">Deliverable</th><th>Status</th><th>Owner</th><th>State</th></tr>${L.map(o=>`<tr class="cl" data-open="${o.s.id}"><td><b>${fd(o.r.eff,o.r.approx)}</b>${o.r.fc?`<div class="small">was ${fd(o.r.t)}</div>`:""}</td><td><span class="rag r${o.s.rag}"></span> ${esc(o.s.name)}</td><td>${o.r.kind=="ext"?"◇ ":""}${esc(o.r.n)} ${lnk(o.r)?`<span class="small">${lnk(o.r)}</span>`:""}</td><td class="small">${esc(o.r.st||"")}</td><td class="small">${esc(o.r.o||"")}</td><td>${chip(o.r.state)}</td></tr>`).join("")}</table></div></div>`});
  $("#when").innerHTML=h;$("#wq").oninput=e=>{q=e.target.value.toLowerCase();draw();const i=$("#wq");i.focus();i.setSelectionRange(i.value.length,i.value.length)};$("#wg").onchange=e=>{fg=e.target.value;draw()};$("#we").onchange=e=>{ext=e.target.checked;draw()};$("#wn").onchange=e=>{nod=e.target.checked;draw()};
  $$("#when [data-open]").forEach(e=>e.onclick=()=>openSub(e.dataset.open))}
 draw()})();

/* ---------- Sources x layers ---------- */
(()=>{const cell=c=>`<td><span class="st s-${c[0]}">${esc(c[1])}</span></td>`;
 $("#sources").innerHTML=`<div class="card"><h3>Every source, by layer — and where it is tracked</h3><p class="small">Layer state comes from Jira epics and the Confluence source-layer tables (30 Sep, refreshed with the 19 Oct weekly status). "Next date" is the earliest open dated epic for that source; "undated" counts open epics with no date.</p><div class="tw"><table><tr><th>Source</th><th>Bronze</th><th>Silver</th><th>Gold</th><th>Consumers</th><th>Next date</th><th>Tracked under</th></tr>${D.sources.map(r=>`<tr class="${r.sub?"cl":""}" ${r.sub?`data-open="${r.sub}"`:""}><td><b>${esc(r.src)}</b></td>${cell(r.b)}${cell(r.s)}${cell(r.g)}<td class="small">${esc(r.use)}</td><td>${r.next?`<b>${fd(r.next.eff)}</b> ${chip(r.next.state)}`:`<span class="small">—</span>`}${r.undated?` <span class="chip c-nodate">${r.undated} undated</span>`:""}</td><td class="small">${esc(r.sub_name)}</td></tr>`).join("")}</table></div></div>`;
 $$("#sources [data-open]").forEach(e=>e.onclick=()=>openSub(e.dataset.open))})();

/* ---------- Reconfirm ---------- */
(()=>{const all=[];D.subs.forEach(s=>s.items.forEach(r=>{if(r.bucket!="done"&&r.kind!="ext")all.push({s,r})}));
 const pick=f=>all.filter(o=>f(o.r)).sort((a,b)=>(a.r.eff||"").localeCompare(b.r.eff||""));
 const tbl=(L,cols)=>`<div class="tw"><table><tr>${cols.map(c=>`<th>${c}</th>`).join("")}</tr>${L.map(o=>`<tr class="cl" data-open="${o.s.id}"><td>${esc(o.s.name)}</td><td>${esc(o.r.n)} ${lnk(o.r)?`<span class="small">${lnk(o.r)}</span>`:""}</td><td class="small">${esc(o.r.st||"")}</td><td class="small">${esc(o.r.o||o.s.owner)}</td><td>${o.r.eff?`${o.r.fc?`<s class="small">${fd(o.r.t)}</s> `:""}<b>${fd(o.r.eff)}</b> <span class="small">${Math.abs(days(o.r.eff))}d ago</span>`:chip("nodate")}</td></tr>`).join("")}</table></div>`;
 const od=pick(r=>r.state=="overdue"||r.state=="fcpassed"),nd=pick(r=>r.state=="nodate");
 const byS={};nd.forEach(o=>(byS[o.s.id]=byS[o.s.id]||[]).push(o));
 $("#reconfirm").innerHTML=`<div class="warn"><b>${od.length}</b> open deliverables are past their date with no new commitment, and <b>${nd.length}</b> open deliverables have no date at all. These are the ones to reconfirm with owners before this goes to Nage.</div>
<div class="card"><h3>1 · Past their date (target or forecast already passed)</h3>${tbl(od,["Sub-project","Deliverable","Status","Owner","Date"])}</div>
<div class="g2"><div class="card"><h3>2 · Sources disagree</h3><div class="tw"><table><tr><th>Area</th><th>What differs</th><th>Ask</th></tr>${D.conflicts.map(c=>`<tr><td><b>${esc(c[0])}</b></td><td>${esc(c[1])}<div class="small">${esc(c[3])}</div></td><td class="small">${esc(c[2])}</td></tr>`).join("")}</table></div></div>
<div class="card"><h3>3 · Decisions needed</h3><div class="tw"><table><tr><th>Area</th><th>Decision</th><th>Owner</th></tr>${D.decisions.map(c=>`<tr><td><b>${esc(c[0])}</b></td><td>${esc(c[1])}</td><td class="small">${esc(c[2])}</td></tr>`).join("")}</table></div></div></div>
<div class="card"><h3>4 · Open with no date (${nd.length}) — by sub-project</h3>${Object.values(byS).sort((a,b)=>b.length-a.length).map(L=>`<details style="margin-bottom:6px"><summary style="cursor:pointer"><b>${esc(L[0].s.name)}</b> <span class="chip c-nodate">${L.length} undated</span></summary>${tbl(L,["Sub-project","Deliverable","Status","Owner","Date"])}</details>`).join("")}</div>`;
 $$("#reconfirm [data-open]").forEach(e=>e.onclick=()=>openSub(e.dataset.open))})();

/* ---------- Method ---------- */
$("#method").innerHTML=`<div class="g2"><div class="card"><h3>How this is organised</h3><ul>
<li><b>Sub-project first.</b> Each row on the Delivery plan is something a stakeholder asks about — MicroStrategy, Salesforce dashboards, UMP, Venus/iDeal, NEO, Nielsen, FreeWheel, GAM. Jira epics, stories and roadmap-only items sit underneath it as deliverables.</li>
<li><b>Five groups:</b> business deliverables, legacy BI migration, internal products CARL feeds, data sources, platform. A source (Nielsen, FreeWheel…) is tracked once, under Data sources; the products that consume it point to it.</li>
<li><b>Each epic appears once.</b> ${D.subs.reduce((a,s)=>a+s.items.filter(r=>r.kind=="epic").length,0)} Jira epics are placed in exactly one sub-project. The build fails if one is missing or doubled.</li>
<li><b>Delivery date</b> = the latest date anyone has written for an open CARL deliverable. It is <i>not</i> a forecast. If any open item is undated the cell says so, because the sub-project cannot honestly be given an end date.</li>
<li><b>Product milestones</b> (purple) come from Confluence planning minutes. They are shown but never move a CARL delivery date.</li>
<li><b>Progress</b> uses Jira story points. To Do and In Triage count as in progress (the PM is gathering requirements), shown in blue so "being defined" stays distinct from "being built".</li>
<li><b>RAG</b> is a judgement written against evidence, with the reason in each sub-project's drawer. Jira's own RAG is not used as-is.</li></ul></div>
<div class="card"><h3>Source precedence</h3><ol>
<li>Status and story points — live Jira (CARL), snapshot 21 Oct 14:56; live epic pull on 21 Oct corrected CARL-2778 to Done.</li>
<li>Scope, owners, committed dates — CARL_2026Q4_QuarterlyPlanning,Status&amp;Roadmap.xlsx.</li>
<li>Epic detail and SP — CARL_Epic_SP_by_Status_20260930_Mapped_Ping_v2.xlsx (30 Sep; mapping only).</li>
<li>Product milestones and risks — Confluence: Q4/Q1 Planning minutes (7 Oct), weekly status (19 Oct), Leadership Review (30 Sep), Product Tracking and Readiness (30 Sep), FreeWheel Silver design, NEO 2.0 status.</li></ol>
<h3 style="margin-top:14px">Not available when this was built</h3><ul>
<li>The Slack channel "CARL Program Status" and the old <i>CARL_Delivery_Roadmap.html</i> — layout here is rebuilt from the description of what Ranjeeta found useful.</li>
<li><i>CARL_Weekly_Program_Status_Oct16_2026.docx</i> — dates tagged PACK16 come from the Slack summary and should be checked against the document.</li>
<li>The 19 Oct UC1 email — tagged EML19, same caveat.</li>
<li>Comscore — no Jira epic or Confluence page was found.</li></ul>
<p class="small">Rebuild: <code>python build.py</code> in <code>carl-delivery-roadmap/</code>. Edit <code>subprojects.py</code> for structure; the numbers refresh from the roadmap agent's Jira snapshot.</p></div></div>`;
{const [t,sid]=location.hash.slice(1).split("/");go(TABS.some(x=>x[0]==t)?t:"plan");if(sid&&SUB[sid])openSub(sid)}
</script></body></html>
