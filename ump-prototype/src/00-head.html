<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>UMP — Unified Media Planning · Prototype Round 1</title>
<!-- Self-contained. React and every source file are inlined below; nothing is fetched. -->
<style>
/* ------------------------------------------------------------------ tokens */
:root{
  --bg:#f4f6f8;
  --panel:#ffffff;
  --panel-2:#fafbfc;
  --ink:#0f1519;
  --ink-2:#57636e;
  --ink-3:#8a95a0;
  --line:#dfe4e9;
  --line-2:#edf0f3;
  --accent:#0b57d0;
  --accent-2:#0842a0;
  --accent-soft:#e8f0fe;
  --good:#0d7a4e;
  --good-soft:#e6f4ec;
  --warn:#9a6600;
  --warn-soft:#fdf2dc;
  --bad:#b3261e;
  --bad-soft:#fce9e7;
  --violet:#5b3fb8;
  --violet-soft:#efeaff;
  --teal:#0a6b6b;
  --teal-soft:#e3f2f2;
  --grid-head:#f2f4f7;
  --shadow:0 1px 2px rgba(16,24,40,.05), 0 8px 24px -12px rgba(16,24,40,.18);
  --mono:"SF Mono",ui-monospace,"JetBrains Mono",Menlo,Consolas,monospace;
  --sans:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --rail:236px;
}
*{box-sizing:border-box}
html,body,#root{height:100%}
body{
  margin:0;background:var(--bg);color:var(--ink);
  font-family:var(--sans);font-size:13px;line-height:1.45;
  -webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums;
}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:none;padding:0}
a{color:var(--accent);text-decoration:none}
h1,h2,h3,h4{margin:0;font-weight:600;letter-spacing:-.01em}
.num{font-variant-numeric:tabular-nums}
.mono{font-family:var(--mono);font-size:11.5px}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:#c9d1d9;border-radius:8px;border:3px solid transparent;background-clip:content-box}
::-webkit-scrollbar-thumb:hover{background:#aab4bf;background-clip:content-box;border:3px solid transparent}
::-webkit-scrollbar-track{background:transparent}

/* ------------------------------------------------------------------ shell */
.app{display:grid;grid-template-columns:var(--rail) 1fr;height:100%;overflow:hidden}
.rail{background:#0f1519;color:#c8d0d8;display:flex;flex-direction:column;overflow:hidden}
.rail-brand{padding:16px 16px 12px;border-bottom:1px solid #1e262d}
.rail-brand .wb{font-size:10px;letter-spacing:.16em;color:#6f7d8a;font-weight:600}
.rail-brand .nm{font-size:15px;color:#fff;font-weight:600;margin-top:3px;letter-spacing:-.01em}
.rail-brand .sub{font-size:10.5px;color:#6f7d8a;margin-top:2px}
.rail-scroll{flex:1;overflow-y:auto;padding:10px 8px 20px}
.rail-scroll::-webkit-scrollbar-thumb{background:#2b3views}
.rail-sec{font-size:9.5px;letter-spacing:.14em;color:#5c6874;font-weight:700;padding:14px 10px 6px}
.rail-item{display:flex;align-items:center;gap:9px;width:100%;text-align:left;padding:7px 10px;border-radius:7px;color:#aeb9c4;font-size:12.5px}
.rail-item:hover{background:#1a232b;color:#e6ebf0}
.rail-item.on{background:var(--accent);color:#fff;font-weight:500}
.rail-item.on .rail-dot{background:#fff}
.rail-item .rail-dot{width:5px;height:5px;border-radius:50%;background:#3b4753;flex:none}
.rail-item .k{margin-left:auto;font-size:10px;color:#5c6874;font-family:var(--mono)}
.rail-item.on .k{color:#cfe0ff}
.rail-foot{border-top:1px solid #1e262d;padding:10px 14px;font-size:10.5px;color:#5c6874}

.main{display:flex;flex-direction:column;overflow:hidden;background:var(--bg)}
.topbar{height:52px;flex:none;background:var(--panel);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:14px;padding:0 18px}
.topbar h1{font-size:14.5px}
.topbar .crumb{color:var(--ink-3);font-size:12px}
.topbar .spacer{flex:1}
.content{flex:1;overflow-y:auto;overflow-x:hidden}
.pad{padding:18px 22px 60px;max-width:1560px}

/* ------------------------------------------------------------------ atoms */
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px}
.card-h{display:flex;align-items:center;gap:10px;padding:11px 14px;border-bottom:1px solid var(--line-2)}
.card-h h3{font-size:12.5px}
.card-h .sp{flex:1}
.card-b{padding:14px}
.card-b.tight{padding:0}
.sec-title{font-size:10px;letter-spacing:.13em;font-weight:700;color:var(--ink-3);text-transform:uppercase}
.muted{color:var(--ink-2)}
.dim{color:var(--ink-3)}
.tiny{font-size:11px}
.mini{font-size:10.5px}
.row{display:flex;align-items:center;gap:8px}
.col{display:flex;flex-direction:column}
.wrap{flex-wrap:wrap}
.grow{flex:1}
.hr{height:1px;background:var(--line-2);margin:12px 0}

.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--panel);
  padding:6px 11px;border-radius:7px;font-size:12px;font-weight:500;color:var(--ink);white-space:nowrap}
.btn:hover{background:var(--panel-2);border-color:#c9d1d9}
.btn.pri{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.pri:hover{background:var(--accent-2);border-color:var(--accent-2)}
.btn.dark{background:#101820;border-color:#101820;color:#fff}
.btn.dark:hover{background:#26313b}
.btn.dgr{color:var(--bad);border-color:#f0cfcc}
.btn.dgr:hover{background:var(--bad-soft)}
.btn.ok{color:var(--good);border-color:#bfe0cf}
.btn.ok:hover{background:var(--good-soft)}
.btn.sm{padding:3.5px 8px;font-size:11px;border-radius:6px}
.btn.xs{padding:2px 6px;font-size:10.5px;border-radius:5px}
.btn.gho{border-color:transparent;background:transparent;color:var(--ink-2)}
.btn.gho:hover{background:var(--line-2);color:var(--ink)}
.btn:disabled{opacity:.42;cursor:not-allowed}

.chip{display:inline-flex;align-items:center;gap:4px;font-size:10px;font-weight:600;letter-spacing:.02em;
  padding:2px 6px;border-radius:5px;background:var(--line-2);color:var(--ink-2);white-space:nowrap;border:1px solid transparent}
.chip.b{background:var(--accent-soft);color:var(--accent-2);border-color:#cfe0fb}
.chip.g{background:var(--good-soft);color:var(--good);border-color:#c8e6d6}
.chip.a{background:var(--warn-soft);color:var(--warn);border-color:#f2dfb6}
.chip.r{background:var(--bad-soft);color:var(--bad);border-color:#f4cfcb}
.chip.v{background:var(--violet-soft);color:var(--violet);border-color:#ded3fb}
.chip.t{background:var(--teal-soft);color:var(--teal);border-color:#c6e4e4}
.chip.n{background:#0f1519;color:#fff}
.chip.o{background:transparent;border:1px dashed var(--line);color:var(--ink-3)}

.pill{display:inline-flex;align-items:center;gap:5px;font-size:11px;padding:3px 9px;border-radius:99px;
  background:var(--panel);border:1px solid var(--line);color:var(--ink-2)}
.pill.on{background:#0f1519;border-color:#0f1519;color:#fff}
.dot{width:6px;height:6px;border-radius:50%;flex:none}

.kv{display:grid;grid-template-columns:120px 1fr;gap:6px 12px;font-size:12px}
.kv dt{color:var(--ink-3)}
.kv dd{margin:0}

.stat{padding:10px 13px;border:1px solid var(--line);border-radius:9px;background:var(--panel);min-width:0}
.stat .lb{font-size:9.5px;letter-spacing:.11em;text-transform:uppercase;color:var(--ink-3);font-weight:700}
.stat .vl{font-size:19px;font-weight:600;letter-spacing:-.02em;margin-top:3px;white-space:nowrap}
.stat .dl{font-size:10.5px;color:var(--ink-2);margin-top:1px}
.statgrid{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(140px,1fr))}

.bar{height:5px;border-radius:3px;background:var(--line-2);overflow:hidden}
.bar > i{display:block;height:100%;background:var(--accent);border-radius:3px}
.bar.g > i{background:var(--good)} .bar.a > i{background:#d99400} .bar.r > i{background:var(--bad)}

.banner{display:flex;gap:10px;padding:10px 13px;border-radius:9px;font-size:12px;border:1px solid}
.banner.b{background:var(--accent-soft);border-color:#cfe0fb;color:#123a80}
.banner.a{background:var(--warn-soft);border-color:#f2dfb6;color:#6d4a00}
.banner.r{background:var(--bad-soft);border-color:#f4cfcb;color:#8c1d17}
.banner.g{background:var(--good-soft);border-color:#c8e6d6;color:#0a5c3b}
.banner .bi{font-weight:700;flex:none}

/* ------------------------------------------------------- excel-affinity grid */
.xl{border:1px solid var(--line);border-radius:9px;background:var(--panel);overflow:hidden}
.xl-bar{display:flex;align-items:center;gap:8px;padding:6px 8px;border-bottom:1px solid var(--line);background:var(--panel-2)}
.xl-name{font-family:var(--mono);font-size:11px;background:var(--panel);border:1px solid var(--line);
  border-radius:5px;padding:2px 8px;min-width:66px;text-align:center;color:var(--ink-2)}
.xl-fx{flex:1;font-family:var(--mono);font-size:11.5px;background:var(--panel);border:1px solid var(--line);
  border-radius:5px;padding:2.5px 9px;color:var(--ink-2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.xl-scroll{overflow:auto;max-height:var(--xlh,560px)}
table.xg{border-collapse:separate;border-spacing:0;width:100%;font-size:12px}
table.xg th,table.xg td{border-right:1px solid var(--line-2);border-bottom:1px solid var(--line-2);padding:0 8px;height:29px;
  white-space:nowrap;background:var(--panel)}
table.xg thead th{position:sticky;top:0;z-index:3;background:var(--grid-head);font-weight:600;color:var(--ink-2);
  font-size:11px;text-align:left;border-bottom:1px solid var(--line)}
table.xg thead tr.abc th{height:19px;font-family:var(--mono);font-size:9.5px;color:var(--ink-3);text-align:center;font-weight:500;
  background:#e9edf1;top:0}
table.xg thead tr.hdr th{top:19px}
table.xg tbody td.rn, table.xg thead th.rn{position:sticky;left:0;z-index:2;background:var(--grid-head);text-align:center;
  font-family:var(--mono);font-size:10px;color:var(--ink-3);width:34px;min-width:34px;padding:0 4px;border-right:1px solid var(--line)}
table.xg thead th.rn{z-index:4}
table.xg tbody tr:hover td{background:#f7f9fb}
table.xg tbody tr:hover td.rn{background:#e9edf1}
table.xg td.sel{outline:2px solid var(--accent);outline-offset:-2px;background:#f0f6ff !important}
table.xg td.r,table.xg th.r{text-align:right}
table.xg td.c,table.xg th.c{text-align:center}
table.xg tr.tot td{background:#f2f4f7;font-weight:600;position:sticky;bottom:0;border-top:1px solid var(--line)}
table.xg tr.dis td{color:var(--ink-3)}
table.xg td.edit{background:#fffdf3}
.xl-foot{display:flex;align-items:center;gap:12px;padding:5px 10px;border-top:1px solid var(--line);
  background:var(--panel-2);font-size:11px;color:var(--ink-2)}

/* simple table (non-excel) */
table.tb{border-collapse:collapse;width:100%;font-size:12px}
table.tb th{text-align:left;font-weight:600;color:var(--ink-3);font-size:10px;letter-spacing:.08em;text-transform:uppercase;
  padding:7px 10px;border-bottom:1px solid var(--line)}
table.tb td{padding:8px 10px;border-bottom:1px solid var(--line-2);vertical-align:top}
table.tb tbody tr:hover{background:var(--panel-2)}
table.tb td.r,table.tb th.r{text-align:right}

/* ------------------------------------------------------------------ tabs */
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);padding:0 2px}
.tabs button{padding:8px 13px;font-size:12.5px;color:var(--ink-2);border-bottom:2px solid transparent;margin-bottom:-1px;font-weight:500}
.tabs button:hover{color:var(--ink)}
.tabs button.on{color:var(--accent);border-bottom-color:var(--accent);font-weight:600}
.tabs .ct{font-size:10px;background:var(--line-2);border-radius:99px;padding:0 5px;margin-left:5px;color:var(--ink-2)}

/* --------------------------------------------------------- phase progress */
.phaserail{display:flex;align-items:stretch;gap:0;background:var(--panel);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.phasestep{flex:1;padding:9px 12px 9px 22px;position:relative;text-align:left;border-right:1px solid var(--line-2);min-width:0}
.phasestep:first-child{padding-left:14px}
.phasestep:after{content:"";position:absolute;right:-11px;top:50%;transform:translateY(-50%) rotate(45deg);width:20px;height:20px;
  background:var(--panel);border-top:1px solid var(--line-2);border-right:1px solid var(--line-2);z-index:2}
.phasestep:last-child:after{display:none}
.phasestep .pl{font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3);font-weight:700}
.phasestep .pn{font-size:12.5px;font-weight:600;margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.phasestep .po{font-size:10.5px;color:var(--ink-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.phasestep.done{background:#f3f8f5}.phasestep.done:after{background:#f3f8f5}
.phasestep.done .pl{color:var(--good)}
.phasestep.cur{background:#0f1519}.phasestep.cur:after{background:#0f1519;border-color:#0f1519}
.phasestep.cur .pl{color:#7fb0ff}.phasestep.cur .pn{color:#fff}.phasestep.cur .po{color:#8a95a0}
.phasestep:disabled{cursor:not-allowed}

/* ------------------------------------------------------------------ modal */
.scrim{position:fixed;inset:0;background:rgba(15,21,25,.44);display:flex;align-items:center;justify-content:center;z-index:80;padding:24px}
.modal{background:var(--panel);border-radius:12px;box-shadow:0 24px 64px -12px rgba(16,24,40,.4);width:min(680px,100%);
  max-height:86vh;display:flex;flex-direction:column;overflow:hidden}
.modal.wide{width:min(1080px,100%)}
.modal-h{padding:14px 18px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px}
.modal-h h3{font-size:14px}
.modal-b{padding:18px;overflow-y:auto}
.modal-f{padding:12px 18px;border-top:1px solid var(--line);display:flex;gap:8px;align-items:center;background:var(--panel-2)}

/* ----------------------------------------------------------------- drawer */
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(560px,94vw);background:var(--panel);z-index:80;
  box-shadow:-20px 0 60px -20px rgba(16,24,40,.35);display:flex;flex-direction:column;border-left:1px solid var(--line)}
.drawer-h{padding:13px 16px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px}
.drawer-b{flex:1;overflow-y:auto;padding:16px}

/* ----------------------------------------------------------------- inputs */
.inp{width:100%;border:1px solid var(--line);border-radius:7px;padding:7px 10px;font-size:12.5px;background:var(--panel)}
.inp:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
textarea.inp{resize:vertical;min-height:74px;line-height:1.5}
.lbl{font-size:10.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);display:block;margin-bottom:5px}
.seg{display:inline-flex;background:var(--line-2);border-radius:7px;padding:2px;gap:2px}
.seg button{padding:4px 10px;border-radius:5px;font-size:11.5px;color:var(--ink-2);font-weight:500}
.seg button.on{background:var(--panel);color:var(--ink);box-shadow:0 1px 2px rgba(16,24,40,.08)}
.sw{width:32px;height:18px;border-radius:99px;background:#cbd3db;position:relative;transition:background .14s;flex:none}
.sw > i{position:absolute;top:2px;left:2px;width:14px;height:14px;border-radius:50%;background:#fff;transition:left .14s;
  box-shadow:0 1px 2px rgba(0,0,0,.2)}
.sw.on{background:var(--accent)} .sw.on > i{left:16px}

/* ---------------------------------------------------------- evidence/brief */
.brief{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:22px 26px}
.brief h2{font-size:16px;letter-spacing:-.02em}
.brief h4{font-size:11px;letter-spacing:.11em;text-transform:uppercase;color:var(--ink-3);margin:22px 0 9px;
  padding-bottom:5px;border-bottom:1px solid var(--line-2)}
.brief h4:first-of-type{margin-top:16px}
.bl{display:grid;grid-template-columns:190px 1fr auto;gap:8px 14px;padding:6px 8px;border-radius:6px;align-items:start;font-size:12.5px}
.bl:hover{background:var(--panel-2)}
.bl .bk{color:var(--ink-3);font-size:11.5px;padding-top:1px}
.bl .bv{font-weight:500}
.bl .bv .why{display:block;font-weight:400;color:var(--ink-2);font-size:11.5px;margin-top:2px}
.bl.gap{background:#fff8f7;box-shadow:inset 2px 0 0 var(--bad)}
.bl.contra{background:#fffaf0;box-shadow:inset 2px 0 0 #d99400}
.readonly{font-size:11px;color:var(--ink-3);display:flex;align-items:center;gap:6px}

/* -------------------------------------------------------------- rank cards */
.rk{display:flex;gap:0;border:1px solid var(--line);border-radius:9px;background:var(--panel);overflow:hidden;margin-bottom:7px}
.rk.off{opacity:.55;background:var(--panel-2)}
.rk.moved{box-shadow:0 0 0 2px var(--violet-soft)}
.rk-n{width:42px;flex:none;background:var(--grid-head);display:flex;flex-direction:column;align-items:center;justify-content:center;
  border-right:1px solid var(--line);gap:2px}
.rk-n b{font-size:14px;font-variant-numeric:tabular-nums}
.rk-n .arrows{display:flex;flex-direction:column;gap:0}
.rk-n .arrows button{font-size:9px;line-height:1;color:var(--ink-3);padding:1px 2px}
.rk-n .arrows button:hover{color:var(--accent)}
.rk-m{flex:1;padding:9px 12px;min-width:0}
.rk-s{width:270px;flex:none;border-left:1px solid var(--line-2);padding:8px 11px;background:var(--panel-2)}
.crit{display:grid;grid-template-columns:78px 1fr 26px;gap:4px 7px;align-items:center;font-size:10.5px}
.crit .cn{color:var(--ink-3)}
.crit .cv{text-align:right;font-variant-numeric:tabular-nums;color:var(--ink-2)}

/* ------------------------------------------------------------------- misc */
.scorebadge{display:flex;flex-direction:column;align-items:center;justify-content:center;width:58px;height:58px;border-radius:10px;
  border:2px solid var(--line);flex:none}
.scorebadge b{font-size:20px;letter-spacing:-.03em;line-height:1}
.scorebadge span{font-size:8.5px;letter-spacing:.1em;color:var(--ink-3);font-weight:700}
.assistant{border:1px solid #cfe0fb;background:linear-gradient(0deg,#f7faff,#f7faff);border-radius:10px;padding:12px 14px}
.assistant .ah{display:flex;align-items:center;gap:7px;font-size:10px;letter-spacing:.12em;text-transform:uppercase;
  font-weight:700;color:var(--accent-2);margin-bottom:7px}
.evrow{display:flex;gap:10px;padding:9px 0;border-bottom:1px solid var(--line-2)}
.evrow:last-child{border-bottom:none}
.evrow .et{width:104px;flex:none;font-size:10.5px;color:var(--ink-3);font-family:var(--mono)}
.tl{position:relative;padding-left:19px}
.tl:before{content:"";position:absolute;left:5px;top:4px;bottom:4px;width:1px;background:var(--line)}
.tl-i{position:relative;padding:0 0 13px}
.tl-i:before{content:"";position:absolute;left:-17px;top:4px;width:9px;height:9px;border-radius:50%;background:var(--panel);
  border:2px solid var(--ink-3)}
.tl-i.ok:before{border-color:var(--good)} .tl-i.no:before{border-color:var(--bad)} .tl-i.ai:before{border-color:var(--accent)}
.hl{background:#fff3bf;padding:0 2px;border-radius:2px}
.strike{text-decoration:line-through;color:var(--ink-3)}
.linebox{border:1px solid var(--line);border-radius:9px;overflow:hidden;margin-bottom:8px;background:var(--panel)}
.linebox.ap{border-color:#bfe0cf;background:#fbfefc}
.linebox.dp{border-color:#f0cfcc;background:#fffcfc}
.linebox.cn{border-color:#f2dfb6;background:#fffdf8}
.lb-h{display:flex;align-items:center;gap:10px;padding:9px 12px}
.lb-b{padding:0 12px 11px;border-top:1px solid var(--line-2);padding-top:10px}
.sw2{display:grid;grid-template-columns:150px 1fr;border-top:1px solid var(--line-2)}
.sw2:first-child{border-top:none}
.sw2 .lane{background:var(--panel-2);padding:11px 12px;border-right:1px solid var(--line-2)}
.sw2 .lanebody{padding:10px;display:flex;gap:8px;flex-wrap:wrap;align-items:flex-start}
.node{border:1px solid var(--line);border-radius:8px;padding:7px 10px;background:var(--panel);font-size:11.5px;min-width:120px}
.node .nt{font-weight:600;font-size:11.5px}
.node .nd{font-size:10.5px;color:var(--ink-3);margin-top:1px}
.node.agent{border-color:#cfe0fb;background:#f7faff}
.node.human{border-color:#f2dfb6;background:#fffdf6}
.node.art{border-style:dashed}
.arrowc{align-self:center;color:var(--ink-3);font-size:14px}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:11px;color:var(--ink-2)}
.legend .li{display:flex;align-items:center;gap:5px}
.toastwrap{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);z-index:99;display:flex;flex-direction:column;gap:7px;align-items:center}
.toast{background:#0f1519;color:#fff;padding:8px 14px;border-radius:8px;font-size:12px;box-shadow:var(--shadow);
  display:flex;gap:8px;align-items:center;animation:tin .18s ease-out}
@keyframes tin{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.spin{width:13px;height:13px;border:2px solid var(--line);border-top-color:var(--accent);border-radius:50%;animation:sp .7s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.g3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px}
.split{display:grid;grid-template-columns:minmax(0,1fr) 372px;gap:14px;align-items:start}
.split > *{min-width:0}
.g2 > *,.g3 > *{min-width:0}
.col{min-width:0}
@media(max-width:1240px){.split{grid-template-columns:1fr}.g3{grid-template-columns:1fr 1fr}}
.sticky{position:sticky;top:14px}
svg .flx{font-family:var(--sans);font-size:11px;fill:var(--ink)}
svg .flx-s{font-family:var(--sans);font-size:9.5px;fill:var(--ink-3)}
svg .flx-t{font-family:var(--sans);font-size:9px;fill:var(--ink-3);letter-spacing:.1em;font-weight:700}
</style>
</head>
