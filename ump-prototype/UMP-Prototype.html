<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>UMP — Unified Media Planning · Prototype Round 1</title>
<!-- Self-contained. React and every source file are inlined below; nothing is fetched. -->
<style>
/* ------------------------------------------------------------------ tokens */
:root{
  --bg:#f4f6f8;
  --panel:#ffffff;
  --panel-2:#fafbfc;
  --ink:#0f1519;
  --ink-2:#57636e;
  --ink-3:#8a95a0;
  --line:#dfe4e9;
  --line-2:#edf0f3;
  --accent:#0b57d0;
  --accent-2:#0842a0;
  --accent-soft:#e8f0fe;
  --good:#0d7a4e;
  --good-soft:#e6f4ec;
  --warn:#9a6600;
  --warn-soft:#fdf2dc;
  --bad:#b3261e;
  --bad-soft:#fce9e7;
  --violet:#5b3fb8;
  --violet-soft:#efeaff;
  --teal:#0a6b6b;
  --teal-soft:#e3f2f2;
  --grid-head:#f2f4f7;
  --shadow:0 1px 2px rgba(16,24,40,.05), 0 8px 24px -12px rgba(16,24,40,.18);
  --mono:"SF Mono",ui-monospace,"JetBrains Mono",Menlo,Consolas,monospace;
  --sans:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --rail:236px;
}
*{box-sizing:border-box}
html,body,#root{height:100%}
body{
  margin:0;background:var(--bg);color:var(--ink);
  font-family:var(--sans);font-size:13px;line-height:1.45;
  -webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums;
}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:none;padding:0}
a{color:var(--accent);text-decoration:none}
h1,h2,h3,h4{margin:0;font-weight:600;letter-spacing:-.01em}
.num{font-variant-numeric:tabular-nums}
.mono{font-family:var(--mono);font-size:11.5px}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:#c9d1d9;border-radius:8px;border:3px solid transparent;background-clip:content-box}
::-webkit-scrollbar-thumb:hover{background:#aab4bf;background-clip:content-box;border:3px solid transparent}
::-webkit-scrollbar-track{background:transparent}

/* ------------------------------------------------------------------ shell */
.app{display:grid;grid-template-columns:var(--rail) 1fr;height:100%;overflow:hidden}
.rail{background:#0f1519;color:#c8d0d8;display:flex;flex-direction:column;overflow:hidden}
.rail-brand{padding:16px 16px 12px;border-bottom:1px solid #1e262d}
.rail-brand .wb{font-size:10px;letter-spacing:.16em;color:#6f7d8a;font-weight:600}
.rail-brand .nm{font-size:15px;color:#fff;font-weight:600;margin-top:3px;letter-spacing:-.01em}
.rail-brand .sub{font-size:10.5px;color:#6f7d8a;margin-top:2px}
.rail-scroll{flex:1;overflow-y:auto;padding:10px 8px 20px}
.rail-scroll::-webkit-scrollbar-thumb{background:#2b3views}
.rail-sec{font-size:9.5px;letter-spacing:.14em;color:#5c6874;font-weight:700;padding:14px 10px 6px}
.rail-item{display:flex;align-items:center;gap:9px;width:100%;text-align:left;padding:7px 10px;border-radius:7px;color:#aeb9c4;font-size:12.5px}
.rail-item:hover{background:#1a232b;color:#e6ebf0}
.rail-item.on{background:var(--accent);color:#fff;font-weight:500}
.rail-item.on .rail-dot{background:#fff}
.rail-item .rail-dot{width:5px;height:5px;border-radius:50%;background:#3b4753;flex:none}
.rail-item .k{margin-left:auto;font-size:10px;color:#5c6874;font-family:var(--mono)}
.rail-item.on .k{color:#cfe0ff}
.rail-foot{border-top:1px solid #1e262d;padding:10px 14px;font-size:10.5px;color:#5c6874}

.main{display:flex;flex-direction:column;overflow:hidden;background:var(--bg)}
.topbar{height:52px;flex:none;background:var(--panel);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:14px;padding:0 18px}
.topbar h1{font-size:14.5px}
.topbar .crumb{color:var(--ink-3);font-size:12px}
.topbar .spacer{flex:1}
.content{flex:1;overflow-y:auto;overflow-x:hidden}
.pad{padding:18px 22px 60px;max-width:1560px}

/* ------------------------------------------------------------------ atoms */
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px}
.card-h{display:flex;align-items:center;gap:10px;padding:11px 14px;border-bottom:1px solid var(--line-2)}
.card-h h3{font-size:12.5px}
.card-h .sp{flex:1}
.card-b{padding:14px}
.card-b.tight{padding:0}
.sec-title{font-size:10px;letter-spacing:.13em;font-weight:700;color:var(--ink-3);text-transform:uppercase}
.muted{color:var(--ink-2)}
.dim{color:var(--ink-3)}
.tiny{font-size:11px}
.mini{font-size:10.5px}
.key{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:4px;vertical-align:baseline}
.row{display:flex;align-items:center;gap:8px}
.col{display:flex;flex-direction:column}
.wrap{flex-wrap:wrap}
.grow{flex:1}
.hr{height:1px;background:var(--line-2);margin:12px 0}

.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--panel);
  padding:6px 11px;border-radius:7px;font-size:12px;font-weight:500;color:var(--ink);white-space:nowrap}
.btn:hover{background:var(--panel-2);border-color:#c9d1d9}
.btn.pri{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.pri:hover{background:var(--accent-2);border-color:var(--accent-2)}
.btn.dark{background:#101820;border-color:#101820;color:#fff}
.btn.dark:hover{background:#26313b}
.btn.dgr{color:var(--bad);border-color:#f0cfcc}
.btn.dgr:hover{background:var(--bad-soft)}
.btn.ok{color:var(--good);border-color:#bfe0cf}
.btn.ok:hover{background:var(--good-soft)}
.btn.sm{padding:3.5px 8px;font-size:11px;border-radius:6px}
.btn.xs{padding:2px 6px;font-size:10.5px;border-radius:5px}
.btn.gho{border-color:transparent;background:transparent;color:var(--ink-2)}
.btn.gho:hover{background:var(--line-2);color:var(--ink)}
.btn:disabled{opacity:.42;cursor:not-allowed}

.chip{display:inline-flex;align-items:center;gap:4px;font-size:10px;font-weight:600;letter-spacing:.02em;
  padding:2px 6px;border-radius:5px;background:var(--line-2);color:var(--ink-2);white-space:nowrap;border:1px solid transparent}
.chip.b{background:var(--accent-soft);color:var(--accent-2);border-color:#cfe0fb}
.chip.g{background:var(--good-soft);color:var(--good);border-color:#c8e6d6}
.chip.a{background:var(--warn-soft);color:var(--warn);border-color:#f2dfb6}
.chip.r{background:var(--bad-soft);color:var(--bad);border-color:#f4cfcb}
.chip.v{background:var(--violet-soft);color:var(--violet);border-color:#ded3fb}
.chip.t{background:var(--teal-soft);color:var(--teal);border-color:#c6e4e4}
.chip.n{background:#0f1519;color:#fff}
.chip.o{background:transparent;border:1px dashed var(--line);color:var(--ink-3)}

.pill{display:inline-flex;align-items:center;gap:5px;font-size:11px;padding:3px 9px;border-radius:99px;
  background:var(--panel);border:1px solid var(--line);color:var(--ink-2)}
.pill.on{background:#0f1519;border-color:#0f1519;color:#fff}
.dot{width:6px;height:6px;border-radius:50%;flex:none}

.kv{display:grid;grid-template-columns:120px 1fr;gap:6px 12px;font-size:12px}
.kv dt{color:var(--ink-3)}
.kv dd{margin:0}

.stat{padding:10px 13px;border:1px solid var(--line);border-radius:9px;background:var(--panel);min-width:0}
.stat .lb{font-size:9.5px;letter-spacing:.11em;text-transform:uppercase;color:var(--ink-3);font-weight:700}
.stat .vl{font-size:19px;font-weight:600;letter-spacing:-.02em;margin-top:3px;white-space:nowrap}
.stat .dl{font-size:10.5px;color:var(--ink-2);margin-top:1px}
.statgrid{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(140px,1fr))}

.bar{height:5px;border-radius:3px;background:var(--line-2);overflow:hidden}
.bar > i{display:block;height:100%;background:var(--accent);border-radius:3px}
.bar.g > i{background:var(--good)} .bar.a > i{background:#d99400} .bar.r > i{background:var(--bad)}

.banner{display:flex;gap:10px;padding:10px 13px;border-radius:9px;font-size:12px;border:1px solid}
.banner.b{background:var(--accent-soft);border-color:#cfe0fb;color:#123a80}
.banner.a{background:var(--warn-soft);border-color:#f2dfb6;color:#6d4a00}
.banner.r{background:var(--bad-soft);border-color:#f4cfcb;color:#8c1d17}
.banner.g{background:var(--good-soft);border-color:#c8e6d6;color:#0a5c3b}
.banner .bi{font-weight:700;flex:none}

/* ------------------------------------------------------- excel-affinity grid */
.xl{border:1px solid var(--line);border-radius:9px;background:var(--panel);overflow:hidden}
.xl-bar{display:flex;align-items:center;gap:8px;padding:6px 8px;border-bottom:1px solid var(--line);background:var(--panel-2)}
.xl-name{font-family:var(--mono);font-size:11px;background:var(--panel);border:1px solid var(--line);
  border-radius:5px;padding:2px 8px;min-width:66px;text-align:center;color:var(--ink-2)}
.xl-fx{flex:1;font-family:var(--mono);font-size:11.5px;background:var(--panel);border:1px solid var(--line);
  border-radius:5px;padding:2.5px 9px;color:var(--ink-2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.xl-scroll{overflow:auto;max-height:var(--xlh,560px)}
table.xg{border-collapse:separate;border-spacing:0;width:100%;font-size:12px}
table.xg th,table.xg td{border-right:1px solid var(--line-2);border-bottom:1px solid var(--line-2);padding:0 8px;height:29px;
  white-space:nowrap;background:var(--panel)}
table.xg thead th{position:sticky;top:0;z-index:3;background:var(--grid-head);font-weight:600;color:var(--ink-2);
  font-size:11px;text-align:left;border-bottom:1px solid var(--line)}
table.xg thead tr.abc th{height:19px;font-family:var(--mono);font-size:9.5px;color:var(--ink-3);text-align:center;font-weight:500;
  background:#e9edf1;top:0}
table.xg thead tr.hdr th{top:19px}
table.xg tbody td.rn, table.xg thead th.rn{position:sticky;left:0;z-index:2;background:var(--grid-head);text-align:center;
  font-family:var(--mono);font-size:10px;color:var(--ink-3);width:34px;min-width:34px;padding:0 4px;border-right:1px solid var(--line)}
table.xg thead th.rn{z-index:4}
table.xg tbody tr:hover td{background:#f7f9fb}
table.xg tbody tr:hover td.rn{background:#e9edf1}
table.xg td.sel{outline:2px solid var(--accent);outline-offset:-2px;background:#f0f6ff !important}
table.xg td.r,table.xg th.r{text-align:right}
table.xg td.c,table.xg th.c{text-align:center}
table.xg tr.tot td{background:#f2f4f7;font-weight:600;position:sticky;bottom:0;border-top:1px solid var(--line)}
table.xg tr.dis td{color:var(--ink-3)}
table.xg td.edit{background:#fffdf3}
.xl-foot{display:flex;align-items:center;gap:12px;padding:5px 10px;border-top:1px solid var(--line);
  background:var(--panel-2);font-size:11px;color:var(--ink-2)}

/* simple table (non-excel) */
table.tb{border-collapse:collapse;width:100%;font-size:12px}
table.tb th{text-align:left;font-weight:600;color:var(--ink-3);font-size:10px;letter-spacing:.08em;text-transform:uppercase;
  padding:7px 10px;border-bottom:1px solid var(--line)}
table.tb td{padding:8px 10px;border-bottom:1px solid var(--line-2);vertical-align:top}
table.tb tbody tr:hover{background:var(--panel-2)}
table.tb td.r,table.tb th.r{text-align:right}

/* ------------------------------------------------------------------ tabs */
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);padding:0 2px}
.tabs button{padding:8px 13px;font-size:12.5px;color:var(--ink-2);border-bottom:2px solid transparent;margin-bottom:-1px;font-weight:500}
.tabs button:hover{color:var(--ink)}
.tabs button.on{color:var(--accent);border-bottom-color:var(--accent);font-weight:600}
.tabs .ct{font-size:10px;background:var(--line-2);border-radius:99px;padding:0 5px;margin-left:5px;color:var(--ink-2)}

/* --------------------------------------------------------- phase progress */
.phaserail{display:flex;align-items:stretch;gap:0;background:var(--panel);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.phasestep{flex:1;padding:9px 12px 9px 22px;position:relative;text-align:left;border-right:1px solid var(--line-2);min-width:0}
.phasestep:first-child{padding-left:14px}
.phasestep:after{content:"";position:absolute;right:-11px;top:50%;transform:translateY(-50%) rotate(45deg);width:20px;height:20px;
  background:var(--panel);border-top:1px solid var(--line-2);border-right:1px solid var(--line-2);z-index:2}
.phasestep:last-child:after{display:none}
.phasestep .pl{font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3);font-weight:700}
.phasestep .pn{font-size:12.5px;font-weight:600;margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.phasestep .po{font-size:10.5px;color:var(--ink-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.phasestep.done{background:#f3f8f5}.phasestep.done:after{background:#f3f8f5}
.phasestep.done .pl{color:var(--good)}
.phasestep.cur{background:#0f1519}.phasestep.cur:after{background:#0f1519;border-color:#0f1519}
.phasestep.cur .pl{color:#7fb0ff}.phasestep.cur .pn{color:#fff}.phasestep.cur .po{color:#8a95a0}
.phasestep:disabled{cursor:not-allowed}

/* ------------------------------------------------------------------ modal */
.scrim{position:fixed;inset:0;background:rgba(15,21,25,.44);display:flex;align-items:center;justify-content:center;z-index:80;padding:24px}
.modal{background:var(--panel);border-radius:12px;box-shadow:0 24px 64px -12px rgba(16,24,40,.4);width:min(680px,100%);
  max-height:86vh;display:flex;flex-direction:column;overflow:hidden}
.modal.wide{width:min(1080px,100%)}
.modal-h{padding:14px 18px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px}
.modal-h h3{font-size:14px}
.modal-b{padding:18px;overflow-y:auto}
.modal-f{padding:12px 18px;border-top:1px solid var(--line);display:flex;gap:8px;align-items:center;background:var(--panel-2)}

/* ----------------------------------------------------------------- drawer */
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(560px,94vw);background:var(--panel);z-index:80;
  box-shadow:-20px 0 60px -20px rgba(16,24,40,.35);display:flex;flex-direction:column;border-left:1px solid var(--line)}
.drawer-h{padding:13px 16px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px}
.drawer-b{flex:1;overflow-y:auto;padding:16px}

/* ----------------------------------------------------------------- inputs */
.inp{width:100%;border:1px solid var(--line);border-radius:7px;padding:7px 10px;font-size:12.5px;background:var(--panel)}
.inp:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
textarea.inp{resize:vertical;min-height:74px;line-height:1.5}
.lbl{font-size:10.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);display:block;margin-bottom:5px}
.seg{display:inline-flex;background:var(--line-2);border-radius:7px;padding:2px;gap:2px}
.seg button{padding:4px 10px;border-radius:5px;font-size:11.5px;color:var(--ink-2);font-weight:500}
.seg button.on{background:var(--panel);color:var(--ink);box-shadow:0 1px 2px rgba(16,24,40,.08)}
.sw{width:32px;height:18px;border-radius:99px;background:#cbd3db;position:relative;transition:background .14s;flex:none}
.sw > i{position:absolute;top:2px;left:2px;width:14px;height:14px;border-radius:50%;background:#fff;transition:left .14s;
  box-shadow:0 1px 2px rgba(0,0,0,.2)}
.sw.on{background:var(--accent)} .sw.on > i{left:16px}

/* ---------------------------------------------------------- evidence/brief */
.brief{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:22px 26px}
.brief h2{font-size:16px;letter-spacing:-.02em}
.brief h4{font-size:11px;letter-spacing:.11em;text-transform:uppercase;color:var(--ink-3);margin:22px 0 9px;
  padding-bottom:5px;border-bottom:1px solid var(--line-2)}
.brief h4:first-of-type{margin-top:16px}
.bl{display:grid;grid-template-columns:190px 1fr auto;gap:8px 14px;padding:6px 8px;border-radius:6px;align-items:start;font-size:12.5px}
.bl:hover{background:var(--panel-2)}
.bl .bk{color:var(--ink-3);font-size:11.5px;padding-top:1px}
.bl .bv{font-weight:500}
.bl .bv .why{display:block;font-weight:400;color:var(--ink-2);font-size:11.5px;margin-top:2px}
.bl.gap{background:#fff8f7;box-shadow:inset 2px 0 0 var(--bad)}
.bl.contra{background:#fffaf0;box-shadow:inset 2px 0 0 #d99400}
.readonly{font-size:11px;color:var(--ink-3);display:flex;align-items:center;gap:6px}

/* -------------------------------------------------------------- rank cards */
.rk{display:flex;gap:0;border:1px solid var(--line);border-radius:9px;background:var(--panel);overflow:hidden;margin-bottom:7px}
.rk.off{opacity:.55;background:var(--panel-2)}
.rk.moved{box-shadow:0 0 0 2px var(--violet-soft)}
.rk-n{width:42px;flex:none;background:var(--grid-head);display:flex;flex-direction:column;align-items:center;justify-content:center;
  border-right:1px solid var(--line);gap:2px}
.rk-n b{font-size:14px;font-variant-numeric:tabular-nums}
.rk-n .arrows{display:flex;flex-direction:column;gap:0}
.rk-n .arrows button{font-size:9px;line-height:1;color:var(--ink-3);padding:1px 2px}
.rk-n .arrows button:hover{color:var(--accent)}
.rk-m{flex:1;padding:9px 12px;min-width:0}
.rk-s{width:270px;flex:none;border-left:1px solid var(--line-2);padding:8px 11px;background:var(--panel-2)}
.crit{display:grid;grid-template-columns:78px 1fr 26px;gap:4px 7px;align-items:center;font-size:10.5px}
.crit .cn{color:var(--ink-3)}
.crit .cv{text-align:right;font-variant-numeric:tabular-nums;color:var(--ink-2)}

/* ------------------------------------------------------------------- misc */
.scorebadge{display:flex;flex-direction:column;align-items:center;justify-content:center;width:58px;height:58px;border-radius:10px;
  border:2px solid var(--line);flex:none}
.scorebadge b{font-size:20px;letter-spacing:-.03em;line-height:1}
.scorebadge span{font-size:8.5px;letter-spacing:.1em;color:var(--ink-3);font-weight:700}
.assistant{border:1px solid #cfe0fb;background:linear-gradient(0deg,#f7faff,#f7faff);border-radius:10px;padding:12px 14px}
.assistant .ah{display:flex;align-items:center;gap:7px;font-size:10px;letter-spacing:.12em;text-transform:uppercase;
  font-weight:700;color:var(--accent-2);margin-bottom:7px}
.evrow{display:flex;gap:10px;padding:9px 0;border-bottom:1px solid var(--line-2)}
.evrow:last-child{border-bottom:none}
.evrow .et{width:104px;flex:none;font-size:10.5px;color:var(--ink-3);font-family:var(--mono)}
.tl{position:relative;padding-left:19px}
.tl:before{content:"";position:absolute;left:5px;top:4px;bottom:4px;width:1px;background:var(--line)}
.tl-i{position:relative;padding:0 0 13px}
.tl-i:before{content:"";position:absolute;left:-17px;top:4px;width:9px;height:9px;border-radius:50%;background:var(--panel);
  border:2px solid var(--ink-3)}
.tl-i.ok:before{border-color:var(--good)} .tl-i.no:before{border-color:var(--bad)} .tl-i.ai:before{border-color:var(--accent)}
.hl{background:#fff3bf;padding:0 2px;border-radius:2px}
.strike{text-decoration:line-through;color:var(--ink-3)}
.linebox{border:1px solid var(--line);border-radius:9px;overflow:hidden;margin-bottom:8px;background:var(--panel)}
.linebox.ap{border-color:#bfe0cf;background:#fbfefc}
.linebox.dp{border-color:#f0cfcc;background:#fffcfc}
.linebox.cn{border-color:#f2dfb6;background:#fffdf8}
.lb-h{display:flex;align-items:center;gap:10px;padding:9px 12px}
.lb-b{padding:0 12px 11px;border-top:1px solid var(--line-2);padding-top:10px}
.sw2{display:grid;grid-template-columns:150px 1fr;border-top:1px solid var(--line-2)}
.sw2:first-child{border-top:none}
.sw2 .lane{background:var(--panel-2);padding:11px 12px;border-right:1px solid var(--line-2)}
.sw2 .lanebody{padding:10px;display:flex;gap:8px;flex-wrap:wrap;align-items:flex-start}
.node{border:1px solid var(--line);border-radius:8px;padding:7px 10px;background:var(--panel);font-size:11.5px;min-width:120px}
.node .nt{font-weight:600;font-size:11.5px}
.node .nd{font-size:10.5px;color:var(--ink-3);margin-top:1px}
.node.agent{border-color:#cfe0fb;background:#f7faff}
.node.human{border-color:#f2dfb6;background:#fffdf6}
.node.art{border-style:dashed}
.arrowc{align-self:center;color:var(--ink-3);font-size:14px}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:11px;color:var(--ink-2)}
.legend .li{display:flex;align-items:center;gap:5px}
.toastwrap{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);z-index:99;display:flex;flex-direction:column;gap:7px;align-items:center}
.toast{background:#0f1519;color:#fff;padding:8px 14px;border-radius:8px;font-size:12px;box-shadow:var(--shadow);
  display:flex;gap:8px;align-items:center;animation:tin .18s ease-out}
@keyframes tin{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.spin{width:13px;height:13px;border:2px solid var(--line);border-top-color:var(--accent);border-radius:50%;animation:sp .7s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.g3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px}
.split{display:grid;grid-template-columns:minmax(0,1fr) 372px;gap:14px;align-items:start}
.split > *{min-width:0}
.g2 > *,.g3 > *{min-width:0}
.col{min-width:0}
@media(max-width:1240px){.split{grid-template-columns:1fr}.g3{grid-template-columns:1fr 1fr}}
.sticky{position:sticky;top:14px}
svg .flx{font-family:var(--sans);font-size:11px;fill:var(--ink)}
svg .flx-s{font-family:var(--sans);font-size:9.5px;fill:var(--ink-3)}
svg .flx-t{font-family:var(--sans);font-size:9px;fill:var(--ink-3);letter-spacing:.1em;font-weight:700}
</style>

/* ------------------------------------------------------------------ formatting */
const money = (n, sym = "$") => n == null ? "—" : sym + Math.round(n).toLocaleString("en-US");

const clamp = (v, a, b) => Math.max(a, Math.min(b, v));

  linearTarget: 0.32,

  viewFloor: 0.80,

  pmpCap: 0.12,
  // PI-Q3-03, hard
  hbomaxFloor: 34,
  // PI-Q3-07 + learned signal S2
  sportHoldPremium: 0.15,
  // PI-Q3-09

  // G02
  reachGoal1: 0.33,
  // 1+ reach, share of in-market A25-54 universe
  reachGoal3: 0.20 // 3+ reach, share of in-market A25-54 universe
};
const INMARKET_UNIVERSE = FRAME.regions.reduce((s, r) => s + UNIVERSE[r]["A25-54"], 0); // 000s

/* ---------------------------------------------------------- ranking criteria */
const CRITERIA = [{
  k: "audience",
  label: "Audience fit",
  w: 0.25,
  help: "Delivered composition inside A25-54, weighted to the W25-54 skew the brief asks for."
}, {
  k: "kpi",
  label: "KPI relevance",
  w: 0.25,

}, {

}, {
  k: "price",
  label: "Price workability",
  w: 0.20,

}, {
  k: "seller",
  label: "Seller position",
  w: 0.15,
  help: "WBD's own posture: push, neutral, hold, or yield-dilutive."
}];
const POSTURE_SCORE = {
  push: 92,
  neutral: 58,
  hold: 30,
  dump: 18
};
const POSTURE_LABEL = {
  push: "Push",
  neutral: "Neutral",

/* ------------------------------------------------ targeting customisations */
const CUSTOM_OPTIONS = [{
  id: "demoGuar",
  label: "Demo-guaranteed A25-54",
  medium: "both",
  desc: "Guarantee delivery inside the demo rather than buying to composition.",
  cpmX: 1.18,

}, {

  cpmX: 1.12,
  availX: 0.46,

}, {
  id: "daypart",
  label: "Daypart lock — Daytime + Prime",
  medium: "Linear",
  desc: "Restrict units to daytime and prime; drop overnight and fringe.",
  cpmX: 1.15,
  availX: 0.54,
  compTo: null,
  kpi: +5
}, {
  id: "ugc",
  label: "Exclude UGC-adjacent placements",
  medium: "Digital",
  desc: "Drop comment-adjacent and social-embedded placements. Lifts measured viewability.",
  cpmX: 1.05,

  compTo: null,

}, {
  id: "freq",
  label: "Hard frequency cap 6/wk",

  desc: "Enforce the client's stated cap at the ad server rather than in planning.",

}, {

  label: "Front-load weeks 1–8",
  medium: "both",
  desc: "Weight 60% of impressions into the first eight weeks.",
  cpmX: 1.07,
  availX: 0.92,
  compTo: null,
  kpi: +4
}];
function customFor(p) {
  return CUSTOM_OPTIONS.filter(o => o.medium === "both" || o.medium === p.medium);
}

/* Apply a set of customisation ids to a product; returns the live position. */
function applyCustom(p, ids) {
  let cpm = p.openCpm,
    availK = p.availK,
    comp = p.demoComp,
    kpi = p.kpiFit,
    view = p.viewability;
  (ids || []).forEach(id => {
    const o = CUSTOM_OPTIONS.find(x => x.id === id);
    if (!o) return;
    cpm *= o.cpmX;
    availK *= o.availX;
    kpi += o.kpi;
    if (o.compTo) comp = Math.max(comp, o.compTo);
    if (o.viewLift && view != null) view = Math.min(0.99, view + o.viewLift);
  });
  return {
    cpm: +cpm.toFixed(2),
    availK: Math.round(availK),
    comp: +comp.toFixed(3),
    kpi: clamp(kpi, 0, 100),
    view: view == null ? null : +view.toFixed(3),
    availEstimate: (ids || []).length > 0

}

/* A hard-constraint breach the planner must see at the moment of customisation,
   not at optimisation or at approval (Discovery §5). */
function breachesFor(p, live) {
  const out = [];
  if (p.medium === "Digital" && live.view != null && live.view < FRAME.viewFloor) out.push({
    id: "H2",
    text: `Viewability ${pct(live.view, 0)} is below the ${pct(FRAME.viewFloor, 0)} floor the RFP states`,
    fix: "ugc",

  });

    id: "S1",
    text: `${cpmf(live.cpm)} is below the ${cpmf(FRAME.hbomaxFloor)} P&I floor`,
    fix: null
  });
  if (p.yieldPosture === "hold" && live.cpm < p.floorCpm * (1 + FRAME.sportHoldPremium)) out.push({
    id: "H6",
    text: `Held inventory: release needs ${cpmf(p.floorCpm * (1 + FRAME.sportHoldPremium))} (floor +15%), offered at ${cpmf(live.cpm)}`,
    fix: null
  });
  return out;
}

/* --------------------------------------------------------------- the ranking */
/* Five criteria produce the order. Every position carries the reasoning that
   put it there, and that reasoning travels forward (Discovery §3, T5). */
const TYPICAL_LINE_SHARE = 0.30; // a line is typically ~30% of a regional envelope

function scoreProduct(p, live, signals) {
  const regionEnvelope = DEAL.netBudget * (FRAME.regionSplit[p.region] || 0);
  const needK = regionEnvelope * TYPICAL_LINE_SHARE / Math.max(live.cpm, 0.01);
  const coverage = clamp(live.availK / Math.max(needK, 1), 0, 2);
  const bench = (BENCH[p.region + "|" + p.medium] || {
    cpm: live.cpm
  }).cpm;
  const audience = clamp((live.comp - 0.40) / 0.55 * 100, 0, 100);
  const kpi = clamp(live.kpi, 0, 100);
  const avails = clamp(coverage * 62, 0, 100);
  let price = clamp(62 + (bench - live.cpm) / bench * 55, 0, 100);
  if (p.medium === "Digital" && live.cpm > FRAME.cpmCeiling) price = clamp(price - 9, 0, 100);
  let seller = POSTURE_SCORE[p.yieldPosture] ?? 50;

  /* learned signals reweight, visibly */
  const applied = [];
  (signals || []).forEach(s => {
    if (!s.on) return;
    if (s.id === "S1" && p.id === "P08") {
      seller = Math.min(seller, 14);
      applied.push(s.id);
    }
    if (s.id === "S3" && /sport/i.test(p.format + p.placement + p.brandSafe)) {
      seller = Math.min(seller, 22);
      applied.push(s.id);
    }
  });
  const parts = {
    audience,
    kpi,
    avails,
    price,
    seller
  };
  const total = CRITERIA.reduce((s, c) => s + parts[c.k] * c.w, 0);
  const why = {
    audience: `${pct(live.comp, 0)} of delivery lands in ${FRAME.demo}${live.comp >= 0.70 ? " — top quartile of the eligible set" : live.comp < 0.55 ? " — below the 0.55 the brief's skew needs" : ""}.`,
    kpi: `${p.medium === "Digital" && p.vcr ? `${pct(p.vcr, 1)} completion, ${pct(p.viewability, 0)} viewable, attention index ${p.attention}` : `attention index ${p.attention}${p.grp ? `, ${p.grp} GRPs available` : ""}`}. Incremental-reach ceiling ${imps(p.reachK)}.`,
    avails: `${imps(live.availK)} sellable in flight against ${imps(needK)} a typical ${p.region} line would need at ${cpmf(live.cpm)} — ${coverage >= 1 ? "covers a full line" : `covers ${pct(coverage, 0)} of one`}.${live.availEstimate ? " Estimate only: targeting is customised, firm avails return with the solve." : ""}`,
    price: `${cpmf(live.cpm)} against a ${cpmf(bench)} market benchmark for ${p.region} ${p.medium.toLowerCase()} (${(BENCH[p.region + "|" + p.medium] || {}).note || ""}). Floor ${cpmf(p.floorCpm)}, card ${cpmf(p.cardCpm)}. Blended ceiling ${cpmf(FRAME.cpmCeiling)}.`,
    seller: `${POSTURE_LABEL[p.yieldPosture]}. ${p.note}`
  };
  return {
    parts,
    total: +total.toFixed(1),
    why,
    live,
    needK,
    coverage,
    appliedSignals: applied
  };
}
function buildRanking(customMap, signals) {
  /* Discovery ranks on the Indicative pre-screen. A product with no Indicative
     inventory across the flight is not eligible in fact, only in principle, and
     never reaches the list at all (Forecast §1). */
  const rows = PRODUCTS.filter(p => indicativeFor(p).eligible).map(p => {
    const ids = customMap[p.id] || [];
    const live = applyCustom(p, ids);
    const s = scoreProduct(p, live, signals);
    return {
      pid: p.id,
      p,
      custom: ids,
      breaches: breachesFor(p, live),
      /* Direction of travel, not a figure — see 28-forecast.js. */
      availSignal: customisationSignal(p, ids, live),
      ...s
    };
  });
  rows.sort((a, b) => b.total - a.total);
  rows.forEach((r, i) => {
    r.sysRank = i + 1;
  });
  return rows;
}

/* ------------------------------------------------------------ constraint set */
function constraintSet() {
  return [{
    id: "H1",
    kind: "hard",
    label: `Blended digital CPM ≤ ${cpmf(FRAME.cpmCeiling)}`,
    from: "E14 · clarified by client"
  }, {
    id: "H2",
    kind: "hard",
    label: `Digital video viewability ≥ ${pct(FRAME.viewFloor, 0)}`,

  }, {

  }, {

/* ------------------------------------------------------------- the optimiser */
/* Rank-preference waterfall inside each regional envelope, capped by avails,
   floors, and the hard constraint set. Preference decays with rank; it does not
   pre-commit spend (Discovery §3). */
function optimise(ranked, opts) {
  const o = Object.assign({
    lambda: 0.42,
    overrides: {},
    locked: {},
    buyCap: 0.80
  }, opts || {});
  const lines = [];
  const dropped = [];
  const unallocated = [];

  /* A product carrying an unresolved hard breach cannot enter the solve.
     The solver reports it rather than quietly shortening the list. */
  const selected = ranked.filter(r => {
    if (r.on === false) return false;
    const hard = (r.breaches || []).filter(b => b.id === "H2" || b.id === "H6");
    if (hard.length) {
      dropped.push({
        pid: r.pid,
        name: r.p.name,
        reason: hard.map(h => h.text).join("; "),
        fix: hard.find(h => h.fix)?.fixLabel || null
      });
      return false;
    }
    return true;
  });

  /* Sending the accepted list to the optimiser is what triggers the Constrained
     run. Until this moment every avails figure on the deal is the Indicative
     pre-screen; from here each line has its own waterfall derivation, its own
     UMP placement ID, and a run date that travels with it as provenance.
     The solve allocates against Constrained avails, not against the pre-screen. */
  const runAt = NOW();
  const fc = {};
  selected.forEach(r => {
    fc[r.pid] = constrainedFor(r.p, r.custom, runAt);
  });
  const conK = r => fc[r.pid] ? fc[r.pid].availK : r.live.availK;
  FRAME.regions.forEach(region => {
    const envelope = DEAL.netBudget * FRAME.regionSplit[region];
    const all = selected.filter(r => r.p.region === region);
    if (!all.length) {
      unallocated.push({
        region,
        amount: envelope,
        why: `No ${region} product is in the accepted list. The envelope has nowhere to go — add a ${region} product in Discovery or re-cut the regional split.`
      });
      return;
    }

    /* Fixed values enter the solve as constraints, not as suggestions: a justified
       planner override, or a line P&I has already approved (T7). */
    const fixed = all.filter(r => o.locked[r.pid] != null || o.overrides[r.pid] != null);
    const pool = all.filter(r => o.locked[r.pid] == null && o.overrides[r.pid] == null);
    let fixedSpend = 0;
    fixed.forEach(r => {
      const spend = o.locked[r.pid] != null ? o.locked[r.pid] : o.overrides[r.pid];
      fixedSpend += spend;
      if (spend < 1) return;
      const impsK = spend / r.live.cpm;
      lines.push({
        pid: r.pid,
        p: r.p,
        region,
        rank: all.indexOf(r) + 1,
        cpm: r.live.cpm,
        spend,
        impsK,
        custom: r.custom,
        comp: r.live.comp,
        availK: conK(r),
        view: r.live.view,
        availUse: impsK / conK(r),
        ...forecastOn(fc[r.pid], r.p),
        overridden: o.overrides[r.pid] != null,
        locked: o.locked[r.pid] != null,
        systemSpend: (o.systemSpend || {})[r.pid]
      });
    });
    if (!pool.length) {
      const left = envelope - fixedSpend;
      if (Math.abs(left) > 5000) unallocated.push({
        region,
        amount: left,
        why: left > 0 ? `Every ${region} line is fixed by an override or a P&I approval, and they do not add up to the envelope.` : `Fixed ${region} lines exceed the envelope by ${money(-left)}.`
      });
      return;
    }

    /* preference weight by position in the accepted order */
    const weights = pool.map((r, i) => Math.exp(-o.lambda * i) * (0.55 + r.total / 220));

    /* first pass: proportional, then clip to avails, redistribute the remainder */
    let remaining = Math.max(0, envelope - fixedSpend);
    const alloc = pool.map(() => 0);
    for (let pass = 0; pass < 4 && remaining > 1000; pass++) {
      const active = pool.map((r, i) => alloc[i] < conK(r) * r.live.cpm * o.buyCap);
      const aw = weights.map((w, i) => active[i] ? w : 0);
      const asum = aw.reduce((a, b) => a + b, 0);
      if (asum <= 0) break;
      let spent = 0;
      pool.forEach((r, i) => {
        if (!active[i]) return;
        const cap = conK(r) * r.live.cpm * o.buyCap - alloc[i]; // never buy past 80% of constrained avails
        const want = remaining * (aw[i] / asum);
        const take = Math.max(0, Math.min(cap, want));
        alloc[i] += take;
        spent += take;
      });
      remaining -= spent;
      if (spent < 1000) break;
    }
    if (remaining > 5000) unallocated.push({
      region,
      amount: remaining,
      why: `Every accepted ${region} product hit its avails ceiling at ${pct(o.buyCap, 0)} of constrained inventory. More budget needs more products, not more weight.`
    });
    pool.forEach((r, i) => {
      const spend = alloc[i];
      if (spend < 1) return;
      const impsK = spend / r.live.cpm;
      lines.push({
        pid: r.pid,
        p: r.p,
        region,
        rank: all.indexOf(r) + 1,
        cpm: r.live.cpm,
        spend,
        impsK,
        custom: r.custom,
        comp: r.live.comp,
        availK: conK(r),
        view: r.live.view,
        availUse: impsK / conK(r),
        ...forecastOn(fc[r.pid], r.p),
        overridden: false,
        locked: false,
        systemSpend: (o.systemSpend || {})[r.pid] != null ? o.systemSpend[r.pid] : spend
      });
    });
  });
  lines.sort((a, b) => b.spend - a.spend);
  return {
    lines,
    dropped,
    unallocated,
    ...rollup(lines)
  };
}

/* ----------------------------------------------------------- the reach model */
/* Per-product saturation curve, then sequential incremental reach with a
   duplication penalty for same-brand and same-medium overlap. A model, and
   labelled as one wherever it is shown. */
function rollup(lines) {
  const spend = lines.reduce((s, l) => s + l.spend, 0);
  const impsK = lines.reduce((s, l) => s + l.impsK, 0);
  const targetImpsK = lines.reduce((s, l) => s + l.impsK * l.comp, 0);
  const digital = lines.filter(l => l.p.medium === "Digital");
  const linear = lines.filter(l => l.p.medium === "Linear");
  const digSpend = digital.reduce((s, l) => s + l.spend, 0);
  const linSpend = linear.reduce((s, l) => s + l.spend, 0);
  const digImpsK = digital.reduce((s, l) => s + l.impsK, 0);
  const curve = lines.map(l => {
    const ceil = l.p.reachK;
    const r = ceil * (1 - Math.exp(-l.impsK / (ceil * 2.2)));
    return {
      ...l,
      reachK: r
    };
  }).sort((a, b) => b.reachK - a.reachK);
  const seenBrand = new Set(),
    seenMedReg = new Set();
  let reachedK = 0;
  const universe = INMARKET_UNIVERSE;
  curve.forEach(l => {
    let dup = 0;
    if (seenBrand.has(l.p.brand)) dup = 0.34;else if (seenMedReg.has(l.p.medium + l.region)) dup = 0.14;
    seenBrand.add(l.p.brand);
    seenMedReg.add(l.p.medium + l.region);
    const inc = l.reachK * (1 - reachedK / universe) * (1 - dup);
    l.incReachK = inc;
    reachedK += inc;
  });
  const reach1 = reachedK / universe;
  const avgFreq = reachedK > 0 ? targetImpsK / reachedK : 0;
  const share3 = avgFreq <= 1 ? 0 : 1 - Math.exp(-0.32 * (avgFreq - 1));
  const reach3 = reach1 * share3;
  const blendedCpm = impsK > 0 ? spend / impsK : 0;
  const digCpm = digImpsK > 0 ? digSpend / digImpsK : 0;
  const cpReachPt = reach1 > 0 ? spend / (reach1 * 100) : 0;

  /* concentration (HHI over spend) */
  const hhi = spend > 0 ? lines.reduce((s, l) => s + Math.pow(l.spend / spend, 2), 0) : 1;
  const byRegion = {};
  FRAME.regions.forEach(r => {
    byRegion[r] = lines.filter(l => l.region === r).reduce((s, l) => s + l.spend, 0);
  });
  return {
    byRegion,
    spend,
    impsK,
    targetImpsK,
    digSpend,
    linSpend,
    digImpsK,
    linearPct: spend > 0 ? linSpend / spend : 0,
    pmpPct: spend > 0 ? lines.filter(l => l.pid === "P08").reduce((s, l) => s + l.spend, 0) / spend : 0,
    reachedK,
    reach1,
    reach3,
    avgFreq,
    blendedCpm,
    digCpm,
    cpReachPt,
    hhi,
    curve
  };
}

/* --------------------------------------------------------- constraint report */
function checkConstraints(res, ranked) {
  const out = [];
  const push = (id, label, ok, detail, kind) => out.push({
    id,
    label,
    ok,
    detail,
    kind
  });
  push("H1", `Blended digital CPM ≤ ${cpmf(FRAME.cpmCeiling)}`, res.digCpm <= FRAME.cpmCeiling, `Solved at ${cpmf(res.digCpm)}.`, "hard");
  const badView = res.lines.filter(l => l.p.medium === "Digital" && l.view != null && l.view < FRAME.viewFloor);
  push("H2", `Digital video viewability ≥ ${pct(FRAME.viewFloor, 0)}`, badView.length === 0, badView.length ? `${badView.length} line(s) below floor: ${badView.map(l => l.p.name.split(" — ")[0]).join(", ")}.` : (res.dropped || []).length ? `All lines in the solve clear the floor. ${res.dropped.length} product held out of the solve — see below.` : "All digital video lines clear the floor.", "hard");
  push("H3", `Curated PMP ≤ ${pct(FRAME.pmpCap, 0)}`, res.pmpPct <= FRAME.pmpCap + 1e-6, `PMP at ${pct(res.pmpPct, 1)} of plan.`, "hard");
  push("H4", `Linear ≤ ${pct(FRAME.linearCeiling, 0)}`, res.linearPct <= FRAME.linearCeiling + 1e-6, `Linear at ${pct(res.linearPct, 1)} of plan (target ${pct(FRAME.linearTarget, 0)}).`, "hard");
  const hbo = res.lines.find(l => l.pid === "P01");
  push("S1", `HBO Max premium CTV ≥ ${cpmf(FRAME.hbomaxFloor)}`, !hbo || hbo.cpm >= FRAME.hbomaxFloor, hbo ? `Carried at ${cpmf(hbo.cpm)}.` : "Not in the plan.", "soft");
  const pushSpend = res.lines.filter(l => ["P03", "P19"].includes(l.pid)).reduce((s, l) => s + l.spend, 0);
  push("S2", "P&I push list carried meaningfully", pushSpend / Math.max(res.spend, 1) >= 0.10, `discovery+ US and HBO Max LATAM at ${pct(pushSpend / Math.max(res.spend, 1), 1)} of plan.`, "soft");
  const over = res.lines.filter(l => l.availUse > 0.85);
  push("S6", "No line above 85% of its sellable avails", over.length === 0, over.length ? `${over.length} line(s) at risk: ${over.map(l => `${l.p.name.split(" — ")[0]} ${pct(l.availUse, 0)}`).join(", ")}.` : "Every line sits inside a deliverable share of avails.", "soft");
  return out;
}

/* ------------------------------------------------------- the good-plan rubric */
/* [PROPOSED] — OQ-2 is open. The shape is settled, the content is not.
   Scored in isolation, never ranked against other versions (Analyze §9). */
/* The definition of a good plan has two layers (OQ-2).

   The standing layer is WBD's, agreed once rather than per deal: these are the
   dimensions a plan is judged on at all. The per-RFP layer is the weights and
   thresholds below, instantiated for this brief.

   The dimensions are scored separately and deliberately not collapsed into one
   number, so the trade-off between them stays visible. A version that buys
   objective delivery by abandoning yield alignment should look different from
   one that is merely average everywhere, and a single total hides exactly that.

   [OPEN] The dimensions here are candidates. Whether they are the right ones,
   how each is measured, and who sets the per-RFP weights are all with the
   business. */
const RUBRIC = [{
  k: "coverage",
  label: "Requirement coverage",
  w: 0.20,
  bar: 80,
  help: "Stated requirements this version satisfies."
}, {
  k: "objective",
  label: "KPI service",
  w: 0.22,
  bar: 85,
  help: "1+ and 3+ reach against the goal the brief set."
}, {
  k: "price",
  label: "Efficiency",
  w: 0.15,
  bar: 70,
  help: "Blended CPM against the ceiling and the advertiser's paid benchmark."
}, {
  k: "yield",
  label: "Seller alignment",
  w: 0.16,
  bar: 75,
  help: "Agreement with P&I's stated position, floors and caps."
}, {
  k: "argument",
  label: "Argument quality",
  w: 0.15,
  bar: 70,
  help: "Every deviation from the system proposal carries a reason that would survive a question."
}, {
  k: "realism",
  label: "Deliverability",
  w: 0.12,
  bar: 75,
  help: "Deliverability against constrained avails and concentration risk."
}];
function scorePlan(res, ranked, overrides, justifications, constraints) {
  const coverageItems = [{
    t: "Flight and markets as stated",
    ok: true
  }, {
    t: `Demo ${FRAME.demo} with W25-54 skew`,
    ok: res.targetImpsK / Math.max(res.impsK, 1) >= 0.62,
    d: `${pct(res.targetImpsK / Math.max(res.impsK, 1), 0)} of delivery in demo.`
  }, {
    t: "No hard-news adjacency",
    ok: true,
    d: "CNN products excluded at eligibility."
  }, {
    t: "Do-not-air list applied",
    ok: true,
    d: "41 titles; Adult Swim excluded at network level."
  }, {
    t: `Viewability ≥ ${pct(FRAME.viewFloor, 0)}`,
    ok: constraints.find(c => c.id === "H2")?.ok
  }, {
    t: `Frequency cap ${FRAME.freqCap}/wk`,
    ok: res.avgFreq <= 14,
    d: `Modelled average frequency ${res.avgFreq.toFixed(1)} across the flight.`
  }, {
    t: "Creative variants deliverable",
    ok: true
  }, {
    t: "Dual measurement currency",
    ok: false,
    d: "VideoAmp not yet confirmed for LATAM lines — C03 open."
  }];
  const coverage = coverageItems.filter(i => i.ok).length / coverageItems.length * 100;
  const o1 = clamp(res.reach1 / FRAME.reachGoal1, 0, 1.15) * 100;
  const o3 = clamp(res.reach3 / FRAME.reachGoal3, 0, 1.15) * 100;
  const objective = clamp(o1 * 0.4 + o3 * 0.6, 0, 100);
  const price = clamp(60 + (FRAME.cpmCeiling - res.digCpm) / FRAME.cpmCeiling * 130, 0, 100);
  const hardFails = constraints.filter(c => c.kind === "hard" && !c.ok).length;
  const softFails = constraints.filter(c => c.kind === "soft" && !c.ok).length;
  const yieldScore = clamp(100 - hardFails * 34 - softFails * 12, 0, 100);
  const devs = Object.keys(overrides || {});
  const withReason = devs.filter(k => (justifications[k] || "").trim().length >= 25);
  const argument = devs.length === 0 ? 84 : clamp(withReason.length / devs.length * 100 - (devs.length > 6 ? 8 : 0), 0, 100);
  const overAvails = res.lines.filter(l => l.availUse > 0.85).length;
  const realism = clamp(100 - overAvails * 18 - Math.max(0, res.hhi - 0.16) * 260, 0, 100);
  const parts = {
    coverage,
    objective,
    price,
    yield: yieldScore,
    argument,
    realism
  };

  /* The profile, not a verdict. Which dimensions clear the threshold this RFP
     set, and which do not — that is the readable answer. `total` is retained
     only as a weak sort key for the version list; nothing decides on it. */
  const below = RUBRIC.filter(r => parts[r.k] < r.bar).map(r => ({
    ...r,
    score: +parts[r.k].toFixed(1),
    short: +(r.bar - parts[r.k]).toFixed(1)
  })).sort((a, b) => b.short - a.short);
  const total = RUBRIC.reduce((s, r) => s + parts[r.k] * r.w, 0);
  return {
    parts,
    below,
    clear: RUBRIC.length - below.length,
    of: RUBRIC.length,
    total: +total.toFixed(1),
    coverageItems,
    devs: devs.length,
    withReason: withReason.length
  };
}

/* ------------------------------------------------------------ P&I line review */
function inventoryImpact(line) {
  const supply = SUPPLY.find(s => s.region === line.region && s.medium === line.p.medium) || {
    selloutPct: 50
  };
  const share = line.availUse;
  const after = clamp(supply.selloutPct + share * (100 - supply.selloutPct) * 0.55, 0, 100);
  const vsFloor = (line.cpm - line.p.floorCpm) / line.p.floorCpm;
  return {
    selloutBefore: supply.selloutPct,
    selloutAfter: +after.toFixed(1),
    availUse: share,
    vsFloor,
    yield: vsFloor >= 0.25 ? "accretive" : vsFloor >= 0.05 ? "at position" : vsFloor >= 0 ? "thin" : "below floor"
  };
}

/* Which stated P&I position each line touches — so P&I reads the plan against
   a position they already stated, rather than reacting to it cold. */
function positionsFor(pid) {
  return PI_POSITION.filter(p => p.appliesTo.includes(pid));
}
</script>

<!-- ================= 25-gates.js ================= -->
<script>
/* =============================================================================
   25-gates.js — the Orchestrator.

   From the Flow Architecture note (6 Sep 2026):
     · knows the full state machine, the evaluation points, and the current
       score at each point
     · understands and scores the intermediate status
     · if scores are below par, re-runs the loop or surfaces for strategic
       analysis and input

   Two things live here. The phase gate, which scores whether a handoff is
   allowed to open at all, and the justification evaluator, which is the
   `Eval Justifications` box in the Discovery flow — the one whose NO edge
   loops back to the human instead of forward to the next step.

   Both are deterministic and both show their working. Neither one decides
   anything: the gate says what is not yet defensible, the evaluator says what
   an argument is missing. A human still moves the plan (T7, T8).
   ============================================================================= */

const GATE_PAR = 80; // below par, the handoff does not open

/* -----------------------------------------------------------------------------
   EVAL JUSTIFICATIONS

   Scores what an argument *contains*, never what it concludes. A planner can
   argue anything they like; they cannot argue it in a way a reader outside the
   room could not act on.

   The four tests are the ones a P&I approver actually applies when a line
   arrives with a reason attached: is there enough of it, does it cite something
   checkable, is it anchored in the evidence rather than in taste, and does it
   own what it costs.
-------------------------------------------------------------------------------*/

const JUST_ANCHORS = ["rfp", "brief", "client", "stated", "clarifi", "position", "p&i", "pi ", "history", "cohort", "kpi", "reach", "frequency", "floor", "ceiling", "cap", "constraint", "avail", "sellout", "sell-out", "yield", "composition", "demo", "viewab", "cpm", "benchmark", "cards", "push list", "do-not-air", "call notes", "evidence", "last year", "q3", "q4", "flight", "pack change", "launch", "competitive"];
const JUST_CONSEQUENCE = ["cost", "costs", "trade", "instead", "rather than", "at the expense", "gives up", "give up", "worth it", "hit", "sacrific", "in exchange", "pay for", "comes out of", "loses", "lose", "goes backwards", "accept", "tolerat", "downside", "risk", "expensive", "efficiency", "even though", "despite", "knowing"];
const JUST_PREFERENCE = ["i think", "i prefer", "i feel", "feels", "seems", "looks better", "better", "best", "makes sense", "should be", "want to", "i like", "obviously", "clearly", "just ", "fine", "good idea", "trust me"];
function evalJustification(text, opts) {
  const o = Object.assign({
    kind: "change"
  }, opts || {});
  const t = String(text || "").trim();
  const low = t.toLowerCase();
  const words = t.split(/\s+/).filter(Boolean).length;
  const hasAny = list => list.some(k => low.includes(k));
  const tests = [{
    id: "substance",
    label: "Enough of an argument to read",
    ok: t.length >= 55 && words >= 11,
    ask: "Two sentences at least. What the system got wrong, and what you know that it does not."
  }, {
    id: "specific",
    label: "Cites something checkable",
    ok: /\d/.test(t) || /[$%]/.test(t),
    ask: "Name the number you are arguing about — the CPM, the share, the reach point, the date."
  }, {
    id: "grounded",
    label: "Anchored in the evidence, not in taste",
    ok: hasAny(JUST_ANCHORS),
    ask: "Point at the record: the RFP, a clarification, the P&I position, the advertiser's history, the KPI."
  }, {
    id: "consequence",
    label: "Owns what the change costs",
    ok: hasAny(JUST_CONSEQUENCE),
    ask: "Say what this gives up. An argument that costs nothing reads as one that was not weighed."
  }];
  const passed = tests.filter(x => x.ok);
  let score = Math.round(passed.length / tests.length * 100);

  /* Preference language on its own is the failure mode this box exists to
     catch: it reads like a reason and carries none. */
  const prefOnly = hasAny(JUST_PREFERENCE) && !tests[1].ok && !tests[2].ok;
  if (prefOnly) score = Math.min(score, 25);
  return {
    score,
    tests,
    missing: tests.filter(x => !x.ok),
    prefOnly,
    verdict: score >= 75 ? "pass" : score >= 50 ? "thin" : "revise",
    /* The feedback edge in the flow: what the orchestrator sends back. */
    feedback: prefOnly ? "This reads as a preference rather than an argument. Nothing in it can be checked or contested, so P&I has nothing to approve against." : score >= 75 ? "This is defensible on its own. It goes forward as written." : score >= 50 ? "This will travel, but a reader outside the room would have to ask you a question to act on it." : "Not yet defensible. Sent back rather than forward."
  };
}

/* Justifications already on the plan, scored in bulk — used by the gates. */
function scoreJustifications(map) {
  const out = Object.entries(map || {}).filter(([, v]) => String(v || "").trim().length > 0).map(([k, v]) => ({
    key: k,
    ...evalJustification(v)
  }));
  return {
    all: out,
    weak: out.filter(x => x.verdict === "revise"),
    thin: out.filter(x => x.verdict === "thin"),
    mean: out.length ? Math.round(out.reduce((s, x) => s + x.score, 0) / out.length) : 100
  };
}

/* -----------------------------------------------------------------------------
   THE PHASE GATE

   One evaluation set per handoff. Each point carries its weight, its current
   score, and — when it is not met — the specific thing that would meet it.
   The note's rule: "what constitutes the trigger handoff to the Discovery
   orchestrator — a sound, defensible intake brief is built."
-------------------------------------------------------------------------------*/

const GATE_META = {
  intake: {
    to: "Discovery",
    from: "Intake orchestrator",
    asks: "Is a sound, defensible intake brief built?"
  },
  discovery: {
    to: "Strategize",
    from: "Discovery orchestrator",
    asks: "Is this ranked list one the planner would defend, product by product?"
  },
  strategize: {
    to: "Analyze",
    from: "Strategize orchestrator",
    asks: "Is there a saved allocation whose every deviation is argued?"
  },
  analyze: {
    to: "Approval",
    from: "Analyze orchestrator",
    asks: "Is one version chosen, and is the choice legible?"
  },
  approval: {
    to: "the client proposal",
    from: "Approval orchestrator",
    asks: "Does every line carry a decision and a reason?"
  }
};
function evaluateGate(phase, st, ctx) {
  const c = ctx || {};
  const pt = [];
  /* Binding points hold the handoff. They test for the *absence* of something
     the next phase cannot work without — an unadjudicated gap, an override with
     no reason at all, a line still resting on an Indicative forecast. */
  const add = (id, label, w, ok, detail, fix) => pt.push({
    id,
    label,
    w,
    bar: 100,
    kind: "binding",
    ok: !!ok,
    score: ok ? 100 : 0,
    detail,
    fix
  });

  /* Advisory points never hold the handoff. They measure *quality* — how good an
     argument is, how strong the evidence is — and quality is not the system's to
     veto (OQ-22: the system never blocks a weak strategy, it proposes a better
     one and records the departure). The score travels into the rubric and into
     the approval package, where P&I reads it and it carries consequence. */
  const addA = (id, label, w, score, detail, fix, bar) => {
    const b = bar == null ? 70 : bar;
    pt.push({
      id,
      label,
      w,
      bar: b,
      kind: "advisory",
      ok: score >= b,
      score: Math.round(score),
      detail,
      fix
    });
  };
  if (phase === "intake") {
    const material = GAPS.filter(g => g.material);
    const openGaps = material.filter(g => !st.gapDecisions[g.id]);
    const matContra = CONTRADICTIONS.filter(x => x.material);
    const openContra = matContra.filter(x => !st.contraDecisions[x.id]);
    const jm = scoreJustifications(Object.fromEntries(Object.entries(st.gapDecisions).map(([k, v]) => [k, v && v.reason])));
    add("G1", "Every material requirement received or inferred, and accepted", 26, openGaps.length === 0, `${material.length - openGaps.length} of ${material.length} material gaps adjudicated.`, openGaps.length ? `Resolve ${openGaps.map(g => g.id).join(", ")}.` : null);
    add("G2", "No contradiction left standing on a material attribute", 22, openContra.length === 0, `${matContra.length - openContra.length} of ${matContra.length} material contradictions adjudicated.`, openContra.length ? `Adjudicate ${openContra.map(x => x.id).join(", ")}.` : null);

    /* Scored by the Evidence Eval Agent on the RFP graph, not asserted here. */
    const eg = c.evGraph || evalEvidenceGraph(EVIDENCE, st);
    addA("G3", "The graph is strong enough to plan an allocation on", 14, eg.plannable, `${eg.plannable}% of ${eg.scored.length} records clear the 60 confidence bar; mean ${eg.mean}.${eg.weak.length ? ` ${eg.weak.length} below it (weakest ${eg.weak[0].id} at ${eg.weak[0].conf}).` : ""}`, eg.weak.length ? `Strengthen ${eg.weak.slice(0, 3).map(w => w.id).join(", ")} — the evidence tab says how.` : null, 75);
    add("G4", "The brief is approved on the version now current", 24, st.intakeApproved && st.intakeApproved.version === st.briefVersion, st.intakeApproved ? st.intakeApproved.version === st.briefVersion ? `Approved on v${st.intakeApproved.version}.` : `Approved on v${st.intakeApproved.version} but the brief has re-derived to v${st.briefVersion} — the approval lapsed (T9).` : `Brief v${st.briefVersion} is not approved.`, st.intakeApproved ? "Re-approve the current version." : "Approve the brief once the gaps are closed.");
    addA("G5", "Adjudications carry reasons a reader could act on", 14, jm.all.length ? jm.mean : 0, jm.all.length ? `${jm.all.length} recorded, mean argument score ${jm.mean}.${jm.weak.length ? ` ${jm.weak.length} would read thin to P&I.` : ""}` : "No adjudication reasons recorded yet.", jm.weak.length ? "Strengthen the reasons flagged on the gaps tab — or carry them as they are and P&I will read them." : null, 70);
  }
  if (phase === "discovery") {
    const ranking = c.ranking || [];
    const on = ranking.filter(r => r.on);
    const emptyRegions = FRAME.regions.filter(rg => (FRAME.regionSplit[rg] || 0) > 0 && !on.some(r => r.p.region === rg));
    const breached = on.filter(r => (r.breaches || []).some(b => b.id === "H2" || b.id === "H6"));
    const jm = scoreJustifications(st.rankJust);
    addA("D1", "Every region carrying budget has a product in the list", 22, emptyRegions.length === 0 ? 100 : 0, emptyRegions.length ? `${emptyRegions.join(", ")} has an envelope and nothing to spend it on — the solver will report it unallocated rather than move the money.` : "All four regional envelopes have somewhere to go.", emptyRegions.length ? `Add a product in ${emptyRegions.join(", ")}, or proceed and let the solve report it.` : null, 100);
    add("D2", "No product in the list carries an unresolved hard breach", 24, breached.length === 0, breached.length ? `${breached.map(r => r.p.name.split(" — ")[0]).join(", ")} would be held out of the solve rather than shorten the list quietly.` : "Every product in the list clears its hard constraints.", breached.length ? "Re-target to clear the breach, or take the product out." : null);

    /* Presence of a reason binds; the strength of it does not. */
    const changed = Object.keys(st.rankJust || {});
    const unreasoned = changed.filter(k => !String(st.rankJust[k] || "").trim());
    add("D3", "Every change to the system's order carries a reason", 14, unreasoned.length === 0, unreasoned.length ? `${unreasoned.length} change${unreasoned.length > 1 ? "s" : ""} with no reason recorded.` : changed.length ? `${changed.length} change${changed.length > 1 ? "s" : ""}, each with a reason.` : "No changes to the system's order.", "A change with no reason cannot be read by P&I at all.");

<script>
/* =============================================================================
   26-evidence.js — the RFP graph and the Evidence Eval Agent.

   From the Flow Architecture note: intake does not assemble a brief directly.
   Every agent writes into one shared structure — `BUILD RFP GRAPH` — and reads
   back out of it. Sitting on that graph is an `Evidence Eval Agent` that
   evaluates the *strengths and weaknesses of each record* and updates its
   probability score. The brief is then built from the graph, not from the
   sources.

   The consequence worth having in the UI: two records can say the same thing
   and not be worth the same. A number read off page 2 of the RFP and a number
   inferred from four comparable advertisers are both evidence; only one of them
   is worth planning a $18.5M allocation on without asking.

   carries a confidence it cannot explain.

    weak: scored.filter(x => x.conf < 60).sort((a, b) => a.conf - b.conf),

   27-rag.js — the Products / Packaging system.

   surface is the shape of the interaction and the provenance of the answer,

<script>
/* =============================================================================
   28-forecast.js — the forecast boundary between UMP and the Allocation Engine.

   Forecast data reaches planning in two fidelity classes. They are not high and
   low quality versions of one number. They are different answers to different
   questions, asked at different moments:

     Indicative   Does enough inventory exist for this product across this
                  flight to be worth putting in front of the planner at all?
                  Product level, no targeting, pre-computed daily, read
                  instantly. It powers the eligibility list and nothing else.

     Constrained  What will this specific line, with this specific targeting,
                  actually deliver? Line level, full waterfall, computed on
                  demand when the optimiser runs. This is what the plan rests
                  on and what the client eventually sees.

   The binding rule that connects them: a plan version cannot be committed for
   approval while any line still rests on an Indicative figure. That is T5
   applied to inventory rather than to advertiser requirements — an inferred
   value is a proposal and must be confirmed before approval. It is what lets
   Discovery be fast and approximate without making the approval package
   indefensible.

   The consequence the UX has to carry: between those two moments, the planner
   customises targeting and gets no number back. Precise availability at a
   specific customisation does not exist until the solver runs (D-8). What they
   get instead is a constraint flag and a direction of travel.
   ============================================================================= */

const FIDELITY = {
  indicative: {
    id: "indicative",
    label: "Indicative",
    short: "IND",
    tone: "a",
    what: "Product-level pre-screen. This RFP's targeting is not applied.",
    granularity: "Product or package",
    targeting: "None — standing pressure only",
    computed: "Daily, pre-computed. Read immediately, no run required.",
    carriedBy: "The strategy brief, as the inventory position per eligibility entry.",
    admissible: "Eligibility and ranked order in Discovery only.",
    notAdmissible: "Any plan version submitted for approval."
  },
  constrained: {
    id: "constrained",
    label: "Constrained",
    short: "CON",
    tone: "g",
    what: "Line-level forecast against this RFP's actual targeting.",
    granularity: "Line item, per UMP placement ID",
    targeting: "Full waterfall — TMR, AMR, ABR, FCR",
    computed: "On demand, asynchronously, when the accepted list goes to the optimiser.",
    carriedBy: "The plan version brief.",
    admissible: "Allocation, Analyze, and anything going to approval.",
    notAdmissible: "Nothing — this is the defensible class."
  }
};

/* The Indicative pre-screen is recomputed overnight; the read is instant but the
   figure is as-at the last nightly pass, which is why it carries a date. */
const INDICATIVE_RUN = "2026-09-22 03:15";

/* Below this, a product has too little inventory across the flight to be worth
   surfacing at all — it never reaches the eligibility list (Forecast §1). */
const INDICATIVE_FLOOR_K = 40000;

/* Maximum age of a Constrained run before P&I is advised to ask for a fresh one.
   [OPEN] The real threshold is P&I's to set, against how fast inventory moves. */
const STALE_HOURS = 24;

/* -------------------------------------------------------- UMP placement IDs */
/* UMP generates the line identifier and the Allocation Engine accepts it,
   without an Operative One deal needing to exist first (dependency DDF-1251).
   The ID carries product, flight and targeting, so two lines differing only in
   customisation are two different forecast questions. */
function umpPlacementId(p, customIds) {
  const t = (customIds || []).slice().sort().join("+");
  const h = t ? t.split("").reduce((a, c) => a * 31 + c.charCodeAt(0) >>> 0, 7).toString(36).slice(0, 3).toUpperCase() : "BSE";
  return `UMP-${p.id}-${h}`;
}

/* --------------------------------------------------------- the ten-step waterfall */
/* The Allocation Engine's own model, reused rather than duplicated. Every
   Constrained figure is explained by it, and the run date travels with the
   derivation as provenance — the same line reading 15% on one date and 10.7% on
   another is not a contradiction, it is the system behaving correctly (§9). */
const WATERFALL_STEPS = [{
  k: "capacity",
  label: "Total digital inventory capacity",
  note: "Raw FreeWheel impressions for the site and period, before any constraint. Sourced from the VW_CAPACITY nightly pipeline."
}, {
  k: "pressure",
  label: "Initial pressure cap",
  note: "Less inventory not open to this sale — programmatic PMP reserved auction, non-AD direct, and PNG."
}, {
  k: "higherOv",
  label: "HIGHER_OV_COMPETITION",
  note: "Impressions lost to prior days and to higher-OV placements."
}, {
  k: "sameOv",
  label: "SAME_OV_COMPETITION",
  note: "Lost to placements at the same override value but higher combined priority index (CPI = OSI + LSI + TI)."
}, {
  k: "afterComp",
  label: "After competition",
  divider: true,
  note: "What remains once both competition steps have been applied."
}, {
  k: "tmr",
  label: "After_TMR — target match rate",
  note: "The share of remaining inventory matching the line's content targeting. Gold MR pipeline, with brand and portfolio fallbacks."
}, {
  k: "amr",
  label: "After_AMR — audience match rate",
  note: "The share matching the audience segments, over the AND/OR combination tree against 14-day trailing tracked audience data."
}, {
  k: "abr",
  label: "After_ABR — ad-break ratio",
  note: "A structural 1/N limit on how many slots in one break a single line may take. Derived from 7–14 day trailing slot data. Non-relaxing."
}, {
  k: "fcr",
  label: "After_FCR — frequency cap ratio",
  note: "Reduces for the per-user exposure ceiling on the line."
}, {
  k: "net",
  label: "Net constrained avails",
  divider: true,
  strong: true,
  note: "The net available impressions returned to the requester."
}];

/* Deterministic per product and targeting set, so the same line always derives
   the same way — a forecast the planner cannot reproduce is not evidence. */
function seeded(str) {
  let h = 2166136261;
  for (let i = 0; i < str.length; i++) {
    h ^= str.charCodeAt(i);
    h = Math.imul(h, 16777619);
  }
  return () => {
    h = Math.imul(h ^ h >>> 15, 2246822507);
    return (h >>> 0) % 1000 / 1000;
  };
}

/* Run the waterfall for one line. `p` is the product, `customIds` the targeting
   customisations the planner applied. Returns every step so the derivation can
   be read, not just the answer. */
function runWaterfall(p, customIds, runAt) {
  const pid = umpPlacementId(p, customIds);
  const rnd = seeded(pid);
  const ids = customIds || [];

  /* Indicative sits at product level with no targeting, so it is the closest
     thing to raw capacity this model has. The waterfall starts above it. */
  const capacity = Math.round(p.availK / 0.42);
  const rows = [];
  let v = capacity;
  const step = (k, ratio) => {
    const before = v;
    v = Math.round(v * ratio);
    rows.push({
      ...WATERFALL_STEPS.find(s => s.k === k),
      value: v,
      lost: before - v,
      ratio
    });
    return v;
  };
  rows.push({
    ...WATERFALL_STEPS[0],
    value: capacity,
    lost: 0,
    ratio: 1
  });
  step("pressure", 0.88 - rnd() * 0.06);
  step("higherOv", 0.94 - rnd() * 0.07);
  step("sameOv", 0.96 - rnd() * 0.05);
  rows.push({
    ...WATERFALL_STEPS[4],
    value: v,
    lost: 0,
    ratio: 1
  });

  /* Targeting customisations bite here, which is exactly why a customised
     figure cannot be known before this runs. */
  const cs = ids.map(id => CUSTOM_OPTIONS.find(o => o.id === id)).filter(Boolean);
  const tmrX = cs.filter(o => ["genre", "daypart", "ugc"].includes(o.id)).reduce((a, o) => a * o.availX, 0.86 - rnd() * 0.08);
  const amrX = cs.filter(o => ["demoGuar"].includes(o.id)).reduce((a, o) => a * o.availX, 0.79 - rnd() * 0.10);
  const fcrX = cs.filter(o => ["freq"].includes(o.id)).reduce((a, o) => a * o.availX, 0.93 - rnd() * 0.05);
  step("tmr", clamp(tmrX, 0.05, 1));
  step("amr", clamp(amrX, 0.05, 1));
  step("abr", 0.91 - rnd() * 0.06);
  step("fcr", clamp(fcrX, 0.05, 1));
  rows.push({
    ...WATERFALL_STEPS[9],
    value: v,
    lost: 0,
    ratio: 1
  });
  return {
    pid,
    runAt: runAt || NOW(),
    capacityK: capacity,
    netK: v,
    rows,
    reductionPct: 1 - v / capacity
  };
}

/* ------------------------------------------------------- the two read paths */
/* Indicative: no run, no targeting, read straight off the nightly pass. */
function indicativeFor(p) {
  return {
    fidelity: "indicative",
    pid: null,
    availK: p.availK,
    runAt: INDICATIVE_RUN,
    eligible: p.availK >= INDICATIVE_FLOOR_K
  };
}

/* Constrained: the answer only the solver pass can give. */
function constrainedFor(p, customIds, runAt) {
  const w = runWaterfall(p, customIds, runAt);
  return {
    fidelity: "constrained",
    pid: w.pid,
    availK: w.netK,
    runAt: w.runAt,
    waterfall: w
  };
}

/* What the planner gets at the moment of customisation: not a figure. A flag,
   a direction, and the Indicative still visible as the reference point (§7).
   Recording the direction alongside the pricing consequence is what makes the
   trade-off readable downstream rather than only its result. */
function customisationSignal(p, customIds, live) {
  const ids = customIds || [];
  if (!ids.length) return null;
  const x = ids.reduce((a, id) => {
    const o = CUSTOM_OPTIONS.find(c => c.id === id);
    return o ? a * o.availX : a;
  }, 1);
  const dir = x < 0.97 ? "down" : x > 1.03 ? "up" : "flat";
  const severity = x < 0.55 ? "sharp" : x < 0.8 ? "material" : "slight";
  return {
    direction: dir,
    severity,
    /* Deliberately not a number. The honest answer is that nobody knows yet. */
    text: dir === "flat" ? "No material change to available inventory." : `Available inventory moves ${dir} ${severity === "sharp" ? "sharply" : severity === "material" ? "materially" : "slightly"} against the pre-screen.`,
    reference: p.availK,
    priced: live ? live.cpm : null,
    why: "The size of the move is not knowable until the optimiser runs this line through the waterfall against your targeting."
  };
}

/* The fidelity fields a solved line carries. They travel into the saved plan
   version, which is how the Analyze gate can tell whether anything still rests
   on the pre-screen, and how P&I can read the run date at approval. */
function forecastOn(c, p) {
  if (!c) return {
    fidelity: "indicative",
    umpPid: null,
    forecastRunAt: null,
    indicativeK: p.availK,
    constrainedK: null,
    waterfall: null
  };
  return {
    fidelity: "constrained",
    umpPid: c.pid,
    forecastRunAt: c.runAt,
    indicativeK: p.availK,
    constrainedK: c.availK,
    waterfall: c.waterfall
  };
}

/* --------------------------------------------------- reserved and available */
/* The Allocation Engine excludes reserved inventory before it returns anything,
   and never breaks it out. Planners consequently never see a pressure figure.
   P&I sees the combined reserved total at approval, and only there (§8).

   Reserved is booked (signed IO, from COMS) plus COMS-pressured (deals past
   advertiser approval at 80%+ sell-through). Plans still inside UMP contribute
   nothing — they have not reached COMS. */
function reservedFor(p) {
  const rnd = seeded("res-" + p.id);
  const capacity = Math.round(p.availK / 0.42);
  const booked = Math.round(capacity * (0.34 + rnd() * 0.26));
  const pressured = Math.round(capacity * (0.08 + rnd() * 0.12));
  return {
    capacityK: capacity,
    bookedK: booked,
    pressuredK: pressured,
    reservedK: booked + pressured,
    sellThrough: (booked + pressured) / capacity
  };
}

/* Competing in-flight UMP demand against the same product. P&I asked for this
   so they can see the whole picture before deciding, rather than this plan's
   draw in isolation.
   NOTE: not current functionality — the Allocation Engine does not identify
   competing UMP plan demand today. Carried here as the stated requirement. */
function competingUmpDemand(p) {
  const rnd = seeded("comp-" + p.id);
  const n = Math.floor(rnd() * 3); // 0–2 other plans
  if (!n) return {
    plans: [],
    askK: 0,
    modelled: true
  };
  const plans = Array.from({
    length: n

   Ranking is the substance. Every position carries the reasoning that put it

  const qs = [];

    c,
    v: row.parts[c.k]

    a: `${weakest.c.label} is its weakest criterion at ${weakest.v.toFixed(0)}. ${row.why[weakest.c.k]}${weakest.c.k === "avails" || weakest.c.k === "audience" ? " Targeting customisation moves this; the price and avails consequence updates as you set it." : weakest.c.k === "price" ? " Price is the lever, and it is a negotiation, not a setting." : weakest.c.k === "seller" ? " That is P&I's posture, not a planning input. It changes when they change it." : ""}`

  });
